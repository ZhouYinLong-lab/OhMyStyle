schema_version: "1.0.0"
purpose: "Reference-backed expansion set: 15 game-art directions and 10 artist/photographer packages."
packages:
  - id: cel-shaded-nature-game-art
    name: 卡通渲染自然冒险游戏美术
    name_en: Cel-Shaded Nature Adventure Game Art
    kind: game_art
    domain: game_art
    summary: "以平面化明暗、清晰轮廓和书法式形体组织三维自然冒险场景，强调图形设计与手绘质感的协同。"
    summary_en: "A stylized 3D nature-adventure direction using banded shading, crisp contours, graphic silhouettes, and hand-drawn surface accents."
    source: {url: "https://www.capcom.co.jp/ir/english/news/pdf/e090903.pdf", title: "Ōkami official company material", authority: "Capcom", attribution: "Ōkami is a commercial work by Capcom; this package is an independent analysis of observable production traits."}
    origin: "stylized_console_action_adventure"
    period: "2000s_to_present"
    entity_type: "cel_shaded_3d_game_art_direction"
    use_cases: [nature_scene, shrine_or_ruin, character_action, environmental_concept]
    exclusions: [photorealistic_pbr, generic_anime_screenshot, copied_named_character, uncontrolled_ink_noise]
    signature:
      composition: ["以清晰前中后景和大块轮廓组织空间", "让路径、树枝、山脊或建筑线条承担视线引导", "主体轮廓先于细节建立"]
      palette: ["自然绿、土黄、朱红、群青和墨色形成有限色组", "高饱和色用于焦点和自然能量，不做全局滤镜", "明暗分区优先于细密渐变"]
      medium: ["三维模型结合平面化着色", "局部保留手绘笔触或纸墨边缘", "轮廓与材质由图形语言统一"]
      lighting: ["使用分段明暗而非连续写实渐变", "日光、月光或神秘光源形成明确色温关系", "阴影保持形状清楚"]
      surface: ["木、石、叶片和布料各自保留简化但可辨的表面逻辑", "高光面积受控"]
      texture: ["纹理跟随材质方向，避免随机噪点", "边缘可有少量手绘破笔但不能覆盖轮廓"]
      invariants: ["三维空间仍然可信", "明暗块面和轮廓优先", "不得复制来源游戏的角色、标志或构图"]
    reproduction:
      medium: "stylized 3D render with cel-shaded lighting and restrained hand-painted accents"
      materials: ["简化法线或平面化材质", "低频手绘纹理", "受控轮廓线或边缘墨色", "分层环境雾"]
      process: ["先搭建可读空间和主体剪影", "再划分大块色面与光照带", "最后加入少量材质笔触和环境细节", "以轮廓、明暗和色组检查统一性"]
      technical: "保持正交或中等透视，避免过度景深；把细节密度集中在焦点区域。"
    palette: [{name: ink, hex: "#1D2430", role: contour_and_deep_shadow}, {name: leaf, hex: "#587449", role: foliage}, {name: ochre, hex: "#C49245", role: earth_and_warm_light}, {name: vermilion, hex: "#C84B39", role: focal_accent}, {name: sky, hex: "#6E91B5", role: cool_distance}]
  - id: hand-inked-animation-game-art
    name: 手绘墨线动画游戏美术
    name_en: Hand-Inked Animation Game Art
    kind: game_art
    domain: game_art
    summary: "以逐帧手绘的弹性动作、黑色墨线、复古卡通比例和水彩背景组织二维游戏画面，保留人工绘制的不完美节奏。"
    summary_en: "A 2D game direction built from hand-inked motion, elastic cartoon anatomy, vintage staging, and watercolor-like backgrounds with deliberate imperfections."
    source: {url: "https://studiomdhr.com/what-kind-of-game-is-cuphead/", title: "What kind of game is Cuphead?", authority: "Studio MDHR", attribution: "Cuphead is a commercial work by Studio MDHR; this package abstracts its production traits without reproducing characters or scenes."}
    origin: "hand_drawn_animation_and_1930s_cartoon_production"
    period: "2010s_to_present"
    entity_type: "hand_inked_2d_game_art_direction"
    use_cases: [character_action, boss_scene, stage_card, expressive_prop]
    exclusions: [smooth_vector_icon, realistic_anatomy, photorealistic_texture, copied_cartoon_character]
    signature:
      composition: ["动作姿态有明确弧线和夸张重心", "前景角色与背景层次分离", "画面重心清楚但允许舞台化留白"]
      palette: ["黑、奶油白、暗红、黄绿和暖棕构成复古有限色板", "背景通常比角色低对比", "局部高饱和用于动作焦点"]
      medium: ["可见的铅笔或墨线轮廓", "手绘填色和水彩式背景", "线条粗细随动作和透视变化"]
      lighting: ["舞台灯光与大块阴影清楚", "高光为绘制形状而非摄影反射", "不依赖霓虹发光"]
      surface: ["纸张、墨水、旧动画片的轻微不均匀感", "角色边缘不做数字锐化光晕"]
      texture: ["少量胶片抖动、纸张颗粒和水彩渗化", "纹理必须服从画面节奏"]
      invariants: ["动作先于真实比例", "手绘线条和二维舞台关系保持稳定", "不得复制已知角色或镜头"]
    reproduction:
      medium: "hand-drawn 2D animation frame with ink contours and painted background"
      materials: ["铅笔草图", "墨线", "水彩或不透明水彩背景", "有限色彩分层", "轻微纸张颗粒"]
      process: ["先确定动作弧线和轮廓", "再绘制线稿与大色块", "随后加入背景笔触和有限阴影", "最后检查线条连贯性与角色可读性"]
      technical: "保留手绘边缘和少量线宽变化；不使用光滑矢量渐变替代绘制层次。"
    palette: [{name: ink, hex: "#1A1718", role: linework}, {name: paper, hex: "#F0E0B6", role: paper_light}, {name: brick, hex: "#A83F35", role: focal_red}, {name: mustard, hex: "#C09A39", role: warm_background}, {name: sage, hex: "#71805A", role: muted_cool_accent}]
  - id: watercolor-storybook-game-art
    name: 水彩绘本冒险游戏美术
    name_en: Watercolor Storybook Adventure Game Art
    kind: game_art
    domain: game_art
    summary: "把可游玩的二维空间处理成带纸张、透明水彩和童话留白的绘本画面，依靠柔和层叠与手绘轮廓保持空间可读性。"
    summary_en: "A playable picture-book direction using translucent watercolor layers, paper tooth, gentle contours, and readable 2D depth without hard digital gloss."
    source: {url: "https://www.ubisoft.com/en-us/company/about-us/our-brands/child-of-light", title: "Child of Light", authority: "Ubisoft", attribution: "Child of Light is a commercial work by Ubisoft; this package studies its watercolor-inspired production language."}
    origin: "interactive_picture_book_and_watercolor_concept_art"
    period: "2010s_to_present"
    entity_type: "watercolor_2d_game_art_direction"
    use_cases: [storybook_landscape, gentle_adventure, character_vignette, illustrated_map]
    exclusions: [plastic_3d_render, neon_cyberpunk, hard_vector_flatness, copied_game_scene]
    signature:
      composition: ["以纸面留白、飘浮层次和柔和地平线组织画面", "主体周围保留呼吸空间", "远景用透明叠色而非锐利细节"]
      palette: ["天蓝、紫灰、淡金、珊瑚和苔绿组成低到中饱和水彩色组", "颜色允许相邻渗化但不变成脏灰", "焦点用少量清晰暖色"]
      medium: ["透明水彩层叠", "纸张吸水边缘", "细而不僵硬的手绘轮廓", "数字拼合但保持绘本感觉"]
      lighting: ["光线柔和并通过透明叠色表达", "月光或晨光有轻微色温变化", "禁止塑料高光"]
      surface: ["纸纹与颜料颗粒可见但不压过形体", "水彩边缘自然收束"]
      texture: ["云、树叶和水面使用方向性水痕", "纹理密度随景深降低"]
      invariants: ["像绘本而不是带水彩滤镜的照片", "二维空间关系明确", "不得复制来源画面的具体人物和布局"]
    reproduction:
      medium: "2D watercolor illustration assembled into an explorable game scene"
      materials: ["冷压纸纹理", "透明水彩层", "不透明白色修饰", "细线稿", "轻柔数字合成"]
      process: ["先确定可玩空间和大留白", "按前中后景叠加透明色层", "再加入角色与可交互物的清晰轮廓", "最后控制纸纹与颜料边缘"]
      technical: "保留透明叠色的明度层级；避免把每个物体都处理成相同锐度。"
    palette: [{name: twilight_blue, hex: "#6C8FA8", role: cool_distance}, {name: lavender, hex: "#9E8FBE", role: atmospheric_shadow}, {name: cream, hex: "#F1DBA3", role: paper_light}, {name: coral, hex: "#D77765", role: focal_warmth}, {name: moss, hex: "#788C68", role: vegetation}]
  - id: papercraft-diorama-game-art
    name: 纸艺立体书游戏美术
    name_en: Papercraft Diorama Game Art
    kind: game_art
    domain: game_art
    summary: "将场景拆成纸张、折痕、剪影和层叠立体结构，使用真实纸艺的边缘、阴影与轻微手作误差构成可游玩的微型世界。"
    summary_en: "A miniature game-world direction built from cut paper, folds, layered depth, soft cast shadows, and visible handmade variation."
    source: {url: "https://blog.playstation.com/2013/09/13/tearaway-building-your-own-papercraft-world/", title: "Tearaway: Building Your Own Papercraft World", authority: "PlayStation and Media Molecule", attribution: "Tearaway is a commercial work by Sony and Media Molecule; this package abstracts paper-craft production traits."}
    origin: "physical_papercraft_and_diorama_design"
    period: "2010s_to_present"
    entity_type: "papercraft_diorama_game_art_direction"
    use_cases: [miniature_landscape, playful_interface, craft_world, character_scene]
    exclusions: [photorealistic_material_scan, seamless_cgi_surface, random_collage, copied_game_asset]
    signature:
      composition: ["用前中后层纸片形成明确景深", "折叠、开窗、切口和悬挂结构可成为构图骨架", "画面像被放在桌上的小型剧场"]
      palette: ["纸白、天蓝、珊瑚、草绿和暖黄组成明快色组", "同一物体保持单一主色和少量阴影", "避免全局灰褐滤镜"]
      medium: ["彩纸、卡纸、瓦楞纸与胶水的视觉暗示", "边缘略有纤维和切割痕", "层间距离真实可读"]
      lighting: ["柔和顶侧光投下纸片阴影", "折痕和层边用真实遮挡表现", "不使用发光轮廓"]
      surface: ["纸张粗糙度和折痕是主要材质信号", "胶带或钉合只在需要时出现"]
      texture: ["纤维、剪切边和轻微手工不齐", "纹理不可变成噪点滤镜"]
      invariants: ["所有层都像同一套纸艺模型", "空间不是平面贴图拼贴", "不得复刻游戏角色或截图"]
    reproduction:
      medium: "paper-craft diorama with layered cutouts and miniature lighting"
      materials: ["彩纸和卡纸", "纸板折面", "哑光胶水痕迹", "小型木质或纸质支撑", "柔和摄影棚光"]
      process: ["先分层并确定遮挡关系", "再设计可见折痕和切口", "最后加入纸面色块与投影", "检查所有物体是否保持同一缩尺"]
      technical: "优先使用真实遮挡、接触阴影和层间间隙表达体积，不用金属或塑料高光。"
    palette: [{name: paper, hex: "#F3E8D1", role: paper_base}, {name: sky, hex: "#6FB5D6", role: background}, {name: coral, hex: "#E47767", role: focal_cutout}, {name: grass, hex: "#7FA36B", role: foliage}, {name: butter, hex: "#F3C968", role: warm_light}]
  - id: voxel-world-game-art
    name: 体素世界游戏美术
    name_en: Voxel World Game Art
    kind: game_art
    domain: game_art
    summary: "以可拆分、可堆叠的立方体体素作为场景基本单位，强调模块化地形、块面光照和从局部方块到整体景观的尺度一致性。"
    summary_en: "A block-based world direction using modular voxel units, readable stepped terrain, flat material families, and consistent scale from props to landscapes."
    source: {url: "https://www.minecraft.net/en-us/article/what-minecraft", title: "What is Minecraft?", authority: "Minecraft and Mojang", attribution: "Minecraft is a commercial work by Mojang and Microsoft; this package abstracts voxel construction principles without copying assets."}
    origin: "block_based_sandbox_world_building"
    period: "2000s_to_present"
    entity_type: "voxel_3d_game_art_direction"
    use_cases: [block_landscape, modular_building, resource_scene, stylized_world_map]
    exclusions: [smooth_subdivision_surface, photorealistic_terrain, copied_game_texture, excessive_microdetail]
    signature:
      composition: ["用体素台阶和方块群形成清晰地形层级", "大型体块先于单方块装饰", "远景减少方块细节但保持块面节奏"]
      palette: ["每类材料使用少量相邻色阶", "草、土、石、水和木有清晰颜色家族", "高亮块只用于路径、资源或焦点"]
      medium: ["立方体或规则体素网格", "平面或阶梯化面法线", "材质通过方块颜色和面向区分"]
      lighting: ["光照沿体素面分区", "接触阴影和体素遮挡清楚", "不使用大面积连续反射"]
      surface: ["泥土、石块、木材和矿物各有有限图案", "表面细节服从体素尺度"]
      texture: ["重复纹理需有模块变化", "避免把真实照片压成方块滤镜"]
      invariants: ["几何体由可识别方块构成", "不同物体共享同一网格尺度", "不得使用来源游戏的独特材质贴图"]
    reproduction:
      medium: "voxel-based 3D scene with block-authored geometry"
      materials: ["立方体体素", "有限色阶材质", "面向相关的阴影", "稀疏装饰方块"]
      process: ["先确定网格尺度和大体块", "再分配材料色族", "随后补充可交互小物", "最后检查所有边缘和透视是否服从网格"]
      technical: "使用正交或弱透视相机，保留方块边缘；避免平滑曲面和高频照片纹理。"
    palette: [{name: dirt, hex: "#8A5A3B", role: soil}, {name: grass, hex: "#6A923F", role: vegetation}, {name: stone, hex: "#8A8D84", role: rock}, {name: water, hex: "#4F91AF", role: water}, {name: wood, hex: "#B27B45", role: structures}]
  - id: stylized-low-poly-world
    name: 风格化低多边形世界游戏美术
    name_en: Stylized Low-Poly World Game Art
    kind: game_art
    domain: game_art
    summary: "通过少量大平面、简化轮廓、克制材质和明确光照构成可探索的低多边形三维世界，强调造型选择而非模型细节。"
    summary_en: "A stylized 3D world direction built from reduced polygon counts, broad planes, simplified silhouettes, restrained materials, and deliberate lighting."
    source: {url: "https://ustwo.com/work/monument-valley/", title: "Monument Valley", authority: "ustwo games", attribution: "Monument Valley is a commercial work by ustwo; this package abstracts stylized 3D composition without reproducing its monuments."}
    origin: "stylized_mobile_3d_and_low_polygon_modeling"
    period: "2010s_to_present"
    entity_type: "low_poly_3d_game_art_direction"
    use_cases: [explorable_landscape, stylized_architecture, toy_like_prop, calm_environment]
    exclusions: [high_poly_realism, noisy_material_scan, impossible_geometry_as_default, copied_landmark]
    signature:
      composition: ["大块几何体先建立层级", "道路、台阶和平台提供清晰路径", "孤立主体与大面积留白并存"]
      palette: ["柔和粉彩、蓝绿、珊瑚、沙色和深紫组成有限色组", "不同平面用色相或明度轻微区分", "焦点色有限"]
      medium: ["低多边形模型", "平滑或平面法线按对象选择", "哑光或半哑光材质"]
      lighting: ["单一主光方向清楚", "阴影柔和但可读", "环境光只做统一补偿"]
      surface: ["材质表现依靠形体和面色，不靠高清纹理", "边缘和倒角适度"]
      texture: ["表面干净、低频、少量手工色差", "不添加随机颗粒"]
      invariants: ["形体简化是主动设计而非低清损失", "同一场景共享尺度与材质语言", "不得复刻特定游戏建筑"]
    reproduction:
      medium: "low-poly 3D scene with graphic planes and soft stylized lighting"
      materials: ["简化网格", "低频哑光材质", "少量面色变化", "软阴影"]
      process: ["先确定主几何和视角", "再压缩材料与色彩", "用单一光源塑造面关系", "最后补充少量植物或道具"]
      technical: "采用中长焦或等距感相机，减少广角畸变；保持轮廓干净和面数克制。"
    palette: [{name: plum, hex: "#5F4E73", role: deep_plane}, {name: coral, hex: "#D77A6C", role: focal_plane}, {name: sand, hex: "#D7B583", role: ground}, {name: teal, hex: "#6C9F9B", role: cool_structure}, {name: cream, hex: "#F0E2C0", role: light_plane}]
  - id: impossible-architecture-game-art
    name: 等距幻觉建筑游戏美术
    name_en: Isometric Impossible-Architecture Game Art
    kind: game_art
    domain: game_art
    summary: "以等距视角、非欧几何连接、干净色面和可操作建筑机关组织谜题场景，画面优先呈现结构关系与视觉错觉。"
    summary_en: "An isometric puzzle direction using impossible connections, clean color planes, legible mechanisms, and architectural illusions that remain readable as game spaces."
    source: {url: "https://gdcvault.com/play/1022299/The-Art-of-Monument", title: "The Art of Monument Valley", authority: "GDC Vault and ustwo", attribution: "Monument Valley is a commercial work by ustwo; this package abstracts isometric design principles without reproducing its structures."}
    origin: "isometric_puzzle_architecture_and_optical_illusion"
    period: "2010s_to_present"
    entity_type: "isometric_architectural_game_art_direction"
    use_cases: [puzzle_room, monument, impossible_stair, abstract_city]
    exclusions: [random_perspective_break, photorealistic_architecture, unreadable_mechanism, copied_level_layout]
    signature:
      composition: ["等距轴线清楚", "平台、楼梯、桥和门形成可追踪路径", "错觉只发生在结构连接处并可被理解"]
      palette: ["大块粉彩与深色阴影形成清晰分区", "一到两个高亮色提示可操作结构", "色彩服务于空间而非装饰堆叠"]
      medium: ["简化三维几何", "等距或弱透视投影", "平整材质和清晰边界"]
      lighting: ["方向明确的软光", "结构阴影帮助读取高度", "避免强反射干扰几何"]
      surface: ["建筑表面简洁，少量台阶或砖缝提供尺度", "材质差异通过色块表达"]
      texture: ["纹理稀疏且不打断几何线", "保持图标化可读性"]
      invariants: ["每个视觉机关有清楚的几何语法", "错误透视必须是有意且局部的", "不复刻来源游戏的地标"]
    reproduction:
      medium: "isometric architectural 3D illustration for puzzle-game spaces"
      materials: ["模块化建筑体块", "平面色材质", "软阴影", "少量纹理标记"]
      process: ["先绘制等距网格和主路径", "再设计一处局部结构错觉", "分配色彩与交互提示", "用俯视检查空间是否仍可解释"]
      technical: "优先正交相机和一致轴线；让每个不可能连接都有明确入口、出口或遮挡理由。"
    palette: [{name: ink, hex: "#2D3047", role: deep_shadow}, {name: rose, hex: "#C77D8A", role: architecture}, {name: mint, hex: "#9BC9B5", role: cool_plane}, {name: gold, hex: "#E8B95E", role: interactive_accent}, {name: sky, hex: "#A8C9D5", role: background}]
  - id: comic-halftone-game-art
    name: 漫画网点叙事游戏美术
    name_en: Comic Halftone Narrative Game Art
    kind: game_art
    domain: game_art
    summary: "把漫画分镜、墨线轮廓、网点阴影和有限色印刷逻辑转译为游戏画面，重点是强烈的面板节奏、表情剪影与叙事信息层级。"
