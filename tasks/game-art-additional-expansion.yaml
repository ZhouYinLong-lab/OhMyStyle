schema_version: 1.0.0
purpose: Five additional reference-backed game-art directions with explicit boundaries against nearby existing packages.
packages:
- id: pre-rendered-isometric-environment-game-art
  name: 预渲染等距环境游戏美术
  name_en: Pre-Rendered Isometric Environment Game Art
  kind: game_art
  domain: game_art
  summary: 以固定等距投影、精细预渲染背景和分层遮挡构建可探索场景；核心是静态画面的空间阅读，不限定油画或像素媒介。
  summary_en: Fixed isometric projection, detailed pre-rendered environments, and layered occlusion make spaces
    readable and explorable without prescribing a painterly or pixel medium.
  source:
    url: https://www.gamedeveloper.com/art/how-obsidian-replicated-the-look-of-an-infinity-engine-game----in-2015
    title: How Obsidian replicated the look of an Infinity Engine game
    authority: Obsidian Entertainment / Game Developer
    attribution: This package abstracts isometric composition and pre-rendered environment traits discussed by the
      developers; it does not reproduce game assets or scenes.
  origin: pre_rendered_isometric_role_playing_games
  period: 1990s_to_present
  entity_type: pre_rendered_isometric_environment_game_art_direction
  use_cases:
  - isometric_exploration
  - room_or_village_scene
  - environment_concept
  - readable_tactical_space
  exclusions:
  - forced_oil_paint_texture
  - pixel_grid_as_primary_edge_language
  - copied_named_game_scene
  - arbitrary_camera_roll
  signature:
    composition:
    - Use a stable isometric camera and consistent verticals across the scene.
    - Layer foreground occluders, traversable middle ground, and distant architecture.
    - Reserve uncluttered paths and focal landmarks so small figures remain legible.
    palette:
    - Group local colors by material and depth rather than global tint.
    - Use restrained warm highlights against cooler distance where needed.
    - Keep interaction cues distinct from decorative set dressing.
    medium:
    - Present a high-detail environment as a fixed-view rendered image.
    - Allow painted, modeled, or hybrid source methods; do not claim a specific production pipeline from appearance
      alone.
    lighting:
    - Use coherent baked-looking illumination with readable contact shadows.
    - Keep key paths and doorways legible beneath environmental shade.
    surface:
    - Differentiate stone, plaster, foliage, and metal through restrained material cues.
    texture:
    - Concentrate fine detail on landmarks and near-ground surfaces.
    - Reduce distant detail without atmospheric blur.
    invariants:
    - Maintain a stable isometric projection and a clear playable route.
    - Keep user-specified subjects and scene contents independent of the style.
    - Do not copy source layouts, named places, characters, or UI.
  reproduction:
    medium: Fixed-view isometric environment illustration with a pre-rendered scene appearance
    materials:
    - layered architecture
    - baked-looking ambient light
    - controlled surface detail
    - depth-separated occluders
    process:
    - Block the traversable footprint and camera grid.
    - Place landmarks and large masses before small props.
    - Separate near, middle, and distant layers with value and overlap.
    - Check object scale, foot contact, and path readability at gameplay size.
    technical: Keep a consistent projection and align repeated edges to the scene grid; reserve fine detail for
      focal areas.
  palette:
  - name: slate
    hex: '#34434C'
    role: cool_structure
  - name: moss
    hex: '#667558'
    role: vegetation
  - name: sandstone
    hex: '#C09A68'
    role: warm_architecture
  - name: linen
    hex: '#D9C8A4'
    role: lit_surfaces
  - name: oxblood
    hex: '#774C49'
    role: focal_accent
- id: layered-parallax-storybook-game-art
  name: 分层视差绘本游戏美术
  name_en: Layered Parallax Storybook Game Art
  kind: game_art
  domain: game_art
  summary: 把手绘或绘本式场景拆成前中后景平面，并以不同位移制造有限纵深；画面仍保持插画轮廓与读图层级。
  summary_en: Illustrated scenery is separated into foreground, middle, and distant planes that shift at different
    rates, creating shallow depth while preserving a storybook hierarchy.
  source:
    url: https://www.gamedeveloper.com/business/exploring-the-art-and-animation-behind-hand-painted-odyssey-i-planet-of-lana-i-
    title: Exploring the art and animation behind hand-painted odyssey Planet of Lana
    authority: Wishfully Studios / Game Developer
    attribution: This package generalizes the developers’ discussion of illustrated parallax environments and mixed
      dimensionality without copying characters, settings, or compositions.
  origin: illustrated_multiplane_side_scrolling_games
  period: 1990s_to_present
  entity_type: layered_parallax_storybook_game_art_direction
  use_cases:
  - side_scrolling_landscape
  - storybook_scene
  - environment_panorama
  - character_traversal
  exclusions:
  - pixel_tile_grid_as_required_medium
  - single_flat_poster_composition
  - unreadable_foreground_occlusion
  - copied_named_scene
  signature:
    composition:
    - Build depth from a few broad planes with clear overlap.
    - Keep the play lane and character silhouette readable against the moving background.
    - Use large illustrated shapes before small decorative marks.
    palette:
    - Separate depth planes with related but distinct color and value groups.
    - Reserve stronger contrast for the play lane and landmarks.
    - Keep color transitions consistent across layer boundaries.
    medium:
    - Use hand-drawn or painted illustration as layered game scenery.
    - Layer separation is a compositional device and does not imply a particular animation technology.
    lighting:
    - Keep a shared light direction across all planes.
    - Use gentle atmospheric shifts in distant planes without erasing their contours.
    surface:
    - Retain visible drawing or paint character in each plane.
    texture:
    - Vary detail density by distance and movement importance.
    - Avoid high-frequency patterns that shimmer during scrolling.
    invariants:
    - Depth comes from separated illustrated planes and controlled parallax.
    - The requested subject and setting remain user-controlled.
    - Do not copy a source game’s character designs or exact landscape.
  reproduction:
    medium: Layered illustrated 2D scene with shallow parallax depth
    materials:
    - painted scenery planes
    - clean play-lane silhouettes
    - subtle atmospheric overlays
    - limited animated accents
    process:
    - Design the horizon and play lane.
    - Split foreground, middle ground, and distant scenery along meaningful depth boundaries.
    - Assign slower motion to distant planes and faster motion to near planes.
    - Preview scrolling to catch edge gaps, visual jitter, and occlusion conflicts.
    technical: Keep parallax ratios modest and maintain continuity at screen edges; use depth offsets only where
      the scene supports them.
  palette:
  - name: night_blue
    hex: '#334A63'
    role: distant_plane
  - name: sage
    hex: '#7D927B'
    role: middle_plane
  - name: ochre
    hex: '#C69A61'
    role: warm_landmark
  - name: paper
    hex: '#E8D9B9'
    role: lit_ground
  - name: plum
    hex: '#76596B'
    role: accent_shadow
- id: hand-painted-low-poly-game-art
  name: 手绘低多边形游戏美术
  name_en: Hand-Painted Low-Poly Game Art
  kind: game_art
  domain: game_art
  summary: 以简化多边形建立清楚体块，再用手绘色面和方向性笔触表达材质；重点是贴图笔触与几何面的协作，不是统一低模滤镜。
  summary_en: Simple polygonal forms provide readable volume while hand-painted color fields and directional strokes
    describe materials; the look depends on painted surface logic, not a generic low-poly filter.
  source:
    url: https://grafit.artstation.com/blog/o0v6/creating-3d-handpainted-scene-creator-s-notes
    title: Creating 3D Handpainted Scene — Creator’s Notes
    authority: Grafit Studio
    attribution: This package abstracts a publicly documented hand-painted 3D workflow and observable surface traits;
      it does not copy the studio’s assets or scene.
  origin: hand_painted_game_ready_3d_assets
  period: 2000s_to_present
  entity_type: hand_painted_low_poly_game_art_direction
  use_cases:
  - stylized_character
  - small_prop
  - natural_environment
  - modular_game_asset
  exclusions:
  - photographic_texture_maps
  - faceted_geometry_without_painted_surface_logic
  - generic_pastel_filter
  - copied_asset_or_scene
  signature:
    composition:
    - Use a few large readable forms before adding painted detail.
    - Keep facet direction and painted shadow shapes aligned with volume.
    - Separate focal objects from scenery through silhouette and value.
    palette:
    - Use compact material-specific color families with controlled accents.
    - Shift hue within painted shadow and light shapes instead of adding uniform gradients.
    - Keep outlines and contact shadows readable at game scale.
    medium:
    - Combine low-to-moderate polygon geometry with hand-painted surface color.
    - The visible paint can be stylized digital texture and does not imply physical paint.
    lighting:
    - Use broad painted light and shadow shapes that reinforce facets.
    - Avoid glossy specular highlights that erase the painted surface.
    surface:
    - Show deliberate brush direction, edge accents, and simplified material cues.
    texture:
    - Use large-to-medium painted marks that remain legible when assets are reduced.
    - Avoid photorealistic noise and procedural detail as the dominant surface language.
    invariants:
    - Painted color and geometry jointly describe form.
    - Keep the user-provided subject independent from example props.
    - Do not reuse source assets, silhouettes, or exact compositions.
  reproduction:
    medium: Game-ready low-poly 3D assets with hand-painted stylized textures
    materials:
    - simplified polygon forms
    - painted color blocks
    - directional brush marks
    - selective edge highlights
    process:
    - Establish silhouette and major planes.
    - Paint local color and broad shadow shapes along the form.
    - Add selective material cues and edge accents.
    - Inspect at target distance and remove texture noise that competes with gameplay.
    technical: Use texture resolution appropriate to screen size; keep hand-painted value structure visible under
      the intended lighting.
  palette:
