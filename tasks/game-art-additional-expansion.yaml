- id: real-time-brushstroke-3d-game-art
  name: 实时笔触三维游戏美术
  name_en: Real-Time Brushstroke 3D Game Art
  kind: game_art
  domain: game_art
  summary: 让可见笔触沿三维形体组织，并随受光方向显出起伏；与静态厚涂贴图不同，笔触边缘和明暗关系需在场景光照下保持一致。
  summary_en: Visible strokes follow 3D forms and respond to scene lighting; unlike a static painterly texture,
    stroke edges and value relationships remain coherent as illumination changes.
  source:
    url: https://www.gamedeveloper.com/art/achieving-a-painterly-look-in-the-signal-from-t-lva
    title: Achieving a Painterly Look in The Signal From Tölva
    authority: Big Robot / Game Developer
    attribution: This package summarizes a developer-described real-time painterly rendering approach; it does not
      imitate the game’s scenes, designs, or concept art.
  origin: real_time_non_photorealistic_brush_rendering
  period: 2010s_to_present
  entity_type: real_time_brushstroke_3d_game_art_direction
  use_cases:
  - 3d_landscape
  - architectural_environment
  - stylized_character
  - moving_camera_scene
  exclusions:
  - static_canvas_painting_only
  - generic_oil_paint_filter
  - photorealistic_microtexture
  - copied_concept_art
  signature:
    composition:
    - Build the scene with clear large forms and a controlled focal hierarchy.
    - Let brush direction support the shape and camera-readable silhouette.
    - Avoid stroke density that obscures traversal or interaction cues.
    palette:
    - Use a coherent scene palette with local color variation inside strokes.
    - Keep value separation stronger at focal subjects and playable edges.
    - Avoid a global color grade as a substitute for painted rendering.
    medium:
    - Render 3D forms with visible brush-like surface marks in real time.
    - The paint appearance is a rendering treatment, not evidence of a physical painting source.
    lighting:
    - Let strokes respond to the scene’s light and form.
    - Keep highlight and shadow behavior coherent across moving or turning surfaces.
    - Avoid specular glare that wipes out stroke structure.
    surface:
    - Use irregular but purposeful stroke shapes across large surfaces.
    texture:
    - Vary stroke length, width, and density by material and scale.
    - Keep strokes stable enough to avoid crawling or flicker during camera movement.
    invariants:
    - Brush marks remain visible and tied to 3D form under lighting.
    - Preserve the requested subject, camera, and scene details.
    - Do not reproduce named concept art or source layouts.
  reproduction:
    medium: Real-time stylized 3D render with form-following painterly strokes
    materials:
    - stroke-aware surface shading
    - broad painted color variation
    - controlled roughness
    - stable edge accents
    process:
    - Block in the scene and lighting before adding stroke detail.
    - Align stroke direction with surface curvature and material.
    - Tune stroke scale against camera distance and motion.
    - Review moving lights and camera angles for flicker, flatness, or lost silhouettes.
    technical: Use screen-space or surface-space marks consistently; preserve stroke scale and avoid temporal shimmer.
  palette:
  - name: charcoal
    hex: '#343A3D'
    role: deep_form
  - name: pine
    hex: '#4E7162'
    role: environment_mid
  - name: clay
    hex: '#B87454'
    role: warm_accent
  - name: golden_light
    hex: '#D7B36D'
    role: lit_brushwork
  - name: mist
    hex: '#A6B5A4'
    role: distance
- id: cutout-2-5d-stage-game-art
  name: 剪纸式 2.5D 舞台游戏美术
  name_en: Cutout 2.5D Stage Game Art
  kind: game_art
  domain: game_art
  summary: 以相机朝向的插画平面组成纵深舞台，角色和少量道具可在层间移动；保留剪纸式轮廓与舞台空间，不要求角色必须是二维或场景必须完全平面。
  summary_en: Illustrated planes form a depth-aware stage while characters and selected props move between layers;
    cutout silhouettes remain visible without requiring every asset to be strictly 2D.
  source:
    url: https://www.gamedeveloper.com/business/poncho-a-postmortem
    title: Poncho — A Postmortem
    authority: Delve Interactive / Game Developer
    attribution: This package generalizes a developer-described layered-plane 2.5D environment approach; it does
      not copy the game’s art, characters, or level layouts.
  origin: layered_plane_2_5d_environment_art
  period: 2010s_to_present
  entity_type: cutout_2_5d_stage_game_art_direction
  use_cases:
  - side_view_exploration
  - layered_stage_scene
  - platforming_environment
  - illustrated_action_scene
  exclusions:
  - flat_noninteractive_poster
  - full_perspective_photoreal_3d
  - unreadable_layer_overlap
  - copied_named_scene
  signature:
    composition:
    - Arrange planes in a clear foreground-to-background order.
    - Use overlap and shallow depth to frame the playable route.
    - Keep the action plane distinct from decorative layers.
    palette:
    - Use connected colors across planes while separating their values.
    - Reserve strongest contrast for active characters and interactable objects.
    - Keep lighting and color transitions consistent across adjacent planes.
    medium:
    - Combine illustrated planes with limited depth-aware movement and optional 3D elements.
    - Cutout-like edges may be clean, textured, or hand-drawn but remain intentional.
    lighting:
    - Use soft inter-plane shadows or ambient separation to clarify depth.
    - Avoid lighting that makes flat layers appear accidentally detached.
    surface:
    - Preserve the chosen illustration surface consistently across planes.
    texture:
    - Keep high-frequency texture sparse near the player silhouette.
    - Use depth-appropriate detail and avoid moiré during camera movement.
    invariants:
    - The scene reads as a layered stage with controlled shallow depth.
    - User-specified subjects and interactions remain independent from example content.
    - Do not reuse source-game layouts, characters, or visual assets.
  reproduction:
    medium: Layered illustrated 2.5D environment with cutout-like planes
    materials:
    - illustrated depth planes
    - limited parallax
    - soft contact shadows
    - clear gameplay silhouettes
    process:
    - Set the camera and action plane.
    - Separate scenery into layers according to depth and occlusion.
    - Place characters and interactive props with consistent scale across layers.
    - Test movement, occlusion, and edge continuity from the gameplay camera.
    technical: Keep parallax shallow and intentional; validate that character feet, platforms, and foreground occluders
      align at the target camera.
