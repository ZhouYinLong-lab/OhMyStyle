package_id: natural-window-light
package_version: 0.1.0
invariants:
- id: signature
  weight: 3
  test: 大窗软光、自然阴影、低饱和材质与真实镜头表现
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
image_audit:
  similarity_level: high
  visual_overlap:
    - diffuse light through or near a window
    - quiet low-contrast interior atmosphere
  reason: Representative image overlaps with photographer packages that use soft domestic daylight.
  keep_separate_because:
    - source_type is a reusable lighting preset rather than an authorial practice
    - the package transfers light behaviour across user-supplied subjects
    - it must not force a window, room, or still life
  action: clarify_distinctive_signature
