medium: a transferable photographic rendering treatment applied to the user-requested capture medium
composition:
- Separate the subject, shadow, and background into readable planes; let a hard directional shadow create a clear
  boundary without imposing a fixed layout.
style_signature:
- Organizes images through hard directional light, clear shadows, separated color planes, and material differences
  without pretending to be the style of a particular photographer or subject.
- avoid_generic_filters; make medium, structure, palette, and lighting jointly visible
- narrative_is_optional
invariants:
- the result is an original new scene, not a copy of a source work
- no unrequested text, logo, trademark, or named character
