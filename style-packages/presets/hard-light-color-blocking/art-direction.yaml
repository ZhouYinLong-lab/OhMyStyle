schema_version: 2.1.0
status: experimental
id: hard-light-color-blocking-direction
name: 硬光色块摄影
base_package: presets/hard-light-color-blocking
scope:
  medium: a transferable photographic rendering treatment applied to the user-requested capture medium
  representation: stylized
  description: Organizes images through hard directional light, clear shadows, separated color planes, and material
    differences without pretending to be the style of a particular photographer or subject.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copying_a_specific_work
  - copying_a_named_character_or_logo
pillars:
- Organizes images through hard directional light, clear shadows, separated color planes, and material differences
  without pretending to be the style of a particular photographer or subject.
- 'medium: a transferable photographic rendering treatment applied to the user-requested capture medium'
- 'composition: Separate the subject, shadow, and background into readable planes; let a hard directional shadow
  create a clear boundary without imposing a fixed layout.'
- 'palette: Near-black shadow #202126, blue #1554A6, red #C84B3B, yellow #E8D24C, teal #4C8D87, and warm highlight
  #E9E4D8 in distinct roles.'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Render in a transferable photographic rendering treatment applied to the user-requested capture
    medium; make the production or rendering process visible in edge, surface, and tonal evidence.
  observable: The image visibly reads as a transferable photographic rendering treatment applied to the user-requested
    capture medium, rather than a generic color treatment.
  reject_when: Reject when the material or rendering process cannot be distinguished from a generic filter.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Separate the subject, shadow, and background into readable planes; let a hard directional shadow
    create a clear boundary without imposing a fixed layout. Preserve the user-provided subject and requested
    layout.
  observable: Separate the subject, shadow, and background into readable planes; let a hard directional shadow
    create a clear boundary without imposing a fixed layout.
  reject_when: Reject when the arrangement loses these structural decisions or copies a source composition.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Keep dark structure and shadow distinct from saturated color planes, with small warm and neutral
    accents. Preserve the material color of the requested subject.
  observable: 'Near-black shadow #202126, blue #1554A6, red #C84B3B, yellow #E8D24C, teal #4C8D87, and warm highlight
    #E9E4D8 in distinct roles.'
  reject_when: Reject when a global tint replaces the stated color roles or the roles cannot be distinguished.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- medium
- composition
- palette
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-source-1
  kind: style_reference
  base_asset_id: source-1
- id: source-source-2
  kind: style_reference
  base_asset_id: source-2
execution:
  route: text_only
  must:
  - translate the user subject into the style medium and structural rules
  - establish composition before small detail
  - inspect against the generic five-task suite
  - the result is an original new scene, not a copy of a source work
  - no unrequested text, logo, trademark, or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic_global_filter
  - copied_source_composition
  - readable_text_or_branding
  - copying_a_specific_work
  - copying_a_named_character_or_logo
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
