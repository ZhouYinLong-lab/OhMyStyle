signature: single controlled spotlight, deep negative space, sculptural silhouette,
  restrained theatrical light
medium:
- show the selected process or educational method through visible structure
- keep subject content independent from style decisions
composition:
- establish hierarchy before detail
- protect negative space where the brief needs it
lighting:
- keep light direction and contrast coherent
- do not use a global filter to fake the signature
palette:
- use the declared palette as a relationship
- allow natural variation without losing color roles
surface:
- show material evidence at the scale of the scene
- avoid generic AI gloss
exclusions:
- copied source composition
- unrequested readable text
- logo, trademark, or emblem
