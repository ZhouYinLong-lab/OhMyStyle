minimum_score: 8
human_review_dimensions:
  - color_binding
  - area_hierarchy
  - luminance_control
  - flatness_or_gradient_control
  - surface_material_fidelity
  - spatial_and_light_physics
  - subject_neutrality
dimensions:
  pair_legibility:
    weight: 3
    pass: The chosen two-color relationship is immediately readable at thumbnail size.
    fail: The pair is diluted by unrelated hues or a muddy global grade.
  area_hierarchy:
    weight: 2
    pass: Dominant, counter, neutral, and accent roles are visibly different.
    fail: Every object has equal visual weight or equal saturation.
  background_counterbalance:
    weight: 2
    pass: The light or deep ground gives the pair clean separation.
    fail: The background competes with or contaminates the pair.
  subject_neutrality:
    weight: 1
    pass: The rule works without forcing flowers, a vase, or a specific object.
    fail: The result is only a copy of the reference subject arrangement.
  surface_control:
    weight: 2
    pass: Material detail remains local and the image avoids glossy synthetic finish.
    fail: Texture, bloom, or reflections replace the color structure.
rejections:
  - rainbow_palette
  - unstructured_neon
  - muddy_filter
  - equal_saturation_everywhere
  - flower_only_template
  - copied_reference_composition
profiles:
  default:
    min_pair_coverage: 0.12
    max_unassigned_high_chroma: 0.55
    enforce_area_ratio: true
  flat-poster:
    min_pair_coverage: 0.12
    max_mean_edge_delta: 0.09
    max_luminance_delta: 0.12
    enforce_area_ratio: true
  same-luminance:
    min_pair_coverage: 0.12
    max_luminance_delta: null
    max_lstar_delta: 2.0
    max_unassigned_high_chroma: 0.45
    enforce_area_ratio: false
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
