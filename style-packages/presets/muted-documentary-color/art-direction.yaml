schema_version: 2.1.0
status: experimental
id: muted-documentary-color-direction
name: 低饱和纪实色彩
base_package: presets/muted-documentary-color
scope:
  medium: a transferable photographic rendering treatment that preserves the user-requested capture medium
  representation: stylized
  description: Builds an observational look through restrained but not lifeless color, natural overcast light,
    ordinary surfaces, and unforced framing; it is not bound to a subject, place, or narrative.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copying_a_specific_work
  - copying_a_named_character_or_logo
pillars:
- Builds an observational look through restrained but not lifeless color, natural overcast light, ordinary surfaces,
  and unforced framing; it is not bound to a subject, place, or narrative.
- 'medium: a transferable photographic rendering treatment that preserves the user-requested capture medium'
- 'composition: Use unforced framing and ordinary environmental context; keep the subject readable through restrained
  contrast and natural spatial relationships.'
- 'palette: Muted shadow #50565A, blue-gray distance #73828A, muted red focal note #9B6256, plant green #6F7960,
  warm highlight #D7D2C7, and natural skin #A98772.'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Render in a transferable photographic rendering treatment that preserves the user-requested capture
    medium; make the production or rendering process visible in edge, surface, and tonal evidence.
  observable: The image visibly reads as a transferable photographic rendering treatment that preserves the user-requested
    capture medium, rather than a generic color treatment.
  reject_when: Reject when the material or rendering process cannot be distinguished from a generic filter.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use unforced framing and ordinary environmental context; keep the subject readable through restrained
    contrast and natural spatial relationships. Preserve the user-provided subject and requested layout.
  observable: Use unforced framing and ordinary environmental context; keep the subject readable through restrained
    contrast and natural spatial relationships.
  reject_when: Reject when the arrangement loses these structural decisions or copies a source composition.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Lower color intensity without draining all color. Preserve believable skin and material colors,
    and reserve the warmest hue for a small focal area.
  observable: 'Muted shadow #50565A, blue-gray distance #73828A, muted red focal note #9B6256, plant green #6F7960,
    warm highlight #D7D2C7, and natural skin #A98772.'
  reject_when: Reject when a global tint replaces the stated color roles or the roles cannot be distinguished.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- medium
- composition
- palette
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-source-1
  kind: style_reference
  base_asset_id: source-1
- id: source-source-2
  kind: style_reference
  base_asset_id: source-2
execution:
  route: text_only
  must:
  - translate the user subject into the style medium and structural rules
  - establish composition before small detail
  - inspect against the generic five-task suite
  - the result is an original new scene, not a copy of a source work
  - no unrequested text, logo, trademark, or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic_global_filter
  - copied_source_composition
  - readable_text_or_branding
  - copying_a_specific_work
  - copying_a_named_character_or_logo
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
