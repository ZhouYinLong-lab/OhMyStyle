package_id: ulm-school
package_version: 0.1.0
invariants:
- id: signature
  weight: 3
  test: 功能主义、系统化网格、信息清晰与中性材料
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
image_audit:
  similarity_level: high
  visual_overlap:
    - systematic grid and restrained product presentation
    - neutral functional palette
  reason: Ulm representatives can share geometric order with Bauhaus, De Stijl, and grid techniques.
  keep_separate_because:
    - the package is defined by information clarity, systems thinking, and functional communication
    - it is not interchangeable with decorative geometric abstraction
    - it must adapt the user's subject rather than force a product board
  action: clarify_distinctive_signature
