- 以跨学科研究、过程公开和展览语境中的实验性，连接绘画、物件、影像、空间与批评性编辑。
- 'differentiation: research-led cross-media thinking; process made legible when useful; exhibition-aware editing'
- 'composition: Let research, process, and presentation shape the hierarchy; support a clear proposition without
  prescribing one format.; Use contrasts between finished form and visible process when they clarify the idea.'
- 'palette: Treat color as a material and conceptual choice, ranging from quiet neutrals to deliberately saturated
  interventions.; Keep the palette accountable to the chosen medium rather than a universal school filter.'
