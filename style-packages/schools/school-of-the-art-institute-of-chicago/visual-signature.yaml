composition:
  - Let research, process, and presentation shape the hierarchy; support a clear proposition without prescribing one format.
  - Use contrasts between finished form and visible process when they clarify the idea.
palette:
  - Treat color as a material and conceptual choice, ranging from quiet neutrals to deliberately saturated interventions.
  - Keep the palette accountable to the chosen medium rather than a universal school filter.
lighting:
  quality: neutral exhibition light or studio light appropriate to the medium
  behavior:
    - Keep the work legible as a proposition before adding atmosphere or spectacle.
surface:
  finish: presentation-ready but allowed to show process
  edges: medium-specific and intentionally edited
texture:
  density: layered around the conceptual focus
  placement: process evidence appears where it supports the proposition, not as generic clutter
invariants:
  - research-led visual proposition
  - medium-aware material decisions
  - clear exhibition hierarchy with room for experimentation
