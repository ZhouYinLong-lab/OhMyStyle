medium: interdisciplinary studio practice
materials:
  support: the user-supplied medium, including image, object, installation, print, or moving image
process:
  - identify the question or proposition implied by the user-supplied subject
  - choose a medium and edit that make the proposition visible
  - retain useful process evidence, then arrange the final presentation with deliberate hierarchy
technical_direction:
  contrast: concept-dependent
  saturation: purposeful rather than global
  perspective: chosen for the proposition
  detail_density: concentrated where research or process needs to be read
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
