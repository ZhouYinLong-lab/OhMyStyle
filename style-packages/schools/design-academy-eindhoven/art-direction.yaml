joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - medium
  - composition
  instruction: Keep the package-specific relationship among differentiation, medium, composition consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-dae-vision-mission
  kind: primary
  base_asset_id: dae-vision-mission
- id: source-dae-graduation-show
  kind: secondary
  base_asset_id: dae-graduation-show
execution:
  route: text_only
  must:
  - define the supplied design problem without inventing a new product category
  - show materials and construction decisions
  - make scale, use, and consequence legible
  - use neutral documentation light and open space
  - avoid polishing away the research status
  - state the supplied design problem and object
  - select materials that make the problem legible
  - show one or two construction decisions and their consequences
  avoid:
  - forced furniture, industrial hall, sustainability icon, or Dutch interior
  - generic futuristic product render
  - polished branding board without material evidence
  - copied student work or recognizable school exhibition layout
  - forced furniture, industrial hall, Dutch interior, or eco icon
  - copied student project
  - named product or branded asset
  - recurring furniture, industrial hall, or sustainability icon
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
