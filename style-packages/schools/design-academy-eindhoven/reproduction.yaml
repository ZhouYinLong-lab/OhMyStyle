medium: critical material design presentation
materials:
  support: user-specified prototype, object, installation, diagram, or publication
  surface: raw, recycled, crafted, or provisional material evidence
process:
  - define the supplied design problem without inventing a new product category
  - show materials and construction decisions
  - make scale, use, and consequence legible
  - use neutral documentation light and open space
  - avoid polishing away the research status
technical_direction:
  contrast: medium and documentary
  saturation: restrained with one purposeful accent
  perspective: credible and spatial
  detail_density: medium-high at construction points
