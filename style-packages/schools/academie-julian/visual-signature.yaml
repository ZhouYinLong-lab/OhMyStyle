composition:
  - When creating a requested artwork, establish pose, proportion, and large value groups before local finish.
  - Keep the main figure or object clearly grounded in space; use simple background planes rather than ornamental institutional architecture.
  - Let preparatory marks or alternate contour traces remain selectively visible where they explain the construction.
palette:
  - Favor charcoal gray, warm paper, earth pigments, and restrained color accents.
  - Let color remain subordinate to drawing and tonal structure; do not impose a fixed palette on unrelated subject matter.
medium:
  - Combine charcoal or graphite study logic with controlled oil-paint finish when the requested medium is painting.
  - Keep line, value, and proportion decisions readable rather than burying them under texture.
lighting:
  - Use clear studio-like light to reveal form and planes without theatrical chiaroscuro.
  - Model volume with grouped values and observed cast shadows.
surface:
  - Preserve paper grain, sketch traces, or measured brush layers only where appropriate to the requested medium.
  - Make revision and construction purposeful, not distressed decoration.
texture:
  - Prefer observational marks and value studies over a signature surface effect.
invariants:
  - The distinctive identity is a method of study: observe, block in, test proportions, revise, then resolve.
  - Keep the process visible enough to distinguish an atelier study from a polished court portrait or a finished gallery installation.
  - Do not force a classroom, easel, student, model, or 19th-century setting into the user's subject.
