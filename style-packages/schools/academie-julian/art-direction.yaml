execution:
  route: text_only
  must:
  - Translate the user brief into a clear pose, object structure, or spatial arrangement.
  - Observe proportions and large value masses before adding detail.
  - Use construction lines or a tonal study to check balance and anatomy where relevant.
  - Revise contours in response to observed form; avoid ornamental or automatic strokes.
  - Resolve the requested medium with selective finish while allowing a few study marks to remain.
  - 'The distinctive identity is a method of study: observe, block in, test proportions, revise, then resolve.'
  - Keep the process visible enough to distinguish an atelier study from a polished court portrait or a finished
    gallery installation.
  - Do not force a classroom, easel, student, model, or 19th-century setting into the user's subject.
  avoid:
  - grand_state_academy_hall
  - abstract_workshop_installation
  - copied_historical_classroom
  - The package abstracts documented pedagogical context; do not reproduce a named student, historical class
    scene, work, logo, or exact composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
