medium: observational drawing and academic painting workflow; adapt materials to the user's requested medium
materials: [charcoal or graphite, warm paper, measured tonal wash, controlled oil-paint layers when requested]
process:
  - Translate the user brief into a clear pose, object structure, or spatial arrangement.
  - Observe proportions and large value masses before adding detail.
  - Use construction lines or a tonal study to check balance and anatomy where relevant.
  - Revise contours in response to observed form; avoid ornamental or automatic strokes.
  - Resolve the requested medium with selective finish while allowing a few study marks to remain.
technical_direction: The school signature is process and observational discipline, not one palette or universal finished look. Respect the requested subject, medium, setting, and historical context.
safety_note: The package abstracts documented pedagogical context; do not reproduce a named student, historical class scene, work, logo, or exact composition.
