joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - composition
  - palette
  instruction: Keep the package-specific relationship among differentiation, composition, palette consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-royal-danish-academy-primary-source
  kind: primary
  base_asset_id: royal-danish-academy-primary-source
execution:
  route: text_only
  must:
  - define the functional proposition and scale relationship
  - assign materials according to behavior, durability, and tactile contrast
  - compose the result with neutral light, readable joints, and environmental context
  - preserve material honesty and functional legibility
  - preserve research-like structure rather than decorative styling
  - preserve balance between human scale, environment, and object system
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - mandatory Scandinavian chair, timber house, or coastal landscape
  - empty luxury minimalism without functional or material reasoning
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
