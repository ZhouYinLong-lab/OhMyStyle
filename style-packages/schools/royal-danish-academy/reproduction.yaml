medium: architecture, product, spatial, and material research presentation
materials:
  support: wood, stone, metal, paper, textile, clay, or restrained digital presentation
process:
  - define the functional proposition and scale relationship
  - assign materials according to behavior, durability, and tactile contrast
  - compose the result with neutral light, readable joints, and environmental context
technical_direction:
  contrast: moderate and controlled
  saturation: low to medium with one purposeful accent
  perspective: accurate, calm, and human-scaled
  detail_density: selective; show evidence of making without clutter
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
