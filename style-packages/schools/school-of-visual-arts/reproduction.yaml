medium: cross-media visual practice
materials:
  support: the user-supplied medium, from image and print to object or installation
process:
  - clarify the visual proposition and user-supplied subject
  - choose a medium and hierarchy that make the idea legible
  - add process-specific material evidence, then edit for exhibition clarity
technical_direction:
  contrast: concept-dependent, with clear focal hierarchy
  saturation: controlled and purpose-driven
  perspective: chosen to support the proposition, not a fixed camera signature
  detail_density: layered; high at the conceptual focus and quieter elsewhere
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
