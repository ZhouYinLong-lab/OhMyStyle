schema_version: 2.1.0
status: experimental
id: school-of-visual-arts-direction
name: 视觉艺术学院
base_package: schools/school-of-visual-arts
scope:
  medium: cross-media visual practice
  representation: stylized
  description: 以跨媒介实验、清晰的概念框架和面向展示的视觉叙事，组织平面、影像、物件与空间之间的关系。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - a mandatory classroom, student figure, poster, or narrative illustration
pillars:
- 以跨媒介实验、清晰的概念框架和面向展示的视觉叙事，组织平面、影像、物件与空间之间的关系。
- 'differentiation: concept-led visual hierarchy; comfort with mixed media and presentation formats; emphasis
  on editability and exhibition readiness'
- 'composition: Build a clear visual proposition with strong hierarchy, purposeful cropping, and room for process
  evidence.; Allow image, text-like structure, object, or space to coexist when the concept requires it, without
  forcing a collage.'
- 'palette: Treat color as a conceptual and material decision; combine controlled neutrals with one deliberate
  accent family.; Preserve the difference between ink, screen, paper, paint, and light rather than applying
  one global grade.'
rules:
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: concept-led
    visual hierarchy; comfort with mixed media and presentation formats; emphasis on editability and exhibition
    readiness. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: concept-led visual hierarchy; comfort
    with mixed media and presentation formats; emphasis on editability and exhibition readiness.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: concept-led
    visual hierarchy; comfort with mixed media and presentation formats; emphasis on editability and exhibition
    readiness.'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Build a clear
    visual proposition with strong hierarchy, purposeful cropping, and room for process evidence.; Allow image,
    text-like structure, object, or space to coexist when the concept requires it, without forcing a collage..
    Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Build a clear visual
    proposition with strong hierarchy, purposeful cropping, and room for process evidence.; Allow image, text-like
    structure, object, or space to coexist when the concept requires it, without forcing a collage..'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: Build a
    clear visual proposition with strong hierarchy, purposeful cropping, and room for process evidence.; Allow
    image, text-like structure, object, or space to coexist when the concept requires it, without forcing a
    collage..'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Treat color as a conceptual and material
    decision; combine controlled neutrals with one deliberate accent family.; Preserve the difference between
    ink, screen, paper, paint, and light rather than applying one global grade.. Adapt their balance to the
    requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: Treat color as a conceptual
    and material decision; combine controlled neutrals with one deliberate accent family.; Preserve the difference
    between ink, screen, paper, paint, and light rather than applying one global grade..'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    Treat color as a conceptual and material decision; combine controlled neutrals with one deliberate accent
    family.; Preserve the difference between ink, screen, paper, paint, and light rather than applying one
    global grade..'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: clear exhibition light or neutral working
    light; behavior: Keep the visual proposition readable before adding atmosphere.; behavior: Let material
    and process determine local contrast.. Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: clear exhibition light
    or neutral working light; behavior: Keep the visual proposition readable before adding atmosphere.; behavior:
    Let material and process determine local contrast..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: clear exhibition
    light or neutral working light; behavior: Keep the visual proposition readable before adding atmosphere.;
    behavior: Let material and process determine local contrast..'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: resolved
    presentation surface with visible process where useful; edges: intentional; crisp for design elements and
    tactile for physical media. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
    resolved presentation surface with visible process where useful; edges: intentional; crisp for design elements
    and tactile for physical media.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    finish: resolved presentation surface with visible process where useful; edges: intentional; crisp for
    design elements and tactile for physical media.'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: variable
    by concept, with focal concentration; placement: place texture where it explains process or material, not
    as decoration everywhere. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density:
    variable by concept, with focal concentration; placement: place texture where it explains process or material,
    not as decoration everywhere.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    density: variable by concept, with focal concentration; placement: place texture where it explains process
    or material, not as decoration everywhere.'
  evidence:
    source_ids:
    - source-school-of-visual-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- distinctiveness
- composition
- palette
- lighting
- surface
- texture
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - composition
  - palette
  instruction: Keep the package-specific relationship among differentiation, composition, palette consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-school-of-visual-arts-primary-source
  kind: primary
  base_asset_id: school-of-visual-arts-primary-source
execution:
  route: text_only
  must:
  - clarify the visual proposition and user-supplied subject
  - choose a medium and hierarchy that make the idea legible
  - add process-specific material evidence, then edit for exhibition clarity
  - concept-led hierarchy
  - cross-media material awareness
  - presentation-ready structure with room for interpretation
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - a mandatory classroom, student figure, poster, or narrative illustration
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
