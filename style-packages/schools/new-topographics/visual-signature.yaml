subject_matter:
  - human_altered_landscape
  - infrastructure
  - ordinary_suburban_edges
  - industrial_or_agricultural_intervention
composition:
  - frontal_or_elevated_fixed_view
  - horizontal_stability
  - modest_scale_of_human_artifacts
  - repeated_structural_motifs
light:
  quality: even_or_unheroic_daylight
  behavior:
    - avoids_dramatic_sunset
    - avoids_heroic_rim_light
    - preserves_surface_information
color:
  - concrete_gray
  - dry_vegetation
  - faded_asphalt
  - pale_sky
  - restrained_artificial_accent
tone:
  - clear_eyed
  - nonjudgmental
  - quietly_critical
invariants:
  - the landscape shows human modification
  - the camera does not romanticize the site
  - geometry and evidence matter more than spectacle
