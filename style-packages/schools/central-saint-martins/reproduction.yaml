medium: interdisciplinary studio documentation and experimental design composition
materials:
  support: paper, cardboard, fabric, transparent sheet, printed fragment, and found object
  tools:
    - cutting and folding
    - pinning and taping
    - scanning or direct photography
process:
  - Clarify the user's design problem and intended audience.
  - Gather a small set of material, image, and structural studies.
  - Arrange prototypes, fragments, and negative space around one visible question.
  - Keep joins, revisions, overlays, and imperfect tests visible where useful.
  - Edit the result so experimentation remains legible rather than becoming clutter.
technical_direction:
  contrast: clear separation between support, samples, and focal prototype
  saturation: theme-dependent with selective accent color
  perspective: documentation viewpoint or deliberately flat editorial view
  detail_density: dense at process areas, quiet around the hierarchy anchor
avoid:
  - fixed pin-up wall, fashion garment, typography poster, or workshop scene
  - unreadable pseudo-text, logos, and exact student projects
safety_note: Do not imply official affiliation or reproduce a real school project.
