  observable: 'The result expresses the stated distinction in visible form: 研究、制作和修订过程进入画面; 多种材料并置但由一个设计问题组织;
    不追求统一表面，而追求有意图的实验性.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: 研究、制作和修订过程进入画面;
    多种材料并置但由一个设计问题组织; 不追求统一表面，而追求有意图的实验性.'
