schema_version: 2.1.0
status: experimental
id: central-saint-martins-direction
name: 中央圣马丁艺术与设计学院
base_package: schools/central-saint-martins
scope:
  medium: interdisciplinary studio documentation and experimental design composition
  representation: stylized
  description: 以跨媒介实验、研究驱动的视觉沟通和材料工作坊把设计当作思考与制作共同推进的过程。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - school logo
  - copied student work
  - generic moodboard
  - polished e-commerce layout
  - school logo or readable institutional text
  - 不强制生成工作室、服装、海报或学生展板
pillars:
- 以跨媒介实验、研究驱动的视觉沟通和材料工作坊把设计当作思考与制作共同推进的过程。
- 'differentiation: 研究、制作和修订过程进入画面; 多种材料并置但由一个设计问题组织; 不追求统一表面，而追求有意图的实验性'
- 'composition: 允许模块、碎片、留白和过程痕迹共存，层次看似松散但有任务重点。; 设计对象、材料样本和注释区域形成跨媒介关系，不要求统一风格表面。'
- 'palette: 以工作室中性底色承载少量实验性色块，颜色来自材料与主题而非固定配色。'
