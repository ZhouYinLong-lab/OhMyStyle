suite: visual-style-core-v1
dimensions:
  style_recognition: Can a reviewer identify the declared medium/process/educational signature without relying on the package
    name?
  object_completion: Are the requested subjects and objects complete and coherent?
  prompt_adherence: Are the user constraints followed without adding unrequested elements?
  color_adherence: Are palette roles preserved with controlled variation?
  material_correctness: Do surfaces show believable material evidence?
  composition_stability: Does hierarchy survive subject changes and aspect-ratio changes?
  ai_artifacts: Are generic gloss, repetition, malformed edges, and synthetic clutter controlled?
  cross_model_stability: Does the signature remain visible across more than one model or workflow?
pass_rule: Score each dimension from 0 to 5; investigate any dimension below 3 before publishing a package example.
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
