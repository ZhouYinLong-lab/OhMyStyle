medium: cross-media contemporary art direction and exhibition presentation
materials:
  support: gallery wall, floor, screen, paper, clay, metal, fabric, or other user-specified materials
process:
  - Identify the user's central idea and select one dominant material or spatial anchor.
  - Add one or two supporting media that clarify process or concept rather than decorate.
  - Light the installation evenly, keeping projection or screen light local and controlled.
  - Edit the frame so process evidence is present but no accidental text, logo, or classroom clutter remains.
technical_direction:
  contrast: medium, with clean separation between materials
  saturation: neutral base with one deliberate accent
  perspective: gallery-documentary, level and spatially coherent
  detail_density: medium; conceptual hierarchy outranks maximal object count
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
