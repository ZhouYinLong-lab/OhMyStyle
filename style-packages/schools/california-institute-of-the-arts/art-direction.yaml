- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Start from a neutral field and let
    one acid or primary accent mark the conceptual hinge.; Keep color blocks and material differences legible
