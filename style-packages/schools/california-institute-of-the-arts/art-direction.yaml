execution:
  route: text_only
  must:
  - Identify the user's central idea and select one dominant material or spatial anchor.
  - Add one or two supporting media that clarify process or concept rather than decorate.
  - Light the installation evenly, keeping projection or screen light local and controlled.
  - Edit the frame so process evidence is present but no accidental text, logo, or classroom clutter remains.
  - Conceptual hierarchy remains clear when the subject changes.
  - Material and process differences remain visible without requiring a classroom or institutional logo.
  - Mixed media serves the requested idea and does not become a mandatory collage recipe.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - a school logo, classroom, student identity, or institutional branding
  - mandatory collage, projection, or process board when the user's subject does not call for it
  - decorative art-school clutter without a clear conceptual anchor
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
