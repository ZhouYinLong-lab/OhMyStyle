- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: clean gallery light with controlled screen
    or projector emission; behavior: Give each material enough even light to read its texture; keep projected
    light localized.; behavior: Separate process artifacts from decorative noise through clear spatial hierarchy..
    Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: clean gallery light
