schema_version: 2.1.0
status: experimental
id: california-institute-of-the-arts-direction
name: 加州艺术学院
base_package: schools/california-institute-of-the-arts
scope:
  medium: cross-media contemporary art direction and exhibition presentation
  representation: stylized
  description: 以跨媒介、批判思考、实验制作和展览语境之间的往返，形成开放而过程导向的当代艺术提案。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - a school logo, classroom, student identity, or institutional branding
  - mandatory collage, projection, or process board when the user's subject does not call for it
  - decorative art-school clutter without a clear conceptual anchor
pillars:
- 以跨媒介、批判思考、实验制作和展览语境之间的往返，形成开放而过程导向的当代艺术提案。
- 'differentiation: concept-led cross-media hierarchy; process evidence integrated into a clean exhibition
  view; tactile coexistence of physical and projected materials'
- 'composition: Organize the image like a considered exhibition view: one clear conceptual anchor with supporting
  material evidence.; Allow separate media to coexist—paper, projection, clay, metal, fabric, or diagram—without
  collapsing into clutter.'
- 'palette: Start from a neutral field and let one acid or primary accent mark the conceptual hinge.; Keep
  color blocks and material differences legible rather than applying a school-wide visual filter.'
rules:
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: concept-led
    cross-media hierarchy; process evidence integrated into a clean exhibition view; tactile coexistence of
    physical and projected materials. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: concept-led cross-media hierarchy;
    process evidence integrated into a clean exhibition view; tactile coexistence of physical and projected
    materials.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: concept-led
    cross-media hierarchy; process evidence integrated into a clean exhibition view; tactile coexistence of
    physical and projected materials.'
  evidence:
    source_ids:
    - source-california-institute-of-the-arts-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Organize the
    image like a considered exhibition view: one clear conceptual anchor with supporting material evidence.;
    Allow separate media to coexist—paper, projection, clay, metal, fabric, or diagram—without collapsing into
    clutter.. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Organize the image
