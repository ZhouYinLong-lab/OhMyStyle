composition:
  - Organize the image like a considered exhibition view: one clear conceptual anchor with supporting material evidence.
  - Allow separate media to coexist—paper, projection, clay, metal, fabric, or diagram—without collapsing into clutter.
palette:
  - Start from a neutral field and let one acid or primary accent mark the conceptual hinge.
  - Keep color blocks and material differences legible rather than applying a school-wide visual filter.
lighting:
  quality: clean gallery light with controlled screen or projector emission
  behavior:
    - Give each material enough even light to read its texture; keep projected light localized.
    - Separate process artifacts from decorative noise through clear spatial hierarchy.
surface:
  finish: tactile contemporary installation documentation
  edges: clean presentation edges interrupted by real folds, seams, cuts, or hand-built irregularities
texture:
  density: medium; detail clusters around material joins and process evidence
  placement: visible in paper fibers, clay marks, tape, projection spill, and edited working notes without readable text
invariants:
  - Conceptual hierarchy remains clear when the subject changes.
  - Material and process differences remain visible without requiring a classroom or institutional logo.
  - Mixed media serves the requested idea and does not become a mandatory collage recipe.
