composition:
- 单一人物通过服装、姿态和背景暗示身份，但不提供明确叙事
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 粉灰、旧绿、奶油、黑和人工暖色形成舞台化色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 构造性肖像摄影、角色化造型与可见布景
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 正面或侧向的舞台光，阴影保留角色扮演痕迹
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 化妆、布料、假发、墙纸和道具表面可辨
- 不同材质保留可辨识的表面行为。
texture:
- 边缘与背景略有人工感，主体身份保持暧昧
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持身份不确定和摄影布景意识，不复制具体艺术家肖像或角色
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
