canonical_name: 李·弗里德兰德
entity_type: photographer
domain: photography
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；复杂街景只是代表性的观察方式，不是默认地点。
  subjects: []
  exclusions:
    - 固定城市、街牌或人物身份
    - 复制具体摄影作品
    - 可读文字、商标和新闻事件
sources:
  - 'https://www.moma.org/artists/2002-lee-friedlander'
notes:
  - 本包提取黑白街头摄影中的反射、遮挡、框中框和画面自指性。
  - 代表图使用普通城市界面作为测试主体，不要求生成街道、商店或行人。
composition:
  - 允许窗框、车窗、影子、线缆和反射把画面分成多个互相干扰的层。
  - 保持局部裁切和不完全信息，让观看路径在前景与背景之间来回移动。
  - 复杂不等于混乱；主体轮廓和空间线索仍需可读。
palette:
  - 默认使用黑白或近黑白灰阶，依靠亮部、暗部和中间灰建立密度。
  - 若用户要求颜色，颜色只作为局部观察信息，不覆盖结构关系。
lighting:
  quality: 真实街头光线，可能有硬光、阴影和玻璃反射
  behavior:
    - 保留高光反射与深暗区域的并置，但避免电影化轮廓光。
    - 让环境光和反射光共同制造多层观看关系。
surface:
  finish: 直接、克制的黑白摄影表面
  edges: 反射边界、窗框和线缆可清楚切割画面，局部允许遮挡
texture:
  density: 中等
  placement: 纹理来自街道、玻璃、墙面和胶片颗粒，不能变成装饰噪声
invariants:
  - 黑白观察和多层框架关系
  - 反射、遮挡、裁切与画面自指性
  - 复杂但可读的街头空间
  - 不固定城市、人物、商店、汽车或事件
medium: 二十世纪后半叶美国街头黑白摄影
materials:
  support: 胶片或模拟黑白摄影质感，保留玻璃、金属、墙面等真实表面
process:
  - 先锁定用户主体，再选择一个自然出现的遮挡或反射层。
  - 用线缆、框架、影子或玻璃把主体置于多层空间中。
  - 以黑白灰阶整理明度，保留局部高光与深暗关系。
  - 最后检查画面是否仍可读，避免随机叠加和可识别文字。
technical_direction:
  contrast: 中高对比，亮暗关系明确但保留中间灰
  saturation: 黑白优先；彩色需求下保持局部、克制的色彩
  perspective: 真实街头镜头，允许遮挡和裁切，不使用夸张广角畸变
  detail_density: 中高，密度来自真实结构而非随机纹理
avoid:
  - 默认加入某个城市、街牌、汽车或行人故事
  - 把复杂构图变成赛博朋克或电影海报
  - 复制具体照片的角度、人物和地标
  - 用大量颗粒掩盖错误空间关系
safety_note: 不复现具体作品、可识别人物、商标、街牌或新闻事件。
