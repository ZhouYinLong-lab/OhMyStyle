pillars:
- 以黑白街头观察、反射叠层、遮挡关系和画面自指性制造复杂但可读的城市观看结构。
- 'form: medium: 黑白街头观察摄影; composition: 反射、遮挡、框中框、局部裁切和自指性; palette: 黑白灰阶，依靠局部明度密度组织观看; lighting: 真实环境光与反射光并置;
  surface: 直接、克制、保留街头表面; texture: 中等胶片与城市材料纹理; edges: 结构线清楚，部分主体被自然遮挡'
- 'process: preserve: 多层观看关系; preserve: 黑白灰阶和复杂但可读的构图; preserve: 反射与裁切带来的不确定性; release: 代表图中的商店、线缆和行人; release:
  固定城市或街头事件'
- 'palette: roles: name: 银白高光; roles: hex: #E7E7E2; roles: role: glass and sky highlights; roles: name: 中性灰;
  roles: hex: #8B8B86; roles: role: material and spatial middle values; roles: name: 深炭黑; roles: hex: #1E2020'
