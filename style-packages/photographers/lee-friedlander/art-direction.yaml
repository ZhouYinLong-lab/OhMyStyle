schema_version: 2.1.0
status: experimental
id: lee-friedlander-direction
name: 李·弗里德兰德
base_package: photographers/lee-friedlander
scope:
  medium: photography
  representation: recognizable
  description: 以黑白街头观察、反射叠层、遮挡关系和画面自指性制造复杂但可读的城市观看结构。
  required_contexts: []
  incompatible_contexts: []
  limitations:
