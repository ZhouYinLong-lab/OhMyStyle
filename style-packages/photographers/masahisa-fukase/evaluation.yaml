invariants:
  - id: sequence_logic
    weight: 3
    test: Three images share a motif or situation but are not redundant copies.
  - id: intimate_distance
    weight: 2
    test: The camera feels personally involved without becoming commercial.
  - id: shadow_information
    weight: 2
    test: Blacks are deep while some tonal information remains.
  - id: ambiguity
    weight: 2
    test: The image leaves emotional or narrative space unresolved.
rejections:
  - single_iconic_poster_frame
  - glossy_noir_filter
  - identifiable_real_person_without_consent
  - copied_named_work
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
