subject_matter:
  - autobiographical fragments
  - repeated encounters with a person, animal, or place
  - ordinary scenes carrying emotional residue
composition:
  - partial visibility
  - unstable distance
  - ambiguous foreground and background
  - sequence matters more than one iconic frame
color:
  primary: deep_black_and_white
  alternate: restrained_color_or_monochrome_variation
  behavior:
    - dense blacks
    - silvery_midtones
    - occasional_buoyant_color_as_contrast
light:
  quality: available_light_or_low_key_ambient
  behavior:
    - selective_visibility
    - atmospheric_falloff
    - darkness_as_narrative_space
surface:
  grain: visible_film_grain
  sharpness: variable
  finish: photographic_print_or_photobook_sequence
invariants:
  - the image belongs to a possible series
  - intimacy is balanced by emotional distance
  - recurring motifs carry meaning without becoming a logo
