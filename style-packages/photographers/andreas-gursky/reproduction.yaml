reproduction:
  priority_order:
    - 用户主体与用途
    - 视点、尺度和整体构图
    - 重复结构与色彩分区
    - 局部细节和后期克制
  subject_rules:
    - 用户主体必须保持可识别，不因风格名被替换为固定设施。
    - 代表图中的场景只用于演示尺度关系，不进入默认提示词。
  transfer_rules:
    - 把主体内部已有的重复或分层放大为构图组织。
    - 只有主体允许时才使用高处或远距离视点。
    - 维持清晰、均匀、信息密集的摄影表面。
  forbidden_shortcuts:
    - 仓库、停车场、办公室、体育场等固定模板
    - 过度 HDR、航拍旅游照或无意义复制
