canonical_name: 安德烈亚斯·古尔斯基
entity_type: photographer
domain: photography
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；代表图只是测试主体，不是默认场景。
  subjects: []
  exclusions:
    - 固定仓库、办公室、停车场、工厂或人群
    - 无人机旅游照式的空泛俯拍
    - 复制具体摄影作品、建筑或品牌
sources:
  - 'https://www.moma.org/calendar/exhibitions/170'
notes:
  - 本包提取大尺度观看、重复模块、色彩分区和系统秩序之间的张力。
  - 高处视角和高信息密度是可选的构图工具，不是固定地点要求。
composition:
  - 先寻找主体内部已有的重复、网格、队列或分层关系。
  - 用远距离或高处观看建立整体秩序，再保留足够细节让局部成为可读单元。
  - 通过水平色带、模块重复和精确裁切控制视觉节奏。
palette:
  - 使用清晰但受控的色块，让色彩承担分区和尺度关系，不套用全局滤镜。
lighting:
  quality: 均匀、清晰、偏冷静的自然或建筑光线
  behavior:
    - 让大量物体保持可辨，避免戏剧化聚光破坏整体秩序。
surface:
  finish: 高解析度、平整而真实的摄影表面
  edges: 远景清晰，局部细节准确，不加发光边缘
texture:
  density: 中等到高
  placement: 纹理来自主体本身的重复结构、材料差异和尺度变化
invariants:
  - 大尺度观看与局部单元并存
  - 重复模块、分区色彩和系统秩序
  - 画面信息密度高但层级清楚
  - 不固定人物、建筑、设施或地点
medium: 当代大画幅色彩摄影
materials:
  support: 真实场景、清晰镜头和受控后期
process:
  - 先锁定用户主体，不从摄影师姓名推断场景。
  - 观察主体中自然存在的网格、重复、队列或层级。
  - 用视点、裁切和色带组织整体，再恢复局部细节。
  - 最后限制饱和度、锐度和后期拼接，避免生成空泛的航拍模板。
technical_direction:
  contrast: 中等，整体层次清晰，避免局部戏剧化
  saturation: 中等到高，色块明确但不脏艳
  perspective: 高处或远距离视点，保持比例稳定
  detail_density: 高，细节分布均匀且可分层阅读
avoid:
  - 默认生成仓库、停车场、办公室或体育场
  - 把重复结构变成无意义的复制错误
  - 过度锐化、HDR 光晕和旅游航拍感
  - 复制原作构图、建筑或可识别人物
safety_note: 不复现具体作品、人物、品牌或地点；代表图只展示可迁移的视觉规则。
