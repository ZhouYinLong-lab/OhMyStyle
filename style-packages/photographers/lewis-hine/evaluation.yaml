package_id: lewis-hine
package_version: 0.1.0
invariants:
  - id: contextual_evidence
    weight: 3
    test: Work or institutional environment provides concrete evidence.
  - id: human_agency
    weight: 3
    test: The person retains dignity and is not reduced to spectacle.
  - id: scale_relationship
    weight: 2
    test: Body, tool, machine, luggage, or building scale is legible.
  - id: original_arrangement
    weight: 3
    test: The image is not a recognizable reconstruction.
rejections: [vintage_filter, poverty_porn, heroic_advertising, copied_named_photo]
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
