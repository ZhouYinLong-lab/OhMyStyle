    rendering: honest_tonal_response.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    capture: early_documentary_plate_or_film_record; rendering: sharp_structural_detail; rendering: modest_print_irregularity;
    rendering: honest_tonal_response.'
  evidence:
