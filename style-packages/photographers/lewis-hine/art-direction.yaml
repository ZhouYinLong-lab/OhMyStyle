execution:
  route: text_only
  must:
  - identify the social fact before styling the frame
  - place tools, machinery, luggage, or architecture in relation to the body
  - keep tonal response descriptive and midtones open
  - avoid sentimental blur, heroic overstatement, and modern editorial polish
  - the person has agency and dignity
  - the environment provides evidence rather than decoration
  - scale relationships between body, work, and institution are legible
  - no invented melodrama or copied historical scene
  avoid:
  - fashion_pose
  - anonymous_vintage_aesthetic
  - poverty_porn
  - Use documentary structure only; do not recreate a named photograph or exploit a vulnerable person.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
