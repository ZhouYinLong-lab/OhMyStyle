medium: 自然主义时尚肖像、少量造型和真实皮肤
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持自然、克制和人物个性，不复制模特、服装或杂志封面
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
