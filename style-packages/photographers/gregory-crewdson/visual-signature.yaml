composition:
- 郊区住宅、空街和一个停顿的人物组成高度控制的电影化静止
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 钨黄、暮蓝、湿黑、草绿和砖红形成冷暖夜景
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 大型制作式摄影、舞台调度与超细致景深
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 多来源但统一的电影灯光，窗口、路灯和天空有明确来源
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 湿路面、草坪、玻璃、木墙和衣物区分清楚
- 不同材质保留可辨识的表面行为。
texture:
- 细节密度高但动作保持静止，画面不加入镜头光晕
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持异常日常与静止时刻，不复制具体住宅、人物或故事
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
