scope:
  medium: intimate color documentary photography with direct flash and available-light mixing
  representation: recognizable
  description: 以亲密距离、直接闪光、饱和色彩和未经修饰的关系现场记录私人生活。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory nightclub, nudity, drugs, named relationship, or autobiographical event
pillars:
- 以亲密距离、直接闪光、饱和色彩和未经修饰的关系现场记录私人生活。
- 'composition: Use close personal distance and a frame that feels entered rather than staged.; Allow ordinary
  clutter, partial bodies, mirrors, beds, tables, or doorways when supplied by the user''s scene.; Preserve
  an unguarded moment without turning the subject into a fashion pose or melodramatic tableau.'
- 'palette: Use saturated reds, pinks, amber, blue, and green where the environment naturally supports them.;
  Let mixed color temperatures and imperfect exposure remain visible; avoid a uniform commercial grade.'
- 'lighting: quality: direct on-camera flash mixed with available room or street light; behavior: Keep flash
  falloff, reflective highlights, and small hard shadows visible without glamorizing the scene.; behavior:
  Do not add a colored rim light or cinematic spotlight.'
