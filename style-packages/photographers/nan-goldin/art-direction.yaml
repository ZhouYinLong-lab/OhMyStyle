execution:
  route: text_only
  must:
  - Begin with the user's real subject and a plausible lived environment.
  - Choose a close, unguarded frame rather than a polished pose.
  - Combine direct flash with existing room or street light and preserve imperfect exposure.
  - Keep ordinary clutter and tactile surfaces visible without turning them into a fixed narrative.
  - close, trusting observational distance
  - direct flash and mixed ambient light remain legible
  - saturated but imperfect color and ordinary lived surfaces
  - no fixed person, relationship, venue, or private event
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory nightclub, nudity, drugs, named relationship, or autobiographical event
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
