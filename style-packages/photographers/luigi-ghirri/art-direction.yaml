schema_version: 2.1.0
status: experimental
id: luigi-ghirri-direction
name: 路易吉·吉里
base_package: photographers/luigi-ghirri
scope:
  medium: restrained color documentary photography
  representation: recognizable
  description: 以克制的彩色摄影、柔和的光线和地图、模型、建筑之间的尺度错位，观察现实如何被图像重新组织。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied photograph
  - named landmark as a default subject
pillars:
- 以克制的彩色摄影、柔和的光线和地图、模型、建筑之间的尺度错位，观察现实如何被图像重新组织。
- 'composition: 使用克制的水平线、边缘裁切和留白，让主体像被安静地放置在观察框中。; 可以让真实物体与图像、模型或标识发生尺度关系，但不能把某一种替代物写成固定题材。'
- 'palette: 低至中饱和的粉灰、沙色、浅蓝、褪绿和砖红，颜色之间保持细小而清楚的温差。; 避免戏剧化的黑白对比和统一复古滤镜，让色彩像自然光下的旧印刷或褪色照片。'
- 'lighting: quality: diffuse natural daylight with restrained contrast; behavior: 光线平稳、方向不夸张，保留表面细节与轻微空气感。;
  behavior: 阴影不压黑，亮部不制造商业棚拍高光。'
