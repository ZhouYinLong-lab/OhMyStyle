execution:
  route: text_only
  must:
  - 先确定一个普通主体和清楚的观察距离，避免先设计戏剧化故事。
  - 用水平线、边缘裁切或轻微尺度错位建立图像内部的秩序。
  - 最后调整颜色，使自然光、表面材质和远近关系保持柔和而可辨。
  - 观察距离、尺度关系和克制色彩在更换主体后仍然可见。
  - 不要求地图、模型、海岸、意大利建筑或空旷广场。
  - 图像感来自现实的轻微错位与颜色秩序，不来自强烈怀旧特效。
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - postcard tourism composition
  - forced nostalgia, heavy film burns, or dramatic sunset grading
  - fixed maps, miniatures, landmarks, or Italian locations
  - copying a specific reference photograph
  - copied photograph
  - named landmark as a default subject
  - Do not reproduce a specific reference photograph, recognizable person, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
