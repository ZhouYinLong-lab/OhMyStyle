profiles:
  generic:
    required:
      - quiet color separation and observational distance are observable
      - ordinary subject remains legible and independent
      - no copied reference photograph or branded material
    reject_if:
      - output is only a faded color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - person remains natural and not converted into a posed fashion advertisement
  still_life:
    required:
      - scale and surface relations remain plausible
