medium: restrained color documentary photography
materials:
  support: color negative or digital capture with fine grain and matte print response
process:
  - 先确定一个普通主体和清楚的观察距离，避免先设计戏剧化故事。
  - 用水平线、边缘裁切或轻微尺度错位建立图像内部的秩序。
  - 最后调整颜色，使自然光、表面材质和远近关系保持柔和而可辨。
technical_direction:
  contrast: low_to_medium with stable midtones
  saturation: muted but chromatically separated
  perspective: normal or slightly compressed perspective; no spectacle-wide distortion
  detail_density: moderate, with quiet secondary details retained
avoid:
  - postcard tourism composition
  - forced nostalgia, heavy film burns, or dramatic sunset grading
  - fixed maps, miniatures, landmarks, or Italian locations
  - copying a specific reference photograph
safety_note: Do not reproduce a specific reference photograph, recognizable person, logo, or branded layout.
