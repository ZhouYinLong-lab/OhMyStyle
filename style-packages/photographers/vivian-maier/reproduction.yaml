medium: observational street photograph with medium-format framing and natural light
materials:
- 黑白银盐或彩色胶片响应
- 中画幅景深
- 真实街头反射
- 轻微扫描纹理
process:
- 先观察人物与环境的瞬间关系
- 保留真实距离和偶然遮挡
- 控制曝光而不美化肤色
- 最后检查是否过度摆拍或侵犯隐私
technical_direction: 使用自然光与适度中画幅压缩；不加入商业造型、品牌或精心布景。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
