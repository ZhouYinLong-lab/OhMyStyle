composition:
- 画面重视偶然瞬间和边缘关系
- 人物与建筑、橱窗或路面共同构成场景
- 保留自然裁切和适度空白
palette:
- 黑白银盐或克制彩色胶片
- 肤色与环境保持真实
- 颜色不被复古滤镜统一染色
medium:
- 中画幅双反或等效中画幅取景
- 自然街头距离
- 方形或近方形画面倾向
lighting:
- 自然日光、阴影和室内窗光
- 高光不过曝，暗部保留信息
- 不使用棚拍轮廓光
surface:
- 银盐颗粒或彩色胶片层次
- 衣物、墙面和路面保持纪录性细节
texture:
- 颗粒和扫描变化轻微可见
- 不添加数字噪声或磨皮
invariants:
- 观察感来自时机和构图，不来自戏剧化摆拍
- 人物尊重和匿名化
- 不复制档案中的人物和地点
