medium: large-format black-and-white photography
materials:
  support: matte fiber paper with restrained wet-process irregularity
  surface: soft grain, absorbed blacks, paper texture, and subtle chemical variation
process:
  - keep the user's subject and setting unchanged
  - use a patient, spacious frame with a clear tonal anchor
  - build deep grayscale before adding atmosphere
  - reveal wet surfaces, foliage, skin, stone, or paper texture locally
  - soften distance through air and print surface rather than blur everywhere
technical_direction:
  contrast: medium-high with open shadows
  saturation: monochrome, optionally warm neutral
  perspective: stable large-format look
  detail_density: medium and selective
