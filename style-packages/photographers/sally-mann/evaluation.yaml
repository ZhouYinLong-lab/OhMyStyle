profiles:
  generic:
    required:
      - monochrome tonal structure is continuous and readable
      - subject remains recognizable and unforced
      - atmosphere and print surface are locally supported
      - no copied reference composition or branded material
    reject_if:
      - result is only a sepia or black-and-white filter
      - a child, family, rural south, nude body, or named place appears without request
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - identity and pose remain user-specified
  still_life:
    required:
      - object edges and material differences remain readable in grayscale
minimum_score: 7
