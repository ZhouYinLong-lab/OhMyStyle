execution:
  route: text_only
  must:
  - keep the user's subject and setting unchanged
  - use a patient, spacious frame with a clear tonal anchor
  - build deep grayscale before adding atmosphere
  - reveal wet surfaces, foliage, skin, stone, or paper texture locally
  - soften distance through air and print surface rather than blur everywhere
  - compose from the supplied subject and location
  - establish a calm large-format frame and tonal anchor
  - build a continuous grayscale with luminous highlights and open blacks
  avoid:
  - forced children, family scenes, rural southern landscapes, or nudity
  - fake antique border or heavy film-grain overlay
  - glossy HDR sharpness and commercial retouching
  - generic melancholy color grading
  - copied composition
  - named person or branded asset
  - recurring child, family, rural Virginia, nude body, or southern landscape
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
