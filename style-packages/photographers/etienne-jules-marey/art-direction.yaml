execution:
  route: text_only
  must:
  - choose one movement and a stable recording field
  - set repeated exposure or sequential phase logic
  - emphasize limb trajectory and body mechanics
  - retain analytical clarity over dramatic composition
  - movement is analyzed as a temporal trace
  - the body and trajectory remain legible
  - the field is technical and controlled
  - the new sequence must not reproduce a known study
  avoid:
  - copied famous composition
  - generic style filter
  - unmotivated decorative effects
  - Use observable traits only; do not recreate a named work, sitter, plate, object, or exact arrangement.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
