canonical_name: Étienne-Jules Marey
entity_type: photographer
life: 1830-1904
region: France
primary_medium: chronophotography_and_collotype
scope:
  subjects:
    - human gait and athletic movement
    - chronophotographic silhouettes
    - motion traces and overlapping phases
    - physiology and movement as measurable phenomena
  period_focus: mature historical practice
  exclusions:
    - copied famous composition
    - generic style filter
    - unmotivated decorative effects
subject_matter:
  - visual behavior is extracted from multiple original works
  - the generated scene must remain a new subject and arrangement
