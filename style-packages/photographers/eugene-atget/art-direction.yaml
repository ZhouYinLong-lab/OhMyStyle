    - source-atget-omnibus
    basis: curatorial_inference
    visual_review: pending
- id: color
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: neutral black, charcoal, brown-gray,
    and faded silver; warm paper or aged-print undertone only when caused by the process; no selective color
    or modern teal-orange grade. Adapt their balance to the requested subject; do not apply them as a uniform
    tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: neutral black, charcoal,
    brown-gray, and faded silver; warm paper or aged-print undertone only when caused by the process; no selective
