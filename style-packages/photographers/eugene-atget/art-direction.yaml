execution:
  route: text_only
  must:
  - compose around the place's geometry before adding a person
  - retain ordinary imperfections in paving, walls, windows, and objects
  - use a restrained silver or warm monochrome print response
  - preserve midtone information and avoid crushed blacks
  - add only subtle period-process irregularity after the scene is coherent
  - the image must feel observed rather than staged
  - geometry and material evidence remain more important than spectacle
  - monochrome tonality stays restrained and physically plausible
  avoid:
  - modern cinematic street photography
  - editorial fashion posing
  - romanticized tourist postcard
  - Use documentary visual traits only; do not recreate a specific historical photograph or identifiable private
    person.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
