    - source-atget-omnibus
    basis: curatorial_inference
    visual_review: pending
- id: light
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: available_daylight_or_soft_overcast_record;
    behavior: broad tonal transitions; behavior: readable midtones in stone and pavement; behavior: shadows
    hold detail instead of becoming cinematic black. Keep light coherent with the requested subject, medium,
    and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: available_daylight_or_soft_overcast_record;
    behavior: broad tonal transitions; behavior: readable midtones in stone and pavement; behavior: shadows
    hold detail instead of becoming cinematic black.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: available_daylight_or_soft_overcast_record;
    behavior: broad tonal transitions; behavior: readable midtones in stone and pavement; behavior: shadows
    hold detail instead of becoming cinematic black.'
  evidence:
    source_ids:
    - source-atget-street-musicians
    - source-atget-omnibus
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: capture: large_format_view_camera_feel;
    rendering: moderate edge softness consistent with historical optics and print; rendering: restrained movement
    blur only when the event supports it; rendering: subtle paper or emulsion irregularity, never decorative
    grain overload. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: capture:
    large_format_view_camera_feel; rendering: moderate edge softness consistent with historical optics and
    print; rendering: restrained movement blur only when the event supports it; rendering: subtle paper or
    emulsion irregularity, never decorative grain overload.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    capture: large_format_view_camera_feel; rendering: moderate edge softness consistent with historical optics
    and print; rendering: restrained movement blur only when the event supports it; rendering: subtle paper
    or emulsion irregularity, never decorative grain overload.'
  evidence:
    source_ids:
    - source-atget-street-musicians
    - source-atget-omnibus
    basis: curatorial_inference
    visual_review: pending
