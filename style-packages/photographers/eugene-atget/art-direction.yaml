schema_version: 2.1.0
status: experimental
id: eugene-atget-direction
name: 欧仁·阿杰
base_package: photographers/eugene-atget
scope:
  medium: documentary_photography
  representation: recognizable
  description: A documentary urban photography profile built from frontal observation, quiet architectural
    geometry, restrained monochrome tonality, and the evidentiary stillness of a large-format street record.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - modern cinematic street photography
  - editorial fashion posing
  - romanticized tourist postcard
pillars:
- A documentary urban photography profile built from frontal observation, quiet architectural geometry, restrained
  monochrome tonality, and the evidentiary stillness of a large-format street record.
- 'composition: use an eye-level or slightly elevated view with frontal, near-frontal, or carefully squared
  geometry; allow streets, façades, carts, windows, and paving to occupy most of the frame; keep human activity
  secondary to the record of place unless the scene naturally demands otherwise; preserve a modest amount of
  empty space and visual patience'
- 'palette: neutral black, charcoal, brown-gray, and faded silver; warm paper or aged-print undertone only
  when caused by the process; no selective color or modern teal-orange grade'
- 'lighting: quality: available_daylight_or_soft_overcast_record; behavior: broad tonal transitions; behavior:
  readable midtones in stone and pavement; behavior: shadows hold detail instead of becoming cinematic black'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: use an eye-level
    or slightly elevated view with frontal, near-frontal, or carefully squared geometry; allow streets, façades,
    carts, windows, and paving to occupy most of the frame; keep human activity secondary to the record of
    place unless the scene naturally demands otherwise; preserve a modest amount of empty space and visual
    patience. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: use an eye-level
    or slightly elevated view with frontal, near-frontal, or carefully squared geometry; allow streets, façades,
    carts, windows, and paving to occupy most of the frame; keep human activity secondary to the record of
    place unless the scene naturally demands otherwise; preserve a modest amount of empty space and visual
    patience.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: use an
    eye-level or slightly elevated view with frontal, near-frontal, or carefully squared geometry; allow streets,
    façades, carts, windows, and paving to occupy most of the frame; keep human activity secondary to the record
    of place unless the scene naturally demands otherwise; preserve a modest amount of empty space and visual
    patience.'
  evidence:
    source_ids:
