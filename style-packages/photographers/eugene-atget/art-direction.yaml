  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    neutral black, charcoal, brown-gray, and faded silver; warm paper or aged-print undertone only when caused
    by the process; no selective color or modern teal-orange grade.'
  evidence:
    source_ids:
