package_id: eugene-atget
package_version: 0.1.0
invariants:
  - id: place_over_performance
    weight: 3
    test: The image reads as an observed place, not a staged portrait or advertisement.
  - id: architectural_geometry
    weight: 2
    test: Streets, façades, paving, or objects provide a stable measured structure.
  - id: archival_tonality
    weight: 3
    test: Restrained monochrome tonality preserves broad midtones and shadow detail.
  - id: original_arrangement
    weight: 3
    test: Subject and composition are not a recognizable reconstruction.
rejections:
  - cinematic_color_grade
  - tourist_postcard
  - copied_named_photo
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
