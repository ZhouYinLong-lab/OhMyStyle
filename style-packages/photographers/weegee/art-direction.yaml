  kind: primary
  base_asset_id: weegee-primary-source
execution:
  route: text_only
  must:
  - 先确定一个普通而开放的街头时刻
  - 用直接闪光建立前景信息
  - 允许背景不完整或被遮挡
  - 以真实动作和空间关系收束画面
  - the requested subject stays unchanged
  - the package signature remains visible after subject transfer
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 固定加入犯罪、警车、尸体或纽约地标
  - 把街头摄影变成摆拍时尚大片
  - 用霓虹蓝橙滤镜替代现场闪光
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or protected
    game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
