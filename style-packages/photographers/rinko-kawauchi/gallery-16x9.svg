  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#91A985" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#D9AAB0"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">blush</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#F0E8D7"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">milk</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#AFC7D0"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">sky</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#91A985"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">leaf</text><rect x="1232" y="600" width="248" height="150" rx="18" fill="#E6D58D"/><text x="1250" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">butter</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">川内伦子</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
