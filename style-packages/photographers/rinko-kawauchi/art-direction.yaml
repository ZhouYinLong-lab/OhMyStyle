schema_version: 2.1.0
status: experimental
id: rinko-kawauchi-direction
name: 川内伦子
base_package: photographers/rinko-kawauchi
scope:
  medium: 彩色胶片或柔和数字色彩响应; 浅景深或轻微运动模糊; 自然光近距离观察
  representation: recognizable
  description: 以柔和自然光、近距离日常细节、轻盈色彩和不确定的时间感构成诗性摄影，强调微小事物、空气感与画面之间的呼吸。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - commercial_product_styling
  - heavy_film_preset
  - staged_symbolism
  - copied_image_sequence
pillars:
- 以柔和自然光、近距离日常细节、轻盈色彩和不确定的时间感构成诗性摄影，强调微小事物、空气感与画面之间的呼吸。
- 'medium: 彩色胶片或柔和数字色彩响应; 浅景深或轻微运动模糊; 自然光近距离观察'
- 'composition: 近距离小物与大面积空气留白并置; 视角可以略低或略偏; 单张画面像一组日常序列中的片段'
- 'palette: 淡粉、乳白、浅蓝、嫩绿和柔黄组成轻盈色组; 高光柔和，颜色相互呼吸; 避免过度饱和和冷暖滤镜'
