package_id: rinko-kawauchi
package_version: 0.1.0
invariants:
- id: style_recognition
  weight: 3
  test: The package medium, edge, light, palette, and texture decisions remain recognizable
    after the subject changes.
- id: prompt_adherence
  weight: 3
  test: The requested subject, count, setting, and aspect ratio are followed without
    adding a copied source arrangement.
- id: material_readability
  weight: 2
  test: Requested materials and capture behavior remain visually distinguishable.
- id: human_artifact_control
  weight: 2
  test: Hands, faces, geometry, text, reflections, and repeated details do not show
    avoidable generative defects.
rejections:
- copied_named_work
- generic_global_filter
- unreadable_subject
- style_pollution
- unmotivated_extra_objects
minimum_score: 8
benchmark_suite:
- portrait
- still_life
- architecture_environment
- minimal_composition
- fuzzy_brief
image_audit:
  similarity_level: high
  visual_overlap:
    - soft daylight
    - pale domestic or seasonal details
  reason: Representative image can resemble quiet natural-light and window-light references at thumbnail size.
  keep_separate_because:
    - source_type is a photographer with a distinct fragmentary, intimate observation
    - colour accents and small fleeting details are not interchangeable with a lighting preset
    - subject transfer must remain open
  action: clarify_distinctive_signature
subject_independence_suite:
  status: pending
  fixture: benchmarks/subject-independence.yaml
  required_subjects:
    - ordinary-chair
    - unspecified-building
  evidence: "No provider-backed result is claimed until a real image run is recorded."
