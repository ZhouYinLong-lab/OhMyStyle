medium: soft natural-light color photograph of an ordinary intimate detail
materials:
- 彩色胶片或柔和数字响应
- 自然窗光
- 浅景深
- 真实微小材质
process:
- 先选择平凡而有尺度感的主体
- 再等待自然光和偶然关系
- 保持曝光轻盈
- 最后检查画面是否过度商业化
technical_direction: 避免极端景深、过度清晰、强烈颗粒和人为彩色灯；保留自然光的中间调。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
