schema_version: 2.1.0
status: experimental
id: josef-koudelka-direction
name: 约瑟夫·库德尔卡
base_package: photographers/josef-koudelka
scope:
  medium: black-and-white documentary photography
  representation: recognizable
  description: 以高反差黑白、开放边缘和全景空间记录流动中的人、地景与历史压力。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named event or documentary claim
  - branded location
  - glossy commercial fashion lighting
  - cinematic teal-orange grade
  - staged crowd scene
  - decorative film border
pillars:
- 以高反差黑白、开放边缘和全景空间记录流动中的人、地景与历史压力。
- 'composition: 使用宽阔横向视野和不完全封闭的边缘，让主体处在空间压力中。; 人、地貌或建筑保持清楚的尺度关系，避免广告式居中摆拍。'
- 'palette: 纯黑、炭灰、银灰和纸白构成主要层次，不使用彩色滤镜。'
- 'lighting: quality: hard or overcast natural light with strong tonal separation; behavior: 天空、地面和主体之间形成明确的黑白结构，保留高光空气感。'
