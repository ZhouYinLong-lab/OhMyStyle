execution:
  route: text_only
  must:
  - Observe the user-supplied subject without adding a documentary event.
  - Establish a wide, slightly tense spatial field and a clear horizon or ground plane.
  - Use available light to divide sky, land, structure, and human scale.
  - 'Keep timing observational: a passing figure, an empty interval, or an unsettled edge.'
  - Print with deep blacks, luminous grays, and controlled paper highlights.
  - 观察距离克制，人物不是摆拍模特或戏剧角色。
  - 黑白层次承担情绪，不能只把彩色图去饱和。
  - 不重建特定事件、地点、人物或摄影作品。
  avoid:
  - fixed walls, fields, war scenes, festivals, or exile narratives
  - copied Magnum or documentary compositions
  - artificial vignette, neon, or overprocessed HDR
  - copied composition
  - named event or documentary claim
  - branded location
  - glossy commercial fashion lighting
  - cinematic teal-orange grade
  - staged crowd scene
  - decorative film border
