execution:
  route: text_only
  must:
  - Choose a neutral supplied subject with a surface that can carry evidence of use.
  - Frame close enough for folds, abrasions, seams, and tonal loss to become readable.
  - Use soft directional available light and preserve a quiet surrounding field.
  - Add restrained grain and print wear after the tonal structure is stable; never use grain to hide errors.
  - Time must be legible through material wear, not through a caption or fixed historical prop.
  - Intimacy comes from distance, crop, and surface attention rather than staged expression.
  - The supplied subject stays authoritative and is never replaced by scars, old clothing, or a named place.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
