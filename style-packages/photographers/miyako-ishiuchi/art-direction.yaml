pillars:
- 以近距离观看磨损、伤痕、织物和旧物表面，让时间在材料痕迹中显现，而不是依赖固定人物或地点。
- 'composition: Use intimate close or medium-close framing that gives one surface or object enough room to
  be examined.; Keep the surrounding space quiet and let cropping, folds, and small absences carry the tension.'
- 'palette: Favor ash, paper, faded rose, oxidized brown, and muted blue; color should feel absorbed and aged
  rather than decorative.; A restrained accent may remain, but do not impose monochrome when the supplied subject
  calls for color.'
- 'lighting: quality: soft available-light observation with gentle falloff; behavior: Reveal dents, scratches,
  seams, creases, and fading without theatrical spotlighting.; behavior: Keep shadows quiet but deep enough
  to show that the material has been handled.'
