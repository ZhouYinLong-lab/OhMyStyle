profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - skin, clothing, or hair are observed as lived surfaces rather than polished glamour detail
      - intimacy comes from crop and light, not a forced expression or biography
  still_life:
    required:
      - wear, fading, folds, or handling marks remain readable on the supplied objects
      - no fixed archive object or named place has been added
minimum_score: 7

