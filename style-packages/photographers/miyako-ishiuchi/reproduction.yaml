medium: observational fine-art photography with restrained analog print character
materials:
  support: matte photographic paper or a softly textured digital print simulation
process:
  - Choose a neutral supplied subject with a surface that can carry evidence of use.
  - Frame close enough for folds, abrasions, seams, and tonal loss to become readable.
  - Use soft directional available light and preserve a quiet surrounding field.
  - Add restrained grain and print wear after the tonal structure is stable; never use grain to hide errors.
technical_direction:
  contrast: low-to-medium with protected highlight detail
  saturation: low or selectively desaturated; preserve a small natural accent when useful
  perspective: observational, close, and free of dramatic wide-angle distortion
  detail_density: medium-high on the chosen surface, low in the surrounding space
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
