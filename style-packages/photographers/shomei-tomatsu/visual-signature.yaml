composition:
  - '使用近距离观察、偏置主体、裁切边缘和偶然遮挡；避免把画面整理成平稳的旅游或商业构图。'
  - '允许背景信息以碎片形式出现，但主体仍需保持可识别和可复核。'
palette:
  - '黑白高反差与局部高饱和色可以并存；色彩来自现场物件、灯光或表面，而不是统一滤镜。'
  - '保留暗部细节和局部过曝痕迹，让颜色带有现实中的不稳定感。'
lighting:
  quality: 自然光、街灯或混合现场光；方向可以不完全均匀，但不能用电影化轮廓光替代观察。
  behavior:
    - 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。
    - 保留用户指定的主体轮廓、位置和空间关系。
surface:
  finish: 粗粒胶片、湿润路面、旧墙、金属反光、玻璃反射和轻微色彩漂移。
  edges: 保持主体边缘可辨；允许媒介造成的轻微不齐，但不使用发光描边或综合色隔离带。
texture:
  density: 中等到偏高；颗粒和磨损集中于阴影、边缘和高反差区域。
  placement: 集中在材料边界、暗部或印刷交界处，不覆盖主体识别信息。
invariants:
  - '更换主体后仍然能观察到本包的媒介、构图、色彩和表面签名。'
  - '不要求特定人物、物件、地点、建筑、植物、车辆或故事作为默认内容。'
  - '示例主体只用于验证视觉迁移，不得泄漏到默认 Prompt。'

