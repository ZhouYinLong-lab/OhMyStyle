notes:
  - '东松照明的照片有一种不稳定的清醒：普通物件会突然带出历史的重量，鲜艳颜色也不会把现实变得轻松。对我而言，这个包最有价值的地方是“靠近但不解释”，让局部、反光和磨损自己留下余波。'
