    允许背景信息以碎片形式出现，但主体仍需保持可识别和可复核。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 使用近距离观察、偏置主体、裁切边缘和偶然遮挡；避免把画面整理成平稳的旅游或商业构图。;
    允许背景信息以碎片形式出现，但主体仍需保持可识别和可复核。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 使用近距离观察、偏置主体、裁切边缘和偶然遮挡；避免把画面整理成平稳的旅游或商业构图。;
