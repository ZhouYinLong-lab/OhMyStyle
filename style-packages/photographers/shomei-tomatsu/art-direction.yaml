schema_version: 2.1.0
status: experimental
id: shomei-tomatsu-direction
name: 东松照明
base_package: photographers/shomei-tomatsu
scope:
  medium: 战后纪实摄影与主观化街头观察
  representation: recognizable
  description: 以战后日本的残痕、日常物件与社会现场为线索，在黑白与高饱和色彩之间建立诗性、尖锐而不稳定的摄影观察。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以战后日本的残痕、日常物件与社会现场为线索，在黑白与高饱和色彩之间建立诗性、尖锐而不稳定的摄影观察。
- 'composition: 使用近距离观察、偏置主体、裁切边缘和偶然遮挡；避免把画面整理成平稳的旅游或商业构图。; 允许背景信息以碎片形式出现，但主体仍需保持可识别和可复核。'
- 'palette: 黑白高反差与局部高饱和色可以并存；色彩来自现场物件、灯光或表面，而不是统一滤镜。; 保留暗部细节和局部过曝痕迹，让颜色带有现实中的不稳定感。'
- 'lighting: quality: 自然光、街灯或混合现场光；方向可以不完全均匀，但不能用电影化轮廓光替代观察。; behavior: 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。; behavior:
  保留用户指定的主体轮廓、位置和空间关系。'
