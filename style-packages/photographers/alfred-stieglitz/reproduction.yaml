medium: pictorial_photography
capture:
  camera: period_plate_or_early_film_camera_impression
  viewpoint: deliberately_selected_formal_view
  lens_behavior: normal_perspective_with_cropped_planes
  focus: structured_scene_not_bokeh_effect
process:
  - design the frame from overlapping lines and masses
  - let rain, fog, or social density create tonal layers
  - use restrained photogravure-like response with open midtones
  - preserve the decisive crop and formal tension
technical_direction:
  contrast: moderate
  saturation: monochrome_or_warm_monochrome
  perspective: authored_flattened_depth
  detail_density: structural_foreground_and_layered_background
safety_note: Use formal and print traits only; do not recreate a named photograph or identifiable private person.
