canonical_name: 纳达尔
entity_type: photographer
life: 1820-1910
region: France
primary_medium: wet_plate_collodion_and_albumen_print
scope:
  subjects:
    - single adult studio portraits
    - artists, performers, and public figures
    - plain or softly graded background
    - hands, shoulders, and gaze as portrait structure
  period_focus: mature historical practice
  exclusions:
    - copied famous composition
    - generic style filter
    - unmotivated decorative effects
subject_matter:
  - visual behavior is extracted from multiple original works
  - the generated scene must remain a new subject and arrangement
