schema_version: 2.1.0
status: experimental
id: nadar-direction
name: 纳达尔
base_package: photographers/nadar
scope:
  medium: wet_plate_collodion_and_albumen_print
  representation: recognizable
  description: An early studio portrait photography profile built from sculptural pose, plain tonal ground,
    directional soft light, and psychologically alert expression.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied famous composition
  - generic style filter
  - unmotivated decorative effects
pillars:
- An early studio portrait photography profile built from sculptural pose, plain tonal ground, directional
  soft light, and psychologically alert expression.
- 'composition: use a single sitter with a sculptural three-quarter or profile pose; leave controlled breathing
  room around head, shoulders, and hands; let the body axis and gaze create the main diagonal'
- 'palette: monochrome silver-gray or warm sepia with restrained tonal range; background stays subordinate
  and untextured'
- 'lighting: quality: large_soft_studio_daylight; behavior: face and hands receive the clearest modeling; behavior:
  clothing falls into broad, legible folds; behavior: shadows remain gentle but directional'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: use a single
    sitter with a sculptural three-quarter or profile pose; leave controlled breathing room around head, shoulders,
    and hands; let the body axis and gaze create the main diagonal. Preserve the user-provided content and
    layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: use a single sitter
    with a sculptural three-quarter or profile pose; leave controlled breathing room around head, shoulders,
    and hands; let the body axis and gaze create the main diagonal.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: use a single
    sitter with a sculptural three-quarter or profile pose; leave controlled breathing room around head, shoulders,
    and hands; let the body axis and gaze create the main diagonal.'
  evidence:
    source_ids:
    - source-nadar-sarah-bernhardt
    - source-nadar-self-portrait
    basis: curatorial_inference
    visual_review: pending
- id: color
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: monochrome silver-gray or warm sepia
    with restrained tonal range; background stays subordinate and untextured. Adapt their balance to the requested
    subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: monochrome silver-gray or
    warm sepia with restrained tonal range; background stays subordinate and untextured.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    monochrome silver-gray or warm sepia with restrained tonal range; background stays subordinate and untextured.'
  evidence:
    source_ids:
    - source-nadar-sarah-bernhardt
    - source-nadar-self-portrait
    basis: curatorial_inference
    visual_review: pending
- id: light
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: large_soft_studio_daylight; behavior: face
    and hands receive the clearest modeling; behavior: clothing falls into broad, legible folds; behavior:
    shadows remain gentle but directional. Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: large_soft_studio_daylight;
    behavior: face and hands receive the clearest modeling; behavior: clothing falls into broad, legible folds;
    behavior: shadows remain gentle but directional.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: large_soft_studio_daylight;
    behavior: face and hands receive the clearest modeling; behavior: clothing falls into broad, legible folds;
    behavior: shadows remain gentle but directional.'
  evidence:
    source_ids:
    - source-nadar-sarah-bernhardt
    - source-nadar-self-portrait
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: brushwork: none_photographic_emulsion_and_print_tone;
    mark_logic: preserve fine facial structure without modern digital sharpness; mark_logic: retain slight
    tonal bloom from historical optics and printing; mark_logic: keep texture in paper, emulsion, and cloth
    rather than added film grain; finish: controlled_historical_portrait_print. Preserve detail hierarchy and
    material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: brushwork:
    none_photographic_emulsion_and_print_tone; mark_logic: preserve fine facial structure without modern digital
    sharpness; mark_logic: retain slight tonal bloom from historical optics and printing; mark_logic: keep
    texture in paper, emulsion, and cloth rather than added film grain; finish: controlled_historical_portrait_print.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    brushwork: none_photographic_emulsion_and_print_tone; mark_logic: preserve fine facial structure without
    modern digital sharpness; mark_logic: retain slight tonal bloom from historical optics and printing; mark_logic:
    keep texture in paper, emulsion, and cloth rather than added film grain; finish: controlled_historical_portrait_print.'
  evidence:
    source_ids:
    - source-nadar-sarah-bernhardt
    - source-nadar-self-portrait
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- composition
- color
- light
- surface
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - color
  - light
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-nadar-sarah-bernhardt
  kind: public_domain
  base_asset_id: nadar-sarah-bernhardt
- id: source-nadar-self-portrait
  kind: secondary
  base_asset_id: nadar-self-portrait
execution:
  route: text_only
  must:
  - choose a plain studio ground and an intentional body axis
  - light face, hands, and fabric with one broad source
  - separate subject from background through value and pose, not rim light
  - apply restrained monochrome print tone and minimal emulsion softness
  - pose communicates character without theatrical action
  - background and props remain minimal
  - facial and fabric detail are soft, not smeared
  - the new sitter and pose must not reproduce a named portrait
  avoid:
  - copied famous composition
  - generic style filter
  - unmotivated decorative effects
  - Use observable traits only; do not recreate a named work, sitter, plate, object, or exact arrangement.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
