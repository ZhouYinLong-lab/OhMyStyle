package_id: nadar
package_version: 0.1.0
medium: wet_plate_collodion_and_albumen_print
materials:
  support: historical_record_or_canvas
  pigment_direction: restrained_source_observed_palette
  finish: observable_surface_and_optical_behavior
process:
  - choose a plain studio ground and an intentional body axis
  - light face, hands, and fabric with one broad source
  - separate subject from background through value and pose, not rim light
  - apply restrained monochrome print tone and minimal emulsion softness
technical_direction:
  contrast: controlled_by_subject_and_medium
  saturation: source_observed_not_global
  perspective: consistent_with_package_signature
  detail_density: focal_detail_with_structural_sparsity
safety_note: Use observable traits only; do not recreate a named work, sitter, plate, object, or exact arrangement.
