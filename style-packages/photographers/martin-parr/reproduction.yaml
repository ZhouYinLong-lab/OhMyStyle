reproduction:
  priority_order:
    - 用户主体、隐私和用途
    - 观察距离与构图切片
    - 直接光线和真实色彩
    - 细节并置与轻微不协调
  subject_rules:
    - 用户主体必须保持核心，不因风格名变成泳池、海滩或游客。
    - 代表图中的公共泳池只是测试主体，不进入默认提示词。
  transfer_rules:
    - 从用户主体周围的普通物件和动作中寻找关系。
    - 允许裁切和遮挡，但不能损害主体识别与人物隐私。
    - 颜色要直接、饱和且来自现场，不套用统一滤镜。
  forbidden_shortcuts:
    - 度假广告、摆拍时尚和旅游明信片
    - 可识别品牌、人物或新闻事件
