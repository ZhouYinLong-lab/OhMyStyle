schema_version: 2.1.0
status: experimental
id: hiroshi-sugimoto-direction
name: 杉本博司
base_package: photographers/hiroshi-sugimoto
scope:
  medium: large-format black-and-white photographic language with long-exposure impression
  representation: recognizable
  description: 以大画幅黑白摄影、长时间曝光、近乎抽象的海天分界和极简信息密度建立时间感；本包关注观看与曝光的关系，不固定海、地平线或建筑题材。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以大画幅黑白摄影、长时间曝光、近乎抽象的海天分界和极简信息密度建立时间感；本包关注观看与曝光的关系，不固定海、地平线或建筑题材。
- 'composition: Reduce the frame to a few measured planes or a single centered structural division.; Let emptiness,
  horizon, symmetry, and repeated architectural rhythm carry the composition.'
- 'palette: Prefer a narrow neutral scale from deep charcoal to luminous gray; color should be absent unless
  the user asks for it.; Keep tonal transitions continuous and deliberate, without dramatic crushed blacks.'
- 'lighting: quality: long-exposure natural light; behavior: Light is even and time-based; movement dissolves
  into calm tonal fields rather than visible effects.'
