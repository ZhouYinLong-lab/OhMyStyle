execution:
  route: text_only
  must:
  - simplify the requested subject into a small set of structural planes
  - choose a measured camera position and a stable horizon or axis when relevant
  - use long-exposure softness and even light to remove incidental movement
  - finish with fine tonal grain and restrained print contrast
  - preserve measured framing and reduced information density
  - preserve fine monochrome tonal transitions and long-exposure calm
  - keep the subject independent; do not force sea, horizon, boats, or empty architecture
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
