signature:
  - 'graphic cropping'
  - 'transparent overlays'
  - 'solarization or negative-like tonal reversal'
  - 'hard and soft light contrast'

controls:
  - 'composition'
  - 'palette'
  - 'lighting'
  - 'surface'

does_not_control:
  - subject identity
  - object count
  - location
  - story or narrative event
  - text, logo, or brand
