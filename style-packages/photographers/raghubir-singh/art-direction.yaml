    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 采用自然光下的高饱和互补色，让暖色衣物、冷色墙面和湿地反光彼此呼应。;
    饱和度来自真实表面与环境关系，不使用统一的旅游宣传滤镜。. Adapt their balance to the requested subject; do not apply them as a uniform
    tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 采用自然光下的高饱和互补色，让暖色衣物、冷色墙面和湿地反光彼此呼应。;
    饱和度来自真实表面与环境关系，不使用统一的旅游宣传滤镜。.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    采用自然光下的高饱和互补色，让暖色衣物、冷色墙面和湿地反光彼此呼应。; 饱和度来自真实表面与环境关系，不使用统一的旅游宣传滤镜。.'
  evidence:
    source_ids:
    - source-raghubir-singh-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: humid natural daylight or soft overcast
    light; behavior: 光线保持现场感，允许反光和阴影同时存在，不制造棚拍轮廓光。. Keep light coherent with the requested subject, medium,
    and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: humid natural daylight
    or soft overcast light; behavior: 光线保持现场感，允许反光和阴影同时存在，不制造棚拍轮廓光。.'
