schema_version: 2.1.0
status: experimental
id: raghubir-singh-direction
name: 拉古比尔·辛格
base_package: photographers/raghubir-singh
scope:
  medium: color documentary photography with chromogenic-print character
  representation: recognizable
  description: 以饱和而自然的彩色街头观察组织多层空间，让人物、建筑、反光和日常色块共同形成复杂但清晰的画面节奏。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以饱和而自然的彩色街头观察组织多层空间，让人物、建筑、反光和日常色块共同形成复杂但清晰的画面节奏。
- 'composition: 通过门框、车窗、墙体或反光面形成前景遮挡，让街景在多个距离层次中展开。; 让人物、建筑和色块相互嵌套，但保留街头瞬间的偶然性。'
- 'palette: 采用自然光下的高饱和互补色，让暖色衣物、冷色墙面和湿地反光彼此呼应。; 饱和度来自真实表面与环境关系，不使用统一的旅游宣传滤镜。'
- 'lighting: quality: humid natural daylight or soft overcast light; behavior: 光线保持现场感，允许反光和阴影同时存在，不制造棚拍轮廓光。'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 通过门框、车窗、墙体或反光面形成前景遮挡，让街景在多个距离层次中展开。;
    让人物、建筑和色块相互嵌套，但保留街头瞬间的偶然性。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 通过门框、车窗、墙体或反光面形成前景遮挡，让街景在多个距离层次中展开。;
    让人物、建筑和色块相互嵌套，但保留街头瞬间的偶然性。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 通过门框、车窗、墙体或反光面形成前景遮挡，让街景在多个距离层次中展开。;
    让人物、建筑和色块相互嵌套，但保留街头瞬间的偶然性。.'
