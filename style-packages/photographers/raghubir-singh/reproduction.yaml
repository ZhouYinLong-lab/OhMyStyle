medium: color documentary photography with chromogenic-print character
materials:
  support: color negative or digital capture with restrained print-like finish
process:
  - Establish the user's subject and location before choosing a viewpoint.
  - Find a foreground frame or reflective plane that creates a second spatial layer.
  - Build a decisive middle-ground action without directing the people into a pose.
  - Balance two or three naturally occurring color families across the frame.
  - Keep distant detail legible enough to reward looking, but let depth soften it.
technical_direction:
  contrast: moderate, with protected highlight detail and readable shadow color
  saturation: medium to high but locally motivated by surfaces and light
  perspective: observational eye-level or incidental side angle; avoid spectacle
  detail_density: high in layered planes, lower at the atmospheric distance
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
