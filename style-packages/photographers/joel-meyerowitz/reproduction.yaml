medium: color documentary photography
materials:
  support: color negative film or a restrained digital color print
process:
  - begin with the user-supplied situation and wait for an unforced arrangement
  - compose through depth layers, color echoes, and incidental alignments
  - preserve ordinary light and local color before applying only restrained print finishing
technical_direction:
  contrast: moderate and open in the shadows
  saturation: natural with selective chromatic accents
  perspective: observational, usually eye-level or quietly elevated
  detail_density: moderate across the frame
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
