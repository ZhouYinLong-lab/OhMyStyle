schema_version: 2.1.0
status: experimental
id: august-sander-direction
name: 奥古斯特·桑德
base_package: photographers/august-sander
scope:
  medium: typological documentary portrait photography
  representation: recognizable
  description: 以正面、清晰、分类式的人物与环境观察建立社会类型学，服饰、姿态、工具和地点共同参与肖像。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory worker, uniform, profession, German setting, or frontal portrait
pillars:
- 以正面、清晰、分类式的人物与环境观察建立社会类型学，服饰、姿态、工具和地点共同参与肖像。
- 'composition: Use a stable, frontal or carefully balanced viewpoint with enough environment to contextualize
  the subject.; Let clothing, tools, posture, and setting carry as much information as facial expression.;
  Prefer a calm frame over a dramatic decisive moment.'
- 'palette: Favor neutral or restrained monochrome relationships that reveal material and tonal difference.;
  Keep background and subject legible without theatrical color grading.'
- 'lighting: quality: even natural or softly controlled daylight; behavior: Preserve readable facial planes,
  clothing texture, and environmental context.; behavior: Avoid glamour highlights and dramatic backlight.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Use a stable,
    frontal or carefully balanced viewpoint with enough environment to contextualize the subject.; Let clothing,
    tools, posture, and setting carry as much information as facial expression.; Prefer a calm frame over a
    dramatic decisive moment.. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Use a stable, frontal
    or carefully balanced viewpoint with enough environment to contextualize the subject.; Let clothing, tools,
    posture, and setting carry as much information as facial expression.; Prefer a calm frame over a dramatic
    decisive moment..'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: Use a stable,
    frontal or carefully balanced viewpoint with enough environment to contextualize the subject.; Let clothing,
    tools, posture, and setting carry as much information as facial expression.; Prefer a calm frame over a
    dramatic decisive moment..'
  evidence:
    source_ids:
    - source-august-sander-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Favor neutral or restrained monochrome
    relationships that reveal material and tonal difference.; Keep background and subject legible without theatrical
    color grading.. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: Favor neutral or restrained
    monochrome relationships that reveal material and tonal difference.; Keep background and subject legible
    without theatrical color grading..'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    Favor neutral or restrained monochrome relationships that reveal material and tonal difference.; Keep background
    and subject legible without theatrical color grading..'
  evidence:
    source_ids:
    - source-august-sander-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: even natural or softly controlled daylight;
    behavior: Preserve readable facial planes, clothing texture, and environmental context.; behavior: Avoid
    glamour highlights and dramatic backlight.. Keep light coherent with the requested subject, medium, and
    scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: even natural or softly
    controlled daylight; behavior: Preserve readable facial planes, clothing texture, and environmental context.;
    behavior: Avoid glamour highlights and dramatic backlight..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: even natural
    or softly controlled daylight; behavior: Preserve readable facial planes, clothing texture, and environmental
