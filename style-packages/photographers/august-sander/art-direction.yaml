joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - palette
  - lighting
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-august-sander-primary-source
  kind: primary
  base_asset_id: august-sander-primary-source
execution:
  route: text_only
  must:
  - Identify the user's subject and the visible social or material context around it.
  - Choose a stable viewpoint and include enough environment to describe the relation.
  - Use even light and a calm pose or arrangement; avoid theatrical direction.
  - Finish with restrained tonal control and fine grain while retaining clothing and surface detail.
  - Preserve the relationship between subject, social marker, and surrounding place.
  - Preserve calm posture and descriptive clarity when the subject changes.
  - Do not turn the package into a fixed historical costume or profession generator.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory worker, uniform, profession, German setting, or frontal portrait
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
