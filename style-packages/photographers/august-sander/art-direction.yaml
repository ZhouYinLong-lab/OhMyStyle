  evidence:
    source_ids:
    - source-august-sander-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: archival
    documentary portrait with gelatin-silver or restrained monochrome character; edges: clear, stable, and
    optically natural. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
    archival documentary portrait with gelatin-silver or restrained monochrome character; edges: clear, stable,
    and optically natural.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    finish: archival documentary portrait with gelatin-silver or restrained monochrome character; edges: clear,
    stable, and optically natural.'
  evidence:
    source_ids:
    - source-august-sander-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: low
    to medium, with fine grain and material detail; placement: distributed across clothing, walls, ground,
