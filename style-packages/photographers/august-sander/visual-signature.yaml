composition:
  - Use a stable, frontal or carefully balanced viewpoint with enough environment to contextualize the subject.
  - Let clothing, tools, posture, and setting carry as much information as facial expression.
  - Prefer a calm frame over a dramatic decisive moment.
palette:
  - Favor neutral or restrained monochrome relationships that reveal material and tonal difference.
  - Keep background and subject legible without theatrical color grading.
lighting:
  quality: even natural or softly controlled daylight
  behavior:
    - Preserve readable facial planes, clothing texture, and environmental context.
    - Avoid glamour highlights and dramatic backlight.
surface:
  finish: archival documentary portrait with gelatin-silver or restrained monochrome character
  edges: clear, stable, and optically natural
texture:
  density: low to medium, with fine grain and material detail
  placement: distributed across clothing, walls, ground, and tools
invariants:
  - Preserve the relationship between subject, social marker, and surrounding place.
  - Preserve calm posture and descriptive clarity when the subject changes.
  - Do not turn the package into a fixed historical costume or profession generator.
