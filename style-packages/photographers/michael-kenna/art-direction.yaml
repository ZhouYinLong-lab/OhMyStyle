joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - palette
  - lighting
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-michael-kenna-primary-source
  kind: primary
  base_asset_id: michael-kenna-primary-source
execution:
  route: text_only
  must:
  - simplify the scene to essential planes and lines
  - set a quiet tonal hierarchy
  - simulate long exposure in moving sky, water, or foliage
  - finish with restrained silver-grain texture
  - negative space remains active
  - the visual anchor stays small
  - tonal range is controlled rather than dramatic
  - the user-selected subject remains open
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, or protected
    game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
