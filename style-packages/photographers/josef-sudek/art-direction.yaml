execution:
  route: text_only
  must:
  - Place the supplied subject in a quiet, believable light field with one dominant tonal anchor.
  - Add a soft threshold—reflection, glass, moisture, curtain, or foliage—only when it supports the subject.
  - Protect subtle highlights and let shadows accumulate without theatrical contrast.
  - Finish with restrained grain and tonal compression, not a generic vintage preset.
  - Stillness, soft falloff, and a contemplative distance survive a change of subject.
  - Light remains naturalistic and low-key rather than becoming a dramatic studio effect.
  - The package does not require a window, vase, garden, Prague, or a particular object.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
