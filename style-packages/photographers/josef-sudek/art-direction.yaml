name: 约瑟夫·苏德克
base_package: photographers/josef-sudek
scope:
  medium: poetic fine-art photography with restrained analog print character
  representation: recognizable
  description: 以安静的窗边光、湿润空气和亲密静物观看，让日常物件在低声部的灰阶与反射中获得时间感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以安静的窗边光、湿润空气和亲密静物观看，让日常物件在低声部的灰阶与反射中获得时间感。
- 'composition: Use a still, intimate composition with a clear foreground object and a deep but quiet tonal
  background.; Allow glass, moisture, curtains, foliage, or reflections to form a soft threshold when the user''s
  subject supports it.'
- 'palette: Favor silver gray, smoky blue, warm umber, muted green, and small amber notes; color remains low-key
  and atmospheric.; Let reflective surfaces carry subtle tonal echoes rather than bright commercial highlights.'
- 'lighting: quality: soft side or window light with long quiet falloff; behavior: Keep highlights broad and
  restrained, with shadows deep enough to hold atmosphere but not collapse.; behavior: Let air, glass, and
  moisture soften the boundary between object and background.'
