schema_version: 2.1.0
status: experimental
id: julia-margaret-cameron-direction
name: 朱莉娅·玛格丽特·卡梅隆
base_package: photographers/julia-margaret-cameron
scope:
  medium: nineteenth_century_portrait_photography
  representation: recognizable
  description: A Victorian portrait photography profile built from close psychological presence, soft-focus
    wet-process optics, dark tonal fields, and sculptural facial light without impersonating a named sitter
    or copying a known portrait.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - modern beauty retouching
  - sharp commercial headshot
  - named-sitter impersonation
pillars:
- A Victorian portrait photography profile built from close psychological presence, soft-focus wet-process
  optics, dark tonal fields, and sculptural facial light without impersonating a named sitter or copying a
  known portrait.
- 'composition: use a close head-and-shoulders or tight three-quarter portrait; make the face a sculptural
  central presence while allowing hair and cloth to merge into the dark field; keep the background plain, soft,
  and subordinate; favor a calm, contemplative expression over a polished smile'
- 'palette: near-monochrome sepia, umber, charcoal, and warm cream; skin highlights are gentle and integrated,
  never porcelain-white; background remains a deep warm neutral'
- 'lighting: quality: broad_victorian_portrait_light; behavior: one dominant soft facial modeling direction;
  behavior: forehead, nose, cheek, and beard or hair transition as continuous tonal planes; behavior: no modern
  rim light or beauty retouching'
