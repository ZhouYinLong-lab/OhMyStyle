execution:
  route: text_only
  must:
  - establish a dark neutral field before placing the face
  - shape the face with broad soft light and continuous tonal transitions
  - keep cloth and hair period-appropriate and subordinate
  - allow slight exposure and emulsion irregularity
  - avoid modern sharpening, pore retouching, and cosmetic symmetry
  - psychological presence outranks cosmetic perfection
  - softness is optical and selective, not a global beauty filter
  - the sitter remains anonymous and newly imagined
  avoid:
  - modern beauty retouching
  - sharp commercial headshot
  - named-sitter impersonation
  - Use period photographic traits only; do not imitate a named sitter or reproduce a known portrait arrangement.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
