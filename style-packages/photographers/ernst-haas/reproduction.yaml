medium: 35毫米彩色胶片摄影
materials:
  capture: 彩色负片或具有胶片响应的数字模拟
  surface: 细颗粒、湿地反射、玻璃与金属局部高光
process:
  - 先锁定用户主体、动作和空间，再安排色块与运动方向。
  - 选择一处稳定细节作为焦点，让拖影围绕它发生。
  - 最后检查色彩是否分区明确、反射是否符合表面材质。
technical_direction:
  contrast: 中等至较高，保留彩色阴影层次
  saturation: 高饱和但不均匀，肤色与中性物体保持可信
  perspective: 观察式取景，允许近距离压缩和局部遮挡
  detail_density: 中等，细节集中在主体轮廓、反射与运动边缘
avoid:
  - 默认电车、街道、人群、赛车或城市夜景
  - 把所有物体都做成拖影或霓虹
  - 过度锐化、塑料质感、数字渐变和商业棚拍
safety_note: 不复现具体照片、人物、文字、标志或固定叙事；代表图只展示视觉方法。
