- 'palette: dominant: 朱红; dominant: 琥珀黄; dominant: 钴蓝; dominant: 青绿色; dominant: 沥青灰; behavior: 高饱和色块彼此分离，阴影保留冷暖差，不使用全局橙青滤镜。'
