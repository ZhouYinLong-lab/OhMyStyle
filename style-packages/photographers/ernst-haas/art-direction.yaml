scope:
  medium: 彩色纪实摄影与实验性街头摄影
  representation: recognizable
  description: 以高饱和色彩、运动拖影、反射和时间切片把纪实瞬间推向介于具象与抽象之间的观看状态。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - 固定电车、街道、人群或城市题材
  - 复制具体照片的构图、人物或瞬间
  - 用单一综合色滤镜替代局部色彩与运动关系
pillars:
- 以高饱和色彩、运动拖影、反射和时间切片把纪实瞬间推向介于具象与抽象之间的观看状态。
