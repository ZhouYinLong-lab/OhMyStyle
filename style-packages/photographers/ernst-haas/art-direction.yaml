execution:
  route: text_only
  must:
  - 先锁定用户主体、动作和空间，再安排色块与运动方向。
  - 选择一处稳定细节作为焦点，让拖影围绕它发生。
  - 最后检查色彩是否分区明确、反射是否符合表面材质。
  - 彩色关系来自场景与光线，不是统一滤镜
  - 运动模糊具有方向与强弱差异
  - 画面仍然保留纪实观察的偶然性
  - 不固定人物、物体、地点或故事
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 默认电车、街道、人群、赛车或城市夜景
  - 把所有物体都做成拖影或霓虹
  - 过度锐化、塑料质感、数字渐变和商业棚拍
  - 固定电车、街道、人群或城市题材
  - 复制具体照片的构图、人物或瞬间
  - 用单一综合色滤镜替代局部色彩与运动关系
  - 不复现具体照片、人物、文字、标志或固定叙事；代表图只展示视觉方法。
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
