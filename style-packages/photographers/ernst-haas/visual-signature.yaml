medium: 彩色纪实摄影与实验性街头摄影
composition:
  - 以局部裁切、偏置主体和横向色带制造被时间截取的瞬间。
  - 允许前景遮挡、反射和非完整轮廓，但主体关系必须可读。
palette:
  dominant:
    - 朱红
    - 琥珀黄
    - 钴蓝
    - 青绿色
    - 沥青灰
  behavior: 高饱和色块彼此分离，阴影保留冷暖差，不使用全局橙青滤镜。
lighting:
  quality: 自然光、城市反光或硬质侧光
  behavior:
    - 让湿润表面和玻璃反射成为空间线索。
    - 高光保持胶片层次，避免霓虹发光和纯白溢出。
motion:
  behavior:
    - 用横向拖影、局部重影或慢门模糊表达移动中的观看。
    - 至少保留一个稳定的形体或色块作为视觉锚点。
surface:
  finish: 彩色胶片颗粒、轻微印刷感与真实反射
  edges: 清晰边缘和运动边缘并置，避免所有区域同时失焦
invariants:
  - 彩色关系来自场景与光线，不是统一滤镜
  - 运动模糊具有方向与强弱差异
  - 画面仍然保留纪实观察的偶然性
  - 不固定人物、物体、地点或故事
