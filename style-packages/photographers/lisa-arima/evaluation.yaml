profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
      - light is soft and explainable without a synthetic glow layer
      - color remains present, restrained, and materially believable
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
      - an unrequested seaside, summer, young-woman, or school-uniform motif is added
  portrait:
    required:
      - requested subject retains natural skin tone and an unforced posture
      - face is not over-smoothed or separated by artificial edge light
  still_life:
    required:
      - requested objects retain distinct material response and count
      - ambient light remains soft without washing out object colors
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
