medium: contemporary natural-light photography with restrained film-like color
materials:
  - daylight, window light, or overcast ambient light
  - real surfaces supplied by the user's subject
  - fine, nearly invisible grain only when it supports the image
process:
  - Translate the user's subject, location, objects, and narrative literally.
  - Find a gentle environmental light source rather than inventing a studio effect.
  - Keep a little visual breathing room and let ordinary details remain ordinary.
  - Use low-to-medium contrast, clean color separation, and gentle highlight roll-off.
  - Check that skin, fabric, glass, paper, wood, plants, or architecture retain their own material identity.
technical_direction: Use natural perspective and a restrained film response. Keep color present but quiet;
  avoid a universal pastel wash, heavy grain, bloom, orange skin, or fixed seasonal imagery.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
