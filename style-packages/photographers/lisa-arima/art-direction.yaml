execution:
  route: text_only
  must:
  - Translate the user's subject, location, objects, and narrative literally.
  - Find a gentle environmental light source rather than inventing a studio effect.
  - Keep a little visual breathing room and let ordinary details remain ordinary.
  - Use low-to-medium contrast, clean color separation, and gentle highlight roll-off.
  - Check that skin, fabric, glass, paper, wood, plants, or architecture retain their own material identity.
  - Preserve the user's subject, location, object count, and narrative.
  - Never add a recurring seaside, summer, school-uniform, or young-woman motif.
  - Never copy a named photograph, pose, crop, or recognizable layout.
  avoid:
  - copied composition
  - fixed seaside or summer setting
  - named character or branded asset
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
