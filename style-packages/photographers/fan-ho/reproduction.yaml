medium: black-and-white fine-art street or editorial photography
materials:
  - monochrome film or neutral digital capture with controlled tonal curve
  - natural surfaces supplied by the user's subject
  - restrained grain, never a decorative overlay
process:
  - Translate the user's subject and location literally before applying style rules.
  - Build a simple geometric frame from available architecture, objects, shadows, or empty space.
  - Establish one coherent directional light source and use reflected light only as fill.
  - Separate foreground, middle ground, and background through value, occlusion, and haze.
  - Grade to neutral black, white, and silver gray; preserve information in highlights and shadows.
technical_direction: Use a normal or short-telephoto viewpoint, deliberate framing, selective depth,
  medium-high local contrast, and subtle film response. Keep all recurring objects optional and user-supplied.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
