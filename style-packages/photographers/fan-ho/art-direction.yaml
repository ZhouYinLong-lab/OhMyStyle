joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-fan-ho-primary-source
  kind: primary
  base_asset_id: fan-ho-primary-source
execution:
  route: text_only
  must:
  - Translate the user's subject and location literally before applying style rules.
  - Build a simple geometric frame from available architecture, objects, shadows, or empty space.
  - Establish one coherent directional light source and use reflected light only as fill.
  - Separate foreground, middle ground, and background through value, occlusion, and haze.
  - Grade to neutral black, white, and silver gray; preserve information in highlights and shadows.
  - Preserve the user's subject, location, object count, and narrative.
  - Never add a recurring staircase, alley, tricycle, market, or Hong Kong landmark.
  - Never copy a named photograph's pose, crop, lighting arrangement, or composition.
  avoid:
  - copied composition
  - named character or branded asset
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
