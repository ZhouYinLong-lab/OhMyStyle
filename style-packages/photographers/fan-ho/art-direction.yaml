  evidence:
    source_ids:
    - source-fan-ho-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: directional natural light or a similarly coherent
    hard source; bright planes and silhouettes separated by controlled haze. Keep light coherent with the requested
    subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: directional natural light or
    a similarly coherent hard source; bright planes and silhouettes separated by controlled haze.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: directional natural light
    or a similarly coherent hard source; bright planes and silhouettes separated by controlled haze.'
