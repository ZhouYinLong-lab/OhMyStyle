  instruction: 'Use the declared medium and keep its package-specific representation constraints visible: black-and-white
    fine-art photography.'
  observable: 'The requested image retains the stated medium distinction or production constraint: black-and-white
    fine-art photography.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    black-and-white fine-art photography.'
  evidence:
    source_ids:
    - source-fan-ho-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: strong diagonals,
    rectangles, frames, and negative space; layered foreground, middle ground, and background; human scale
    used only when the user requests people. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: strong diagonals,
    rectangles, frames, and negative space; layered foreground, middle ground, and background; human scale
    used only when the user requests people.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: strong
    diagonals, rectangles, frames, and negative space; layered foreground, middle ground, and background; human
    scale used only when the user requests people.'
  evidence:
    source_ids:
    - source-fan-ho-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: neutral black, white, and a full
    range of silver-gray. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: neutral black, white, and
    a full range of silver-gray.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
