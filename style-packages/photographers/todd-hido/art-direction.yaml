schema_version: 2.1.0
status: experimental
id: todd-hido-direction
name: 托德·海多
base_package: photographers/todd-hido
scope:
  medium: observational color photography with restrained film response
  representation: recognizable
  description: 以蓝调时刻、住宅边缘和窗内暖光把日常郊区拍成含蓄而悬置的记忆。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - dramatic cinematic poster lighting
  - generic teal-and-orange grade
  - landmark-centered travel photography
  - invented text or signage
pillars:
- 以蓝调时刻、住宅边缘和窗内暖光把日常郊区拍成含蓄而悬置的记忆。
- 'composition: 以远距离、略偏置的视点保留大片安静天空或路面，让普通地点显得悬置。; 主体通常位于中远景，边缘建筑、树木或道路承担空间锚点。'
- 'palette: 冷蓝灰环境与少量窗内暖黄形成克制对照，避免糖果色或旅游宣传色。'
- 'lighting: quality: blue-hour ambient light with isolated practical warmth; behavior: 天空和路面保持均匀低照度，暖光只来自场景中真实存在的灯窗或灯具。'
