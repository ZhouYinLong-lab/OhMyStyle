  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 以远距离、略偏置的视点保留大片安静天空或路面，让普通地点显得悬置。;
    主体通常位于中远景，边缘建筑、树木或道路承担空间锚点。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 以远距离、略偏置的视点保留大片安静天空或路面，让普通地点显得悬置。;
    主体通常位于中远景，边缘建筑、树木或道路承担空间锚点。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 以远距离、略偏置的视点保留大片安静天空或路面，让普通地点显得悬置。;
    主体通常位于中远景，边缘建筑、树木或道路承担空间锚点。.'
