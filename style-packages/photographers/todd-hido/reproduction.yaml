medium: observational color photography with restrained film response
materials:
  support: color negative or muted digital capture with weathered atmospheric light
  tools:
    - long lens or moderate telephoto distance
    - tripod or stable low-light exposure
    - subtle grain and restrained highlight roll-off
process:
  - Establish the user's subject and location before adding atmosphere.
  - Choose a distant, slightly detached viewpoint with generous negative space.
  - Set cool ambient exposure for the sky, pavement, or surrounding air.
  - Retain small warm practical lights only where the scene supports them.
  - Add restrained grain and wet-surface reflections without making the image nostalgic.
technical_direction:
  contrast: low to medium with protected shadow detail
  saturation: muted overall, with controlled warm windows or lamps
  perspective: moderate telephoto compression or calm observational distance
  detail_density: selective; ordinary structures remain legible but not over-described
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
