canonical_name: 苏珊·梅塞拉斯
entity_type: photographer
domain: photography
scope:
  subject_policy: open
  subject_note: User-supplied subjects are authoritative; listed use cases are optional benchmark labels, not default scene requirements.
  subjects:
    - any user-supplied subject
  exclusions:
    - copied composition
    - named character or branded asset
    - fixed conflict zone, carnival, protest, or documentary event
sources:
