medium: long-form social documentary photography
materials:
  support: color film or restrained documentary digital capture
process:
  - begin with the user's subject and social or spatial context
  - observe relationships, gestures, and traces rather than directing a pose
  - include enough surrounding information to locate the moment without over-explaining it
  - finish with honest color, natural skin, and consistent photographic texture
technical_direction:
  contrast: moderate, preserving context in shadows
  saturation: restrained natural color
  perspective: human-scale documentary distance
  detail_density: layered, with context distributed across the frame
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
