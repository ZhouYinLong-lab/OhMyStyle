- id: source-susan-meiselas-primary-source
  kind: primary
  base_asset_id: susan-meiselas-primary-source
execution:
  route: text_only
  must:
  - begin with the user's subject and social or spatial context
  - observe relationships, gestures, and traces rather than directing a pose
  - include enough surrounding information to locate the moment without over-explaining it
  - finish with honest color, natural skin, and consistent photographic texture
  - attention to relationship and context rather than spectacle
  - human-scale proximity and multiple points of social information
  - natural color and physical photographic texture
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - fixed conflict zone, carnival, protest, or documentary event
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
