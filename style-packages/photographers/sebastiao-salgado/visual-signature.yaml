composition:
- 群体劳动、地貌和人物身体构成宏大的社会纪实尺度
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 深黑、银灰、粉尘白和少量土黄形成深沉黑白层次
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 大画幅黑白纪实与环境群像
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 强但自然的侧光塑造人物体量，天空和尘土层次丰富
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 泥土、汗水、金属、岩石和粗布有重量感
- 不同材质保留可辨识的表面行为。
texture:
- 细颗粒和宽广灰阶同时保留远景信息
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持人的尊严与环境尺度，不复制具体劳工、灾难或地点
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
