medium: observational color photography
materials:
  support: photographic or clean digital color surface with real local texture
process:
  - Start from the user's subject and find an ordinary, non-dramatic arrangement.
  - Set a normal eye-level viewpoint and use architecture, cables, curbs, and empty space as compositional lines.
  - Preserve local color and broad focus; allow small irregularities to remain.
  - Avoid adding a nostalgia preset, dramatic lighting, or a fixed roadside narrative.
technical_direction:
  contrast: moderate and open
  saturation: honest local color, scene-dependent
  perspective: normal to mildly wide
  detail_density: medium-high across foreground and distance
avoid:
  - copied location, composition, road trip, motel, car, or commercial strip
safety_note: This package transfers an observational photographic approach, not the content of a source photograph.
