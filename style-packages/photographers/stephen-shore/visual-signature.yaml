composition:
  - eye-level, unshowy, carefully balanced observation
  - deep or broad focus with lines and gaps carrying structure
palette:
  - honest local color, including ordinary saturated surfaces
  - no automatic nostalgia or cinematic grade
lighting:
  quality: natural daylight or ordinary ambient light
  behavior:
    - shadows remain readable and non-theatrical
surface:
  finish: optically observed photographic detail and everyday wear
  edges: clear geometry across the frame
texture:
  density: low to medium natural surface texture
  placement: pavement, paint, glass, foliage, and infrastructure
invariants:
  - ordinary subject treated as a complete visual problem
  - viewer distance stays observational, not promotional
  - no fixed road trip, motel, vehicle, or American setting
not_equivalent_to:
  - generic film photography preset
  - nostalgic roadside postcard
  - commercial street advertising image
