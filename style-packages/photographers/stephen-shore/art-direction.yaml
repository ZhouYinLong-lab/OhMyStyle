joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - palette
  - lighting
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-stephen-shore-primary-source
  kind: primary
  base_asset_id: stephen-shore-primary-source
execution:
  route: text_only
  must:
  - Start from the user's subject and find an ordinary, non-dramatic arrangement.
  - Set a normal eye-level viewpoint and use architecture, cables, curbs, and empty space as compositional
    lines.
  - Preserve local color and broad focus; allow small irregularities to remain.
  - Avoid adding a nostalgia preset, dramatic lighting, or a fixed roadside narrative.
  - ordinary subject treated as a complete visual problem
  - viewer distance stays observational, not promotional
  - no fixed road trip, motel, vehicle, or American setting
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - copied location, composition, road trip, motel, car, or commercial strip
  - copied composition
  - named character or branded asset
  - mandatory road trip, gas station, motel, or American small town
  - This package transfers an observational photographic approach, not the content of a source photograph.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
