composition:
- 人物处于真实环境中，环境线索与面部表情同等重要
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 黑白或低饱和彩色，肤色、深棕、灰蓝和暖黄形成克制对比
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 人文纪实摄影与环境肖像
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 自然窗光、街灯或柔和侧光，避免摆拍式轮廓光
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 衣物、墙面、纸张和皮肤保留生活痕迹
- 不同材质保留可辨识的表面行为。
texture:
- 颗粒细腻，背景信息足够但不抢主体
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持尊重、观察和环境叙事，不复制真实人物或历史事件
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
