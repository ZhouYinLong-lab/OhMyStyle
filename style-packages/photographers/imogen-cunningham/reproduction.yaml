medium: modernist observational photography
materials:
  support: fine-grain black-and-white or natural-color photographic print
process:
  - identify the user-supplied subject's most informative contour or structural rhythm
  - choose a simple ground and camera distance that make that structure legible
  - use gentle daylight and precise focus, then preserve natural print character
technical_direction:
  contrast: moderate with clean tonal separation
  saturation: natural or monochrome
  perspective: direct, close, and observational
  detail_density: selective and highly resolved at the focal structure
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
