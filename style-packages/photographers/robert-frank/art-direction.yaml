execution:
  route: text_only
  must:
  - Observe the user's subject in its supplied environment rather than staging a hero scene.
  - Choose an oblique, cropped, or slightly late frame with a readable but incomplete relation.
  - Preserve available-light evidence, uneven tonal density, and ordinary surface texture.
  - Finish with restrained grain and print compression, never with a generic vintage filter.
  - unresolved but intentional framing
  - ordinary social or environmental details share the frame with the main subject
  - tonal roughness and available-light evidence remain visible
  - no fixed road, country, flag, vehicle, or documentary event
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory road trip, American flag, diner, or named social group
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
