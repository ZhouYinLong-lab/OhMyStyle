schema_version: 2.1.0
status: experimental
id: robert-frank-direction
name: 罗伯特·弗兰克
base_package: photographers/robert-frank
scope:
  medium: black-and-white documentary photography with 35mm-like framing and print grain
  representation: recognizable
  description: 以不规则取景、松散叙事、社会观察和略带粗粝的黑白调子记录日常空间。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory road trip, American flag, diner, or named social group
pillars:
- 以不规则取景、松散叙事、社会观察和略带粗粝的黑白调子记录日常空间。
- 'composition: Use off-center, cropped, or slightly awkward framing that leaves relationships unresolved.;
  Let ordinary environmental details share importance with people; avoid a single heroic focal point.; Suggest
  a larger sequence or social field without explaining the whole story in one frame.'
- 'palette: Default to restrained black-and-white with broad gray values, imperfect highlights, and deep but
  not crushed shadows.; If color is requested, keep it observational and uneven rather than applying a polished
  commercial grade.'
- 'lighting: quality: available light with occasional harsh or accidental contrast; behavior: Accept windshield
  reflections, mixed exposure, flat daylight, and small areas of glare when they arise naturally.; behavior:
  Do not add theatrical key light or deliberate fashion polish.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Use off-center,
    cropped, or slightly awkward framing that leaves relationships unresolved.; Let ordinary environmental
    details share importance with people; avoid a single heroic focal point.; Suggest a larger sequence or
    social field without explaining the whole story in one frame.. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Use off-center, cropped,
    or slightly awkward framing that leaves relationships unresolved.; Let ordinary environmental details share
    importance with people; avoid a single heroic focal point.; Suggest a larger sequence or social field without
    explaining the whole story in one frame..'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: Use off-center,
    cropped, or slightly awkward framing that leaves relationships unresolved.; Let ordinary environmental
    details share importance with people; avoid a single heroic focal point.; Suggest a larger sequence or
    social field without explaining the whole story in one frame..'
  evidence:
    source_ids:
    - source-robert-frank-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Default to restrained black-and-white
    with broad gray values, imperfect highlights, and deep but not crushed shadows.; If color is requested,
    keep it observational and uneven rather than applying a polished commercial grade.. Adapt their balance
    to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: Default to restrained black-and-white
    with broad gray values, imperfect highlights, and deep but not crushed shadows.; If color is requested,
    keep it observational and uneven rather than applying a polished commercial grade..'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    Default to restrained black-and-white with broad gray values, imperfect highlights, and deep but not crushed
    shadows.; If color is requested, keep it observational and uneven rather than applying a polished commercial
    grade..'
  evidence:
    source_ids:
    - source-robert-frank-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: available light with occasional harsh or
    accidental contrast; behavior: Accept windshield reflections, mixed exposure, flat daylight, and small
    areas of glare when they arise naturally.; behavior: Do not add theatrical key light or deliberate fashion
    polish.. Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: available light with
    occasional harsh or accidental contrast; behavior: Accept windshield reflections, mixed exposure, flat
    daylight, and small areas of glare when they arise naturally.; behavior: Do not add theatrical key light
    or deliberate fashion polish..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: available light
    with occasional harsh or accidental contrast; behavior: Accept windshield reflections, mixed exposure,
    flat daylight, and small areas of glare when they arise naturally.; behavior: Do not add theatrical key
    light or deliberate fashion polish..'
  evidence:
    source_ids:
    - source-robert-frank-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: grainy
    documentary print with visible tonal compression; edges: imperfect crop, contact-sheet energy, and occasional
    motion or focus softness. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
