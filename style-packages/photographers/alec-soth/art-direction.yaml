execution:
  route: text_only
  must:
  - Start from the user-supplied subject and find an ordinary surrounding place.
  - Compose a patient wide frame with meaningful negative space and an off-center anchor.
  - Use soft daylight and preserve local color, weathering, and small visual inconsistencies.
  - Apply restrained grain and optical softness only after the spatial relationships are stable.
  - Preserve observational distance and the balance between subject and surrounding place.
  - Preserve open-ended mood without turning the scene into a dramatic narrative.
  - Keep natural color and optical imperfection ahead of commercial retouching.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory road, motel, prairie, American flag, or named location
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
