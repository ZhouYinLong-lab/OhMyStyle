schema_version: 2.1.0
status: experimental
id: alec-soth-direction
name: 亚历克·索思
base_package: photographers/alec-soth
scope:
  medium: large-format color documentary photography
  representation: recognizable
  description: 以大画幅彩色纪实摄影观察普通地点、边缘空间和人与环境的疏离关系，强调安静距离与开放叙事。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory road, motel, prairie, American flag, or named location
pillars:
- 以大画幅彩色纪实摄影观察普通地点、边缘空间和人与环境的疏离关系，强调安静距离与开放叙事。
- 'composition: Hold a wide frame with generous sky or quiet negative space.; Place the subject slightly off-center
  and let the surrounding place carry equal visual weight.; Keep horizon and perspective calm, with a small
  irregularity that prevents advertising polish.'
- 'palette: Use restrained natural color: dusty blue, faded green, pale beige, weathered red-brown, and neutral
  skin or material colors.; Preserve small color facts in the environment instead of applying a unified cinematic
  grade.'
- 'lighting: quality: soft natural daylight; behavior: Prefer overcast or gently broken light with low drama
  and readable local color.; behavior: Keep shadows soft enough for place and surface details to remain legible.'
