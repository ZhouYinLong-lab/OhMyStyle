medium: candid documentary street photography
materials:
  support: original subject rendered through the package medium and surface logic
process:
  - 'choose an unremarkable viewpoint'
  - 'let gestures and environmental marks create the composition'
  - 'keep timing imperfect and believable'
  - 'finish with restrained documentary print texture'
technical_direction:
  contrast: 'clear but not crushed'
  saturation: 'neutral monochrome or quiet archival color'
  perspective: 'eye-level, close-range, observational'
avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or protected game asset.
