schema_version: 2.1.0
status: experimental
id: helen-levitt-direction
name: 海伦·莱维特
base_package: photographers/helen-levitt
scope:
  medium: candid documentary street photography
  representation: recognizable
  description: 以贴近街面的观察、儿童与日常动作的偶然节奏、清晰黑白层次和克制的幽默感记录普通城市生活，不绑定特定街区或人物。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以贴近街面的观察、儿童与日常动作的偶然节奏、清晰黑白层次和克制的幽默感记录普通城市生活，不绑定特定街区或人物。
- 'composition: 贴近视线的街道高度; 人物动作与墙面、地面形成偶然几何; 边缘人物和局部遮挡保留现场感'
- 'palette: 以清晰黑白阶调突出动作与空间; 彩色版本可保留少量旧胶片色，但不套统一复古滤镜; 明亮墙面和深色服装形成可读对照'
- 'lighting: quality: available daylight with crisp but natural urban shadows; behavior: Keep the requested
  subject and location independent from the package.; behavior: Apply lighting as a transferable visual decision,
  not a fixed scene.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 贴近视线的街道高度; 人物动作与墙面、地面形成偶然几何;
    边缘人物和局部遮挡保留现场感. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 贴近视线的街道高度; 人物动作与墙面、地面形成偶然几何;
    边缘人物和局部遮挡保留现场感.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 贴近视线的街道高度;
    人物动作与墙面、地面形成偶然几何; 边缘人物和局部遮挡保留现场感.'
  evidence:
    source_ids:
    - source-helen-levitt-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 以清晰黑白阶调突出动作与空间; 彩色版本可保留少量旧胶片色，但不套统一复古滤镜;
    明亮墙面和深色服装形成可读对照. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 以清晰黑白阶调突出动作与空间; 彩色版本可保留少量旧胶片色，但不套统一复古滤镜;
    明亮墙面和深色服装形成可读对照.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    以清晰黑白阶调突出动作与空间; 彩色版本可保留少量旧胶片色，但不套统一复古滤镜; 明亮墙面和深色服装形成可读对照.'
  evidence:
    source_ids:
    - source-helen-levitt-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: available daylight with crisp but natural
    urban shadows; behavior: Keep the requested subject and location independent from the package.; behavior:
    Apply lighting as a transferable visual decision, not a fixed scene.. Keep light coherent with the requested
    subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: available daylight
    with crisp but natural urban shadows; behavior: Keep the requested subject and location independent from
    the package.; behavior: Apply lighting as a transferable visual decision, not a fixed scene..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: available daylight
    with crisp but natural urban shadows; behavior: Keep the requested subject and location independent from
    the package.; behavior: Apply lighting as a transferable visual decision, not a fixed scene..'
  evidence:
    source_ids:
    - source-helen-levitt-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: fine-grain
