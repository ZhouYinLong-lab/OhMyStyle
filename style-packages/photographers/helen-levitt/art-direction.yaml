sources:
- id: source-helen-levitt-primary-source
  kind: primary
  base_asset_id: helen-levitt-primary-source
execution:
  route: text_only
  must:
  - choose an unremarkable viewpoint
  - let gestures and environmental marks create the composition
  - keep timing imperfect and believable
  - finish with restrained documentary print texture
  - camera remains close to ordinary life
  - gesture and spatial coincidence matter
  - the scene stays candid rather than staged
  - the requested subject remains open
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or
    protected game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
