execution:
  route: text_only
  must:
  - 先找遮挡层和色块关系
  - 再决定焦点落在前景或背景
  - 保持曝光克制
  - 最后检查反射是否有来源
  - 日常片段被抽象成色彩和遮挡关系
  - 不靠夸张戏剧叙事
  - 不复制具体街景或人物
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - clean_street_documentary
  - oversharpened_hdr
  - exact_photo_reconstruction
  - generic_teal_orange_grade
