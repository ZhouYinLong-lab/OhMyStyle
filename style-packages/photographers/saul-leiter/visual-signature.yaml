composition:
- 前景遮挡或玻璃层切割视野
- 主体可能只露出一部分
- 色块和反射先于事件解释
palette:
- 砖红、黄、深蓝、粉紫和灰绿形成低到中饱和色块
- 红伞、车灯或墙面可作为孤立色点
- 肤色与环境保持自然
medium:
- 彩色胶片或等效色彩响应
- 近距离街头取景
- 浅景深与局部失焦
lighting:
- 阴天、雨天或窗内漫射光
- 反射光柔和并保留色彩来源
- 不使用商业轮廓光
surface:
- 玻璃、水、雪、车漆和墙面反射可辨
- 轻微胶片色彩偏移
texture:
- 颗粒细而不重
- 雾气和雨痕形成自然软化
invariants:
- 日常片段被抽象成色彩和遮挡关系
- 不靠夸张戏剧叙事
- 不复制具体街景或人物
