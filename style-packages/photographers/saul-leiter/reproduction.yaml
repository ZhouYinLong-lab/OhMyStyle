medium: quiet color street photograph with layered occlusion and analog-like response
materials:
- 彩色胶片或胶片模拟
- 玻璃与雨水前景
- 自然街头反射
- 轻微颗粒
process:
- 先找遮挡层和色块关系
- 再决定焦点落在前景或背景
- 保持曝光克制
- 最后检查反射是否有来源
technical_direction: 使用中长焦或近距离视角；避免锐化、HDR、全局青橙和过度虚化。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
