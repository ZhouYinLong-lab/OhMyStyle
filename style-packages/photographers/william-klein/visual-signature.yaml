composition:
- 近距离广角、切边人物和运动中的街道形成冲撞式构图
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 高反差黑白、红黄蓝广告色和粗颗粒形成城市能量
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 广角街头摄影、运动模糊和图形裁切
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 硬质城市光与反射面制造强烈反差
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 沥青、玻璃、雨衣和皮肤在运动中保留粗粝感
- 不同材质保留可辨识的表面行为。
texture:
- 颗粒、拖影和不完美对焦是表达的一部分
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持街头冲击与几何裁切，不复制具体街景、标语或人物
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
