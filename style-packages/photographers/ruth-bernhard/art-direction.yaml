- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: 低到中等颗粒，集中在暗部和纸面;
    placement: 纹理服务于形体，不增加复古滤镜. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density:
    低到中等颗粒，集中在暗部和纸面; placement: 纹理服务于形体，不增加复古滤镜.'
