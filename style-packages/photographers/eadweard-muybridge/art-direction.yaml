    - source-muybridge-horse
    - source-muybridge-woman-dog
    basis: curatorial_inference
    visual_review: pending
- id: light
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: even_technical_daylight; behavior: illumination
