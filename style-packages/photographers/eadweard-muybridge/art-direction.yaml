execution:
  route: text_only
  must:
  - choose a stable side or orthogonal camera and baseline
  - define the interval and number of phases
  - keep lighting and scale markers consistent
  - render clear silhouettes with restrained plate texture
  - the sequence has a repeatable viewpoint and interval logic
  - movement is decomposed into observable phases
  - the background is neutral and measurement-friendly
  - the new sequence must not reproduce a known plate
  avoid:
  - copied famous composition
  - generic style filter
  - unmotivated decorative effects
  - Use observable traits only; do not recreate a named work, sitter, plate, object, or exact arrangement.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
