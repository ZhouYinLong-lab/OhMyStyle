schema_version: 2.1.0
status: experimental
id: eadweard-muybridge-direction
name: 埃德沃德·迈布里奇
base_package: photographers/eadweard-muybridge
scope:
  medium: collotype_and_chronophotographic_plate
  representation: recognizable
  description: A motion-study photography profile built from repeatable camera geometry, neutral staging, sequential
    phases, and evidence-first observation of movement.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied famous composition
  - generic style filter
  - unmotivated decorative effects
pillars:
- A motion-study photography profile built from repeatable camera geometry, neutral staging, sequential phases,
  and evidence-first observation of movement.
- 'composition: treat the frame or plate as a measurement field, not a cinematic scene; show repeated phases
  on a stable baseline or grid; keep subject orientation and camera geometry consistent across phases'
- 'palette: neutral paper, charcoal, gray-brown emulsion, and sparse structural lines; avoid expressive color
  grading'
- 'lighting: quality: even_technical_daylight; behavior: illumination stays sufficiently stable for comparing
  phases; behavior: motion is communicated by changed pose, not motion blur; behavior: background and scale
  markers remain legible'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: treat the frame
    or plate as a measurement field, not a cinematic scene; show repeated phases on a stable baseline or grid;
    keep subject orientation and camera geometry consistent across phases. Preserve the user-provided content
    and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: treat the frame or
    plate as a measurement field, not a cinematic scene; show repeated phases on a stable baseline or grid;
    keep subject orientation and camera geometry consistent across phases.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: treat the
    frame or plate as a measurement field, not a cinematic scene; show repeated phases on a stable baseline
    or grid; keep subject orientation and camera geometry consistent across phases.'
  evidence:
    source_ids:
    - source-muybridge-horse
    - source-muybridge-woman-dog
    basis: curatorial_inference
    visual_review: pending
- id: color
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: neutral paper, charcoal, gray-brown
    emulsion, and sparse structural lines; avoid expressive color grading. Adapt their balance to the requested
    subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: neutral paper, charcoal,
    gray-brown emulsion, and sparse structural lines; avoid expressive color grading.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    neutral paper, charcoal, gray-brown emulsion, and sparse structural lines; avoid expressive color grading.'
  evidence:
