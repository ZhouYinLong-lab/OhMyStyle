profiles:
  generic:
    required:
      - at least two spatial layers are legible without becoming clutter
      - package-specific color and observation signature is visible
      - user-supplied subject remains present and independent
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global saturation filter
      - image becomes a postcard, staged advertisement, or shallow-focus portrait
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - person remains observed rather than turned into a posed fashion subject
      - gesture and environmental planes remain legible
  still_life:
    required:
      - objects remain countable and are organized through overlap and color
      - image does not default to a clean commercial product setup
minimum_score: 7

