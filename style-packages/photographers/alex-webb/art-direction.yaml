  representation: recognizable
  description: 以多层次街头观察、鲜明色彩、复杂遮挡和偶然瞬间组织具有空间张力的彩色纪实摄影；本包提取观看方式，不固定热带街道或特定城市。
  required_contexts: []
  incompatible_contexts: []
