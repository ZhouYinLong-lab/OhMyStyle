execution:
  route: text_only
  must:
  - Identify the requested subject, then choose an eye-level or lightly elevated observational viewpoint.
  - Build three readable depth layers using existing architecture, light, and spatial interruptions.
  - Keep at least one partial occlusion or off-axis gesture if it belongs naturally to the scene.
  - Expose bright color and shadow together; retain detail in both rather than flattening the range.
  - Review the result for accidental narrative additions, logos, and copied source composition.
  - Start from the user's subject and find an ordinary, non-dramatic arrangement.
  - Find a viewpoint where foreground, middle ground, and distance overlap naturally.
  - Preserve local colors and allow one or two strong color relationships to anchor the frame.
  avoid:
  - generic travel-poster composition
  - an obligatory street, car, market, tropical climate, or crowd
  - global color wash, excessive grain, dramatic rim light, and staged expression
  - fixed tropical street, market, or named city
  - copied composition or recognizable photograph
  - cinematic teal-orange grade, fake lens flare, heavy bokeh, or glossy commercial polish
  - copied location, gesture, framing, or recognizable source photograph
  - mandatory tropical city, street market, political scene, or named landmark
  - staged fashion pose or travel postcard treatment
  - The package is a visual treatment, not a prompt for a recurring location or subject.
