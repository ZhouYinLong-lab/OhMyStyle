pillars:
- 以多层次街头观察、鲜明色彩、复杂遮挡和偶然瞬间组织具有空间张力的彩色纪实摄影；本包提取观看方式，不固定热带街道或特定城市。
- 'medium: layered color documentary photography'
- 'composition: layered foreground, middle ground, and distance with meaningful occlusions; chance encounters
  of gesture, architecture, shadow, and color within one frame; deep focus or broad legibility rather than
  a single isolated subject'
- 'palette: saturated local colors held in tension with dense shadow; warm painted surfaces against cool shade,
  sky, or reflected pavement; color blocks remain attached to real surfaces instead of becoming a global filter'
