composition:
- 建筑立面、街道和科学物件以清楚几何结构和垂直线组织
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 银盐黑白、冷灰、白色和少量金属反光形成技术感色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 直接摄影、清晰焦点和精确建筑构图
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 自然日光或均匀实验室光，阴影明确但不过度戏剧
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 砖、玻璃、钢铁和混凝土的结构纹理清楚
- 不同材质保留可辨识的表面行为。
texture:
- 细节均匀、边缘锐利，透视和尺度是主要信息
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持几何精确和观察性，不复制具体纽约建筑或科学仪器
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
