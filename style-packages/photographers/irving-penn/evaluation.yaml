version: 1
checks:
  style_recognition:
    question: 是否能看出受控摄影棚、精确形体和克制留白？
    score: 0
  subject_independence:
    question: 用户主体是否保留，且没有被纸张、器物或时装替换？
    score: 0
  prompt_following:
    question: 是否遵守用户指定的画幅、用途、动作与场景？
    score: 0
  material_accuracy:
    question: 物体、皮肤、织物或其他材料是否有各自可信的反射和纹理？
    score: 0
  ai_artifact_level:
    question: 是否出现塑料皮肤、随机道具、过度磨皮或不自然边缘？
    score: 0
notes: 评分用于生成结果之间的比较，不表示与摄影师原作的认证或等同。
