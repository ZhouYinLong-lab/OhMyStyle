canonical_name: 欧文·佩恩
entity_type: photographer
domain: photography
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；代表图中的纸张和器物只是测试主体。
  subjects: []
  exclusions:
    - 固定人物、服装品牌或特定静物
    - 复制具体摄影作品
    - 过度修饰和电商棚拍效果
sources:
  - 'https://www.moma.org/artists/4548-irving-penn'
notes:
  - 本包提取严谨摄影棚控制、克制背景、几何形体和材料观察。
  - 代表图使用普通纸张与陶瓷器物，不代表每次生成都要出现它们。
composition:
  - 以清晰轮廓、克制留白和精确的物体间距组织画面。
  - 让主体与背景形成干净的平面关系，必要时使用轻微错位制造张力。
  - 适合肖像、时装、静物和普通物体，但不规定具体题材。
palette:
  - 使用中性背景与有限的材质色，保留细微色温差而不使用全局滤镜。
lighting:
  quality: 大型柔光与精确补光结合的摄影棚光线
  behavior:
    - 明暗过渡平滑，阴影边界可控，重点落在形体和材质上。
    - 高光克制，玻璃、金属、纸张或织物各自保留不同反射逻辑。
surface:
  finish: 干净而真实的高品质摄影表面
  edges: 轮廓精确，局部允许自然柔化但不加发光边缘
texture:
  density: 低到中等
  placement: 纹理集中在材料转折、纸张纤维、织物和皮肤细节
invariants:
  - 严谨的摄影棚控制和有意识的留白
  - 形体、材料与阴影的精确分离
  - 安静、克制、不依赖装饰的视觉完成度
  - 不固定人物、服装、器物或地点
medium: 黑白或低饱和的高控制摄影，覆盖肖像、时装与静物语境
materials:
  support: 无缝背景、受控光源和真实可辨的物体表面
process:
  - 先锁定用户主体、画幅和用途，避免从风格名推断题材。
  - 建立简洁背景与精确轮廓，再安排光线和阴影。
  - 逐项区分材质反射、表面纹理和边缘过渡。
  - 最后控制色温、留白和局部修饰，避免过度商业化。
technical_direction:
  contrast: 中等，局部层次清楚，避免死黑和死白
  saturation: 低到中等，色彩服务于材料和形体
  perspective: 受控镜头和稳定比例，避免夸张广角
  detail_density: 中等，细节有重点且不堆满背景
avoid:
  - 普通电商产品图的均匀塑料质感
  - 过度磨皮、过锐化和强烈彩色滤镜
  - 固定使用人物、时装或某种经典静物
  - 复制具体摄影作品的姿态和道具安排
safety_note: 不复现具体作品、可识别人物、商标或品牌版式。
