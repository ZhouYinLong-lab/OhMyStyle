schema_version: 2.1.0
status: experimental
id: irving-penn-direction
name: 欧文·佩恩
base_package: photographers/irving-penn
scope:
  medium: photography
  representation: recognizable
  description: 以严谨的摄影棚控制、克制的背景、精确的形体关系和材料质感组织肖像、时装与静物画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - 固定人物、服装品牌或特定静物
  - 复制具体摄影作品
  - 过度修饰和电商棚拍效果
pillars:
- 以严谨的摄影棚控制、克制的背景、精确的形体关系和材料质感组织肖像、时装与静物画面。
- 'form: medium: 高控制摄影棚摄影; composition: 精确轮廓、留白、克制的物体间距; palette: 中性基础色与有限材料色; lighting: 大型柔光、清楚但柔和的明暗转折; surface:
  干净、真实、不过度修饰; texture: 细节集中于材料与形体; edges: 稳定、精确、无人工发光边缘'
- 'process: preserve: 摄影棚控制和形体精度; preserve: 材料差异与克制阴影; preserve: 负空间和安静的完成度; release: 代表图中的纸张和器物; release:
  固定肖像、时装或静物题材'
- 'palette: roles: name: 暖灰背景; roles: hex: #D4CEC2; roles: role: quiet studio ground; roles: name: 炭黑阴影; roles:
  hex: #242321; roles: role: controlled depth; roles: name: 纸张米白; roles: hex: #EEE7D8'
