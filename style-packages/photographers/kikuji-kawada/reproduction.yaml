medium: high-contrast black-and-white documentary photography
materials:
  support: gelatin-silver print or matte photobook page
process:
  - choose an ordinary subject with an unresolved visual detail
  - crop or frame it as a fragment rather than an explanatory scene
  - tune exposure for deep blacks, active highlights, and readable surface grain
technical_direction:
  contrast: high but not posterized
  saturation: monochrome or one restrained color accent
  perspective: observational, oblique, or close-cropped
  detail_density: selective; allow gaps and visual silence
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
