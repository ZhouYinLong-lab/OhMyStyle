schema_version: 2.1.0
status: experimental
id: kikuji-kawada-direction
name: 川田喜久治
base_package: photographers/kikuji-kawada
scope:
  medium: high-contrast black-and-white documentary photography
  representation: recognizable
  description: 以高反差黑白、碎片化符号、物质表面和历史记忆的间接指涉，形成不依赖单一题材的摄影观察方式。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以高反差黑白、碎片化符号、物质表面和历史记忆的间接指涉，形成不依赖单一题材的摄影观察方式。
- 'composition: Build images from cropped fragments, oblique viewpoints, and visual interruptions rather than
  explanatory scenes.; Let a small sign, surface, or object carry tension through placement and scale.'
- 'palette: Prefer dense black, paper white, and restrained gray; allow a single muted color when it functions
  as a symbolic accent.; Keep tonal separation strong without turning every subject into a graphic poster.'
- 'lighting: quality: hard or naturally abrupt documentary light; behavior: Preserve blown highlights, deep
  shadows, and reflective surfaces as evidence of the photographic encounter.'
