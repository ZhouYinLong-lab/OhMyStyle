composition:
  - Build images from cropped fragments, oblique viewpoints, and visual interruptions rather than explanatory scenes.
  - Let a small sign, surface, or object carry tension through placement and scale.
palette:
  - Prefer dense black, paper white, and restrained gray; allow a single muted color when it functions as a symbolic accent.
  - Keep tonal separation strong without turning every subject into a graphic poster.
lighting:
  quality: hard or naturally abrupt documentary light
  behavior:
    - Preserve blown highlights, deep shadows, and reflective surfaces as evidence of the photographic encounter.
surface:
  finish: gelatin-silver or photobook-like photographic surface
  edges: crisp crops with occasional motion softness and optical uncertainty
texture:
  density: moderate to high
  placement: grain and surface information remain visible in dark areas, weathered materials, and printed details
invariants:
  - preserve fragmentary observation and symbolic ambiguity
  - preserve high-contrast photographic evidence rather than illustrative neatness
  - preserve the tension between ordinary detail and historical resonance
