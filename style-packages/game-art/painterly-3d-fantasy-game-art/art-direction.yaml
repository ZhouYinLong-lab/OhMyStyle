schema_version: 2.1.0
status: experimental
id: painterly-3d-fantasy-game-art-direction
name: 手绘质感三维幻想游戏美术
base_package: game-art/painterly-3d-fantasy-game-art
scope:
  medium: 手绘环境纹理; 简化三维角色或生物; 柔和但可读的边缘光效
  representation: stylized
  description: 以手绘背景、柔和三维角色和层叠光雾构成幻想游戏空间，强调笔触方向、环境光和角色与景观之间的统一色温。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - photorealistic_game_render
  - glossy_asset_catalog
  - random_bloom
  - copied_character
pillars:
- 以手绘背景、柔和三维角色和层叠光雾构成幻想游戏空间，强调笔触方向、环境光和角色与景观之间的统一色温。
- 'medium: 手绘环境纹理; 简化三维角色或生物; 柔和但可读的边缘光效'
- 'composition: 用大气透视和枝叶框景组织景深; 角色与环境共享色温但保持轮廓清楚; 前景细节高于远景'
- 'palette: 深蓝绿、紫灰、暖金和乳白构成冷暖幻想色组; 发光色只用于少数光源或焦点; 背景饱和度随距离降低'
