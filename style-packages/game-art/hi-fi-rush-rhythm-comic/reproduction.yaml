medium: bold cel-shaded 3D comic game scene
materials:
- 卡通渲染模型
- 工业金属
- 涂漆机械
- 橡胶和塑料
- 平面色彩图形
process:
- 先建立动作和平台节奏
- 再分配纯净色面
- 加入少量设备光和轮廓
- 最后检查每个形体的边缘可读性
technical_direction: 保持图形化明暗和清晰轮廓；避免霓虹滤镜、文字和写实电影光。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
