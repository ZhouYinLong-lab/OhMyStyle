execution:
  route: text_only
  must:
  - 先建立动作和平台节奏
  - 再分配纯净色面
  - 加入少量设备光和轮廓
  - 最后检查每个形体的边缘可读性
  - 轮廓、色块和动作优先
  - 画面可读而不依赖文字
  - 不得复制具体角色、乐器、标志或舞台
  - Preserve the user-provided subject, object count, location, and requested details.
