Create an original image using this package as a visual language, not as a fixed subject or copied composition.

Package signature:
- 深蓝、钴蓝和冷紫构成夜间主色阶
- 月光或冷色顶光塑造清晰而克制的剪影
- 都市建筑、电线和栏杆形成有秩序的图形骨架
- 少量暖色窗口光作为视觉节拍，不改变整体冷色基调

Subject rule:
Keep the user-supplied subject, object count, location, action, and narrative unchanged. Do not add a recurring moon, school, train, character, weapon, or game interface.

Reproduction direction:
- 先确定宽幅构图和清楚的前中后景关系
- 以深蓝冷色环境光统一画面，再加入有限暖色点光
- 使用干净轮廓、平整色面和少量有方向的纹理
- 检查没有把代表图中的都市平台、月亮或人物剪影变成默认主体
