joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-primary-01
  kind: primary_research_source
  base_asset_id: primary-01
execution:
  route: text_only
  must:
  - 先写用户主体和构图，再注入冷蓝夜间视觉签名
  - 将蓝色作为环境主色，将暖色限制为有来源的局部光
  - 保持建筑、天空、人物或物体的轮廓可读
  - 用少量颗粒、湿润反射或软雾连接前中后景
  - 先安排宽幅空间骨架与主体留白
  - 用冷色环境光统一不同材质
  - 以轮廓、色面和有限纹理建立可读性
  - 最后检查暖色光源是否过量、是否出现固定游戏元素
  avoid:
  - fixed subject matter
  - copied composition
  - logos, interface text, or branded symbols
  - generic neon cyberpunk treatment
  - fixed moon, school, train, character, weapon, or interface
  - copied key-art composition
  - photorealistic rendering when the user requests illustration
  - named character
  - branded interface
  - fixed moon or school setting
