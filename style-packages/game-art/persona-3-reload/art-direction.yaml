  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 深海军蓝、钴蓝和冷紫构成主要明度层; 青蓝高光用于月光、玻璃或湿润表面;
