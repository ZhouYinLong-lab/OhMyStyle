schema_version: 2.1.0
status: experimental
id: persona-3-reload-direction
name: 女神异闻录3重制版游戏美术
base_package: game-art/persona-3-reload
scope:
  medium: 游戏美术
  representation: stylized
  description: 以深蓝夜色、月光都市、清晰剪影和克制的冷暖对比组织现代日式角色扮演游戏画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character
  - branded interface
  - fixed moon or school setting
pillars:
- 以深蓝夜色、月光都市、清晰剪影和克制的冷暖对比组织现代日式角色扮演游戏画面。
- 'medium: 游戏美术'
- 'composition: 宽幅画面由建筑、栏杆、电线或道路组织出清楚的水平与斜向骨架; 主体通常保留适度留白，不依赖中心对称或固定场景; 前景结构清楚，中景承担空间叙事，远景用蓝色空气透视后退'
- 'palette: 深海军蓝、钴蓝和冷紫构成主要明度层; 青蓝高光用于月光、玻璃或湿润表面; 少量暖琥珀光只作为窗口、路灯或局部反射; 不使用全画面霓虹渐变或无来源的彩色光污染'
