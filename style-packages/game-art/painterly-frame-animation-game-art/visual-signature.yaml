composition:
- 关键姿势形成清楚的动作剪影
- 画面留白服务动作方向与情绪停顿
- 背景层级不抢占角色运动路径
palette:
- 色彩按情绪阶段分组而非全程固定滤镜
- 大色面托住角色和平台
- 高饱和变化集中在叙事或动作焦点
medium:
- 二维绘制边缘保留笔触和局部晕染
- 姿态逐帧变化而非完全均匀插值
- 轮廓形状随动作伸缩但保持角色身份
lighting:
- 光影以绘制色块和透明叠层表达
- 光线转场可参与情绪变化
- 避免写实高光盖掉笔触
surface:
- 纸纹或颜料颗粒轻微可辨
- 不同景物可有不同笔触方向
- 纹理尺度与角色尺寸协调
texture:
- 动作快时减少面部和关键部位噪声
- 帧间纹理稳定或有控制地变化
- 可站立表面边缘比装饰笔触更清晰
invariants:
- 姿态设计与绘画表面共同构成风格
- 动画节奏允许停顿和不均匀变化
- 不复刻来源作品的角色或镜头
