composition:
- 垂直建筑、线缆、桥和巷道形成多层视线
- 地面反射把局部光源连接到空间
- 人物或车辆只作为尺度，不成为广告海报主体
palette:
- 深蓝黑、青色、洋红、钠橙和少量脏白形成局部对比
- 每个发光源有明确物理位置
- 阴影保持色彩信息而不是纯黑
medium:
- 写实三维环境结合设计化光源
- 材质真实但边缘和构图经过图形设计
- 不把所有表面处理成镜面
lighting:
- 霓虹和室内灯只照亮邻近表面
- 雨雾承接光线但不形成无来源光晕
- 冷暖光源彼此有空间关系
surface:
- 湿混凝土、锈金属、玻璃、塑料和旧墙可区分
- 反射受粗糙度控制
texture:
- 污渍、维修痕迹和老化集中在近景
- 背景细节随距离降低
invariants:
- 若用户指定城市环境，城市可呈现生活和基础设施痕迹；其他主体不添加默认城市
- 光源有来源且不污染全画面
- 不得使用可识别文字、品牌或游戏资产
