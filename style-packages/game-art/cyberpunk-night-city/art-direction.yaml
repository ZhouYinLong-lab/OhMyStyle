schema_version: 2.1.0
status: experimental
id: cyberpunk-night-city-direction
name: 霓虹未来都市游戏美术
base_package: game-art/cyberpunk-night-city
scope:
  medium: 写实三维环境结合设计化光源; 材质真实但边缘和构图经过图形设计; 不把所有表面处理成镜面
  representation: stylized
  description: 以垂直城市、潮湿路面、密集基础设施、局部霓虹和电影化夜景组织可信的未来都市环境，不依赖全局发光。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - readable_branding
  - generic_teal_orange
  - empty_clean_city
  - fantasy_cybernetics
pillars:
- 以垂直城市、潮湿路面、密集基础设施、局部霓虹和电影化夜景组织可信的未来都市环境，不依赖全局发光。
- 'medium: 写实三维环境结合设计化光源; 材质真实但边缘和构图经过图形设计; 不把所有表面处理成镜面'
- 'composition: 垂直建筑、线缆、桥和巷道形成多层视线; 地面反射把局部光源连接到空间; 人物或车辆只作为尺度，不成为广告海报主体'
- 'palette: 深蓝黑、青色、洋红、钠橙和少量脏白形成局部对比; 每个发光源有明确物理位置; 阴影保持色彩信息而不是纯黑'
