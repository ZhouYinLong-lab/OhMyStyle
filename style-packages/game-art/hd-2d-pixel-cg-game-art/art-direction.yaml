execution:
  route: text_only
  must:
  - establish the subject and camera
  - build simple 3D depth layers
  - place crisp pixel sprites
  - add restrained light and depth of field
  - check path and edge readability
  - 2D sprite and 3D space stay legible
  - no copied scene or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - pure flat pixel scene
  - photorealistic PBR
  - copied character
  - excessive blur
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
