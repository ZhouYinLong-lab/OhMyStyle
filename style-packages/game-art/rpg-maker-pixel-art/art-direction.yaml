schema_version: 2.1.0
status: experimental
id: rpg-maker-pixel-art-direction
name: 角色扮演游戏像素美术
base_package: game-art/rpg-maker-pixel-art
scope:
  medium: 2d_rpg_pixel_game_art
  representation: stylized
  description: A 2D tile-based pixel-game direction built from compact sprites, crisp nearest-neighbor edges,
    layered environments, restrained palettes, and warm-cool lighting. It supports exploration, dialogue, puzzle,
    combat, menu, and transition scenes without requiring a particular subject.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - generic_8_bit_hardware_replica
  - modern_smooth_pixel_art
  - photorealistic_background
  - character_or_scene_copying
pillars:
- A 2D tile-based pixel-game direction built from compact sprites, crisp nearest-neighbor edges, layered environments,
  restrained palettes, and warm-cool lighting. It supports exploration, dialogue, puzzle, combat, menu, and
  transition scenes without requiring a particular subject.
- 'composition: build a readable tile-based room or landscape with a clear walkable plane; keep sprites small
  enough for the environment to carry compositional weight; use doors, windows, paths, railings, horizon lines,
  or furniture as guide lines; reserve negative space when the scene needs calm or visual separation; establish
  the largest spatial masses before adding small props'
- 'palette: deep navy, blue-violet, muted teal, dusty lavender, warm amber, ochre, muted rose; keep most surfaces
  in a restrained family and reserve bright accents for focal objects; use warm-cool opposition as an optional
  lighting and spatial device'
- 'lighting: warm pools of interior or sunset light against cool dusk or night surroundings; haze and reflection
  expressed as deliberate pixel clusters or stepped bands; no smooth bloom; important forms retain visible
  pixel edges; shadows remain shaped and readable instead of becoming uniform black'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: build a readable
    tile-based room or landscape with a clear walkable plane; keep sprites small enough for the environment
    to carry compositional weight; use doors, windows, paths, railings, horizon lines, or furniture as guide
    lines; reserve negative space when the scene needs calm or visual separation; establish the largest spatial
    masses before adding small props. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: build a readable
    tile-based room or landscape with a clear walkable plane; keep sprites small enough for the environment
    to carry compositional weight; use doors, windows, paths, railings, horizon lines, or furniture as guide
    lines; reserve negative space when the scene needs calm or visual separation; establish the largest spatial
    masses before adding small props.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: build a
    readable tile-based room or landscape with a clear walkable plane; keep sprites small enough for the environment
    to carry compositional weight; use doors, windows, paths, railings, horizon lines, or furniture as guide
    lines; reserve negative space when the scene needs calm or visual separation; establish the largest spatial
    masses before adding small props.'
  evidence:
