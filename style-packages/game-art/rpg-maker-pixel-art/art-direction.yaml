execution:
  route: text_only
  must:
  - block the walkable plane and largest light-dark masses first
  - place sprites and interactive objects using one consistent tile scale
  - add props for location clarity composition or gameplay readability
  - use stepped palette bands for sky water shadow and interior light
  - check the scene at logical resolution before display upscale
  - choose an optional open outdoor enclosed interior or uncanny detail variant
  - the image is authored pixel art rather than a smooth image with a pixel filter
  - sprite scale and environment geometry remain coherent
  avoid:
  - anti_aliasing
  - smooth_photographic_gradient
  - excessive_particle_effects
  - generic_neon_cyberpunk_lighting
  - oversized_character_portrait
  - readable_text_or_branding
  - copied_game_ui_or_known_scene
  - generic_8_bit_hardware_replica
  - modern_smooth_pixel_art
  - photorealistic_background
