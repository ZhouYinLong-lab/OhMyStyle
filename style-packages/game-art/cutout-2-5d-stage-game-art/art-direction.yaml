schema_version: 2.1.0
status: experimental
id: cutout-2-5d-stage-game-art-direction
name: 剪纸式 2.5D 舞台游戏美术
base_package: game-art/cutout-2-5d-stage-game-art
scope:
  medium: Combine illustrated planes with limited depth-aware movement and optional 3D elements.; Cutout-like
    edges may be clean, textured, or hand-drawn but remain intentional.
  representation: stylized
  description: 以相机朝向的插画平面组成纵深舞台，角色和少量道具可在层间移动；保留剪纸式轮廓与舞台空间，不要求角色必须是二维或场景必须完全平面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - flat_noninteractive_poster
  - full_perspective_photoreal_3d
  - unreadable_layer_overlap
  - copied_named_scene
pillars:
- 以相机朝向的插画平面组成纵深舞台，角色和少量道具可在层间移动；保留剪纸式轮廓与舞台空间，不要求角色必须是二维或场景必须完全平面。
- 'medium: Combine illustrated planes with limited depth-aware movement and optional 3D elements.; Cutout-like
  edges may be clean, textured, or hand-drawn but remain intentional.'
- 'composition: Arrange planes in a clear foreground-to-background order.; Use overlap and shallow depth to
  frame the playable route.; Keep the action plane distinct from decorative layers.'
- 'palette: Use connected colors across planes while separating their values.; Reserve strongest contrast for
  active characters and interactable objects.; Keep lighting and color transitions consistent across adjacent
  planes.'
