composition:
- 中心景物像被安置在可观察的模型空间
- 小路、平台和门洞形成可读路径
- 保留模型周围的安静背景
palette:
- 苔绿、暖棕、米白、灰蓝和一点篝火橙
- 整体中等饱和且有温度
- 亮色只用于情绪焦点
medium:
- 哑光三维模型
- 纸板、木材、石块和软质地形的简化暗示
- 圆润边缘
lighting:
- 大面积柔光和接触阴影
- 小型光源给局部温暖
- 阴影不黑不脏
surface:
- 表面有手作但不粗糙的质感
- 材料边界清楚
texture:
- 近景小物细节有限且有尺度
- 远景保持简化
invariants:
- 模型尺度贯穿全场景
- 空间可以被当作游戏关卡理解
- 不复制来源作品的角色和建筑
