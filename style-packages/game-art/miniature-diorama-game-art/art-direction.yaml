schema_version: 2.1.0
status: experimental
id: miniature-diorama-game-art-direction
name: 微缩模型场景游戏美术
base_package: game-art/miniature-diorama-game-art
scope:
  medium: 哑光三维模型; 纸板、木材、石块和软质地形的简化暗示; 圆润边缘
  representation: stylized
  description: 把游戏环境设计成具有微缩模型尺度的立体场景，依靠圆润造型、柔和阴影和小物件比例建立亲切但不幼稚的空间。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - unclear_scale
  - giant_photo_texture
  - plastic_toy_gloss
  - copied_scene
pillars:
- 把游戏环境设计成具有微缩模型尺度的立体场景，依靠圆润造型、柔和阴影和小物件比例建立亲切但不幼稚的空间。
- 'medium: 哑光三维模型; 纸板、木材、石块和软质地形的简化暗示; 圆润边缘'
- 'composition: 中心景物像被安置在可观察的模型空间; 小路、平台和门洞形成可读路径; 保留模型周围的安静背景'
- 'palette: 苔绿、暖棕、米白、灰蓝和一点篝火橙; 整体中等饱和且有温度; 亮色只用于情绪焦点'
