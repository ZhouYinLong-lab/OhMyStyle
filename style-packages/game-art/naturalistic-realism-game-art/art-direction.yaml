schema_version: 2.1.0
status: experimental
id: naturalistic-realism-game-art-direction
name: 自然主义写实游戏美术
base_package: game-art/naturalistic-realism-game-art
scope:
  medium: 三维形体保持可信比例和结构; 材质差异由粗糙度、反射和细节尺度共同表达; 写实不要求每个区域都堆满微细节
  representation: stylized
  description: 以可信的自然光、材质响应、尺度关系和环境因果构建可探索世界；强调观察所得的真实感，而非电影式镜头或单纯高细节。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - generic_cinematic_teal_orange
  - fantasy_material_glow
  - arbitrary_asset_scatter
  - copied_named_world
pillars:
- 以可信的自然光、材质响应、尺度关系和环境因果构建可探索世界；强调观察所得的真实感，而非电影式镜头或单纯高细节。
- 'medium: 三维形体保持可信比例和结构; 材质差异由粗糙度、反射和细节尺度共同表达; 写实不要求每个区域都堆满微细节'
- 'composition: 空间尺度由可比较的物体和地形关系建立; 视线引导来自地貌、光线和真实使用路径; 远近层次遵循大气和遮挡关系'
- 'palette: 颜色来自环境光与材料本色的共同作用; 远景对比和饱和度随空气距离下降; 人工色彩用于有因果的标记或物件'
