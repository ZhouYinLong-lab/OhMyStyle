execution:
  route: text_only
  must:
  - 观察动作节奏和重心
  - 选择关键姿态并简化形体
  - 连接为可读动作弧线
  - 设计线条与色块处理
  - 检查帧间轮廓稳定
  - 动作观察感可见
  - 角色身份稳定
