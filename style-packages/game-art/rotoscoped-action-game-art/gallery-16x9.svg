<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">转描动作游戏美术 palette card</title>
  <desc id="desc">以真人动作或影像为运动参照，再经逐帧描绘、提炼或处理形成动画；核心是动作观察与再设计，而非固定表面画风。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#E9DDC7" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#2A2B30" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#AC5044" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#687B83" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#E9DDC7"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">warm paper</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#2A2B30"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">charcoal</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#AC5044"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">brick red</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#687B83"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">smoke blue</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">转描动作游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
</svg>
