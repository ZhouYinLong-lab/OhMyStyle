schema_version: 2.1.0
status: experimental
id: hand-inked-animation-game-art-direction
name: 手绘墨线动画游戏美术
base_package: game-art/hand-inked-animation-game-art
scope:
  medium: 可见的铅笔或墨线轮廓; 手绘填色和水彩式背景; 线条粗细随动作和透视变化
  representation: stylized
  description: 以逐帧手绘的弹性动作、黑色墨线、复古卡通比例和水彩背景组织二维游戏画面，保留人工绘制的不完美节奏。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - smooth_vector_icon
  - realistic_anatomy
  - photorealistic_texture
  - copied_cartoon_character
pillars:
- 以逐帧手绘的弹性动作、黑色墨线、复古卡通比例和水彩背景组织二维游戏画面，保留人工绘制的不完美节奏。
- 'medium: 可见的铅笔或墨线轮廓; 手绘填色和水彩式背景; 线条粗细随动作和透视变化'
- 'composition: 动作姿态有明确弧线和夸张重心; 前景角色与背景层次分离; 画面重心清楚但允许舞台化留白'
- 'palette: 黑、奶油白、暗红、黄绿和暖棕构成复古有限色板; 背景通常比角色低对比; 局部高饱和用于动作焦点'
