composition:
- 动作姿态有明确弧线和夸张重心
- 前景角色与背景层次分离
- 画面重心清楚但允许舞台化留白
palette:
- 黑、奶油白、暗红、黄绿和暖棕构成复古有限色板
- 背景通常比角色低对比
- 局部高饱和用于动作焦点
medium:
- 可见的铅笔或墨线轮廓
- 手绘填色和水彩式背景
- 线条粗细随动作和透视变化
lighting:
- 舞台灯光与大块阴影清楚
- 高光为绘制形状而非摄影反射
- 不依赖霓虹发光
surface:
- 纸张、墨水、旧动画片的轻微不均匀感
- 角色边缘不做数字锐化光晕
texture:
- 少量胶片抖动、纸张颗粒和水彩渗化
- 纹理必须服从画面节奏
invariants:
- 动作先于真实比例
- 手绘线条和二维舞台关系保持稳定
- 不得复制已知角色或镜头
