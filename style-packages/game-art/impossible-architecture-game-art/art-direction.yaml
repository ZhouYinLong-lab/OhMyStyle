schema_version: 2.1.0
status: experimental
id: impossible-architecture-game-art-direction
name: 等距幻觉建筑游戏美术
base_package: game-art/impossible-architecture-game-art
scope:
  medium: 简化三维几何; 等距或弱透视投影; 平整材质和清晰边界
  representation: stylized
  description: 以等距视角、非欧几何连接、干净色面和可操作建筑机关组织谜题场景，画面优先呈现结构关系与视觉错觉。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - random_perspective_break
  - photorealistic_architecture
  - unreadable_mechanism
  - copied_level_layout
pillars:
- 以等距视角、非欧几何连接、干净色面和可操作建筑机关组织谜题场景，画面优先呈现结构关系与视觉错觉。
- 'medium: 简化三维几何; 等距或弱透视投影; 平整材质和清晰边界'
- 'composition: 等距轴线清楚; 平台、楼梯、桥和门形成可追踪路径; 错觉只发生在结构连接处并可被理解'
- 'palette: 大块粉彩与深色阴影形成清晰分区; 一到两个高亮色提示可操作结构; 色彩服务于空间而非装饰堆叠'
