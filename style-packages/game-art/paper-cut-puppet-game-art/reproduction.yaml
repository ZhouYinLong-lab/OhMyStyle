reproduction:
  priority_order:
    - 用户主体与玩法用途
    - 纸片拆层和剪影
    - 关节、层间阴影和浅舞台空间
    - 纸面与印刷细节
  subject_rules:
    - 用户主体必须保持可识别；媒介规则不能替换角色或场景。
    - 代表图中的纸片角色和草地场景不进入默认提示词。
  transfer_rules:
    - 把主体拆成有限层，而不是生成随机拼贴。
    - 用层间阴影表达深度，不使用三维建模高光。
    - 保持远距离剪影和二维游戏阅读清楚。
  forbidden_shortcuts:
    - 3D 纸艺立体书
    - 默认木偶、剧院或特定故事
