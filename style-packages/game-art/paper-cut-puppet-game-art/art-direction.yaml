schema_version: 2.1.0
status: experimental
id: paper-cut-puppet-game-art-direction
name: 纸片木偶式二维游戏美术
base_package: game-art/paper-cut-puppet-game-art
scope:
  medium: flat cut-paper and 2D puppet game art with visible paper edges, articulated silhouettes, shallow
    stage depth, and readable layered composition
  representation: stylized
  description: 以分层纸片、关节化轮廓、浅舞台深度和手工色块构成可拆分的二维游戏画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - 固定木偶、剧院、儿童房、战争故事或特定角色
  - 三维纸艺立体书或写实材质扫描
  - 复制具体游戏资产、界面或关卡构图
pillars:
- 以分层纸片、关节化轮廓、浅舞台深度和手工色块构成可拆分的二维游戏画面。
- 'medium: flat cut-paper and 2D puppet game art with visible paper edges, articulated silhouettes, shallow
  stage depth, and readable layered composition'
- 'composition: 前后纸片层; 可活动关节与清楚剪影; 浅舞台空间'
- 'palette: 纸张中性色; 有限高辨识度色块; 手工印刷差异'
