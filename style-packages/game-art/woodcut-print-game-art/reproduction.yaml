medium: digital illustration inspired by relief printmaking
materials:
- carved directional lines
- ink blocks
- paper support
- limited spot color
process:
- 先定轮廓和黑白面积
- 沿结构添加排线
- 调整线密度表达明暗
- 留出纸白呼吸区域
- 检查缩小后线条是否粘连
technical_direction: Use carved line direction and value grouping; do not reduce woodcut
  to a sepia filter.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
