<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">木刻版画游戏美术 palette card</title>
  <desc id="desc">把明暗译成有方向的刀刻线和黑白色块，使人物、建筑与地表像由版面转印而来。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#232326" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#E5D9C0" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#77716B" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#A34D41" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#232326"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">ink black</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#E5D9C0"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">warm paper</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#77716B"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">iron gray</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#A34D41"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">rust red</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">木刻版画游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
</svg>
