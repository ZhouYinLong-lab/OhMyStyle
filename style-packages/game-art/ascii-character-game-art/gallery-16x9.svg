<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ASCII 字符游戏美术 palette card</title>
  <desc id="desc">用字母、数字和标点构成空间、角色与材质，把字符栅格的密度、字体和对比关系作为主要图形语言。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#10151B" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#D9D0A7" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#D39A54" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#73947D" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#10151B"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">terminal black</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#D9D0A7"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">warm phosphor</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#D39A54"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">amber</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#73947D"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">muted green</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">ASCII 字符游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
</svg>
