id: hand-painted-low-poly-game-art-direction
name: 手绘低多边形游戏美术
base_package: game-art/hand-painted-low-poly-game-art
scope:
  medium: Combine low-to-moderate polygon geometry with hand-painted surface color.; The visible paint can
    be stylized digital texture and does not imply physical paint.
  representation: stylized
  description: 以简化多边形建立清楚体块，再用手绘色面和方向性笔触表达材质；重点是贴图笔触与几何面的协作，不是统一低模滤镜。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - photographic_texture_maps
  - faceted_geometry_without_painted_surface_logic
  - generic_pastel_filter
  - copied_asset_or_scene
pillars:
- 以简化多边形建立清楚体块，再用手绘色面和方向性笔触表达材质；重点是贴图笔触与几何面的协作，不是统一低模滤镜。
- 'medium: Combine low-to-moderate polygon geometry with hand-painted surface color.; The visible paint can
  be stylized digital texture and does not imply physical paint.'
- 'composition: Use a few large readable forms before adding painted detail.; Keep facet direction and painted
  shadow shapes aligned with volume.; Separate focal objects from scenery through silhouette and value.'
- 'palette: Use compact material-specific color families with controlled accents.; Shift hue within painted
  shadow and light shapes instead of adding uniform gradients.; Keep outlines and contact shadows readable
  at game scale.'
