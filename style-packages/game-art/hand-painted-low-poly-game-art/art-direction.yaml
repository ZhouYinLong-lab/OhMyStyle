execution:
  route: text_only
  must:
  - Establish silhouette and major planes.
  - Paint local color and broad shadow shapes along the form.
  - Add selective material cues and edge accents.
  - Inspect at target distance and remove texture noise that competes with gameplay.
  - Painted color and geometry jointly describe form.
  - Keep the user-provided subject independent from example props.
  - Do not reuse source assets, silhouettes, or exact compositions.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photographic_texture_maps
  - faceted_geometry_without_painted_surface_logic
  - generic_pastel_filter
  - copied_asset_or_scene
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
