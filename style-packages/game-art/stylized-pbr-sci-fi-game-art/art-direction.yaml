schema_version: 2.1.0
status: experimental
id: stylized-pbr-sci-fi-game-art-direction
name: 风格化物理渲染科幻游戏美术
base_package: game-art/stylized-pbr-sci-fi-game-art
scope:
  medium: 风格化PBR材质; 真实粗糙度和金属度差异; 图形化灯牌或发光面
  representation: stylized
  description: 在真实材质响应与高度风格化的科幻环境之间建立平衡，使用可读的金属、玻璃、湿地和霓虹反射，但避免把画面退化成无层次的赛博滤镜。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - generic_cyberpunk_gradient
  - unreadable_neon
  - copied_cityscape
  - plastic_everything
pillars:
- 在真实材质响应与高度风格化的科幻环境之间建立平衡，使用可读的金属、玻璃、湿地和霓虹反射，但避免把画面退化成无层次的赛博滤镜。
- 'medium: 风格化PBR材质; 真实粗糙度和金属度差异; 图形化灯牌或发光面'
- 'composition: 用建筑层叠、垂直管线和狭窄通道形成深度; 焦点物体有明确轮廓和交互尺度; 远景灯光不抢近景材质'
- 'palette: 深蓝黑、青绿、橙黄和少量紫红形成冷暖对照; 霓虹色是局部光源而不是全局色罩; 湿地反射保持原色层次'
