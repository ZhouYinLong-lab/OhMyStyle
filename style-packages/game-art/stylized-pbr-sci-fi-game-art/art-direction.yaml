    source_ids:
    - source-stylized-pbr-sci-fi-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 深蓝黑、青绿、橙黄和少量紫红形成冷暖对照; 霓虹色是局部光源而不是全局色罩;
    湿地反射保持原色层次. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 深蓝黑、青绿、橙黄和少量紫红形成冷暖对照; 霓虹色是局部光源而不是全局色罩;
    湿地反射保持原色层次.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    深蓝黑、青绿、橙黄和少量紫红形成冷暖对照; 霓虹色是局部光源而不是全局色罩; 湿地反射保持原色层次.'
  evidence:
    source_ids:
    - source-stylized-pbr-sci-fi-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: 多源环境光仍有主次; 雨后湿地反射可辨但不过曝; 光源方向和颜色可追踪. Keep light
    coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: 多源环境光仍有主次; 雨后湿地反射可辨但不过曝; 光源方向和颜色可追踪.'
