    光源方向和颜色可追踪.'
  evidence:
    source_ids:
    - source-stylized-pbr-sci-fi-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 锈蚀、玻璃、混凝土、塑料和金属必须区分;
    粗糙度比高光数量更重要. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: 锈蚀、玻璃、混凝土、塑料和金属必须区分;
