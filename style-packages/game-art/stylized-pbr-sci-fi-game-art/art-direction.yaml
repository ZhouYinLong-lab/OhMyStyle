- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 细节集中在近景和功能构件;
    污渍、划痕与水迹有空间逻辑. Preserve detail hierarchy and material identity.'
