    焦点物体有明确轮廓和交互尺度; 远景灯光不抢近景材质.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 用建筑层叠、垂直管线和狭窄通道形成深度;
    焦点物体有明确轮廓和交互尺度; 远景灯光不抢近景材质.'
