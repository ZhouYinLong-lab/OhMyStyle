    真实粗糙度和金属度差异; 图形化灯牌或发光面.'
  observable: 'The requested image retains the stated medium distinction or production constraint: 风格化PBR材质;
    真实粗糙度和金属度差异; 图形化灯牌或发光面.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    风格化PBR材质; 真实粗糙度和金属度差异; 图形化灯牌或发光面.'
  evidence:
    source_ids:
    - source-stylized-pbr-sci-fi-game-art-primary-source
    basis: curatorial_inference
