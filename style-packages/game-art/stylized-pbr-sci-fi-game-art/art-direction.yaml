- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 用建筑层叠、垂直管线和狭窄通道形成深度;
    焦点物体有明确轮廓和交互尺度; 远景灯光不抢近景材质. Preserve the user-provided content and layout.'
