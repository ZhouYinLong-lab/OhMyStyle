schema_version: 2.1.0
status: experimental
id: retro-3d-console-direction
name: 复古三维主机美术
base_package: game-art/retro-3d-console
scope:
  medium: retro console 3D game rendering
  representation: stylized
  description: 以早期三维主机的低多边形几何、低分辨率纹理、顶点光照、贴图偏移和有限雾效构成可探索空间；本包只提取媒介限制，不固定某部游戏或场景。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - mandatory observatory, road, mountain, tree, character, or dusk setting
  - named game, recognizable character, logo, HUD, or copied level layout
  - modern physically based rendering or polished cinematic concept art
pillars:
- 以早期三维主机的低多边形几何、低分辨率纹理、顶点光照、贴图偏移和有限雾效构成可探索空间；本包只提取媒介限制，不固定某部游戏或场景。
- 'medium: retro console 3D game rendering'
- 'composition: navigable spatial layout with readable ground plane, horizon, and landmark silhouette; simple
  geometric masses arranged for movement and discovery; camera feels like a game viewpoint rather than a gallery
  illustration'
- 'palette: limited, slightly compressed palette with strong dark midtones; local material colors survive low
  resolution without modern cinematic grading; small warm or cool accents can guide navigation when supported
  by the subject'
