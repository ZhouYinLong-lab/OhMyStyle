execution:
  route: text_only
  must:
  - Lock the user's subject, then choose a camera angle that makes the space feel navigable.
  - Reduce geometry while preserving recognizable object classes and traversal paths.
  - Use small textures, vertex colors, broad light, and simple shadows rather than modern surface simulation.
  - Apply restrained distance fog to separate depth layers; keep the nearest ground readable.
  - Check for title-specific characters, interface elements, logos, and accidental modern rendering.
  - Begin with the user's requested game subject and determine a navigable camera view.
  - Simplify forms into purposeful low-polygon masses; do not remove spatial logic.
  - Apply small, slightly imperfect textures and vertex-colored lighting.
  avoid:
  - mandatory environment or story
  - modern PBR, ray tracing, ultra-high polygon detail, and polished concept-art lighting
  - fixed observatory, road, mountain, tree, or dusk scene
  - modern PBR materials, ray tracing, volumetric light, or glossy cinematic polish
  - voxel cubes, 2D pixel sprites, anime rendering, and copied game interfaces
  - mandatory observatory, road, mountain, tree, character, or dusk setting
  - named game, recognizable character, logo, HUD, or copied level layout
  - modern physically based rendering or polished cinematic concept art
  - The package describes a historical rendering language; users provide the scene and subject.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
