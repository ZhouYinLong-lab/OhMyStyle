schema_version: 2.1.0
status: experimental
id: hand-painted-isometric-strategy-direction
name: 等距手绘策略游戏美术
base_package: game-art/hand-painted-isometric-strategy
scope:
  medium: hand-painted isometric strategy-game environment art
  representation: stylized
  description: 以等距网格、手绘材质、分层地形和清晰可读的策略信息组织游戏场景。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - pixel art grid
  - low-poly 3D render
  - photorealistic landscape
  - game UI, text, logos, or named franchise assets
pillars:
- 以等距网格、手绘材质、分层地形和清晰可读的策略信息组织游戏场景。
- 'composition: 使用约30–45度等距俯视，把路径、地块、障碍和单位放进清楚的空间层级。; 让前景、中景和远景都能读取，但避免像地图编辑器一样铺满信息。'
- 'palette: 以自然绿、土黄、石灰灰和水体蓝为底，使用少量暖色提示可交互或重要位置。'
- 'lighting: quality: soft directional daylight with painterly atmospheric separation; behavior: 光照统一，阴影帮助地形分层而不变成电影化光束。'
