  instruction: 'Organize the requested subject using these package-specific spatial decisions: 使用约30–45度等距俯视，把路径、地块、障碍和单位放进清楚的空间层级。;
    让前景、中景和远景都能读取，但避免像地图编辑器一样铺满信息。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 使用约30–45度等距俯视，把路径、地块、障碍和单位放进清楚的空间层级。;
    让前景、中景和远景都能读取，但避免像地图编辑器一样铺满信息。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 使用约30–45度等距俯视，把路径、地块、障碍和单位放进清楚的空间层级。;
    让前景、中景和远景都能读取，但避免像地图编辑器一样铺满信息。.'
