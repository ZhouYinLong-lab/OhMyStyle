canonical_name: 手绘点击式冒险游戏美术
entity_type: game_art
domain: game_art
scope:
  subject_policy: open
  subject_note: 用户提供的主体和场景优先；冒险游戏场景只是媒介参考，不是固定地点。
  subjects: []
  exclusions:
    - 固定角色、谜题、城堡或幻想世界
    - 复制具体游戏截图或美术资产
    - 默认文字、界面和叙事事件
sources:
  - 'https://noemagames.com/'
notes:
  - 本包描述二维手绘冒险游戏的场景美术方法：可读构图、分层空间和保留笔触。
  - 代表图使用普通公共空间作为中性测试主体，不要求每次生成楼梯、车站或黄昏。
composition:
  - 以可探索的场景视图组织前景、中景和背景，保留适合角色或交互点的空间。
  - 用清楚的入口、遮挡和视觉路径建立场景可读性，但不强制谜题或剧情。
  - 画面可以有舞台式取景，但不使用游戏界面、对话框或固定角色。
palette:
  - 使用经过统一控制的环境色，允许暖冷空气层次和局部强调色。
  - 颜色服务于空间、时间和材质，不把每个场景变成统一奇幻滤镜。
lighting:
  quality: 手绘环境光，具有可读的方向和空气层次
  behavior:
    - 以大面积明暗和局部笔触表达空间深度。
    - 允许窗光、天光或人工光，但光源必须来自用户场景。
surface:
  finish: 可见笔触的二维手绘表面，边缘经过设计而非照片锐化
  edges: 关键轮廓清晰，远处或空气层可以柔化
texture:
  density: 中等
  placement: 笔触集中于墙面、地面、植被、天空和材料转折，避免随机噪声
invariants:
  - 二维手绘媒介感与清楚的场景层级
  - 前中后景可读、适合探索的空间组织
  - 笔触和色块共同塑造光线与材质
  - 不固定角色、地点、谜题、幻想元素或故事
medium: 二维手绘点击式冒险游戏场景美术
materials:
  support: 数字绘制的背景层、角色预留空间和可分层的环境平面
process:
  - 读取用户主体与场景，先建立可读的前中后景结构。
  - 为重要表面分配手绘色块和笔触方向，保留合理的交互空间。
  - 用环境光、空气层和局部细节建立深度。
  - 最后检查画面是否像可探索场景，同时避免默认角色、谜题、文字和界面。
technical_direction:
  contrast: 中等，关键入口和交互区域清楚但不戏剧化
  saturation: 中等到偏高，按场景需要组织，不使用统一滤镜
  perspective: 稳定的游戏背景透视，可适度舞台化但不广角夸张
  detail_density: 中高，细节集中于空间线索和材质转折
avoid:
  - 默认加入楼梯、车站、城堡、角色或谜题
  - 直接复制某一款游戏的地图、角色或界面
  - 把手绘场景变成通用水彩滤镜或写实三维渲染
  - 在没有用户要求时加入文字、按钮和对话框
safety_note: 不复现具体游戏截图、角色、标志、界面或品牌资产。
