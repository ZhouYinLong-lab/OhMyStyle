schema_version: 2.1.0
status: experimental
id: hand-painted-point-and-click-direction
name: 手绘点击式冒险游戏美术
base_package: game-art/hand-painted-point-and-click
scope:
  medium: 二维手绘游戏背景
  representation: stylized
  description: 以二维手绘场景、分层空间、可读的前中后景和局部笔触保留构成可探索的冒险游戏画面。
  required_contexts: []
