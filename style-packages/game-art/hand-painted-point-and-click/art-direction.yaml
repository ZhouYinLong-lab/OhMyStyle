execution:
  route: text_only
  must:
  - 关键轮廓可读，远景可适度柔化
  - 二维手绘媒介感
  - 可探索的场景层级
  - 笔触、色块和环境光的协作
  - Release the sample stairs, station, dusk, fixed characters, puzzles, and fantasy location.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 固定角色、谜题、城堡或幻想世界
  - 复制具体游戏截图或美术资产
  - 默认文字、界面和叙事事件
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
