execution:
  route: text_only
  must:
  - 先建立剪影和动作弧线
  - 再铺深色底与主色组
  - 补充建筑与装饰框架
  - 最后控制笔触密度和焦点
  - 手绘图形语言稳定
  - 动作或姿态不被装饰淹没
  - 不得复制具体人物、武器、徽记或布局
  - Preserve the user-provided subject, object count, location, and requested details.
