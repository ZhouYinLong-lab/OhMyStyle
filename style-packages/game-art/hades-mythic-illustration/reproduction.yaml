medium: hand-painted 2D mythic game illustration
materials:
- 不透明水彩或数字绘笔
- 粗细变化线稿
- 深色底层
- 装饰性纹样
- 局部高饱和色面
process:
- 先建立剪影和动作弧线
- 再铺深色底与主色组
- 补充建筑与装饰框架
- 最后控制笔触密度和焦点
technical_direction: 保持二维插画边缘和强色块；不要把结果处理成写实三维渲染或游戏截图。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
