pillars:
- 以清晰卡通渲染、夸张但可读的轮廓、明亮海天色彩和绘画般的三维表面建立轻快而完整的游戏空间。
- 'composition: 清楚的前中后景和可读的游戏空间; 轮廓、路径和地标形体优先于细碎写实纹理; 画面保持轻快的视觉节奏和大色块平衡'
- 'palette: 海蓝、天空青、暖沙色和明亮绿植形成清爽关系; 阴影偏彩色而非纯黑; 强调色用于可交互或视觉重点，但不强制指定对象'
- 'lighting: quality: 明亮的自然日光，柔和但明确的卡通阴影，避免写实电影式压暗; behavior: Keep the requested subject and location independent
  from the package.; behavior: Apply lighting as a transferable visual decision, not a fixed scene.'
