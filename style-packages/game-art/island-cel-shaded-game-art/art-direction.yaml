name: 海岛卡通渲染游戏美术
base_package: game-art/island-cel-shaded-game-art
scope:
  medium: 以清晰卡通渲染、夸张但可读的轮廓、明亮海天色彩和绘画般的三维表面建立轻快而完整的游戏空间。
  representation: stylized
  description: 以清晰卡通渲染、夸张但可读的轮廓、明亮海天色彩和绘画般的三维表面建立轻快而完整的游戏空间。
  required_contexts: []
  incompatible_contexts: []
  limitations:
