composition:
- 几何焦点沿明确的运动轴组织
- 深色负空间隔开轮廓与光迹
- 透视线和重复形状提供方向感
palette:
- 暗底承托少量高亮色
- 每个颜色承担稳定的对象或节奏角色
- 高饱和色以面积和亮度共同分级
medium:
- 线框、发光边缘与简化实体并置
- 形体以几何轮廓而非生活化细节识别
- 光迹沿运动路径出现并及时衰减
lighting:
- 发光核心与外溢光晕分层
- 高光不吞并主体边界
- 明暗变化跟随节奏或事件而非随机闪烁
surface:
- 表面保持光滑、抽象且低材质噪声
- 体积由边缘亮度和透明叠层建立
- 不用照片纹理伪装复杂度
texture:
- 重复图形构成节拍而非装饰铺满
- 轨迹粗细映射速度或能量
- 屏幕闪烁频率可控且保留舒适度
invariants:
- 抽象几何比写实地点更主导
- 颜色和运动有一致映射
- 不复刻来源作品的特定图形或镜头
