schema_version: 2.1.0
status: experimental
id: cel-shaded-nature-game-art-direction
name: 卡通渲染自然冒险游戏美术
base_package: game-art/cel-shaded-nature-game-art
scope:
  medium: 三维模型结合平面化着色; 局部保留手绘笔触或纸墨边缘; 轮廓与材质由图形语言统一
  representation: stylized
  description: 以平面化明暗、清晰轮廓和书法式形体组织三维自然冒险场景，强调图形设计与手绘质感的协同。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - photorealistic_pbr
  - generic_anime_screenshot
  - copied_named_character
  - uncontrolled_ink_noise
pillars:
- 以平面化明暗、清晰轮廓和书法式形体组织三维自然冒险场景，强调图形设计与手绘质感的协同。
- 'medium: 三维模型结合平面化着色; 局部保留手绘笔触或纸墨边缘; 轮廓与材质由图形语言统一'
- 'composition: 以清晰前中后景和大块轮廓组织空间; 让路径、树枝、山脊或建筑线条承担视线引导; 主体轮廓先于细节建立'
- 'palette: 自然绿、土黄、朱红、群青和墨色形成有限色组; 高饱和色用于焦点和自然能量，不做全局滤镜; 明暗分区优先于细密渐变'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Build credible three-dimensional forms from flat color planes and clear silhouettes. Give each major
    surface 2–4 distinct value regions with firm boundaries; reserve hand-painted marks for sparse edge accents.
    Keep contour and material treatment graphically unified.
  observable: Major forms read as three-dimensional, but their light and shadow divide into a few clear, mostly
    hard-edged planes rather than continuous realistic gradients.
  reject_when: Smooth gradients or dense painterly texture cover most major surfaces, or the graphic silhouette
    and flat value grouping disappear.
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 以清晰前中后景和大块轮廓组织空间;
    让路径、树枝、山脊或建筑线条承担视线引导; 主体轮廓先于细节建立. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 以清晰前中后景和大块轮廓组织空间;
    让路径、树枝、山脊或建筑线条承担视线引导; 主体轮廓先于细节建立.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 以清晰前中后景和大块轮廓组织空间;
    让路径、树枝、山脊或建筑线条承担视线引导; 主体轮廓先于细节建立.'
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 自然绿、土黄、朱红、群青和墨色形成有限色组; 高饱和色用于焦点和自然能量，不做全局滤镜;
    明暗分区优先于细密渐变. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 自然绿、土黄、朱红、群青和墨色形成有限色组; 高饱和色用于焦点和自然能量，不做全局滤镜;
    明暗分区优先于细密渐变.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    自然绿、土黄、朱红、群青和墨色形成有限色组; 高饱和色用于焦点和自然能量，不做全局滤镜; 明暗分区优先于细密渐变.'
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use a consistent declared light source and separate lit, middle, and shadow regions into 2–4 tonal
    bands per major form. Keep cast-shadow shapes legible; avoid soft realistic gradients across the main silhouette.
  observable: The light direction is clear and the major shadow boundaries remain visible at presentation size.
  reject_when: Soft gradients erase the value bands, shadows contradict the light source, or glow obscures silhouettes.
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: >-
    Distinguish materials with simplified graphic cues: angular planes for wood and rock, grouped shapes for
    foliage, and controlled highlights. Preserve material identity without photorealistic microtexture.
  observable: Wood, rock, and foliage remain distinguishable through shape and a few material-specific marks, not
    dense texture.
  reject_when: All materials share the same smooth or noisy surface, or microtexture dominates the large color planes.
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Keep texture sparse and directional. Use occasional hand-painted edge marks only where they reinforce
    a silhouette or material transition; leave the main color planes quiet.
  observable: Texture accents are subordinate to the silhouette and value grouping, with no broad field of random
    brush noise.
  reject_when: Dense brushwork fills the image, breaks major contours, or hides the flat-shaded value regions.
  evidence:
    source_ids:
    - source-cel-shaded-nature-game-art-primary-source
    basis: curatorial_inference
    visual_review: reviewed
active_rule_ids:
- medium
- composition
