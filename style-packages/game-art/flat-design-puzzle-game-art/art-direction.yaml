schema_version: 2.1.0
status: experimental
id: flat-design-puzzle-game-art-direction
name: 平面设计解谜游戏美术
base_package: game-art/flat-design-puzzle-game-art
scope:
  medium: 平面插画; 简化三维或二维形体; 圆角、硬边和阴影层按语义使用
  representation: stylized
  description: 用几何形状、纯色面、清楚的交互层级和克制动画语言构成平面解谜画面，强调图形识别和操作逻辑而不是材质复杂度。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - photorealistic_material
  - decorative_noise
  - unreadable_symbols
  - copied_game_ui
pillars:
- 用几何形状、纯色面、清楚的交互层级和克制动画语言构成平面解谜画面，强调图形识别和操作逻辑而不是材质复杂度。
- 'medium: 平面插画; 简化三维或二维形体; 圆角、硬边和阴影层按语义使用'
- 'composition: 几何形状和留白建立清晰层级; 交互物有视觉优先级; 每一组元素保持可扫描的间距'
- 'palette: 使用三到六个主色及中性底色; 色相差优先于复杂渐变; 危险、目标和可移动物有稳定色码'
