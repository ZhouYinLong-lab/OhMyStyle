composition:
- 低机位让巷道和建筑压出纵深
- 屋檐、线缆和楼梯形成遮挡层
- 小动物、植物或远处灯光可作为尺度锚点
palette:
- 湿青、暗紫、锈红、暖黄和深褐形成夜间色组
- 彩色光只落在邻近墙面和水洼
- 黑暗保留细节和色相
medium:
- 写实三维环境
- 密集但可导航的空间布局
- 材质细节与灯光共同讲述使用痕迹
lighting:
- 灯管、窗口和招牌提供分散实用光
- 雨水反射有限且有来源
- 不使用全局发光边缘
surface:
- 剥落涂层、锈金属、玻璃、水泥、植物和水面有明显区别
- 近景细节更密
texture:
- 污渍、维修、植物和废弃物形成有规律的生活痕迹
- 避免随机垃圾堆满画面
invariants:
- 城市可居住又正在衰败
- 光源必须嵌入建筑逻辑
- 不得复制具体角色、招牌、机器人或场景
