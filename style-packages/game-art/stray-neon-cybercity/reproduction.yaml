medium: grounded 3D cybercity alley with localized colored practical lights
materials:
- 湿混凝土
- 剥落墙漆
- 锈金属
- 玻璃和水洼
- 盆栽与杂草
process:
- 先搭建巷道和垂直层次
- 再加入建筑使用痕迹
- 用少量彩色灯连接空间
- 最后检查反射与光源一致
technical_direction: 低机位、中等广角但避免畸变；不加入品牌、可读文字、过度光晕或纯赛博海报感。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
