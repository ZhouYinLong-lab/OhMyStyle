schema_version: 2.1.0
status: experimental
id: papercraft-diorama-game-art-direction
name: 纸艺立体书游戏美术
base_package: game-art/papercraft-diorama-game-art
scope:
  medium: 彩纸、卡纸、瓦楞纸与胶水的视觉暗示; 边缘略有纤维和切割痕; 层间距离真实可读
  representation: stylized
  description: 将场景拆成纸张、折痕、剪影和层叠立体结构，使用真实纸艺的边缘、阴影与轻微手作误差构成可游玩的微型世界。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - photorealistic_material_scan
  - seamless_cgi_surface
  - random_collage
  - copied_game_asset
pillars:
- 将场景拆成纸张、折痕、剪影和层叠立体结构，使用真实纸艺的边缘、阴影与轻微手作误差构成可游玩的微型世界。
- 'medium: 彩纸、卡纸、瓦楞纸与胶水的视觉暗示; 边缘略有纤维和切割痕; 层间距离真实可读'
- 'composition: 用前中后层纸片形成明确景深; 折叠、开窗、切口和悬挂结构可成为构图骨架; 画面像被放在桌上的小型剧场'
- 'palette: 纸白、天蓝、珊瑚、草绿和暖黄组成明快色组; 同一物体保持单一主色和少量阴影; 避免全局灰褐滤镜'
