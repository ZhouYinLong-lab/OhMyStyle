medium: paper-craft diorama with layered cutouts and miniature lighting
materials:
- 彩纸和卡纸
- 纸板折面
- 哑光胶水痕迹
- 小型木质或纸质支撑
- 柔和摄影棚光
process:
- 先分层并确定遮挡关系
- 再设计可见折痕和切口
- 最后加入纸面色块与投影
- 检查所有物体是否保持同一缩尺
technical_direction: 优先使用真实遮挡、接触阴影和层间间隙表达体积，不用金属或塑料高光。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
