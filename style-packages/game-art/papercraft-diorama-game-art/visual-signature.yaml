composition:
- 用前中后层纸片形成明确景深
- 折叠、开窗、切口和悬挂结构可成为构图骨架
- 画面像被放在桌上的小型剧场
palette:
- 纸白、天蓝、珊瑚、草绿和暖黄组成明快色组
- 同一物体保持单一主色和少量阴影
- 避免全局灰褐滤镜
medium:
- 彩纸、卡纸、瓦楞纸与胶水的视觉暗示
- 边缘略有纤维和切割痕
- 层间距离真实可读
lighting:
- 柔和顶侧光投下纸片阴影
- 折痕和层边用真实遮挡表现
- 不使用发光轮廓
surface:
- 纸张粗糙度和折痕是主要材质信号
- 胶带或钉合只在需要时出现
texture:
- 纤维、剪切边和轻微手工不齐
- 纹理不可变成噪点滤镜
invariants:
- 所有层都像同一套纸艺模型
- 空间不是平面贴图拼贴
- 不得复刻游戏角色或截图
