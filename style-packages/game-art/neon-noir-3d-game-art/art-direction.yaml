schema_version: 2.1.0
status: experimental
id: neon-noir-3d-game-art-direction
name: 霓虹黑色三维游戏美术
base_package: game-art/neon-noir-3d-game-art
scope:
  medium: 写实或半写实三维场景; PBR湿地、玻璃和金属; 少量图形化灯牌
  representation: stylized
  description: 以潮湿城市、低照度空间、局部霓虹色与真实三维材质构成黑色电影式游戏画面，强调色光来源和空间遮挡而不是全局发光。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - uniform_cyan_orange_filter
  - floating_neon
  - unreadable_darkness
  - copied_city_layout
pillars:
- 以潮湿城市、低照度空间、局部霓虹色与真实三维材质构成黑色电影式游戏画面，强调色光来源和空间遮挡而不是全局发光。
- 'medium: 写实或半写实三维场景; PBR湿地、玻璃和金属; 少量图形化灯牌'
- 'composition: 狭窄通道、窗框和雨幕形成层层遮挡; 主体通常由一处实际光源勾勒; 背景信息分级而非全部清晰'
- 'palette: 深蓝黑、青绿、紫红和钨丝橙形成局部对照; 中性物体仍保持中性; 颜色与光源位置绑定'
