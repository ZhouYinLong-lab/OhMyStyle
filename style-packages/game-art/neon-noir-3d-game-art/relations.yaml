related_packages: []
contrast_note: Compare medium, composition, lighting, palette, surface, and texture
  before crossing this package with another.
crossing:
  supported: true
  default_mode: adaptive
  note: Cross-style composition is handled by the repository-level workflow, not by
    this package identity.

family: neon-urban-game-art
near_duplicates:
  - game-art/cyberpunk-night-city
supersedes: []
conflicts: []
distinctives:
  - tight alley framing when requested
  - practical lights embedded in worn, low-rise architecture
  - layered eaves, cables, stairs, and restrained signs of repair or habitation
  - noir-scale solitary figure
  - localized blue-magenta-orange light
avoid_overlap:
  - do not require an alley, vending machine, dumpster, plants, or rain
