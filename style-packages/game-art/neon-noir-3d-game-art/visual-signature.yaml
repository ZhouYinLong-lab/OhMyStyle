composition:
- 狭窄通道、窗框和雨幕形成层层遮挡
- 主体通常由一处实际光源勾勒
- 背景信息分级而非全部清晰
palette:
- 深蓝黑、青绿、紫红和钨丝橙形成局部对照
- 中性物体仍保持中性
- 颜色与光源位置绑定
medium:
- 写实或半写实三维场景
- PBR湿地、玻璃和金属
- 少量图形化灯牌
lighting:
- 可见光源、反射和遮挡相互对应
- 雨后地面有有限反射
- 禁止无来源轮廓光
surface:
- 锈、混凝土、玻璃、塑料和水面区分明确
- 高光不吞没颜色
texture:
- 污渍、雨痕和城市维护痕迹有方向
- 颗粒克制
invariants:
- 霓虹是空间中的对象和光源
- 黑色电影的节奏大于赛博装饰
- 不复制来源游戏具体街景
