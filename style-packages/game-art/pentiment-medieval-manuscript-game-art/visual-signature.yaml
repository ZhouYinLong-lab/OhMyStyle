composition:
  - '把画面组织成页面、插图框或连续图像的层级；主体与边缘留白要像印刷页面而不是满屏概念图。'
  - '允许平面正视、侧视或简化透视，优先保证轮廓、图层和阅读顺序。'
palette:
  - '旧纸米白、炭黑和赭色构成基础，红、蓝、金或绿色作为有限的手工着色。'
  - '色彩略有不均匀和套印偏差，但不能变成泛黄滤镜或过度复古。'
lighting:
  quality: 以页面明暗和墨线层级表达体积，光线克制；避免写实电影光和强烈体积光。
  behavior:
    - 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。
    - 保留用户指定的主体轮廓、位置和空间关系。
surface:
  finish: 羊皮纸、木刻线、钢笔墨线、蛋彩或水彩薄层，边缘可有轻微印刷磨损。
  edges: 保持主体边缘可辨；允许媒介造成的轻微不齐，但不使用发光描边或综合色隔离带。
texture:
  density: 中等；线刻、纸纤维和色块边界可见，但不遮挡主体。
  placement: 集中在材料边界、暗部或印刷交界处，不覆盖主体识别信息。
invariants:
  - '更换主体后仍然能观察到本包的媒介、构图、色彩和表面签名。'
  - '不要求特定人物、物件、地点、建筑、植物、车辆或故事作为默认内容。'
  - '示例主体只用于验证视觉迁移，不得泄漏到默认 Prompt。'

