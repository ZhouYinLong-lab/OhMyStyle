    notes: Run at least two neutral-subject tasks from benchmarks/subject-independence.yaml.
  distinctive_signature:
    score: null
    notes: Record the package-specific visual decisions that remain observable.
  visual_overlap:
    score: null
    notes: Compare with related packages without treating shared historical context as duplication.
  cross_subject_stability:
    score: null
    notes: Do not mark complete without outputs for at least two different subjects.
