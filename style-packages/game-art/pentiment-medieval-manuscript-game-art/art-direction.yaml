pillars:
- 将中世纪细密画、木刻印刷、手写边注和有限帧动画转译为可游玩的页面式游戏美术。
- 'composition: 把画面组织成页面、插图框或连续图像的层级；主体与边缘留白要像印刷页面而不是满屏概念图。; 允许平面正视、侧视或简化透视，优先保证轮廓、图层和阅读顺序。'
- 'palette: 旧纸米白、炭黑和赭色构成基础，红、蓝、金或绿色作为有限的手工着色。; 色彩略有不均匀和套印偏差，但不能变成泛黄滤镜或过度复古。'
- 'lighting: quality: 以页面明暗和墨线层级表达体积，光线克制；避免写实电影光和强烈体积光。; behavior: 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。; behavior:
  保留用户指定的主体轮廓、位置和空间关系。'
