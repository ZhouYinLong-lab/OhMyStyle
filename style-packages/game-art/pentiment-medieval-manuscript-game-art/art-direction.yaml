scope:
  medium: 手稿插图、木刻印刷与平面游戏动画
  representation: stylized
  description: 将中世纪细密画、木刻印刷、手写边注和有限帧动画转译为可游玩的页面式游戏美术。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
