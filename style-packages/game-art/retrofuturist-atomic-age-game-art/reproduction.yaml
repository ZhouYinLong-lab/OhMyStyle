medium: mid-century inspired speculative technology illustration
materials:
- streamlined enclosures
- analog dials and switches
- enameled metal
- early robotics
process:
- 设定时间错位的技术假设
- 设计具有操作逻辑的设备
- 组合流线外壳和模拟控制
- 用少量状态灯提示功能
- 检查它是否超出普通怀旧布景
technical_direction: Show a coherent imagined future from a past design language;
  furniture alone is not retrofuturism.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
