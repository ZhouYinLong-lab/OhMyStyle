<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">原子时代复古未来游戏美术 palette card</title>
  <desc id="desc">重现过去对未来的想象，以流线造型、模拟控制、早期机器人和科技乐观建立时间错位感，而非只摆放老家具。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#E7DDC3" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#2D4962" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#D26A3D" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#899092" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#E7DDC3"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">cream enamel</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#2D4962"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">navy</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#D26A3D"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">signal orange</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#899092"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">brushed steel</text><rect x="1232" y="600" width="248" height="150" rx="18" fill="#2C3032"/><text x="1250" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">charcoal</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">原子时代复古未来游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
</svg>
