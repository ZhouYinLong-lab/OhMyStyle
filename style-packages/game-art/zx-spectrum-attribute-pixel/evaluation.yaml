invariants:
  - id: native_pixel_logic
    weight: 3
    test: The image reads as hard-edged pixel art at a small native resolution.
  - id: attribute_cells
    weight: 3
    test: Color changes visibly respect or deliberately negotiate 8x8 cell logic.
  - id: palette_constraint
    weight: 2
    test: The image uses a compact saturated palette rather than continuous color.
  - id: gameplay_legibility
    weight: 2
    test: Player, ground, danger, and navigable space remain readable.
rejections:
  - smooth_modern_pixel_art
  - unlimited_palette
  - anti_aliased_edges
  - copyrighted_character_or_logo
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
