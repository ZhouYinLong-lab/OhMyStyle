schema_version: 2.1.0
status: experimental
id: zx-spectrum-attribute-pixel-direction
name: 属性受限像素美术
base_package: game-art/zx-spectrum-attribute-pixel
scope:
  medium: 'Native resolution: 256x192; integer nearest-neighbor upscale only.'
  representation: stylized
  description: A constrained 8-bit game-art direction defined by chunky pixel silhouettes, hard two-color attribute
    blocks, a saturated 15-color hardware palette, deliberate color clash management, and readable gameplay-first
    composition.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - modern_smooth_pixel_art
  - unlimited_palette_pixel_art
  - anti_aliased_vector_art
pillars:
- A constrained 8-bit game-art direction defined by chunky pixel silhouettes, hard two-color attribute blocks,
  a saturated 15-color hardware palette, deliberate color clash management, and readable gameplay-first composition.
- 'medium: Native resolution: 256x192; integer nearest-neighbor upscale only.'
- 'composition: gameplay_first_legibility; strong_horizontal_ground_or_platform; clustered_cells_for_objects;
  deliberate_empty_border_or_ui_band'
- 'palette: 15 visible colors; at most maximum_two_colors_per_8x8_cell.; Brightness mode: normal_or_bright_mode'
