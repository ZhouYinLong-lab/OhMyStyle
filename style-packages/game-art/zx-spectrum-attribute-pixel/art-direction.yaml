joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-planet-sinclair-spec
  kind: primary
  base_asset_id: planet-sinclair-spec
- id: source-zx-spectrum-wiki
  kind: secondary
  base_asset_id: zx-spectrum-wiki
execution:
  route: text_only
  must:
  - block the background and player silhouette before small details
  - reserve high-contrast cells for interactive objects
  - align moving-object colors to nearby cell attributes when clarity matters
  - allow small controlled clashes when they add era-specific character
  - test the image at native resolution before upscaling
  - no_smooth_antialiasing
  - two_color_cell_logic_remains_visible
  - silhouette_is_readable_at_native_size
  avoid:
  - anti_aliasing
  - smooth_gradient
  - modern_particle_effect
  - photorealistic_texture
  - unlimited_color_sprinkle
  - modern_smooth_pixel_art
  - unlimited_palette_pixel_art
  - anti_aliased_vector_art
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
