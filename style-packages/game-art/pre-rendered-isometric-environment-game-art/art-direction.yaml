schema_version: 2.1.0
status: experimental
id: pre-rendered-isometric-environment-game-art-direction
name: 预渲染等距环境游戏美术
base_package: game-art/pre-rendered-isometric-environment-game-art
scope:
  medium: Present a high-detail environment as a fixed-view rendered image.; Allow painted, modeled, or hybrid
    source methods; do not claim a specific production pipeline from appearance alone.
  representation: stylized
  description: 以固定等距投影、精细预渲染背景和分层遮挡构建可探索场景；核心是静态画面的空间阅读，不限定油画或像素媒介。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - forced_oil_paint_texture
  - pixel_grid_as_primary_edge_language
  - copied_named_game_scene
  - arbitrary_camera_roll
pillars:
- 以固定等距投影、精细预渲染背景和分层遮挡构建可探索场景；核心是静态画面的空间阅读，不限定油画或像素媒介。
- 'medium: Present a high-detail environment as a fixed-view rendered image.; Allow painted, modeled, or hybrid
  source methods; do not claim a specific production pipeline from appearance alone.'
- 'composition: Use a stable isometric camera and consistent verticals across the scene.; Layer foreground
  occluders, traversable middle ground, and distant architecture.; Reserve uncluttered paths and focal landmarks
  so small figures remain legible.'
- 'palette: Group local colors by material and depth rather than global tint.; Use restrained warm highlights
  against cooler distance where needed.; Keep interaction cues distinct from decorative set dressing.'
