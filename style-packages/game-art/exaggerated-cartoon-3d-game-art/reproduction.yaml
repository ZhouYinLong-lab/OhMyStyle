medium: stylized 3D character illustration
materials:
- expressive anatomy
- simple readable materials
- graphic color blocks
process:
- 先确定角色性格和剪影
- 放大一到两个表达部位
- 压缩次要结构
- 设计支持表演的姿势
- 检查缩略轮廓与动作可读性
technical_direction: Exaggerate selectively; not every feature should be enlarged
  equally.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
