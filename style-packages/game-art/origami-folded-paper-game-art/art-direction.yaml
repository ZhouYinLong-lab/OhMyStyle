name: 折纸与折叠纸景游戏美术
base_package: game-art/origami-folded-paper-game-art
scope:
  medium: 纸片、折页和立体书层次明确; 结构边缘带有轻微纸厚度
  representation: stylized
  description: 以折线、折面、铰接和展开关系建立纸质形体；每个体积都应让人看出纸面如何折合，而非只叠加纸纹。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - generic paper texture
  - unfoldable geometry
  - copied book composition
pillars:
- 以折线、折面、铰接和展开关系建立纸质形体；每个体积都应让人看出纸面如何折合，而非只叠加纸纹。
- 'medium: 纸片、折页和立体书层次明确; 结构边缘带有轻微纸厚度'
- 'composition: 折痕形成体块和空间转折; 展开结构引导视线与路径'
- 'palette: 纸白、墨色和少量重点色; 颜色强调纸层，不模拟金属反光'
