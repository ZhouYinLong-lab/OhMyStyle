medium: adaptive game illustration for a Chinese martial-arts world
materials:
- landscape and architecture
- costume and weapon silhouettes
- controlled motion trails
process:
- 确定媒介与镜头
- 规划路径和交手空间
- 明确人物重心与兵器方向
- 加入生活线索但不固定身份
- 检查特效是否压住轮廓
technical_direction: Treat wuxia as genre and world logic, not as a synonym for ink
  painting or fixed historical costume.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
