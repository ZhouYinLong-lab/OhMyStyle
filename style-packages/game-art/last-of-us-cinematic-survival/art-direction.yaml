pillars:
- 以自然光、植物重新占据人工环境、克制的蓝灰空气和真实材质建立美丽与衰败并置的生存游戏空间。
- 'composition: 自然光驱动的可探索空间; 植物与人工结构形成时间层次'
- 'palette: 植物与人工结构形成时间层次; 蓝灰空气、湿润材质与局部暖色锚点'
- 'lighting: filtered natural light broken by foliage and openings, with local warm sources against cool ambient
  shade; Keep wet-surface reflections selective and let vegetation fragment the light.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 自然光驱动的可探索空间; 植物与人工结构形成时间层次.
    Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 自然光驱动的可探索空间; 植物与人工结构形成时间层次.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 自然光驱动的可探索空间;
    植物与人工结构形成时间层次.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 植物与人工结构形成时间层次; 蓝灰空气、湿润材质与局部暖色锚点. Adapt
    their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 植物与人工结构形成时间层次; 蓝灰空气、湿润材质与局部暖色锚点.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    植物与人工结构形成时间层次; 蓝灰空气、湿润材质与局部暖色锚点.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use filtered natural light broken by foliage and openings, with local warm sources against cool
    ambient shade. Keep wet-surface reflections selective and let vegetation fragment the light. Keep the light
    coherent with the requested subject and scene.
  observable: 'The light quality and its effect on shadows, materials, or tonal separation are visible: filtered
    natural light broken by foliage and openings, with local warm sources against cool ambient shade. Keep wet-surface
    reflections selective and let vegetation fragment the light.'
  reject_when: 'Reject global tint, bloom, or lighting that erases the stated tonal or material distinctions:
    filtered natural light broken by foliage and openings, with local warm sources against cool ambient shade.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: 写实材质和克制的电影化景别;
    edges: subject-dependent, without a copied layout. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish: 写实材质和克制的电影化景别;
    edges: subject-dependent, without a copied layout.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: finish:
    写实材质和克制的电影化景别; edges: subject-dependent, without a copied layout.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: controlled
    and medium-dependent; placement: only where the package visual language needs explanation. Preserve detail
    hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density: controlled
    and medium-dependent; placement: only where the package visual language needs explanation.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: density:
