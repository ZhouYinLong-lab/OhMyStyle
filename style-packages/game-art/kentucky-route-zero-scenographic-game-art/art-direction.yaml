execution:
  route: text_only
  must:
  - block the scene as a stage set with a clear foreground, middle plane, and backdrop
  - simplify objects into readable faceted masses and assign matte materials
  - add a slow, localized light cue and leave space for the user's subject or action
  - preserve scenographic staging and slow-camera readability
  - preserve simplified forms, matte surfaces, and quiet atmospheric color
  - preserve ambiguity without forcing a roadside, cave, or rural American setting
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
