pillars:
- 以舞台布景式三维空间、低多边形形体、慢电影镜头和克制灯光，构成可迁移的游戏环境视觉语言。
- 'composition: Compose environments like theatrical sets: strong stage planes, deliberate entrances, and readable
  silhouettes.; Use slow, patient framing with a small number of carefully placed forms and generous negative
  space.'
- 'palette: Combine muted asphalt, wood, and paper colors with one atmospheric accent such as sodium amber
  or nocturnal blue.; Keep colors matte and spatially motivated rather than glossy or hyper-saturated.'
- 'lighting: quality: low-key stage light with calm pools of illumination; behavior: Use visible light zones
  and quiet shadow planes; avoid cinematic spectacle and constant rim light.'
