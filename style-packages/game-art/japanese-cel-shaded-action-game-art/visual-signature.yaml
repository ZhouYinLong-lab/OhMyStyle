medium: 2D绘画语言与3D实时渲染结合的游戏美术
composition:
  - 使用有方向的动态透视、前景遮挡和清楚的视觉焦点。
  - 让角色、物体和环境形成可读的层级，不依赖界面元素说明空间。
palette:
  dominant:
    - 深蓝
    - 朱红
    - 暖灰
    - 金黄
    - 青绿
  behavior: 颜色服务于阵营、材质和光线，饱和色集中在焦点附近。
lighting:
  quality: 明确的主光与分段式明暗
  behavior:
    - 使用清晰但不僵硬的明暗带，转折处保留绘画设计。
    - 高光与轮廓线服从体积，不添加无来源的霓虹光环。
surface:
  finish: 细腻的赛璐珞色块、手绘轮廓修饰与有限纹理
  edges: 轮廓清楚，局部允许线宽变化和速度线式笔触
motion:
  behavior:
    - 通过姿态、透视、衣物方向和环境线索表达动作潜势。
    - 静态主体也必须有明确重心与可读的空间关系。
invariants:
  - 保留三维体积、透视和遮挡关系
  - 明暗分段服务于材质和体积
  - 手绘感不能破坏结构可读性
  - 不固定人物、物体、地点、游戏或故事
