canonical_name: 日式赛璐珞动作游戏美术
entity_type: game_art_style
domain: game_art
scope:
  subject_policy: open
  subject_note: 用户提供的主体与世界设定优先；动作游戏只是媒介语境，不是固定故事。
  subjects: []
  exclusions:
    - 固定角色、武器、机甲、学校或城市
    - 复制具体游戏的角色、场景、界面、标志或服装
    - 把硬边明暗误做成平面贴纸或纯二维插画
sources:
  - 'https://www.arcsystemworks.com/game/guilty-gear-strive/'
notes:
  - 以二维绘画的轮廓与明暗分区结合三维空间和动态镜头。
  - 角色、物体和环境共享同一套轮廓、材质和光照规则。
