execution:
  route: text_only
  must:
  - 先锁定用户主体、视角和空间，再建立可读的三维结构。
  - 为主要形体安排主光方向和明暗带，避免每个表面同样亮。
  - 最后加入克制的手绘边缘、速度感和色彩焦点。
  - 保留三维体积、透视和遮挡关系
  - 明暗分段服务于材质和体积
  - 手绘感不能破坏结构可读性
  - 不固定人物、物体、地点、游戏或故事
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 默认少年角色、长剑、机甲、校园、竞技场或日本城市
  - 界面、血条、徽标、游戏标题和具体作品元素
  - 纯平贴纸、塑料三维、过度写实摄影或全局霓虹
  - 固定角色、武器、机甲、学校或城市
  - 复制具体游戏的角色、场景、界面、标志或服装
  - 把硬边明暗误做成平面贴纸或纯二维插画
  - 不复现具体游戏、角色、界面、标志或固定叙事；代表图只展示渲染方法。
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
