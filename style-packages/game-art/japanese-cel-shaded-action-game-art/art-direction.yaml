scope:
  medium: 2D绘画语言与3D实时渲染结合的游戏美术
  representation: stylized
  description: 以硬边卡通明暗、手绘轮廓、二维动画节奏和三维体积结合，形成清晰而有动势的动作游戏画面。
  required_contexts: []
  incompatible_contexts: []
