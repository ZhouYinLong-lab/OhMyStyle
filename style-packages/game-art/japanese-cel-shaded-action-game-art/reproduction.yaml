medium: 混合二维绘画与三维赛璐珞渲染
materials:
  geometry: 具有真实遮挡和体积的三维场景
  shading: 两至三段主明暗色阶，辅以少量手绘修饰
  surface: 低噪点材质、局部纹理和清楚的轮廓边缘
process:
  - 先锁定用户主体、视角和空间，再建立可读的三维结构。
  - 为主要形体安排主光方向和明暗带，避免每个表面同样亮。
  - 最后加入克制的手绘边缘、速度感和色彩焦点。
technical_direction:
  contrast: 中高，对比集中在焦点和动作方向
  saturation: 中高，背景与非焦点区域适度收敛
  perspective: 动态但可信，保留垂直线与遮挡逻辑
  detail_density: 中等至高，细节服从层级和可读性
avoid:
  - 默认少年角色、长剑、机甲、校园、竞技场或日本城市
  - 界面、血条、徽标、游戏标题和具体作品元素
  - 纯平贴纸、塑料三维、过度写实摄影或全局霓虹
safety_note: 不复现具体游戏、角色、界面、标志或固定叙事；代表图只展示渲染方法。
