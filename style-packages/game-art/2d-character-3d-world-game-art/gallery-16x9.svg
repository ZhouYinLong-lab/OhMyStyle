<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">二维角色与三维场景混合游戏美术 palette card</title>
  <desc id="desc">让平面绘制的角色在有深度的三维空间活动，保留二维表演力度，同时获得立体关卡的距离、遮挡与探索。</desc>
