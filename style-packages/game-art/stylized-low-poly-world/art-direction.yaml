schema_version: 2.1.0
status: experimental
id: stylized-low-poly-world-direction
name: 风格化低多边形世界游戏美术
base_package: game-art/stylized-low-poly-world
scope:
  medium: 低多边形模型; 平滑或平面法线按对象选择; 哑光或半哑光材质
  representation: stylized
  description: 通过少量大平面、简化轮廓、克制材质和明确光照构成可探索的低多边形三维世界，强调造型选择而非模型细节。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - high_poly_realism
  - noisy_material_scan
  - impossible_geometry_as_default
  - copied_landmark
pillars:
- 通过少量大平面、简化轮廓、克制材质和明确光照构成可探索的低多边形三维世界，强调造型选择而非模型细节。
- 'medium: 低多边形模型; 平滑或平面法线按对象选择; 哑光或半哑光材质'
- 'composition: 大块几何体先建立层级; 道路、台阶和平台提供清晰路径; 孤立主体与大面积留白并存'
- 'palette: 柔和粉彩、蓝绿、珊瑚、沙色和深紫组成有限色组; 不同平面用色相或明度轻微区分; 焦点色有限'
