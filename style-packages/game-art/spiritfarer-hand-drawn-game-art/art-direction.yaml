execution:
  route: text_only
  must:
  - 先确定可游玩空间的轮廓、移动方向和主体可读性。
  - 再用大色面、柔和轮廓和前中后景层次建立环境。
  - 最后加入少量手绘纹理、互动亮点和局部动画暗示，避免细节淹没形状。
  - 手绘二维形状、柔和色彩和可读的游戏空间在更换主体后仍然成立。
  - 不要求船、海、灵魂、猫、角色或特定地图。
  - 叙事氛围可以温暖，但视觉包不替用户决定故事。
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - mandatory boat, ocean, cat, ghost, or named character
  - photorealistic rendering, generic anime key art, or hard cel-shading
  - copied game screenshot, logo, interface, or dialogue box
  - named game character
  - copied game screenshot or branded asset
  - Do not reproduce a specific game screenshot, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
