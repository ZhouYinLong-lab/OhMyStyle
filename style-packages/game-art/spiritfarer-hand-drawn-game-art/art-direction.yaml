id: spiritfarer-hand-drawn-game-art-direction
name: 灵魂旅人手绘游戏美术
base_package: game-art/spiritfarer-hand-drawn-game-art
scope:
  medium: hand-drawn 2D game illustration and animation-ready background art
  representation: stylized
  description: 以手绘线条、温暖的形状设计、柔和的色彩层次和具有呼吸感的二维动画构成亲和而完整的游戏视觉语言。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - named game character
  - copied game screenshot or branded asset
pillars:
- 以手绘线条、温暖的形状设计、柔和的色彩层次和具有呼吸感的二维动画构成亲和而完整的游戏视觉语言。
- 'composition: 以清晰的前中后景、可读的轮廓和适合横向移动的层次组织画面。; 让主体与环境共享形状语言，保留可供角色、道具或互动元素使用的空间。'
- 'palette: 使用暖米色、珊瑚、海蓝、苔绿和深紫等柔和但有层次的颜色。; 冷暖关系清晰，避免统一高饱和滤镜或只靠黑色描边分离主体。'
- 'lighting: quality: soft illustrated daylight or warm interior light; behavior: 光线通过大色面、柔和渐变和局部亮点表达，不追求写实摄影阴影。;
  behavior: 关键互动区域可以有温暖的小型光源，但不要自动加入灯笼或船舱。'
