schema_version: 2.1.0
status: experimental
id: silhouette-platformer-game-art-direction
name: 剪影光影平台游戏美术
base_package: game-art/silhouette-platformer-game-art
scope:
  medium: 二维剪影与柔焦背景; 细微颗粒和体积空气; 实体边缘保持清楚
  representation: stylized
  description: 以剪影角色、背光环境、层叠雾气和有限色彩构成平台游戏画面，利用轮廓和光线表达动作、危险与深度。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - pure_black_everywhere
  - hidden_playability
  - horror_gore
  - copied_character
pillars:
- 以剪影角色、背光环境、层叠雾气和有限色彩构成平台游戏画面，利用轮廓和光线表达动作、危险与深度。
- 'medium: 二维剪影与柔焦背景; 细微颗粒和体积空气; 实体边缘保持清楚'
- 'composition: 角色轮廓和可行走平台优先; 前景、中景和远景以明度分层; 障碍物边缘留出可读间隙'
- 'palette: 黑、灰、冷蓝和少量灰白构成低饱和色组; 焦点光可以是暖白或暗红但不铺满; 色彩差异服务深度'
