schema_version: 2.1.0
status: experimental
id: okami-sumi-e-game-art-direction
name: 大神水墨游戏美术
base_package: game-art/okami-sumi-e-game-art
scope:
  medium: ink-wash and flat-color 2D game environment art
  representation: stylized
  description: 以书写性墨线、水墨晕染、纸张肌理和有限平涂色面建立游戏场景风格。它强调可读的环境层次和笔触方向，不绑定具体角色、关卡、神话人物或游戏界面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以书写性墨线、水墨晕染、纸张肌理和有限平涂色面建立游戏场景风格。它强调可读的环境层次和笔触方向，不绑定具体角色、关卡、神话人物或游戏界面。
- 'composition: 清楚的前中后景层次; 大块留白与书写性路径; 轮廓线引导可读的探索空间'
- 'palette: 墨黑、灰青和纸白构成骨架; 朱红、靛蓝或草绿作为少量平涂色面; 颜色保持平面而不变成赛博霓虹'
- 'lighting: quality: graphic ink value separation with soft wash transitions and selective flat color accents;
  behavior: Keep the requested subject and location independent from the package.; behavior: Use light as a
  structural and material decision, not as a fixed scene.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 清楚的前中后景层次; 大块留白与书写性路径;
    轮廓线引导可读的探索空间. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 清楚的前中后景层次; 大块留白与书写性路径;
    轮廓线引导可读的探索空间.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 清楚的前中后景层次;
    大块留白与书写性路径; 轮廓线引导可读的探索空间.'
  evidence:
    source_ids:
    - source-okami-sumi-e-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 墨黑、灰青和纸白构成骨架; 朱红、靛蓝或草绿作为少量平涂色面; 颜色保持平面而不变成赛博霓虹.
    Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 墨黑、灰青和纸白构成骨架; 朱红、靛蓝或草绿作为少量平涂色面;
    颜色保持平面而不变成赛博霓虹.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    墨黑、灰青和纸白构成骨架; 朱红、靛蓝或草绿作为少量平涂色面; 颜色保持平面而不变成赛博霓虹.'
  evidence:
    source_ids:
    - source-okami-sumi-e-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: graphic ink value separation with soft
    wash transitions and selective flat color accents; behavior: Keep the requested subject and location independent
    from the package.; behavior: Use light as a structural and material decision, not as a fixed scene.. Keep
    light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: graphic ink value
    separation with soft wash transitions and selective flat color accents; behavior: Keep the requested subject
    and location independent from the package.; behavior: Use light as a structural and material decision,
    not as a fixed scene..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: graphic ink value
    separation with soft wash transitions and selective flat color accents; behavior: Keep the requested subject
    and location independent from the package.; behavior: Use light as a structural and material decision,
    not as a fixed scene..'
  evidence:
    source_ids:
    - source-okami-sumi-e-game-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: fibrous
