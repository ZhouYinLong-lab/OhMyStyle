sources:
- id: source-okami-sumi-e-game-art-primary-source
  kind: primary
  base_asset_id: okami-sumi-e-game-art-primary-source
execution:
  route: text_only
  must:
  - block the environment as readable planes
  - draw decisive ink contours
  - wash distant forms with diluted ink
  - apply a restrained flat-color accent layer and paper texture
  - brush movement remains visible
  - environmental depth is readable at game scale
  - limited colors support ink structure
  - no named character, level, interface, or copied asset is introduced
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, or protected
    game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
