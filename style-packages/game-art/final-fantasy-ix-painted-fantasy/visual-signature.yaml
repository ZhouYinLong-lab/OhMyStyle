composition:
- 绘本式城镇、夸张轮廓和温暖道具形成可亲近的幻想空间
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 暖棕、蓝紫、橙黄、草绿和奶油白形成童话色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 手绘背景、简化角色比例和旧绘本纹理
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 柔和室内灯与天空光共同照亮城镇层次
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 石墙、木梁、布料、陶器和金属具有手工质感
- 不同材质保留可辨识的表面行为。
texture:
- 边缘略带纸张与墨线感，细节集中于道具和建筑节点
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持原创绘本幻想，不复制角色、怪物、城镇或 UI
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
