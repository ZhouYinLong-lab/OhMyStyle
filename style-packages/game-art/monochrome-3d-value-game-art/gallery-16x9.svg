<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">黑白明暗构成三维游戏美术 palette card</title>
  <desc id="desc">主动撤去大部分颜色，以黑白灰阶、负形和投影组织三维空间；关键是重设计明暗关系，而非给彩色画面去饱和。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#161719" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#414448" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#92938F" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#E5E2D8" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#161719"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">near black</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#414448"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">charcoal</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#92938F"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">stone gray</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#E5E2D8"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">paper white</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">黑白明暗构成三维游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
</svg>
