medium: illustrative landscape painting adapted to exploratory game space
materials:
- blue-green mineral-pigment inspired hues
- ink contours
- layered landforms
- mist and negative space
process:
- 确定画卷视线和可走路径
- 勾线归纳山体和水岸
- 分层铺设青绿并控制远近饱和度
- 加入云雾和植被
- 检查路径明度差
technical_direction: Use mineral-pigment hues as visual reference only; do not imply
  physical pigments or recreate a named painting.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
