schema_version: 2.1.0
status: experimental
id: comic-halftone-game-art-direction
name: 漫画网点叙事游戏美术
base_package: game-art/comic-halftone-game-art
scope:
  medium: 粗细变化的墨线; 平涂色块; 网点或交叉线阴影; 略有套印误差的印刷边缘
  representation: stylized
  description: 把漫画分镜、墨线轮廓、网点阴影和有限色印刷逻辑转译为游戏画面，重点是强烈的面板节奏、表情剪影与叙事信息层级。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - readable_text
  - exact_comic_panel
  - photorealistic_skin
  - uncontrolled_halftone_noise
pillars:
- 把漫画分镜、墨线轮廓、网点阴影和有限色印刷逻辑转译为游戏画面，重点是强烈的面板节奏、表情剪影与叙事信息层级。
- 'medium: 粗细变化的墨线; 平涂色块; 网点或交叉线阴影; 略有套印误差的印刷边缘'
- 'composition: 使用近景、斜线和局部裁切强化戏剧信息; 关键动作有明确视线方向; 背景细节服从主体和面板节奏'
- 'palette: 黑、米白、暗青、砖红和金黄形成印刷色组; 局部高饱和色承担叙事焦点; 阴影可用单色网点而不是灰阶雾化'
