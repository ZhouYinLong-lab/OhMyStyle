composition:
- 使用近景、斜线和局部裁切强化戏剧信息
- 关键动作有明确视线方向
- 背景细节服从主体和面板节奏
palette:
- 黑、米白、暗青、砖红和金黄形成印刷色组
- 局部高饱和色承担叙事焦点
- 阴影可用单色网点而不是灰阶雾化
medium:
- 粗细变化的墨线
- 平涂色块
- 网点或交叉线阴影
- 略有套印误差的印刷边缘
lighting:
- 高反差侧光或舞台光
- 阴影图形化
- 高光保持平面形状
surface:
- 纸张与油墨的轻微触感
- 边缘允许小幅套印偏移
- 禁止廉价漫画滤镜
texture:
- 网点沿阴影和材质方向分布
- 颗粒必须有尺度和层级
invariants:
- 图形叙事优先于照片真实
- 不会生成可读品牌与对白
- 不复刻来源作品的镜头和角色
