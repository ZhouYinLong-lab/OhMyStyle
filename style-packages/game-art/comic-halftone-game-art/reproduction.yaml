medium: comic-inspired game illustration with ink, flat color, and controlled halftone
materials:
- 黑色墨线
- 平涂色版
- 半色调网点
- 纸面或印刷纹理
process:
- 先做剪影和镜头信息
- 再分配平涂色版
- 用网点建立阴影与材质
- 最后检查文字和标志是否被排除
technical_direction: 保持网点尺寸一致且可控；不要把每个区域都覆盖成高频颗粒。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
