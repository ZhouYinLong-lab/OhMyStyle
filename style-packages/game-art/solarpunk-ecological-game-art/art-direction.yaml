execution:
  route: text_only
  must:
  - 定义生态状态和修复目标
  - 安排能源与水系设施
  - 让植物按地形和阶段生长
  - 用自然光区分恢复层级
  - 保留可读的系统路径
  - 未来感来自生态系统关系
  - 设施与自然相互作用
  - 不预设无冲突乌托邦
  avoid:
  - green filter only
  - decorative plants without system logic
  - wasteland-only framing
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
