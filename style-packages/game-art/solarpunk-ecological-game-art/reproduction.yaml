medium: ecological game environment illustration
materials:
- renewable-energy infrastructure
- restored landscapes
- water and soil layers
- diverse vegetation
process:
- 定义生态状态和修复目标
- 安排能源与水系设施
- 让植物按地形和阶段生长
- 用自然光区分恢复层级
- 保留可读的系统路径
technical_direction: Show technology participating in ecological processes; green
  color alone does not define the style.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
