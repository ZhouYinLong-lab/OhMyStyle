composition:
- 像素尺度保持一致，主体与可走区域优先于装饰
- 用前中后景和局部遮挡承载环境信息
- 细节密度集中在焦点并为交互物保留负形
palette:
- 限制局部色组并为明暗层级分配稳定角色
- 以邻近色阶塑造体积而不抹平像素簇
- 灯光色只在明确光源附近改变局部色相
medium:
- 角色轮廓由可辨认像素簇构成
- 场景允许比角色更细的像素纹理但不得改变网格感
- 逐像素边缘保持硬朗
lighting:
- 用分区明暗和局部动态光扩展体积
- 发光效果不能覆盖轮廓像素
- 远景降低对比而不模糊成照片
surface:
- 材质靠像素簇方向和色块差异表达
- 避免统一颗粒叠层
- 水面金属织物保留不同纹理节奏
texture:
- 像素簇有可追踪的方向与尺度
- 细节在缩小后仍不形成噪声
- 动画帧间保持边缘稳定
invariants:
- 像素组织仍是主要边缘语言
- 角色和可交互区域在复杂背景上清晰可读
- 不复刻任何来源游戏画面
