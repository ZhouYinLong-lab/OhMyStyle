schema_version: 2.1.0
status: experimental
id: high-density-modern-pixel-game-art-direction
name: 高密度现代像素游戏美术
base_package: game-art/high-density-modern-pixel-game-art
scope:
  medium: 角色轮廓由可辨认像素簇构成; 场景允许比角色更细的像素纹理但不得改变网格感; 逐像素边缘保持硬朗
  representation: stylized
  description: 保留像素网格与清晰边缘，同时用密集环境叙事、精细动画和现代光照构成可近看探索的像素世界。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - unfiltered_photorealism
  - arbitrary_pixel_noise
  - copied_game_scene
  - smooth_vector_edges
pillars:
- 保留像素网格与清晰边缘，同时用密集环境叙事、精细动画和现代光照构成可近看探索的像素世界。
- 'medium: 角色轮廓由可辨认像素簇构成; 场景允许比角色更细的像素纹理但不得改变网格感; 逐像素边缘保持硬朗'
- 'composition: 像素尺度保持一致，主体与可走区域优先于装饰; 用前中后景和局部遮挡承载环境信息; 细节密度集中在焦点并为交互物保留负形'
- 'palette: 限制局部色组并为明暗层级分配稳定角色; 以邻近色阶塑造体积而不抹平像素簇; 灯光色只在明确光源附近改变局部色相'
