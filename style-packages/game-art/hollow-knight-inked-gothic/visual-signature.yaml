composition:
- 地下遗迹、细小主体和巨大空洞空间由流动墨线与剪影构成
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 深蓝黑、骨白、锈红、苔绿和冷紫形成压低但清晰的色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 手绘二维背景、墨线轮廓和少量柔和色层
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 局部冷光、微弱暖灯和深色剪影形成层次
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 石头、甲壳、植物、水和旧金属有不同手绘触感
- 不同材质保留可辨识的表面行为。
texture:
- 边缘线沿形体方向变化，雾层和远景降低密度
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持二维手绘、可导航空间和哥特静默，不复制角色、敌人或地图
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
