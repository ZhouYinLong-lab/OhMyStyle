medium: 手绘二维背景、墨线轮廓和少量柔和色层
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持二维手绘、可导航空间和哥特静默，不复制角色、敌人或地图
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
