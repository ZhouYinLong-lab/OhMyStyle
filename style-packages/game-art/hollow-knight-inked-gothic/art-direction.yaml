scope:
  medium: 手绘二维背景、墨线轮廓和少量柔和色层; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 手绘二维背景、墨线轮廓和少量柔和色层；地下遗迹、细小主体和巨大空洞空间由流动墨线与剪影构成；深蓝黑、骨白、锈红、苔绿和冷紫形成压低但清晰的色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
