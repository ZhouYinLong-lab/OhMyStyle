pillars:
- 手绘二维背景、墨线轮廓和少量柔和色层；地下遗迹、细小主体和巨大空洞空间由流动墨线与剪影构成；深蓝黑、骨白、锈红、苔绿和冷紫形成压低但清晰的色组。
- 'medium: 手绘二维背景、墨线轮廓和少量柔和色层; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 地下遗迹、细小主体和巨大空洞空间由流动墨线与剪影构成; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 深蓝黑、骨白、锈红、苔绿和冷紫形成压低但清晰的色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
