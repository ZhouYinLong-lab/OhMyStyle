medium: painterly graphic-novel game illustration
materials:
- 干湿笔刷
- 油彩式色层
- 粗纸或画布纹理
- 有限边缘软化
- 克制雨雾
process:
- 先用大笔触建立建筑与天空
- 再安排人物剪影和道路关系
- 补充局部材质笔触
- 最后削减解释性道具和文字
technical_direction: 让笔触具有方向和层次；避免把画面做成光滑概念艺术或普通电影调色。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
