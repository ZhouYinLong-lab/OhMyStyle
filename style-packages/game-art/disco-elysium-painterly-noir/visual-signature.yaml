composition:
- 建筑和人物可略有歪斜但仍保持空间关系
- 画面像绘本跨页而不是截图
- 主体常被大面积天空、墙面或路面包围
palette:
- 脏青绿、烟灰、奶油、锈红和尼古丁黄形成低到中饱和色组
- 暖色点缀带有叙事重量但不成为商业高光
- 阴影保留颜色
medium:
- 厚涂数字绘画或油彩式绘本
- 干笔、湿笔和擦除痕迹可见
- 边缘有意在清晰和融化之间变化
lighting:
- 阴天、雨天和室内窗光为主
- 光线软但有方向
- 不使用电影化镜头光晕
surface:
- 墙面、路面、衣物、皮肤和金属有不同笔触
- 绘画纹理不是统一噪声
texture:
- 纹理沿笔触和结构分布
- 背景可简化但不能全部模糊
invariants:
- 厚涂表面和构图距离共同制造气质
- 不靠可读文字讲故事
- 不得复制游戏中的人物、对白和地点
