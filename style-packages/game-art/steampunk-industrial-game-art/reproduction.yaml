medium: industrial illustration with visible steam-power systems
materials:
- iron and brass mechanisms
- boilers
- pipes and valves
- coal soot and heat glow
process:
- 建立动力核心与空间尺度
- 连接可追踪的管线和阀门
- 区分金属、玻璃和织物
- 用热光解释能源流
- 检查功能和路径关系
technical_direction: Mechanical details should explain power transfer or function;
  avoid ornamental gears without structural purpose.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
