medium: precise 3D brutalist interior with restrained surreal geometry
materials:
- 浇筑混凝土
- 深色木材
- 金属抽屉
- 红色地毯
- 荧光灯具
process:
- 先建立建筑轴线和尺度
- 再加入单一异常连接
- 用红色标记固定视觉锚点
- 最后检查空间仍可解释
technical_direction: 使用水平相机和清晰透视；不使用随机扭曲、无来源光带或装饰性恐怖元素。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
