schema_version: 2.1.0
status: experimental
id: control-paranormal-architecture-direction
name: 超现实机关建筑游戏美术
base_package: game-art/control-paranormal-architecture
scope:
  medium: 写实三维建筑; 图形化构图和克制超现实; 材质细节服从空间几何
  representation: stylized
  description: 以粗野主义建筑、机构化红色标记、荧光灯、深长走廊和单一几何异常组织可解释的超现实空间。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - chaotic_distortion
  - horror_gore
  - copied_logo
  - fantasy_castle
pillars:
- 以粗野主义建筑、机构化红色标记、荧光灯、深长走廊和单一几何异常组织可解释的超现实空间。
- 'medium: 写实三维建筑; 图形化构图和克制超现实; 材质细节服从空间几何'
- 'composition: 强透视走廊、门框和天井建立秩序; 异常只改变一个空间关系; 小人物或普通物件用于测量尺度'
- 'palette: 混凝土灰、暗木棕、深黑、机构红和荧光白组成严格色组; 红色是局部标记而非全局滤镜; 异常可有微弱冷色但不发光泛滥'
