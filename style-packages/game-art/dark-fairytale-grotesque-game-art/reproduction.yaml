medium: adaptive storybook and game environment illustration
materials:
- toy-like forms
- distorted scale
- selective shadow
- mixed materials
process:
- 建立熟悉场景轮廓
- 加入一到两个比例或材质异常
- 安排安全和危险视觉层
- 突出可行动路径
- 检查怪诞细节不遮挡操作信息
technical_direction: Dark fairy tale is a narrative visual tension, not a synonym
  for clay or darkness alone.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
