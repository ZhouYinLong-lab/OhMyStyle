pillars:
- 以低多边形几何、低分辨率纹理、固定机位、近距离雾化和预计算阴影制造早期三维游戏的紧张空间。
- 'composition: Use a deliberate fixed-camera or near-fixed viewpoint with readable planes and a clear playable-space
  hierarchy.; Prefer strong silhouettes, large geometric masses, and a controlled amount of empty space over
  dense micro-detail.; Let doorways, corners, stairs, windows, or other planes guide the eye only when supplied
  by the user''s subject.'
- 'palette: Keep a limited, slightly dirty palette: cool blue-green shadows, neutral stone or concrete mids,
  and small warm practical-light accents.; Separate depth with value grouping and material color blocks rather
  than a global cinematic grade.'
- 'lighting: quality: hard-edged real-time approximation softened by distance and atmosphere; behavior: Use
  sparse directional or point-like sources with readable pools of light and restrained falloff.; behavior:
  Keep shadow shapes simple and slightly stepped; use localized haze to reduce distant contrast.'
