scope:
  medium: early real-time 3D game rendering with low-poly geometry and low-resolution texture logic
  representation: stylized
  description: 以低多边形几何、低分辨率纹理、固定机位、近距离雾化和预计算阴影制造早期三维游戏的紧张空间。
