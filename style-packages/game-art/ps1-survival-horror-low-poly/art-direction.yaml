execution:
  route: text_only
  must:
  - Block the user-supplied subject into a small number of readable polygonal masses.
  - Choose a deliberate camera position and preserve strong planar perspective.
  - Assign a restrained material palette and low-resolution texture cues.
  - Add sparse practical or directional light, simple shadows, and localized distance haze.
  - Finish with restrained texture breakup and edge stepping; do not add a default horror location or prop.
  - early real-time 3D geometry remains visible in silhouettes and planes
  - camera and lighting stay intentional, restrained, and spatially legible
  - depth is carried by value groups, haze, and simplified material response
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory corridor, hotel, mansion, monster, blood, or horror plot
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
