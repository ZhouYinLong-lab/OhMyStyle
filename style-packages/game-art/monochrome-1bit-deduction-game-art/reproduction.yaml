reproduction:
  priority_order:
    - 用户主体与游戏用途
    - 空间轮廓与透视
    - 黑白分区和抖动密度
    - 线索安排与像素可读性
  subject_rules:
    - 用户主体必须保持可辨；媒介规则不能替换成船只或固定案件。
    - 代表图中的建筑走廊只是测试主体，不进入默认提示词。
  transfer_rules:
    - 用一位逻辑压缩颜色，不用灰度滤镜代替。
    - 让抖动与光照、材质和空间深度相关。
    - 保留足够留白和线索，使画面可探索、可阅读。
  forbidden_shortcuts:
    - 彩色像素画、连续灰度和光滑三维渲染
    - 默认船只、海洋或谋杀故事
