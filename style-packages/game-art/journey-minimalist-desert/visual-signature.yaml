composition:
- 小型旅者、长路径和巨大沙丘形成极简尺度对照
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 沙金、赭红、雾蓝、象牙和深褐形成温暖空气感色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 简化三维地形、布料剪影与广阔负空间
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 低角度日光、长影和薄雾建立远近层次
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 沙粒、布料、石块和金属遗迹以简化材质表达
- 不同材质保留可辨识的表面行为。
texture:
- 远景平滑，近景保留方向性沙纹和路径
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持极简、安静和空间探索，不复制旅者、符号或关卡
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
