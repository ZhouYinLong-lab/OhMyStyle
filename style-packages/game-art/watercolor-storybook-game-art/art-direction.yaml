  observable: 'The requested image retains the stated medium distinction or production constraint: 透明水彩层叠;
    纸张吸水边缘; 细而不僵硬的手绘轮廓; 数字拼合但保持绘本感觉.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    透明水彩层叠; 纸张吸水边缘; 细而不僵硬的手绘轮廓; 数字拼合但保持绘本感觉.'
