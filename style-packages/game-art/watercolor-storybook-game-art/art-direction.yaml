schema_version: 2.1.0
status: experimental
id: watercolor-storybook-game-art-direction
name: 水彩绘本冒险游戏美术
base_package: game-art/watercolor-storybook-game-art
scope:
  medium: 透明水彩层叠; 纸张吸水边缘; 细而不僵硬的手绘轮廓; 数字拼合但保持绘本感觉
  representation: stylized
  description: 把可游玩的二维空间处理成带纸张、透明水彩和童话留白的绘本画面，依靠柔和层叠与手绘轮廓保持空间可读性。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - plastic_3d_render
  - neon_cyberpunk
  - hard_vector_flatness
  - copied_game_scene
pillars:
- 把可游玩的二维空间处理成带纸张、透明水彩和童话留白的绘本画面，依靠柔和层叠与手绘轮廓保持空间可读性。
- 'medium: 透明水彩层叠; 纸张吸水边缘; 细而不僵硬的手绘轮廓; 数字拼合但保持绘本感觉'
- 'composition: 以纸面留白、飘浮层次和柔和地平线组织画面; 主体周围保留呼吸空间; 远景用透明叠色而非锐利细节'
- 'palette: 天蓝、紫灰、淡金、珊瑚和苔绿组成低到中饱和水彩色组; 颜色允许相邻渗化但不变成脏灰; 焦点用少量清晰暖色'
