- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 天蓝、紫灰、淡金、珊瑚和苔绿组成低到中饱和水彩色组; 颜色允许相邻渗化但不变成脏灰;
    焦点用少量清晰暖色. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 天蓝、紫灰、淡金、珊瑚和苔绿组成低到中饱和水彩色组;
