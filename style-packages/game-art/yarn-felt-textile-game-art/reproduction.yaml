medium: crafted textile illustration or textured 3D render
materials:
- yarn fibers
- knitted loops
- felted surfaces
- visible seams
process:
- 确定轮廓与受力关系
- 建立纱线或布片体块
- 选择针织、毡化或缝合细节
- 用柔光展示厚度
- 检查交互轮廓
technical_direction: Distinguish yarn, felt, and woven cloth by structure; avoid generic
  soft-focus texture.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
