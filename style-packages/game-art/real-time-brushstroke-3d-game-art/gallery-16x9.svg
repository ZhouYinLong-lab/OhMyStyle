<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">实时笔触三维游戏美术 palette card</title>
  <desc id="desc">让可见笔触沿三维形体组织，并随受光方向显出起伏；与静态厚涂贴图不同，笔触边缘和明暗关系需在场景光照下保持一致。</desc>
