  <circle cx="1030" cy="360" r="190" fill="#4E7162" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#B87454" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#D7B36D" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#343A3D"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">charcoal</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#4E7162"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">pine</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#B87454"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">clay</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#D7B36D"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">golden_light</text><rect x="1232" y="600" width="248" height="150" rx="18" fill="#A6B5A4"/><text x="1250" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">mist</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">实时笔触三维游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
