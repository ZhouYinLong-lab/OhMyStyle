schema_version: 2.1.0
status: experimental
id: real-time-brushstroke-3d-game-art-direction
name: 实时笔触三维游戏美术
base_package: game-art/real-time-brushstroke-3d-game-art
scope:
  medium: Render 3D forms with visible brush-like surface marks in real time.; The paint appearance is a rendering
    treatment, not evidence of a physical painting source.
  representation: stylized
  description: 让可见笔触沿三维形体组织，并随受光方向显出起伏；与静态厚涂贴图不同，笔触边缘和明暗关系需在场景光照下保持一致。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - static_canvas_painting_only
  - generic_oil_paint_filter
  - photorealistic_microtexture
  - copied_concept_art
pillars:
- 让可见笔触沿三维形体组织，并随受光方向显出起伏；与静态厚涂贴图不同，笔触边缘和明暗关系需在场景光照下保持一致。
- 'medium: Render 3D forms with visible brush-like surface marks in real time.; The paint appearance is a rendering
  treatment, not evidence of a physical painting source.'
- 'composition: Build the scene with clear large forms and a controlled focal hierarchy.; Let brush direction
  support the shape and camera-readable silhouette.; Avoid stroke density that obscures traversal or interaction
  cues.'
- 'palette: Use a coherent scene palette with local color variation inside strokes.; Keep value separation
  stronger at focal subjects and playable edges.; Avoid a global color grade as a substitute for painted rendering.'
