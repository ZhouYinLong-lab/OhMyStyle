execution:
  route: text_only
  must:
  - Block in the scene and lighting before adding stroke detail.
  - Align stroke direction with surface curvature and material.
  - Tune stroke scale against camera distance and motion.
  - Review moving lights and camera angles for flicker, flatness, or lost silhouettes.
  - Brush marks remain visible and tied to 3D form under lighting.
  - Preserve the requested subject, camera, and scene details.
  - Do not reproduce named concept art or source layouts.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - static_canvas_painting_only
  - generic_oil_paint_filter
  - photorealistic_microtexture
  - copied_concept_art
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
