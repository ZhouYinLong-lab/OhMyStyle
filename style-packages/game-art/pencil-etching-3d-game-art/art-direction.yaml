name: 铅笔排线与蚀刻感三维游戏美术
base_package: game-art/pencil-etching-3d-game-art
scope:
  medium: 三维形体叠加手绘铅笔与排线; 边缘与体积由线条共同确定
  representation: stylized
  description: 在三维场景表面以铅笔、炭笔或刻线般的方向性线条建立灰度、形体和纸面触感，而非依赖光滑渐变。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - smooth gradient-only shading
  - random crosshatching
  - unreadable fine lines
pillars:
- 在三维场景表面以铅笔、炭笔或刻线般的方向性线条建立灰度、形体和纸面触感，而非依赖光滑渐变。
- 'medium: 三维形体叠加手绘铅笔与排线; 边缘与体积由线条共同确定'
- 'composition: 三维体块仍有明确透视和遮挡; 线条方向解释表面朝向'
- 'palette: 以灰阶为主并可保留少量手工色; 明度由线密度与少量色块建立'
