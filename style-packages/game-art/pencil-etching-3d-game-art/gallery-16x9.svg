<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">铅笔排线与蚀刻感三维游戏美术 palette card</title>
  <desc id="desc">在三维场景表面以铅笔、炭笔或刻线般的方向性线条建立灰度、形体和纸面触感，而非依赖光滑渐变。</desc>
  <rect width="1600" height="900" fill="#10151D"/>
  <circle cx="1280" cy="240" r="250" fill="#D7D3C8" opacity="0.85"/>
  <circle cx="1030" cy="360" r="190" fill="#323436" opacity="0.85"/>
  <path d="M0 520 C280 360 510 690 800 500 S1260 330 1600 520 V900 H0 Z" fill="#777A78" opacity="0.9"/>
  <path d="M0 640 C280 520 530 760 880 610 S1260 520 1600 680 V900 H0 Z" fill="#EEE8D8" opacity="0.9"/>
  <rect x="80" y="600" width="248" height="150" rx="18" fill="#D7D3C8"/><text x="98" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">paper gray</text><rect x="368" y="600" width="248" height="150" rx="18" fill="#323436"/><text x="386" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">graphite</text><rect x="656" y="600" width="248" height="150" rx="18" fill="#777A78"/><text x="674" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">mid graphite</text><rect x="944" y="600" width="248" height="150" rx="18" fill="#EEE8D8"/><text x="962" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">warm chalk</text><rect x="1232" y="600" width="248" height="150" rx="18" fill="#9D6555"/><text x="1250" y="730" font-family="sans-serif" font-size="22" fill="#ffffff">rust accent</text>
  <text x="80" y="120" font-family="sans-serif" font-size="52" font-weight="700" fill="#F5F1E8">铅笔排线与蚀刻感三维游戏美术</text>
  <text x="80" y="175" font-family="sans-serif" font-size="24" fill="#C8D0D8">版权安全的抽象色板卡 · 可替换为已获授权的代表图</text>
