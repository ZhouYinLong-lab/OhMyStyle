execution:
  route: text_only
  must:
  - Establish the user-requested subject and a readable traversable spatial hierarchy.
  - Use varied ink pressure to separate focal contours from distant silhouettes.
  - Layer diluted washes, leaving paper gaps for light and atmosphere.
  - Add limited accent colors only where the subject or navigation hierarchy needs them.
  - painted ink-and-wash game-art medium, not pixel art
  - playable spatial readability survives subject changes
  - no fixed narrative object or named game world
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - pixel grid, plastic 3D, glossy anime render, or fixed game screenshot
  - mandatory bridge, shrine, traveler, or named character
  - copied composition
  - named character or branded asset
  - mandatory traveler, bridge, shrine, village, or named game world
  - The package transfers a visual language and game-space logic, not content from a source game.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
