schema_version: 2.1.0
status: experimental
id: ink-wash-adventure-direction
name: 水墨冒险游戏美术
base_package: game-art/ink-wash-adventure
scope:
  medium: hand-painted ink-and-wash game environment simulation
  representation: stylized
  description: 以墨线、洗染、留白、有限朱色与清晰前中后景组织可探索画面；本包控制游戏媒介与水墨表现，不固定旅人、桥、神社或任何具体故事。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory traveler, bridge, shrine, village, or named game world
pillars:
- 以墨线、洗染、留白、有限朱色与清晰前中后景组织可探索画面；本包控制游戏媒介与水墨表现，不固定旅人、桥、神社或任何具体故事。
- 'composition: layered game-environment depth with a readable route or focal opening; asymmetrical masses
  balanced by paper space'
- 'palette: warm paper, charcoal, diluted earth, indigo, and selective vermilion; color accents guide attention
  rather than recolor the whole scene'
- 'lighting: quality: atmospheric wash with ink-weight contrast; behavior: foreground is legible; distant forms
  dissolve into paper and wash'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: layered game-environment
    depth with a readable route or focal opening; asymmetrical masses balanced by paper space. Preserve the
    user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: layered game-environment
    depth with a readable route or focal opening; asymmetrical masses balanced by paper space.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: layered
    game-environment depth with a readable route or focal opening; asymmetrical masses balanced by paper space.'
  evidence:
    source_ids:
    - source-ink-wash-adventure-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: warm paper, charcoal, diluted earth,
    indigo, and selective vermilion; color accents guide attention rather than recolor the whole scene. Adapt
    their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: warm paper, charcoal, diluted
    earth, indigo, and selective vermilion; color accents guide attention rather than recolor the whole scene.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
