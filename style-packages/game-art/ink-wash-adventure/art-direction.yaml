  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: atmospheric wash with
    ink-weight contrast; behavior: foreground is legible; distant forms dissolve into paper and wash.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: atmospheric wash
    with ink-weight contrast; behavior: foreground is legible; distant forms dissolve into paper and wash.'
