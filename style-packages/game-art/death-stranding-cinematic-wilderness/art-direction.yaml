pillars:
- 以极大负空间、风雨荒原、细小人物尺度和克制的电影化自然光构成孤独但不压抑的环境叙事。
- 'medium: 电影化三维环境; 自然地形细节与克制后期; 真实材质和大气透视优先'
- 'composition: 宽阔地形和低地平线制造巨大尺度; 人物、道路或设施作为极小尺度锚点; 留白是环境结构而非空洞'
- 'palette: 苔绿、石板蓝、湿土棕、锈橙和云白组成低饱和色组; 暖色只在人物、设施或少量地表出现; 不把所有颜色压成灰'
