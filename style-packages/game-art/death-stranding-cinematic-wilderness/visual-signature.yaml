composition:
- 宽阔地形和低地平线制造巨大尺度
- 人物、道路或设施作为极小尺度锚点
- 留白是环境结构而非空洞
palette:
- 苔绿、石板蓝、湿土棕、锈橙和云白组成低饱和色组
- 暖色只在人物、设施或少量地表出现
- 不把所有颜色压成灰
medium:
- 电影化三维环境
- 自然地形细节与克制后期
- 真实材质和大气透视优先
lighting:
- 阴天、雨后或破云光作为主光
- 光线柔和且方向可追踪
- 远景对比度自然降低
surface:
- 湿草、泥、岩石、水和旧工业设施各有重量
- 反射有限并服从粗糙度
texture:
- 地形纹理沿风向和侵蚀方向分布
- 不使用粗重胶片噪点制造电影感
invariants:
- 自然尺度先于人物戏剧
- 天气改变空间但不吞没主体
- 不得复制具体装备、角色、地标或构图
