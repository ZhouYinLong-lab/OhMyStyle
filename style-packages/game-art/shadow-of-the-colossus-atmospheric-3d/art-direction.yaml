- 'composition: 大面积空旷空间与远距离焦点; 小主体对照巨大地貌; 低密度可探索路径和清楚的空间导航'
- 'palette: 沙灰、苔绿、冷蓝灰和旧金色构成克制环境色; 局部暖光作为尺度锚点; 避免赛博霓虹和全局电影滤镜'
