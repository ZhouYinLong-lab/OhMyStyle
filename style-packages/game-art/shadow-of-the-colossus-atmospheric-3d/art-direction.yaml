schema_version: 2.1.0
status: experimental
id: shadow-of-the-colossus-atmospheric-3d-direction
name: 巨像之影荒原三维游戏美术
base_package: game-art/shadow-of-the-colossus-atmospheric-3d
scope:
  medium: atmospheric 3D adventure game environment art
  representation: stylized
  description: 以巨大的空旷尺度、低密度三维地貌、远距离主体、克制的土灰色调和强烈空气透视组织游戏环境，不绑定巨像、遗迹或具体关卡。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以巨大的空旷尺度、低密度三维地貌、远距离主体、克制的土灰色调和强烈空气透视组织游戏环境，不绑定巨像、遗迹或具体关卡。
- 'composition: 大面积空旷空间与远距离焦点; 小主体对照巨大地貌; 低密度可探索路径和清楚的空间导航'
- 'palette: 沙灰、苔绿、冷蓝灰和旧金色构成克制环境色; 局部暖光作为尺度锚点; 避免赛博霓虹和全局电影滤镜'
- 'lighting: wide natural light, atmospheric haze, and long cast shadows across open terrain; Let haze reduce
  contrast with distance and keep shadow shapes broad and subordinate to navigation.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 大面积空旷空间与远距离焦点;
    小主体对照巨大地貌; 低密度可探索路径和清楚的空间导航. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 大面积空旷空间与远距离焦点; 小主体对照巨大地貌;
    低密度可探索路径和清楚的空间导航.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 大面积空旷空间与远距离焦点;
    小主体对照巨大地貌; 低密度可探索路径和清楚的空间导航.'
  evidence:
    source_ids:
    - source-shadow-of-the-colossus-atmospheric-3d-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 沙灰、苔绿、冷蓝灰和旧金色构成克制环境色; 局部暖光作为尺度锚点; 避免赛博霓虹和全局电影滤镜.
    Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 沙灰、苔绿、冷蓝灰和旧金色构成克制环境色; 局部暖光作为尺度锚点;
    避免赛博霓虹和全局电影滤镜.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    沙灰、苔绿、冷蓝灰和旧金色构成克制环境色; 局部暖光作为尺度锚点; 避免赛博霓虹和全局电影滤镜.'
  evidence:
    source_ids:
    - source-shadow-of-the-colossus-atmospheric-3d-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use wide natural light, atmospheric haze, and long cast shadows across open terrain. Let haze reduce
    contrast with distance and keep shadow shapes broad and subordinate to navigation. Keep the light coherent
    with the requested subject and scene.
  observable: 'The light quality and its effect on shadows, materials, or tonal separation are visible: wide natural
    light, atmospheric haze, and long cast shadows across open terrain. Let haze reduce contrast with distance
    and keep shadow shapes broad and subordinate to navigation.'
  reject_when: 'Reject global tint, bloom, or lighting that erases the stated tonal or material distinctions:
    wide natural light, atmospheric haze, and long cast shadows across open terrain.'
  evidence:
    source_ids:
    - source-shadow-of-the-colossus-atmospheric-3d-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: weathered
    rock, dry grass, dust, water, and restrained 3D material detail; edges: deliberate and subject-dependent,
    without a copied layout. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish: weathered
    rock, dry grass, dust, water, and restrained 3D material detail; edges: deliberate and subject-dependent,
    without a copied layout.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: finish:
    weathered rock, dry grass, dust, water, and restrained 3D material detail; edges: deliberate and subject-dependent,
    without a copied layout.'
  evidence:
    source_ids:
    - source-shadow-of-the-colossus-atmospheric-3d-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: low-to-medium
    density in distant terrain, higher only along navigable foreground surfaces; placement: concentrated where
    the medium or material needs explanation. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density: low-to-medium
    density in distant terrain, higher only along navigable foreground surfaces; placement: concentrated where
    the medium or material needs explanation.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: density:
