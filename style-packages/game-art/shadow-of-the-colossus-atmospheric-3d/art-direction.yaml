execution:
  route: text_only
  must:
  - block broad terrain and route readability
  - set a small subject against the environment
  - add haze and distant value compression
  - finish with selective material detail and restrained natural light
  - scale is carried by spatial contrast
  - the environment remains playable and readable
  - distance and haze separate planes
  - no named creature, map, shrine, or copied asset is introduced
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or
    protected game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
