composition:
- 以清楚的外轮廓和疏密差组织读图顺序
- 密集区域之间保留可供视线停留的空隙
- 交互对象用轮廓或留白从线网中分离
palette:
- 黑白或纸色为主并限制强调色数量
- 线色与底色保持稳定对比
- 色块只用于分区和交互提示
medium:
- 线条具有手绘粗细和微小偏差
- 轮廓允许局部断开但形体必须闭合可读
- 排线沿结构而非随机填充
lighting:
- 明暗以线密度和少量实黑表达
- 不模拟写实渐变
- 重要轮廓避免与暗部合并
surface:
- 纸面和扫描感轻微可见
- 不规则线端保留人工痕迹
- 表面纹理不能遮住线条交叉关系
texture:
- 排线方向呼应结构和材质
- 细节密度随重要度分配
- 缩小显示时合并为稳定明暗块
invariants:
- 线条始终是主要造型媒介
- 主题变化后仍保留手绘边缘
- 不复制来源插画或其物件布局
