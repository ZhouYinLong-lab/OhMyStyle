- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 黑白或纸色为主并限制强调色数量; 线色与底色保持稳定对比; 色块只用于分区和交互提示.
    Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 黑白或纸色为主并限制强调色数量; 线色与底色保持稳定对比;
