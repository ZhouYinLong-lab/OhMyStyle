schema_version: 2.1.0
status: experimental
id: hand-drawn-linework-game-art-direction
name: 手绘线描游戏美术
base_package: game-art/hand-drawn-linework-game-art
scope:
  medium: 线条具有手绘粗细和微小偏差; 轮廓允许局部断开但形体必须闭合可读; 排线沿结构而非随机填充
  representation: stylized
  description: 以具有手绘粗细和轻微不规则性的线条构建人物、物件与空间，允许黑白或少量填色，靠线密度和轮廓保持层级。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - perfect_vector_uniformity
  - photographic_shading
  - copied_illustration
  - illegible_dense_hatching
pillars:
- 以具有手绘粗细和轻微不规则性的线条构建人物、物件与空间，允许黑白或少量填色，靠线密度和轮廓保持层级。
- 'medium: 线条具有手绘粗细和微小偏差; 轮廓允许局部断开但形体必须闭合可读; 排线沿结构而非随机填充'
- 'composition: 以清楚的外轮廓和疏密差组织读图顺序; 密集区域之间保留可供视线停留的空隙; 交互对象用轮廓或留白从线网中分离'
- 'palette: 黑白或纸色为主并限制强调色数量; 线色与底色保持稳定对比; 色块只用于分区和交互提示'
