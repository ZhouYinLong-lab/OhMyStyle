    密集区域之间保留可供视线停留的空隙; 交互对象用轮廓或留白从线网中分离.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 以清楚的外轮廓和疏密差组织读图顺序;
    密集区域之间保留可供视线停留的空隙; 交互对象用轮廓或留白从线网中分离.'
