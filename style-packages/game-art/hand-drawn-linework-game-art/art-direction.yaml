  observable: 'Light and shadow visibly support the stated forms or atmosphere: 明暗以线密度和少量实黑表达; 不模拟写实渐变; 重要轮廓避免与暗部合并.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: 明暗以线密度和少量实黑表达; 不模拟写实渐变;
    重要轮廓避免与暗部合并.'
