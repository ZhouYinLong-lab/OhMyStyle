- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: 明暗以线密度和少量实黑表达; 不模拟写实渐变; 重要轮廓避免与暗部合并. Keep light
