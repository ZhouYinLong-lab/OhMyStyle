    轮廓允许局部断开但形体必须闭合可读; 排线沿结构而非随机填充.'
  observable: 'The requested image retains the stated medium distinction or production constraint: 线条具有手绘粗细和微小偏差;
    轮廓允许局部断开但形体必须闭合可读; 排线沿结构而非随机填充.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    线条具有手绘粗细和微小偏差; 轮廓允许局部断开但形体必须闭合可读; 排线沿结构而非随机填充.'
