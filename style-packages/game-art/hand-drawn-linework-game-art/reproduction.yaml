medium: hand-drawn ink or pencil illustration with layered linework for an interactive
  scene
materials:
- 钢笔或铅笔式线条
- 纸白或浅色底
- 少量平涂色
- 结构性排线
- 低强度纸纹
process:
- 先用大轮廓建立空间与焦点
- 再用线宽区分前后层级
- 以方向性排线说明形体
- 最后检查缩小后的可读性
technical_direction: 密线场景用局部放大或分区引导；交互提示不能只依赖相近的细线差异。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
