execution:
  route: text_only
  must:
  - 先明确可读的前中后景轮廓
  - 用低饱和大色面确定气氛
  - 在局部加入精确材质、灯光和微小线索
  - 保持画面简洁，避免无关装饰和泛滥特效
  - 低复杂度大形与高精度局部细节并置
  - 灰绿、煤黑、雾白和少量暖色组成克制调色
  - 强剪影、遮挡与水平构图建立空间压力
  - 环境叙事通过材质和尺度表达，不依赖固定角色
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or
    protected game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
