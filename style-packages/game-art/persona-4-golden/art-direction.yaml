execution:
  route: text_only
  must:
  - 先写用户主体和构图，再注入明亮乡镇日常的视觉签名
  - 以晴黄、暖白和叶绿建立主色系统
  - 用湿润反光和远景雾气增加层次，但不遮挡主体
  - 保持场景亲切、可读，同时留出轻微的不确定感
  - 先安排平凡场景的透视、尺度和主体位置
  - 用暖黄、暖白和绿建立亲切感
  - 添加有限的湿润反光或远景雾层
  - 最后检查是否把电视、连环案件或具体小镇写进默认主体
  avoid:
  - fixed subject matter
  - copied composition
  - logos, interface text, or branded symbols
  - generic yellow color filter
  - fixed television, fog event, shopping street, rural town, or character
  - horror or disaster mood
  - copied key-art composition
  - named character
  - branded interface
  - fixed television, fog, shopping street, or rural town
