schema_version: 2.1.0
status: experimental
id: persona-4-golden-direction
name: 女神异闻录4黄金版游戏美术
base_package: game-art/persona-4-golden
scope:
  medium: 游戏美术
  representation: stylized
  description: 以明亮晴黄、乡镇日常、湿润反光和柔和雾气组织亲切而带有轻微悬疑感的日式角色扮演游戏画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character
  - branded interface
  - fixed television, fog, shopping street, or rural town
pillars:
- 以明亮晴黄、乡镇日常、湿润反光和柔和雾气组织亲切而带有轻微悬疑感的日式角色扮演游戏画面。
- 'medium: 游戏美术'
- 'composition: 生活化街道、室内或自然环境保持清楚的视线和可读尺度; 低层建筑、道路、电线、树木或远山形成稳定的水平透视; 主体可以偏置，画面保留天空、道路或墙面的安静区域'
- 'palette: 晴黄、暖白、浅赭和叶绿构成明亮的主色阶; 红色、深棕或青灰用于少量局部对比; 反光与雾气允许降低局部饱和度，但不把画面洗成灰色; 不使用全局黄色滤镜，也不依赖阴暗恐怖色调'
