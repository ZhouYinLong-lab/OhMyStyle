medium: dry drawing media on textured paper
materials:
- crayon marks
- soft pastel dust
- colored-pencil strokes
- paper grain
process:
- 选择一种主笔材
- 用大色块搭建主体
- 沿结构添加擦痕或叠线
- 留出纸白和清晰互动边界
- 缩小检查颗粒密度
technical_direction: Keep waxy, powdery, and pencil marks distinct; preserve readable
  silhouettes and interaction edges.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
