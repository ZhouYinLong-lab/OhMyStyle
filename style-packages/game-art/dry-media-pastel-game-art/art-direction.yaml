id: dry-media-pastel-game-art-direction
name: 蜡笔粉彩与彩铅游戏美术
base_package: game-art/dry-media-pastel-game-art
scope:
  medium: 蜡笔宽擦、粉彩柔边、彩铅叠线可辨; 线条承担形体和互动边界
  representation: stylized
  description: 用纸纹间隙、擦痕和颗粒呈现蜡笔、粉彩或彩铅的不同触感，不把三类材料混为同一种笔触。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - smooth digital gradients
  - uniform noise
  - unclear interaction edge
pillars:
- 用纸纹间隙、擦痕和颗粒呈现蜡笔、粉彩或彩铅的不同触感，不把三类材料混为同一种笔触。
- 'medium: 蜡笔宽擦、粉彩柔边、彩铅叠线可辨; 线条承担形体和互动边界'
- 'composition: 色面和线条保留纸面呼吸; 主体轮廓缩小后仍清楚'
- 'palette: 纸色与少量高彩色块; 颗粒来自笔材而非滤镜'
