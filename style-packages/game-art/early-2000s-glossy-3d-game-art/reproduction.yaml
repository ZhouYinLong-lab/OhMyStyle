medium: stylized real-time 3D with smooth materials and direct highlights
materials:
- simple polygonal models
- clear texture blocks
- plastic and metal response
process:
- 先锁定模型密度和轮廓
- 建立清晰贴图色区
- 添加直接高光和硬质阴影
- 控制后处理和景深
- 检查年代感来自整体资产语言
technical_direction: Do not rely on bloom alone; coordinate geometry, textures, materials,
  and interface-era cues.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
