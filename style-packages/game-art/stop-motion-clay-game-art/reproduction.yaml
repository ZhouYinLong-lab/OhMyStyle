medium: handmade clay-and-model-set game scene photographed or rendered as a tactile
  diorama
materials:
- 黏土
- 布料
- 木板
- 焊接金属
- 模型涂料
- 哑光保护层
process:
- 先设计模型比例和布景
- 再塑造主体与材料接缝
- 用柔光拍摄或渲染
- 最后保留少量真实制作痕迹
technical_direction: 保持材质边界和微缩尺度一致；不要用过度磨皮、镜面高光或CG完美边缘。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
