pillars:
- 以真实手工搭建的黏土角色、焊接金属、布料和微缩木工为基础，保留指痕、接缝、模型尺度和定格动画般的逐帧生命感。
- 'medium: 黏土、布料、木板、焊接金属和模型涂料; 真实景深但不极端微缩模糊'
- 'composition: 场景像真实模型台或小型布景; 角色与道具共享可见比例; 前景物体保留手工搭建的重量'
- 'palette: 暖灰、锈红、旧蓝、乳白和土黄构成复古工业色组; 颜色有材料差异而非统一滤镜; 局部亮色作为功能焦点'
