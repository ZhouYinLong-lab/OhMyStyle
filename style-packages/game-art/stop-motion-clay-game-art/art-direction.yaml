scope:
  medium: 黏土、布料、木板、焊接金属和模型涂料; 真实景深但不极端微缩模糊
  representation: stylized
  description: 以真实手工搭建的黏土角色、焊接金属、布料和微缩木工为基础，保留指痕、接缝、模型尺度和定格动画般的逐帧生命感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
