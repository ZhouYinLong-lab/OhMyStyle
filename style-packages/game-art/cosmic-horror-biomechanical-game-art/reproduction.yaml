medium: surreal biomechanical environment illustration
materials:
- organic forms
- eroded mineral surfaces
- bone-like structures
- selective wet highlights
process:
- 规划空间主轴和可行路径
- 用大尺度异形结构建立压迫感
- 混合有机与机械轮廓
- 以局部光标出交互处
- 区分主体与背景材质
technical_direction: Create unfamiliar forms without copying a named work; keep routes
  and interaction cues readable.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
