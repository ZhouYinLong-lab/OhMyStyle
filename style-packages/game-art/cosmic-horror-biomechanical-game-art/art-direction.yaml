id: cosmic-horror-biomechanical-game-art-direction
name: 宇宙恐怖与生物机械游戏美术
base_package: game-art/cosmic-horror-biomechanical-game-art
scope:
  medium: 有机形态与机械结构互相嵌合; 表面有生长或铸造逻辑
  representation: stylized
  description: 以难以解释的尺度、异化器官和有机机械结构制造陌生感；通过轮廓、运动与局部光线保留可交互空间的辨认度。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - uniform flesh texture
  - unreadable interaction areas
  - copied creature design
pillars:
- 以难以解释的尺度、异化器官和有机机械结构制造陌生感；通过轮廓、运动与局部光线保留可交互空间的辨认度。
- 'medium: 有机形态与机械结构互相嵌合; 表面有生长或铸造逻辑'
- 'composition: 巨大结构压迫小尺度主体; 生物与建筑边界发生异化'
- 'palette: 低饱和石色、骨色和有限肉红; 小范围异色提示机关和路线'
