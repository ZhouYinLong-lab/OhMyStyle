execution:
  route: text_only
  must:
  - 规划空间主轴和可行路径
  - 用大尺度异形结构建立压迫感
  - 混合有机与机械轮廓
  - 以局部光标出交互处
  - 区分主体与背景材质
  - 陌生感强但路径可辨
  - 交互物与环境可区分
  - 不复刻特定生物或场景
  avoid:
  - uniform flesh texture
  - unreadable interaction areas
  - copied creature design
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
