composition:
- 根系、枝干和溪流形成流动曲线
- 主体很小但轮廓清晰
- 前景深色剪影包围明亮远景
palette:
- 深蓝、青绿、靛紫、暖奶黄和少量紫粉形成发光色组
- 发光物体颜色由附近空气承接
- 不把全画面提亮成荧光
medium:
- 手绘二维背景与柔和角色剪影
- 笔触沿植物生长和水流方向
- 层叠绘画保持平台空间可读
lighting:
- 月光或森林光源形成局部光池
- 发光叶片和水面有柔和反射
- 背景亮度逐层递减
surface:
- 树皮、叶脉、水、岩石和苔藓用不同笔触表达
- 高光柔和而不塑料化
texture:
- 纹理集中在前景和焦点附近
- 远景用透明叠色和软边
invariants:
- 梦幻来自光色和植物曲线而非随机魔法特效
- 平台和路径仍然能读
- 不得复制具体角色、地图或生物
