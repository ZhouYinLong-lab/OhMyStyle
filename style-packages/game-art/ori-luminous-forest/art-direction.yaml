schema_version: 2.1.0
status: experimental
id: ori-luminous-forest-direction
name: 荧光森林手绘游戏美术
base_package: game-art/ori-luminous-forest
scope:
  medium: 手绘二维背景与柔和角色剪影; 笔触沿植物生长和水流方向; 层叠绘画保持平台空间可读
  representation: stylized
  description: 以手绘二维森林、流动根系、发光叶片、柔和空气层和清晰小型主体组织梦幻但可游玩的平台冒险空间。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - named_spirit_character
  - photorealistic_forest
  - hard_plastic_3d
  - excessive_bloom
  - copied_world_layout
pillars:
- 以手绘二维森林、流动根系、发光叶片、柔和空气层和清晰小型主体组织梦幻但可游玩的平台冒险空间。
- 'medium: 手绘二维背景与柔和角色剪影; 笔触沿植物生长和水流方向; 层叠绘画保持平台空间可读'
- 'composition: 根系、枝干和溪流形成流动曲线; 主体很小但轮廓清晰; 前景深色剪影包围明亮远景'
- 'palette: 深蓝、青绿、靛紫、暖奶黄和少量紫粉形成发光色组; 发光物体颜色由附近空气承接; 不把全画面提亮成荧光'
