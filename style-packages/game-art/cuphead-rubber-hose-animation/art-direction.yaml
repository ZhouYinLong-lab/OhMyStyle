execution:
  route: text_only
  must:
  - Block a readable side-scrolling composition and gameplay path with large silhouettes.
  - Draw variable ink contours and elastic curves around the user-supplied subject.
  - Paint a limited-color background in broad washes, then add cel-like planes and small accents.
  - Add restrained paper and registration imperfections without obscuring silhouettes.
  - Preserve hand-inked contour variation and readable game silhouettes after the subject changes.
  - Preserve layered painted depth without converting the image to pixel art or glossy 3D.
  - Keep the limited palette and print imperfections subordinate to gameplay clarity.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - mandatory seaside village, windmill, dock, boss, or mascot
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
