medium: digitally composed collage with distinct source-like material layers
materials:
- cut paper edges
- printed fragments
- painted textures
- layering shadows
process:
- 明确主体层级和阅读方向
- 规划主要片层轮廓
- 控制尺度错置和遮挡
- 用有限色彩协调而保留材料差异
- 检查小尺寸层级
technical_direction: Collage depends on visible recombination and layering; do not
  reproduce source paintings or copyrighted fragments.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
