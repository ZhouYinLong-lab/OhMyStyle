pillars:
- 以手绘质感的三维自然场景、清晰前中后景、柔和卡通明暗和大尺度探索空间组织可游玩的开放世界画面。
- 'medium: 三维环境结合手绘色面与柔和卡通明暗; 轮廓简洁但不使用粗黑描边; 形体先于微纹理'
- 'composition: 以宽阔地平线、路径和前中后景建立可探索空间; 远景层次清楚而不过度细密; 小尺度主体与大自然尺度形成对照'
- 'palette: 天空蓝、草木绿、岩石灰、暖土色和少量朱红形成自然色组; 焦点色只落在花、旗帜或光源等局部; 不使用统一高饱和滤镜'
