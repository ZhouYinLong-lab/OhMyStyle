schema_version: 2.1.0
status: experimental
id: cinematic-pixel-adventure-direction
name: 电影化像素冒险美术
base_package: game-art/cinematic-pixel-adventure
scope:
  medium: 'low-resolution pixel sprites and tile-based 2D environments'
  representation: stylized
  description: Combines small readable sprites, broad skies, layered distance, and 
    warm-cool environmental light for cinematic space; narrative use is optional and the 
    direction also works for environments, still lifes, and backgrounds.
  required_contexts: []
  incompatible_contexts: []
  limitations:
    - copying_a_specific_work
    - copying_a_named_character_or_logo
pillars:
  - Character and interaction silhouettes resolve into deliberate pixel clusters at the 
    intended display size.
  - A broad sky and layered near, middle, and far planes create cinematic distance without
    hiding the playable focal point.
  - Warm light and cool shadow separate planes and guide attention; color remains 
    role-based rather than a full-frame tint.
  - Pixel edges stay stepped and grid-aware; no blur or smooth repainting replaces the 
    pixel structure.
rules:
  - id: medium
    axis: medium
    importance: core
    applies_when: For requested scenes rendered in this pixel-art direction.
    instruction: 'Build characters, props, and terrain from intentional pixel clusters with
      stepped contours. Keep distant clusters simpler and retain crisp pixel edges at the requested
      output scale.'
    observable: 'Contours, value groups, and small material cues resolve into readable pixel
      clusters rather than blurred or smoothly painted forms.'
    reject_when: 'The image is smooth raster painting with a pixel filter, or pixel noise breaks
      the main silhouettes.'
    evidence:
      source_ids:
        - source-source-1
        - source-source-2
      basis: curatorial_inference
      visual_review: pending
  - id: composition
    axis: composition
    importance: core
    applies_when: When the requested scene includes a playable subject, environment, or 
      both.
    instruction: 'Stage the requested subject against a broad atmospheric field. Separate foreground,
      middle distance, and far distance in clear bands, and keep the focal sprite or object
      readable against the environment.'
    observable: 'The scene has a clear focal silhouette, visible depth layers, and enough open
      space to read the requested subject at thumbnail size.'
    reject_when: 'Dense scenery competes with the focal subject, or the scene becomes a fixed
      railway, sunset, house, or traveler composition.'
    evidence:
      source_ids:
        - source-source-1
        - source-source-2
      basis: curatorial_inference
      visual_review: pending
  - id: palette
    axis: palette
    importance: supporting
    applies_when: When the requested subject and scene use environmental color.
    instruction: 'Use cool colors to separate distance and shadow from warmer focal light or
      foreground accents. Adapt the balance to the requested time and subject; do not apply
      the palette as a global tint.'
    observable: 'Warm and cool color groups distinguish depth or focal emphasis while the subject
      remains legible.'
    reject_when: 'A uniform sunset or blue-hour wash replaces distinct color roles, or the palette
      reduces contrast around the focal silhouette.'
    evidence:
      source_ids:
        - source-source-1
        - source-source-2
      basis: curatorial_inference
      visual_review: pending
active_rule_ids:
  - medium
  - composition
  - palette
joint_checks:
  - id: visual-relationship-coherence
    rule_ids:
      - medium
      - composition
      - palette
    instruction: Keep the package-specific relationship among medium, composition, palette
      consistent while preserving the user-specified subject and layout.
    observable: The linked visual decisions reinforce one another and remain subordinate 
      to the user-provided subject.
sources:
  - id: source-source-1
    kind: style_reference
    base_asset_id: source-1
  - id: source-source-2
    kind: style_reference
    base_asset_id: source-2
execution:
  route: text_only
  must:
    - Preserve the requested subject, object count, and location while building an 
      original pixel-art scene.
    - Establish large sky and environment color masses before adding sprite and prop 
      clusters.
    - Use stepped contours and grid-aware pixel groups; keep the focal silhouette readable
      at the requested display size.
    - Separate foreground, middle distance, and far distance with value and warm-cool 
      color roles.
    - Do not force a railway, sunset, house, traveler, or narrative event unless 
      requested.
  avoid:
    - blurred pixel edges or smooth vector-like outlines
    - random pixel noise that damages silhouettes
    - generic global color filters
    - copied game screenshots, characters, interfaces, or compositions
