joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-primary-01
  kind: primary_research_source
  base_asset_id: primary-01
execution:
  route: text_only
  must:
  - 先写用户主体、数量和构图，再注入红黑白版式语言
  - 用近黑、纸白和清楚的切角建立层级
  - 将朱红限制在主体、路径或视觉焦点
  - 以局部网点和刷痕增加触感，不覆盖主体结构
  - 先写用户主体和版式目标，再决定斜线或切角方向
  - 用黑白建立层级，用朱红突出关键区域
  - 添加少量网点、纸张磨损或手工刷痕
  - 最后检查版式没有变成固定游戏界面或品牌海报
  avoid:
  - fixed subject matter
  - copied composition
  - logos, interface text, or branded symbols
  - generic red-black color filter
  - fixed mask, card, weapon, thief, character, or landmark
  - copied key-art composition
  - excessive neon glow or photorealistic rendering
  - named character
  - branded interface
  - fixed mask, card, weapon, thief, or city landmark
