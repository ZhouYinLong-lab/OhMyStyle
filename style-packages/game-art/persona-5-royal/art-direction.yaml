schema_version: 2.1.0
status: experimental
id: persona-5-royal-direction
name: 女神异闻录5皇家版游戏美术
base_package: game-art/persona-5-royal
scope:
  medium: 游戏美术
  representation: stylized
  description: 以朱红、近黑和纸白构成高对比图形系统，结合斜切构图、拼贴层次和印刷质感制造强烈而时尚的日式角色扮演游戏画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character
  - branded interface
  - fixed mask, card, weapon, thief, or city landmark
pillars:
- 以朱红、近黑和纸白构成高对比图形系统，结合斜切构图、拼贴层次和印刷质感制造强烈而时尚的日式角色扮演游戏画面。
- 'medium: 游戏美术'
- 'composition: 斜线、切角、重叠平面和不对称留白形成明确的视觉方向; 主体可以被大色块或边界切分，但轮廓和动作仍需可读; 画面保留编辑版式的呼吸区，不把所有空间填满'
- 'palette: 朱红、近黑和纸白构成核心三色系统; 暗灰和少量米白用于过渡，不稀释红黑对比; 红色集中在主体、路径或视觉焦点，不做全局红色滤镜; 禁止使用廉价霓虹光替代平面色块和印刷层次'
