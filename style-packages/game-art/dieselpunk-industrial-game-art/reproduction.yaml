medium: industrial military illustration with combustion-powered machinery
materials:
- armored plate
- rivets and tracks
- smoke and exhaust
- muted field materials
process:
- 设计单位轮廓和功能
- 安排掩体与机械尺度
- 加入装甲与动力结构
- 用烟尘和火光建立环境
- 缩远检查辨识度
technical_direction: Keep weapon direction and unit silhouettes readable; do not reproduce
  named machines, insignia, or factions.
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
