schema_version: 2.1.0
status: experimental
id: chinese-literati-ink-painting-direction
name: 中国文人水墨
base_package: movements/chinese-literati-ink-painting
scope:
  medium: Chinese ink-and-wash painting language on absorbent paper
  representation: stylized
  description: 以墨色浓淡、笔触速度、留白空间和含蓄的观看节奏组织画面；强调笔墨本身的气韵与主体之间的距离，不固定竹子、山水、亭台或卷轴形式。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以墨色浓淡、笔触速度、留白空间和含蓄的观看节奏组织画面；强调笔墨本身的气韵与主体之间的距离，不固定竹子、山水、亭台或卷轴形式。
- 'composition: Give the image a quiet imbalance with a large breathing area and a small number of purposeful
  brush masses.; Use distance, omission, and scale to create attention rather than filling every area with
  detail.'
- 'palette: Let ink value carry most of the image; if color appears, keep it mineral, sparse, and subordinate
  to the paper.; Preserve warm or cool paper variation without turning it into a tinted cinematic filter.'
- 'lighting: quality: diffuse daylight filtered through atmosphere; behavior: Light is understated; depth comes
  from ink dilution, dry brush, and omitted edges rather than dramatic cast shadow.'
