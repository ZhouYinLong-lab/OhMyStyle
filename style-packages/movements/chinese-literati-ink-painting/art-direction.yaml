execution:
  route: text_only
  must:
  - reserve the main blank field and place the user-supplied subject with a few structural strokes
  - establish pale washes and distant value layers
  - add dark wet-ink anchors and dry-brush edges selectively
  - introduce restrained mineral color only when it clarifies the requested subject
  - preserve value-based ink hierarchy and active blank space
  - preserve visible brush behavior instead of generic watercolor blur
  - preserve an open subject policy; do not force bamboo, mountains, pavilions, seals, or calligraphy
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
