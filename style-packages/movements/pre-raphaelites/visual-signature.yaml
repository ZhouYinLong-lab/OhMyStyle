composition:
- 清晰前景植物、细密人物和装饰性叙事形成高密度平面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 宝石绿、深红、蓝、金黄和乳白形成明亮精细色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 细密绘画、植物观察和中世纪式装饰
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀自然光，细节和颜色保持清澈
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 花叶、织物、头发和水面都有精细纹理
- 不同材质保留可辨识的表面行为。
texture:
- 近景植物密度高，远景仍保持轮廓可读
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持自然细节和装饰性，不复制文学人物、模特或名画场景
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
