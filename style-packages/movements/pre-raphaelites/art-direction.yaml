schema_version: 2.1.0
status: experimental
id: pre-raphaelites-direction
name: 拉斐尔前派
base_package: movements/pre-raphaelites
scope:
  medium: 细密绘画、植物观察和中世纪式装饰; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 细密绘画、植物观察和中世纪式装饰；清晰前景植物、细密人物和装饰性叙事形成高密度平面；宝石绿、深红、蓝、金黄和乳白形成明亮精细色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied_named_work
  - recognizable_source_arrangement
  - readable_logo_or_text
  - generic_global_filter
pillars:
- 细密绘画、植物观察和中世纪式装饰；清晰前景植物、细密人物和装饰性叙事形成高密度平面；宝石绿、深红、蓝、金黄和乳白形成明亮精细色组。
- 'medium: 细密绘画、植物观察和中世纪式装饰; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 清晰前景植物、细密人物和装饰性叙事形成高密度平面; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 宝石绿、深红、蓝、金黄和乳白形成明亮精细色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use the declared medium and keep its package-specific representation constraints visible: 细密绘画、植物观察和中世纪式装饰;
    媒介边缘、形体和细节密度保持一致。.'
  observable: 'The requested image retains the stated medium distinction or production constraint: 细密绘画、植物观察和中世纪式装饰;
    媒介边缘、形体和细节密度保持一致。.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    细密绘画、植物观察和中世纪式装饰; 媒介边缘、形体和细节密度保持一致。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 清晰前景植物、细密人物和装饰性叙事形成高密度平面;
    主体与背景保持清楚的层级关系，并让新主题拥有独立构图。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 清晰前景植物、细密人物和装饰性叙事形成高密度平面;
    主体与背景保持清楚的层级关系，并让新主题拥有独立构图。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 清晰前景植物、细密人物和装饰性叙事形成高密度平面;
    主体与背景保持清楚的层级关系，并让新主题拥有独立构图。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 宝石绿、深红、蓝、金黄和乳白形成明亮精细色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。.
    Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 宝石绿、深红、蓝、金黄和乳白形成明亮精细色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    宝石绿、深红、蓝、金黄和乳白形成明亮精细色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: 均匀自然光，细节和颜色保持清澈; 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。.
    Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: 均匀自然光，细节和颜色保持清澈; 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: 均匀自然光，细节和颜色保持清澈; 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 花叶、织物、头发和水面都有精细纹理;
    不同材质保留可辨识的表面行为。. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: 花叶、织物、头发和水面都有精细纹理;
    不同材质保留可辨识的表面行为。.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    花叶、织物、头发和水面都有精细纹理; 不同材质保留可辨识的表面行为。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 近景植物密度高，远景仍保持轮廓可读;
    纹理沿结构和媒介方向组织，远景与次要区域降低密度。. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: 近景植物密度高，远景仍保持轮廓可读;
    纹理沿结构和媒介方向组织，远景与次要区域降低密度。.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    近景植物密度高，远景仍保持轮廓可读; 纹理沿结构和媒介方向组织，远景与次要区域降低密度。.'
  evidence:
    source_ids:
    - source-pre-raphaelites-primary-source
    basis: curatorial_inference
    visual_review: pending
