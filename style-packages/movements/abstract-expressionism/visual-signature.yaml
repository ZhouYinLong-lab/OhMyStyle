composition:
- 大尺度画面由手势笔触和局部空白建立非中心构图
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 黑、赭红、钴蓝、乳白和橙黄形成高能量色层
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 动作绘画、厚薄笔触和开放画布
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 光线不描述物体，而通过颜料厚薄和反光制造层次
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 颜料堆积、刮擦、滴落和画布纤维可见
- 不同材质保留可辨识的表面行为。
texture:
- 笔触方向与速度保持个体化，不生成均匀纹理
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持手势和材料性，不把结果变成普通渐变或具象场景
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
