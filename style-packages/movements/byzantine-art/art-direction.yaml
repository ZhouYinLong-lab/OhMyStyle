schema_version: 2.1.0
status: experimental
id: byzantine-art-direction
name: 拜占庭艺术
base_package: movements/byzantine-art
scope:
  medium: 以正面秩序、金色或深色背景、稳定轮廓、象征性尺度和克制的平面层次建立超越日常空间的视觉庄严感。
  representation: stylized
  description: 以正面秩序、金色或深色背景、稳定轮廓、象征性尺度和克制的平面层次建立超越日常空间的视觉庄严感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以正面秩序、金色或深色背景、稳定轮廓、象征性尺度和克制的平面层次建立超越日常空间的视觉庄严感。
- 'composition: 稳定、正面、近似仪式性的排列; 空间深度被压缩，主体轮廓优先; 以对称或近对称建立持续的视觉安定感'
- 'palette: 金色、深蓝、暗红和赭色形成象征性色彩关系; 高光集中而克制，不制造写实金属反射; 背景可简化为深色或金色的平面场'
- 'lighting: even frontal illumination with minimal cast shadow and luminous flat grounds; Use light to keep outlines
  and color fields legible; avoid sculptural chiaroscuro.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 稳定、正面、近似仪式性的排列;
    空间深度被压缩，主体轮廓优先; 以对称或近对称建立持续的视觉安定感. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 稳定、正面、近似仪式性的排列; 空间深度被压缩，主体轮廓优先;
    以对称或近对称建立持续的视觉安定感.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 稳定、正面、近似仪式性的排列;
    空间深度被压缩，主体轮廓优先; 以对称或近对称建立持续的视觉安定感.'
  evidence:
    source_ids:
    - source-byzantine-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 金色、深蓝、暗红和赭色形成象征性色彩关系; 高光集中而克制，不制造写实金属反射;
    背景可简化为深色或金色的平面场. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 金色、深蓝、暗红和赭色形成象征性色彩关系; 高光集中而克制，不制造写实金属反射;
    背景可简化为深色或金色的平面场.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    金色、深蓝、暗红和赭色形成象征性色彩关系; 高光集中而克制，不制造写实金属反射; 背景可简化为深色或金色的平面场.'
  evidence:
    source_ids:
    - source-byzantine-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use even frontal illumination with minimal cast shadow and luminous flat grounds. Use light to
    keep outlines and color fields legible; avoid sculptural chiaroscuro. Keep the light coherent with the requested
    subject and scene.
  observable: 'The light quality and its effect on shadows, materials, or tonal separation are visible: even frontal
    illumination with minimal cast shadow and luminous flat grounds. Use light to keep outlines and color fields
    legible; avoid sculptural chiaroscuro.'
  reject_when: 'Reject global tint, bloom, or lighting that erases the stated tonal or material distinctions:
    even frontal illumination with minimal cast shadow and luminous flat grounds.'
  evidence:
    source_ids:
    - source-byzantine-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: 平滑的矿物色层、细密装饰性纹理和局部金属光泽;
    edges: deliberate and subject-dependent, without a copied layout. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish: 平滑的矿物色层、细密装饰性纹理和局部金属光泽;
    edges: deliberate and subject-dependent, without a copied layout.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: finish:
    平滑的矿物色层、细密装饰性纹理和局部金属光泽; edges: deliberate and subject-dependent, without a copied layout.'
  evidence:
    source_ids:
    - source-byzantine-art-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: 纹理集中在边框、衣料或背景装饰，主体表面保持可读;
    placement: concentrated where the medium or material needs explanation. Preserve detail hierarchy and material
    identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density: 纹理集中在边框、衣料或背景装饰，主体表面保持可读;
    placement: concentrated where the medium or material needs explanation.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: density:
    纹理集中在边框、衣料或背景装饰，主体表面保持可读; placement: concentrated where the medium or material needs explanation.'
  evidence:
    source_ids:
    - source-byzantine-art-primary-source
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- composition
- palette
- lighting
- surface
- texture
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - palette
  - lighting
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-byzantine-art-primary-source
  kind: primary
  base_asset_id: byzantine-art-primary-source
execution:
  route: text_only
  must:
  - 先安排正面秩序和轮廓
  - 压缩空间并建立背景色场
  - 分配象征性主色和局部金色
  - 最后添加克制的装饰边界与表面细节
  - the requested subject stays unchanged
  - the package signature remains visible after subject transfer
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 固定加入圣像、光环、教堂或宗教仪式
  - 把风格简化为金色滤镜
  - 使用现代商业金属质感或三维渲染高光
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or protected
    game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
