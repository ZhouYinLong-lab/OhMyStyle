medium: 几何化具象、清晰边缘与简化体积
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持工业几何与克制叙事，不复制具体工厂或城市地标
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
