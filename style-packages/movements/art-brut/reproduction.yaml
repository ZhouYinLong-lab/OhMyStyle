medium: mixed drawing, painting, assemblage, or found-surface mark-making
materials:
  support: paper, cardboard, wall-like ground, found material, or a plain digital field
process:
  - begin with the user-supplied subject without imposing an academic sketch plan
  - add repeated, overdrawn, or accumulated marks with uneven pressure
  - retain gaps, corrections, collisions, and material irregularities as part of the final image
technical_direction:
  contrast: locally extreme and globally uneven
  saturation: variable, with abrupt material color
  perspective: unstable or subject-led
  detail_density: irregular, alternating between accumulation and open space
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
