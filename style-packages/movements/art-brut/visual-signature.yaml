composition:
  - Let the user-supplied subject emerge through direct marks, repetition, accumulation, and irregular scale.
  - Preserve awkward gaps, crowded passages, and personal ordering instead of normalizing the image into polished design.
palette:
  - Use available-looking pigments, dirty neutrals, dark ink, chalk white, and occasional abrupt color.
  - Keep color relationships personal and material, not harmonized by a commercial grade.
lighting:
  quality: raw direct mark-making with uneven local contrast
  behavior:
    - Keep illumination secondary to the marks; allow uneven pressure and density to create value.
surface:
  finish: handmade, layered, and visibly process-led
  edges: irregular, overdrawn, or abruptly cut off
texture:
  density: variable from sparse blank fields to dense accumulations
  placement: follow the subject's internal associations and mark rhythm, not a decorative pattern library
invariants:
  - direct and non-standard mark language
  - retained process accidents
  - personal ordering without polished academic finish
