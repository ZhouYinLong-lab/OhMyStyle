schema_version: 2.1.0
status: experimental
id: magic-realism-direction
name: 魔幻现实主义
base_package: movements/magic-realism
scope:
  medium: 具象绘画、细节写实与一个超现实但克制的事件; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 具象绘画、细节写实与一个超现实但克制的事件；日常空间保持真实，但一个不解释的异常物体改变心理重心；尘土色、灰绿、暗红、乳白和冷蓝形成平静而异样的色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied_named_work
  - recognizable_source_arrangement
  - readable_logo_or_text
  - generic_global_filter
pillars:
- 具象绘画、细节写实与一个超现实但克制的事件；日常空间保持真实，但一个不解释的异常物体改变心理重心；尘土色、灰绿、暗红、乳白和冷蓝形成平静而异样的色组。
- 'medium: 具象绘画、细节写实与一个超现实但克制的事件; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 日常空间保持真实，但一个不解释的异常物体改变心理重心; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 尘土色、灰绿、暗红、乳白和冷蓝形成平静而异样的色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
