composition:
- 重复线条、网格和波纹制造视觉震动，画面保持平面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 黑白为主，辅以单一红或蓝强调色
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 硬边几何、重复图案和视错觉结构
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀平光，深度只来自图案密度和相位变化
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 表面平滑，印刷边缘清楚
- 不同材质保留可辨识的表面行为。
texture:
- 线条间距、弯曲和重复必须稳定，不使用随机噪声
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持抽象视觉机制，不加入人物、可读文字或三维透视
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
