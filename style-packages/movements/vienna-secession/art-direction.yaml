schema_version: 2.1.0
status: experimental
id: vienna-secession-direction
name: 维也纳分离派
base_package: movements/vienna-secession
scope:
  medium: decorative painting, print, or mixed graphic surface
  representation: stylized
  description: 以平面装饰、几何秩序、象征性图形和建筑—平面—工艺的整体关系组织画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以平面装饰、几何秩序、象征性图形和建筑—平面—工艺的整体关系组织画面。
- 'composition: Organize the image as a deliberate flat field with ornamental borders, axial balance, and controlled
  asymmetry.; Connect image, frame, and surrounding surface so decoration feels structural rather than added
  afterward.'
- 'palette: Combine mineral cream, deep blue-green, muted red, black, and restrained metallic gold.; Use metallic
  or jewel-like accents sparingly against large calm fields.'
- 'lighting: quality: even graphic illumination with selective metallic emphasis; behavior: Keep the main field
  legible and stable; allow small highlights to articulate ornament.; behavior: Avoid cinematic spotlights
  or a single iconic building as the source of style.'
