medium: decorative painting, print, or mixed graphic surface
materials:
  support: paper, poster board, wall panel, or digital canvas treated as a designed surface
process:
  - establish the flat field and primary axis
  - place the user-supplied subject inside a balanced frame
  - add ornamental line, geometric accents, and restrained metallic or jewel notes
technical_direction:
  contrast: moderate with strong edge hierarchy
  saturation: selective jewel tones, otherwise restrained
  perspective: flattened or intentionally controlled
  detail_density: concentrated in framing and symbolic surface details
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
