composition:
  - Organize the image as a deliberate flat field with ornamental borders, axial balance, and controlled asymmetry.
  - Connect image, frame, and surrounding surface so decoration feels structural rather than added afterward.
palette:
  - Combine mineral cream, deep blue-green, muted red, black, and restrained metallic gold.
  - Use metallic or jewel-like accents sparingly against large calm fields.
lighting:
  quality: even graphic illumination with selective metallic emphasis
  behavior:
    - Keep the main field legible and stable; allow small highlights to articulate ornament.
    - Avoid cinematic spotlights or a single iconic building as the source of style.
surface:
  finish: printed, lacquered, or painted decorative surface
  edges: crisp graphic contours with controlled ornamental linework
texture:
  density: moderate and patterned
  placement: concentrated in borders, motifs, typography-like structures, and selected surfaces
invariants:
  - integration of decoration with the whole composition
  - planar geometry and controlled ornament
  - restrained jewel accents against calm fields
