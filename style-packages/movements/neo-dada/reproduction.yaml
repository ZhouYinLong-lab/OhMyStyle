medium: mixed-media assemblage and collage
materials:
  support: paper, photograph, print, paint, tape, or found surface
process:
  - establish the user subject; add a few ordinary material interventions; introduce one offset or scale shift; remove accidental clutter
technical_direction:
  contrast: uneven by design but anchored
  saturation: follows source materials
  perspective: may mix flat and spatial fragments
  detail_density: joins, overlaps, and altered surfaces
avoid:
  - fixed subject, location, character, or story not requested by the user
  - generic global color filter without process evidence
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
