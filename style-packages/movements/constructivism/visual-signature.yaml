composition:
- 对角线、圆弧、网格和机械结构构成强烈的平面空间
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 黑、白、红、黄和工业灰形成革命性几何色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 几何构成、印刷设计与工业材料感
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 硬质平光，阴影被简化为几何块
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 纸面、钢铁、木材和印刷油墨以平面关系出现
- 不同材质保留可辨识的表面行为。
texture:
- 线条、圆形和斜切面形成节奏，纹理极少
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持几何秩序和有限色组，不复制政治标语或历史海报
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
