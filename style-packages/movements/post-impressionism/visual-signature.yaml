medium: painting
signature: 结构化色块、主观色彩、稳定形体与可见笔触
composition:
- new subject and arrangement
- clear primary focal hierarchy
- readable negative space
color:
  palette:
  - '#C24D32'
  - '#D09B38'
  - '#3C6780'
  behavior:
  - local color remains readable
  - no automatic global color wash
light:
  quality: style-consistent natural or designed light
  behavior:
  - light supports form
  - background does not erase material identity
surface:
  texture: observable medium or capture texture
  finish: controlled detail without generic AI gloss
invariants:
- 结构化色块、主观色彩、稳定形体与可见笔触
- new theme and composition are mandatory
- style cues remain subordinate to subject readability
