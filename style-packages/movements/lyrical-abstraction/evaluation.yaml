profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - the body, if requested, is carried by gesture and paint process rather than literal portrait detail
      - open edges and layered passages remain visible around the supplied subject
  still_life:
    required:
      - objects may dissolve into the field but must not be replaced by a fixed motif
      - paint process remains visible through drips, overlaps, and varied stroke pressure
minimum_score: 7

