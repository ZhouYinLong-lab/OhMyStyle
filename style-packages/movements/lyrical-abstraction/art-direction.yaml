execution:
  route: text_only
  must:
  - Establish the supplied subject only as a loose silhouette, mass, or compositional cue.
  - Lay down broad transparent and opaque color fields with different stroke pressures.
  - Add directional gestures, drips, dry-brush skips, and scraped overlaps while leaving pauses.
  - Reintroduce only the minimum subject cues needed for the user's request; keep the making process visible.
  - The sequence and pressure of gestures remain visible after the subject changes.
  - The image avoids a single decorative pattern or a uniform digital gradient.
  - The subject remains optional; abstraction is a treatment of making, not a fixed object.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
