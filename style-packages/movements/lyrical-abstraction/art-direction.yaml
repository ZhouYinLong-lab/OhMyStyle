schema_version: 2.1.0
status: experimental
id: lyrical-abstraction-direction
name: 抒情抽象
base_package: movements/lyrical-abstraction
scope:
  medium: lyrical abstract painting with a physical process translated into image generation
  representation: abstract_interpretation
  description: 以身体性的笔触、开放边界、流动色层和不规则节奏，让绘画过程成为画面结构的一部分。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以身体性的笔触、开放边界、流动色层和不规则节奏，让绘画过程成为画面结构的一部分。
- 'composition: Let the image breathe as an open field with an uneven center of gravity rather than a closed
  emblem.; Use overlapping gestures and pauses; allow a small supplied form to sit inside, beside, or partly
  disappear into the field.'
- 'palette: Combine warm white, deep maroon, cobalt, olive, and raw umber through layered transparent and opaque
  passages.; Let color temperature shift across gestures while preserving a few quiet areas.'
- 'lighting: quality: diffuse light that reveals paint thickness without theatrical modeling; behavior: Highlights
  come from paint thickness and exposed support, not a simulated object light source.; behavior: Keep the field
  legible through value rhythm even when edges remain open.'
