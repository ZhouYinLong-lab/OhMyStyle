package: "粗野主义"
summary: "裸露结构、厚重体块、粗粝材质、强烈比例和直接功能表达建立不修饰的视觉"
subject_policy: open
visual_signature:
  medium: "建筑与平面设计"
  focus: "裸露结构、厚重体块、粗粝材质、强烈比例和直接功能表达建立不修饰的视觉"
  composition:
  - "结构本身承担装饰"
  - "混凝土、金属、纸张或粗糙表面可见"
  - "文字若由用户提供则保持直接清晰"
  palette:
  - "混凝土灰 #8D8D87，角色：主体材质"
  - "煤黑 #202124，角色：结构阴影"
  - "警示橙 #D86632，角色：功能强调"
  surface:
    - 材质细节服从用户主体，并保持可辨识
  edge_behavior:
    - 边缘行为由媒介与光线决定，不使用统一发光描边
invariants:
  - Preserve the user's subject, location, object count, and narrative.
  - Do not add a recurring object, setting, character, landmark, or narrative motif.
  - Do not copy a named reference work or recognizable layout.
