medium: atmospheric tonal painting translated into a restrained visual treatment
materials:
  support: canvas, paper, or a softly textured image field
process:
  - Establish the user's subject with a simple silhouette and one focal value anchor.
  - Lay in a narrow family of related tones before adding local description.
  - Soften secondary edges and push distant areas toward the shared atmospheric value.
  - Restore only enough focal contrast and material detail for the subject to remain readable.
technical_direction:
  contrast: low overall, medium at the focal anchor
  saturation: low-to-medium and harmonized
  perspective: atmospheric rather than geometrically emphatic
  detail_density: low-to-medium, increasing only near the focal area
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
