execution:
  route: text_only
  must:
  - Establish the user's subject with a simple silhouette and one focal value anchor.
  - Lay in a narrow family of related tones before adding local description.
  - Soften secondary edges and push distant areas toward the shared atmospheric value.
  - Restore only enough focal contrast and material detail for the subject to remain readable.
  - Related tones and atmospheric recession remain more important than detailed description.
  - The supplied subject remains legible but is not forced into a landscape.
  - The image avoids a flat gray wash by keeping a controlled focal contrast.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
