profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - a requested figure remains legible through a small focal contrast and is not dissolved into a generic silhouette
      - atmosphere softens secondary edges without imposing a landscape
  still_life:
    required:
      - neighboring tones create unity while material identity remains visible
      - no mandatory mountains, lake, fog, or rural scene has been introduced
minimum_score: 7

