execution:
  route: text_only
  must:
  - emotion is carried by posture and contact
  - space feels active rather than diagrammed
  - bodies include age, difference, and vulnerability
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic superhero action
  - flat neoclassical calm
  - horror gore as a shortcut to pathos
  - copied famous sculpture group
  - Do not copy a specific reference composition, named character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
