composition:
  - drive the eye through a strong diagonal or spiral
  - use foreshortening and partial occlusion to create spatial pressure
  - stage emotion as an embodied action, not a facial sticker
form:
  anatomy: naturalistic, varied, age- and labor-specific
  movement: torsion, counterforce, reaching, falling, or turning
  space: deep, crowded, and theatrically opened toward the viewer
surface:
  - polished and rough passages coexist
  - marble grain, bronze patina, terracotta, or tesserae stay legible
  - drapery amplifies motion and contact
color:
  - stone and bronze neutrals
  - saturated red, blue, ochre, and green accents
  - dark cavities against lit planes
tone:
  - dramatic
  - empathetic
  - cosmopolitan
invariants:
  - emotion is carried by posture and contact
  - space feels active rather than diagrammed
  - bodies include age, difference, and vulnerability
avoid:
  - generic superhero action
  - flat neoclassical calm
  - horror gore as a shortcut to pathos
  - copied famous sculpture group
