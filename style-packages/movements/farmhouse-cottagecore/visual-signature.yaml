package: "农舍风格"
summary: "乡村生活的自然材质、朴素器物、植物、织物和温暖日光构成实用而有季节感的视觉"
subject_policy: open
visual_signature:
  medium: "乡村生活方式设计"
  focus: "乡村生活的自然材质、朴素器物、植物、织物和温暖日光构成实用而有季节感的视觉"
  composition:
  - "木、亚麻、陶、铁和纸张"
  - "功能明确的器物摆放"
  - "季节感来自光线和材质而非固定道具"
  palette:
  - "奶油 #F0E7D2，角色：墙面与布料"
  - "橡木 #A8794E，角色：结构材质"
  - "鼠尾草 #89977D，角色：自然补色"
  surface:
    - 材质细节服从用户主体，并保持可辨识
  edge_behavior:
    - 边缘行为由媒介与光线决定，不使用统一发光描边
invariants:
  - Preserve the user's subject, location, object count, and narrative.
  - Do not add a recurring object, setting, character, landmark, or narrative motif.
  - Do not copy a named reference work or recognizable layout.
