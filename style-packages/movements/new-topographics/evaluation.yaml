invariants:
  - id: alteration_visible
    weight: 3
    test: Human intervention is visibly part of the landscape.
  - id: neutral_description
    weight: 2
    test: The camera describes rather than celebrates or condemns through effects.
  - id: spatial_order
    weight: 2
    test: Horizon, geometry, and repeated structures are legible.
  - id: low_spectacle
    weight: 2
    test: Light and color avoid postcard drama.
rejections:
  - picturesque_wilderness
  - dystopian_cliche
  - real_estate_polish
  - privacy_violation
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
