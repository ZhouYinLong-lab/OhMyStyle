medium: documentary_landscape_photography
capture:
  viewpoint: fixed_tripod_or_deliberate_stance
  lens_direction: normal_or_moderate_wide
  horizon: stable_and_legible
  light: overcast_or_even_daylight
composition:
  - include the altered edge rather than cropping it away
  - let roads, poles, fences, drainage, or parking structure the frame
  - keep visual drama low and spatial evidence high
processing:
  contrast: restrained
  saturation: low_to_moderate
  sharpening: descriptive_not_crunchy
avoid:
  - sublime_wilderness
  - disaster_movie_color_grade
  - real_estate_advertising
  - dystopian_cliche
safety_note: Do not reveal private addresses or identifiable people in examples.


