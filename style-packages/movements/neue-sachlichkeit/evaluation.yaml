invariants:
- id: social_specificity
  weight: 3
  test: Objects and setting provide concrete social or material information.
- id: descriptive_edges
  weight: 2
  test: Edges and surfaces are observed rather than dissolved into mood.
- id: unsentimental_tone
  weight: 2
  test: The scene avoids romantic nostalgia and commercial glamour.
- id: historical_distance
  weight: 2
  test: The result is informed by the movement without copying a named work.
rejections:
- generic_dark_vintage
- decorative_expressionism
- costume_pastiche
- copied_historical_portrait
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
image_audit:
  similarity_level: review
  method: perceptual hash, color histogram, luminance, texture, and layout; screening only
  candidate_pairs:
  - package: artists/eugene-delacroix
    score: 0.828
    signals:
      color: 0.952
      luminance: 0.964
      texture: 0.986
      layout: 0.998
  reason: Automated gallery similarity is a curator-review cue, not evidence of semantic duplication.
  action: preserve-distinctive-signature-and-recheck-gallery
