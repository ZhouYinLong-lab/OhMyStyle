composition:
- 少量基本形体占据宽阔空间，比例和间距成为主体
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 白、灰、黑、冷蓝和单一强调色形成低噪声色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 工业几何体、硬边表面与极少装饰
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀光线消除戏剧性，阴影轻而准确
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 金属、亚克力、木板和混凝土保持工业质感
- 不同材质保留可辨识的表面行为。
texture:
- 表面纹理极少，边缘、间距和重复必须稳定
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持数量少、结构清楚和非叙事性，不加入多余物体
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
