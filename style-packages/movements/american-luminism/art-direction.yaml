schema_version: 2.1.0
status: experimental
id: american-luminism-direction
name: 美国光主义
base_package: movements/american-luminism
scope:
  medium: Suggest finely controlled oil paint with smooth, thin transitions and few conspicuous stroke marks.;
    Keep surface detail subordinate to precise atmospheric separation.
  representation: stylized
  description: 以稀疏的横向景观、克制的边缘、平静水面和精密大气透视捕捉冷静、清澈且近乎静止的自然光。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - dramatic_storm
  - sublime_mountain_scale
  - visible_impressionist_strokes
  - global_cool_filter
pillars:
- 以稀疏的横向景观、克制的边缘、平静水面和精密大气透视捕捉冷静、清澈且近乎静止的自然光。
- 'medium: Suggest finely controlled oil paint with smooth, thin transitions and few conspicuous stroke marks.;
  Keep surface detail subordinate to precise atmospheric separation.'
- 'composition: Prefer broad horizontal balance and a low or distant horizon when the requested subject allows
  it; follow a different requested aspect ratio without cropping to a preset.; Keep the main forms sparse and
  carefully spaced; let empty water, sky, or an equivalent quiet field carry visual weight.; Use layered near,
  middle, and far planes with restrained scale shifts rather than a dramatic foreground-to-mountain sweep.'
- 'palette: Use cool silver, pale blue, soft gray, muted green, and controlled earth colors.; Keep chroma measured;
  allow light to brighten local colors without turning the whole image blue or gold.; Reserve stronger darks
  for small anchors and foreground edges.'
