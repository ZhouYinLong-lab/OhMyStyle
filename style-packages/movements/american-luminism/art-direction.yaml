execution:
  route: text_only
  must:
  - Honor the requested subject and choose a quiet, balanced arrangement.
  - Separate near, middle, and far planes through small shifts in value and atmospheric clarity.
  - Establish the broad light field before detailing objects or surfaces.
  - Add reflective light in restrained, aligned accents; keep water or equivalent surfaces calm.
  - Resolve only the structural edges needed for depth; suppress conspicuous brushwork.
  - Stillness comes from sparse spacing, tonal control, and reflective light, not from blur.
  - Atmospheric depth stays legible even when detail is restrained.
  - The image retains the user’s chosen subject and does not default to a specific coast or landmark.
  avoid:
  - dramatic_storm
  - sublime_mountain_scale
  - visible_impressionist_strokes
  - global_cool_filter
  - Use movement-level visual traits only. Do not reconstruct a named landscape, landmark, composition, logo,
    or text.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
