composition:
  - Prefer broad horizontal balance and a low or distant horizon when the requested subject allows it; follow a different requested aspect ratio without cropping to a preset.
  - Keep the main forms sparse and carefully spaced; let empty water, sky, or an equivalent quiet field carry visual weight.
  - Use layered near, middle, and far planes with restrained scale shifts rather than a dramatic foreground-to-mountain sweep.
palette:
  - Use cool silver, pale blue, soft gray, muted green, and controlled earth colors.
  - Keep chroma measured; allow light to brighten local colors without turning the whole image blue or gold.
  - Reserve stronger darks for small anchors and foreground edges.
medium:
  - Suggest finely controlled oil paint with smooth, thin transitions and few conspicuous stroke marks.
  - Keep surface detail subordinate to precise atmospheric separation.
lighting:
  - Make light itself the primary event: clear, even, and quietly radiant across surfaces.
  - Use subtle reflected light and delicate atmospheric haze while preserving distant form.
  - Avoid sudden rays, theatrical sunset bands, and abrupt chiaroscuro.
surface:
  - Suppress visible brushwork; distinguish this from Impressionist broken color and gestural landscape painting.
  - Keep water and sky calm, with sparse horizontal variations rather than glittering detail.
texture:
  - Use smooth transitions and fine detail in moderation; do not add artificial canvas grain uniformly.
invariants:
  - Stillness comes from sparse spacing, tonal control, and reflective light, not from blur.
  - Atmospheric depth stays legible even when detail is restrained.
  - The image retains the user’s chosen subject and does not default to a specific coast or landmark.
