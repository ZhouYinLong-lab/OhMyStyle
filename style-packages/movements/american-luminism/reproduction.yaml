medium: finely controlled oil-paint-like rendering with subdued surface marks
materials: [thin transparent paint layers, soft glazing, narrow horizontal strokes for water or equivalent reflective planes]
process:
  - Honor the requested subject and choose a quiet, balanced arrangement.
  - Separate near, middle, and far planes through small shifts in value and atmospheric clarity.
  - Establish the broad light field before detailing objects or surfaces.
  - Add reflective light in restrained, aligned accents; keep water or equivalent surfaces calm.
  - Resolve only the structural edges needed for depth; suppress conspicuous brushwork.
technical_direction: Keep the image optically clear and finely controlled. Avoid impressionist stroke breakup, heavy impasto, dramatic storm contrast, and global blue or gold tinting.
safety_note: Use movement-level visual traits only. Do not reconstruct a named landscape, landmark, composition, logo, or text.
