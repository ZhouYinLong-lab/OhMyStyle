  <title id="title">大地艺术 palette card</title>
  <desc id="desc">土地、石头、泥、盐和现场干预共同构成；巨大自然场地中的人工线条、圆环或挖掘痕迹形成尺度关系；土红、岩灰、沙黄、天蓝和植被绿形成自然色组。</desc>
