medium: painting and graphic composition built from orthogonal relations, flat color planes, and structural lines
composition:
- Build an asymmetrical balance from horizontal and vertical axes, open space, and a few unequal rectangles; do
  not copy a canonical grid.
style_signature:
- Builds clarity through horizontal-vertical relations, rectangular color fields, black structural lines, and
  asymmetrical balance, treating composition as a system rather than a few colored shapes.
- avoid_generic_filters; make medium, structure, palette, and lighting jointly visible
- narrative_is_optional
invariants:
- the result is an original new scene, not a copy of a source work
- no unrequested text, logo, trademark, or named character
