schema_version: 2.1.0
status: experimental
id: de-stijl-direction
name: 荷兰风格派
base_package: movements/de-stijl
scope:
  medium: painting and graphic composition built from orthogonal relations, flat color planes, and structural
    lines
  representation: stylized
  description: Builds clarity through horizontal-vertical relations, rectangular color fields, black structural
    lines, and asymmetrical balance, treating composition as a system rather than a few colored shapes.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copying_a_specific_work
  - copying_a_named_character_or_logo
pillars:
- Builds clarity through horizontal-vertical relations, rectangular color fields, black structural lines, and
  asymmetrical balance, treating composition as a system rather than a few colored shapes.
- 'medium: painting and graphic composition built from orthogonal relations, flat color planes, and structural
  lines'
- 'composition: Build an asymmetrical balance from horizontal and vertical axes, open space, and a few unequal
  rectangles; do not copy a canonical grid.'
- 'palette: Warm white ground, near-black structure, red, blue, and yellow focal planes, with rare gray transitions.'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Render in painting and graphic composition built from orthogonal relations, flat color planes,
    and structural lines; make the production or rendering process visible in edge, surface, and tonal evidence.
  observable: The image visibly reads as painting and graphic composition built from orthogonal relations, flat
    color planes, and structural lines, rather than a generic color treatment.
  reject_when: Reject when the material or rendering process cannot be distinguished from a generic filter.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Build an asymmetrical balance from horizontal and vertical axes, open space, and a few unequal
    rectangles; do not copy a canonical grid. Preserve the user-provided subject and requested layout.
  observable: Build an asymmetrical balance from horizontal and vertical axes, open space, and a few unequal rectangles;
    do not copy a canonical grid.
  reject_when: Reject when the arrangement loses these structural decisions or copies a source composition.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use warm white as the open ground, near-black for structural lines, and restrained red, blue, or
    yellow as separated color planes. Keep gray transitional areas rare.
  observable: Warm white ground, near-black structure, red, blue, and yellow focal planes, with rare gray transitions.
  reject_when: Reject when a global tint replaces the stated color roles or the roles cannot be distinguished.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- medium
- composition
- palette
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-source-1
  kind: style_reference
  base_asset_id: source-1
- id: source-source-2
  kind: style_reference
  base_asset_id: source-2
execution:
  route: text_only
  must:
  - translate the user subject into the style medium and structural rules
  - establish composition before small detail
  - inspect against the generic five-task suite
  - the result is an original new scene, not a copy of a source work
  - no unrequested text, logo, trademark, or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic_global_filter
  - copied_source_composition
  - readable_text_or_branding
  - copying_a_specific_work
  - copying_a_named_character_or_logo
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
