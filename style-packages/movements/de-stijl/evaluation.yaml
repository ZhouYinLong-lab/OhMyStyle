profiles:
  generic:
    required:
      - medium_evidence_is_visible
      - composition_is_intentional
      - palette_and_lighting_are_coherent
      - new_subject_is_not_a_copy_of_a_reference_work
      - no_unrequested_text_or_branding
    reject_if:
      - a_generic_filter_replaces_the_style_signature
      - the_image_is_a_direct_copy_of_a_named_work
      - medium_or_material_cues_are_missing
  portrait:
    required:
      - subject_structure_remains_readable
  still_life:
    required:
      - material_or_process_difference_is_visible
  architecture_environment:
    required:
      - spatial_layers_or_surface_structure_are_readable
  minimal_composition:
    required:
      - reduction_does_not_remove_the_style_signature
  fuzzy_brief:
    required:
      - ambiguous_request_is_compiled_into_coherent_visual_decisions
image_audit:
  similarity_level: high
  visual_overlap:
    - orthogonal grid structure
    - red, blue, yellow, black, and white colour roles
  reason: Representative image may be visually close to Bauhaus and grid-based design packages.
  keep_separate_because:
    - the package requires strict orthogonal abstraction and primary-colour balance
    - it is a historical movement, not a general-purpose layout utility
    - it must not force rectangles, interiors, or posters onto every subject
  action: clarify_distinctive_signature
subject_independence_suite:
  status: pending
  fixture: benchmarks/subject-independence.yaml
  required_subjects:
    - ordinary-chair
    - unspecified-building
  evidence: "No provider-backed result is claimed until a real image run is recorded."
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
