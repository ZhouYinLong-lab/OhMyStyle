medium: decorative historical painting language with material-focused surface
materials:
  support: original subject rendered through the package medium and surface logic
process:
  - 'define the user-supplied subject and location first'
  - 'organize architectural or decorative planes'
  - 'lay in warm earth and cool shadow masses'
  - 'add selective material detail without exoticizing the scene'
technical_direction:
  contrast: 'moderate, with warm foreground detail and cooler recession'
  saturation: 'earthy and mineral, with selective jewel-like accents'
  perspective: 'layered and slightly compressed, using frames, screens, or architectural planes when requested'
avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, branded layout, or protected game asset.
