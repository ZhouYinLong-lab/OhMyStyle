composition:
  - one simple action or rule creates tension inside an otherwise ordinary arrangement
  - generous negative space and matter-of-fact framing keep the result open-ended
  - visible traces of before, during, or after allow the image to read as an event record
palette:
  - modest paper, wood, graphite, and daylight neutrals with one or two blunt accent colors
  - color is material evidence, not a decorative gradient or polished brand system
