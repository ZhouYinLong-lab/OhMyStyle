surface:
  finish: handled, provisional, and lightly imperfect
  edges: ordinary object edges and direct photographic boundaries
texture:
  density: low to moderate, with local evidence of use
  placement: concentrated on cheap materials, joints, marks, and small changes of position
invariants:
  - a clear but not over-explained action or visual rule
  - ordinary material presence and anti-polished handling
  - room for multiple interpretations rather than a closed narrative
