medium: collage, found-image montage, and experimental graphic surface
materials:
  support: pasted paper, street photograph, map-like marks, or weathered wall
process:
  - establish an ordinary navigable space or abstract route
  - interrupt it with found-looking fragments, cuts, overlays, and erased connections
  - add one visual intervention that changes how the viewer reads the route
technical_direction:
  contrast: medium with clear layer separation
  saturation: restrained base with one disruptive accent
  perspective: intentionally discontinuous or map-like
  detail_density: medium; every fragment should support the drift
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
