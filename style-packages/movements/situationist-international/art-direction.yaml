execution:
  route: text_only
  must:
  - establish an ordinary navigable space or abstract route
  - interrupt it with found-looking fragments, cuts, overlays, and erased connections
  - add one visual intervention that changes how the viewer reads the route
  - preserve the feeling of a route being discovered rather than a scene being illustrated
  - preserve visible layer conflicts and one deliberate intervention color
  - preserve open interpretation without forcing a political slogan or named city
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
