  evidence:
    source_ids:
    - source-situationist-international-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: ordinary urban light or flat printed illumination;
    behavior: Favor legibility of pasted surfaces, paper seams, and spatial contradictions over cinematic glamour..
