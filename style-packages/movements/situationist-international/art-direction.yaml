  instruction: 'Render the requested materials using these package-specific surface decisions: finish: layered
    print, map, photograph, or painted wall surface; edges: hard cut edges beside torn, rubbed, or misregistered
    boundaries. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
    layered print, map, photograph, or painted wall surface; edges: hard cut edges beside torn, rubbed, or
