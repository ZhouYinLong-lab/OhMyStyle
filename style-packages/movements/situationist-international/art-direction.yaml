schema_version: 2.1.0
status: experimental
id: situationist-international-direction
name: 情境主义国际
base_package: movements/situationist-international
scope:
  medium: collage, found-image montage, and experimental graphic surface
  representation: stylized
  description: 以城市漂移、断裂地图、拼贴文本和对消费空间的重新编排，制造开放而批判性的视觉场景。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以城市漂移、断裂地图、拼贴文本和对消费空间的重新编排，制造开放而批判性的视觉场景。
- 'composition: Organize the image as a dérive: disconnected routes, cropped maps, found fragments, and a destabilized
  viewpoint.; Let text-like marks or diagrammatic traces act as spatial evidence, never as required readable
  copy.'
- 'palette: Combine weathered neutrals with one disruptive red, yellow, or electric blue intervention.; Keep
  collage layers visibly distinct rather than smoothing them into a decorative poster.'
- 'lighting: quality: ordinary urban light or flat printed illumination; behavior: Favor legibility of pasted
  surfaces, paper seams, and spatial contradictions over cinematic glamour.'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Organize the
    image as a dérive: disconnected routes, cropped maps, found fragments, and a destabilized viewpoint.; Let
    text-like marks or diagrammatic traces act as spatial evidence, never as required readable copy.. Preserve
    the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Organize the image
    as a dérive: disconnected routes, cropped maps, found fragments, and a destabilized viewpoint.; Let text-like
    marks or diagrammatic traces act as spatial evidence, never as required readable copy..'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: Organize
    the image as a dérive: disconnected routes, cropped maps, found fragments, and a destabilized viewpoint.;
    Let text-like marks or diagrammatic traces act as spatial evidence, never as required readable copy..'
  evidence:
    source_ids:
    - source-situationist-international-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Combine weathered neutrals with one
    disruptive red, yellow, or electric blue intervention.; Keep collage layers visibly distinct rather than
    smoothing them into a decorative poster.. Adapt their balance to the requested subject; do not apply them
    as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: Combine weathered neutrals
