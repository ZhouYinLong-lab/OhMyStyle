composition:
  - Organize the image as a dérive: disconnected routes, cropped maps, found fragments, and a destabilized viewpoint.
  - Let text-like marks or diagrammatic traces act as spatial evidence, never as required readable copy.
palette:
  - Combine weathered neutrals with one disruptive red, yellow, or electric blue intervention.
  - Keep collage layers visibly distinct rather than smoothing them into a decorative poster.
lighting:
  quality: ordinary urban light or flat printed illumination
  behavior:
    - Favor legibility of pasted surfaces, paper seams, and spatial contradictions over cinematic glamour.
surface:
  finish: layered print, map, photograph, or painted wall surface
  edges: hard cut edges beside torn, rubbed, or misregistered boundaries
texture:
  density: moderate and layered
  placement: concentrated at overlaps, pasted fragments, route marks, and erasures; keep the base field readable
invariants:
  - preserve the feeling of a route being discovered rather than a scene being illustrated
  - preserve visible layer conflicts and one deliberate intervention color
  - preserve open interpretation without forcing a political slogan or named city
