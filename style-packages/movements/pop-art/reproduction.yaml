medium: 丝网印刷、硬边平涂、重复和商业图像语法
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持消费图像的平面语言，不复制商标、明星或广告文案
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
