composition:
  - stack scenes in clear horizontal registers
  - use symmetry or rhythmic repetition before individual drama
  - compress narrative into readable silhouettes
form:
  edges: angular, incised, and sharply bounded
  bodies: triangular torsos, stick-like limbs, profile heads
  depth: shallow bands with little atmospheric recession
surface:
  - matte clay ground
  - slip-black motifs
  - meander, triangle, zigzag, and concentric motifs
color:
  - terracotta ground
  - charcoal black
  - cream highlights used sparingly
tone:
  - ceremonial
  - rhythmic
  - public and funerary
invariants:
  - ordered repetition carries meaning
  - the material support remains legible
  - figures read as signs before portraits
avoid:
  - smooth Renaissance anatomy
  - atmospheric landscape depth
  - photorealistic texture
  - random tribal-pattern decoration
