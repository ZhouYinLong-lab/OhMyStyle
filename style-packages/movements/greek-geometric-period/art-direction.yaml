schema_version: 2.1.0
status: experimental
id: greek-geometric-period-direction
name: 古希腊几何时期
base_package: movements/greek-geometric-period
scope:
  medium: 'support: hand-shaped terracotta vessel or flat clay panel; mark: dark slip, incised contour, repeated
    painted motif; finish: dry matte surface with slight firing variation'
  representation: stylized
  description: An early Greek visual system built from ordered registers, angular bodies, repeated signs, funerary
    procession, and a tightly controlled terracotta, black, and cream material language.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - Do not copy a specific reference composition, named character, logo, or branded layout.
pillars:
- An early Greek visual system built from ordered registers, angular bodies, repeated signs, funerary procession,
  and a tightly controlled terracotta, black, and cream material language.
- 'composition: stack scenes in clear horizontal registers; use symmetry or rhythmic repetition before individual
  drama; compress narrative into readable silhouettes'
- 'form: edges: angular, incised, and sharply bounded; bodies: triangular torsos, stick-like limbs, profile
  heads; depth: shallow bands with little atmospheric recession'
- 'palette: terracotta ground; charcoal black; cream highlights used sparingly'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: stack scenes
    in clear horizontal registers; use symmetry or rhythmic repetition before individual drama; compress narrative
    into readable silhouettes. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: stack scenes in clear
    horizontal registers; use symmetry or rhythmic repetition before individual drama; compress narrative into
    readable silhouettes.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: stack scenes
    in clear horizontal registers; use symmetry or rhythmic repetition before individual drama; compress narrative
    into readable silhouettes.'
  evidence:
    source_ids:
    - source-met-geometric
    - source-met-252849
    - source-met-240180
    basis: curatorial_inference
    visual_review: pending
- id: form
  axis: form
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply this package-specific visual rule: edges: angular, incised, and sharply bounded; bodies:
    triangular torsos, stick-like limbs, profile heads; depth: shallow bands with little atmospheric recession.
    Keep it subordinate to the requested subject and medium.'
  observable: 'The stated visual decision is plainly visible in the requested image: edges: angular, incised,
    and sharply bounded; bodies: triangular torsos, stick-like limbs, profile heads; depth: shallow bands with
    little atmospheric recession.'
  reject_when: 'The stated decision is absent, contradicted, or replaced by a generic filter: edges: angular,
    incised, and sharply bounded; bodies: triangular torsos, stick-like limbs, profile heads; depth: shallow
    bands with little atmospheric recession.'
  evidence:
    source_ids:
    - source-met-geometric
    - source-met-252849
    - source-met-240180
    basis: curatorial_inference
    visual_review: pending
- id: color
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: terracotta ground; charcoal black;
    cream highlights used sparingly. Adapt their balance to the requested subject; do not apply them as a uniform
    tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: terracotta ground; charcoal
    black; cream highlights used sparingly.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    terracotta ground; charcoal black; cream highlights used sparingly.'
  evidence:
    source_ids:
    - source-met-geometric
    - source-met-252849
    - source-met-240180
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: matte clay ground;
    slip-black motifs; meander, triangle, zigzag, and concentric motifs. Preserve detail hierarchy and material
    identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: matte clay
    ground; slip-black motifs; meander, triangle, zigzag, and concentric motifs.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
