canonical_name: 射线主义
entity_type: movement
domain: painting
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；抽象方向、光线和色场是视觉方法，不是固定物件。
  subjects: []
  exclusions:
    - 固定太阳、星空、城市或风景题材
    - 普通放射渐变、霓虹光束或纯几何海报
    - 复制具体作品、构图或文字
sources:
  - 'https://www.nationalgalleries.org/art-and-artists/glossary-terms/rayismrayonism'
  - 'https://www.moma.org/collection/works/80480?sov_referrer=theme&theme_id=5102'
notes:
  - 以交错的方向性光线和半透明色场拆解物体的视觉关系。
  - 线束既组织空间，也制造运动、折射和重叠的节奏。
