execution:
  route: text_only
  must:
  - 先读取用户主体的主要轮廓与方向，再拆成几个视觉平面。
  - 用不同方向的线束和色带重组这些平面，避免中心辐射模板。
  - 最后检查透明层是否仍然像颜料叠加，而不是数字发光。
  - 交错射线和色场共同承担空间组织
  - 颜色不是统一渐变，而是具有方向的绘画层
  - 可辨主体可以被拆解，但不自动替换为风景
  - 不固定人物、物体、地点或故事
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 默认太阳、星空、城市、风景或宇宙背景
  - 霓虹光束、玻璃渐变、光晕和赛博朋克界面
  - 只画规则矩形、圆形和直线的现代平面设计
  - 固定太阳、星空、城市或风景题材
  - 普通放射渐变、霓虹光束或纯几何海报
  - 复制具体作品、构图或文字
  - 不复现具体作品、文字、签名或固定叙事；代表图只展示视觉方法。
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
