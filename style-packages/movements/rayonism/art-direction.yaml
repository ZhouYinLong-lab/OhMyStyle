schema_version: 2.1.0
status: experimental
id: rayonism-direction
name: 射线主义
base_package: movements/rayonism
scope:
  medium: 20世纪初俄国先锋绘画
  representation: stylized
  description: 以相交射线、透明色带、碎裂平面和方向性运动组织非具象画面，让光线关系取代物体轮廓成为构图骨架。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - 固定太阳、星空、城市或风景题材
  - 普通放射渐变、霓虹光束或纯几何海报
  - 复制具体作品、构图或文字
pillars:
- 以相交射线、透明色带、碎裂平面和方向性运动组织非具象画面，让光线关系取代物体轮廓成为构图骨架。
- 'medium: 20世纪初俄国先锋绘画'
- 'composition: 用来自不同方向的斜线、折线和透明色带组织画面。; 让色带互相穿插，形成前后层次，而非从中心均匀发散。'
- 'palette: dominant: 钴蓝; dominant: 朱红; dominant: 藤紫; dominant: 土黄; dominant: 旧纸白; behavior: 颜色以相邻色带和透明叠加建立张力，保留画布底色。'
