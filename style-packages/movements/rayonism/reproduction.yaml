medium: 画布上的油彩或混合绘画媒介
materials:
  support: 粗纹画布、旧纸或带底色的绘画表面
  pigment: 不透明色与半透明色层交替
process:
  - 先读取用户主体的主要轮廓与方向，再拆成几个视觉平面。
  - 用不同方向的线束和色带重组这些平面，避免中心辐射模板。
  - 最后检查透明层是否仍然像颜料叠加，而不是数字发光。
technical_direction:
  contrast: 中等至较高，依靠色相与重叠关系建立对比
  saturation: 中高，保留底色和颜料混合
  perspective: 平面化并带有方向性空间
  detail_density: 中等，细节集中在交叉线束和层间关系
avoid:
  - 默认太阳、星空、城市、风景或宇宙背景
  - 霓虹光束、玻璃渐变、光晕和赛博朋克界面
  - 只画规则矩形、圆形和直线的现代平面设计
safety_note: 不复现具体作品、文字、签名或固定叙事；代表图只展示视觉方法。
