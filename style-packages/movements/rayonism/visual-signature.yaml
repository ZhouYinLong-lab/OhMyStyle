medium: 20世纪初俄国先锋绘画
composition:
  - 用来自不同方向的斜线、折线和透明色带组织画面。
  - 让色带互相穿插，形成前后层次，而非从中心均匀发散。
palette:
  dominant:
    - 钴蓝
    - 朱红
    - 藤紫
    - 土黄
    - 旧纸白
  behavior: 颜色以相邻色带和透明叠加建立张力，保留画布底色。
lighting:
  quality: 非自然的方向性光线与色面
  behavior:
    - 光线是构图材料，不是摄影棚光源或发光特效。
    - 透明叠加仍需保留笔触和纸面吸收感。
surface:
  finish: 手工绘画、薄涂、干刷与略带粗糙的画布
  edges: 线束边缘可有手工偏差，但交叉关系必须清楚
texture:
  density: 中等
  placement: 色带交叠处与画布底色之间保留不均匀性
invariants:
  - 交错射线和色场共同承担空间组织
  - 颜色不是统一渐变，而是具有方向的绘画层
  - 可辨主体可以被拆解，但不自动替换为风景
  - 不固定人物、物体、地点或故事
