medium: expressive oil, acrylic, and mixed paint surface
materials:
  support: coarse canvas or primed board
  tools:
    - stiff brush
    - palette knife
    - dry rag
process:
  - Block the user-supplied subject with simplified, slightly unstable masses.
  - Draw decisive dark contours around selected structural edges.
  - Push a few saturated color blocks against dirty neutrals.
  - Add thick, scraped, and dragged marks that remain visibly physical.
  - Reassert enough anatomy or object structure for the subject to remain readable.
technical_direction:
  contrast: strong local contrast with uneven value shifts
  saturation: medium to high, interrupted by dirty neutrals
  perspective: intentionally strained but spatially coherent
  detail_density: concentrated at collisions and focal forms
avoid:
  - fixed chair, portrait, skull, animal, ruin, or city scene
  - smooth painterly polish and generic filter language
safety_note: Do not reproduce a named artwork, artist signature, or recognizable source composition.
