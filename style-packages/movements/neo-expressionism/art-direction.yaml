joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - composition
  - palette
  - lighting
  instruction: Keep the package-specific relationship among composition, palette, lighting consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-neo-expressionism-moma
  kind: primary
  base_asset_id: neo-expressionism-moma
execution:
  route: text_only
  must:
  - Block the user-supplied subject with simplified, slightly unstable masses.
  - Draw decisive dark contours around selected structural edges.
  - Push a few saturated color blocks against dirty neutrals.
  - Add thick, scraped, and dragged marks that remain visibly physical.
  - Reassert enough anatomy or object structure for the subject to remain readable.
  - 形体仍能辨认，粗粝来自绘画动作而不是故意做坏。
  - 颜色与线条共同承担情绪，不只叠加一层红蓝滤镜。
  - 不复制某位艺术家的具体人物、构图或符号。
  avoid:
  - fixed chair, portrait, skull, animal, ruin, or city scene
  - smooth painterly polish and generic filter language
  - copied composition
  - fixed portrait or skull motif
  - generic abstract expressionism
  - childlike doodle without structure
  - smooth digital illustration
  - decorative impressionist brushwork
  - Do not reproduce a named artwork, artist signature, or recognizable source composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
