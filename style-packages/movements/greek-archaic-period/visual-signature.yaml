composition:
  - build a stable field around a central action or procession
  - fill negative space with controlled rosettes, lotuses, or small marks
  - use profile figures and overlapping limbs to clarify narrative
form:
  edges: firm contour with incised or reserved internal detail
  bodies: frontal or profile, increasingly observed but still patterned
  depth: shallow overlap, no atmospheric recession
surface:
  - warm orange clay
  - high-contrast dark figure field or reserved figure field
  - ornamental borders and repeated filler marks
color:
  - black or deep brown
  - orange-red clay
  - cream and muted red accents
tone:
  - declarative
  - narrative
  - ceremonial and competitive
invariants:
  - ornament supports the story
  - bodies remain contour-led
  - material and vessel geometry stay visible
avoid:
  - modern comic line art
  - photorealistic myth cinema
  - empty minimalist composition
  - arbitrary fantasy armor
