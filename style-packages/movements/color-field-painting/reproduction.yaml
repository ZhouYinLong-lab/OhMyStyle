reproduction:
  priority_order:
    - 用户主体与用途
    - 色域数量和面积比例
    - 边界、留白和空间关系
    - 颜料吸收与微小表面差异
  subject_rules:
    - 用户主体必须保留；色域规则不能强制完全抽象化。
    - 代表图中的无物体抽象画面只是测试主体，不进入默认提示词。
  transfer_rules:
    - 从用户主体或用途提炼少数主色域。
    - 让颜色承担空间和情绪，不用零碎装饰补充气氛。
    - 保持大面积表面连续，控制边界变化。
  forbidden_shortcuts:
    - 极光渐变、霓虹发光和随机彩色拼贴
    - 默认几何图形或符号
