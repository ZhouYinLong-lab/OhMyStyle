composition:
- 稳定的人体比例、清楚透视和金字塔式人物关系建立人文秩序
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 赭金、群青、朱红、石灰白和自然绿形成平衡色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 蛋彩或油画结合古典素描与清晰轮廓
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀主光塑造理想化体积，阴影柔和
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 石材、布料、皮肤和木材有雕塑性重量
- 不同材质保留可辨识的表面行为。
texture:
- 纹理服务结构，不追求随机表面噪声
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持古典比例、秩序和人文尺度，不复制名作构图
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
