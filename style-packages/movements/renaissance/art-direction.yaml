    Keep light coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: 均匀主光塑造理想化体积，阴影柔和; 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。.'
