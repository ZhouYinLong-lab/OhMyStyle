schema_version: 2.1.0
status: experimental
id: renaissance-direction
name: 文艺复兴
base_package: movements/renaissance
scope:
  medium: 蛋彩或油画结合古典素描与清晰轮廓; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 蛋彩或油画结合古典素描与清晰轮廓；稳定的人体比例、清楚透视和金字塔式人物关系建立人文秩序；赭金、群青、朱红、石灰白和自然绿形成平衡色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied_named_work
  - recognizable_source_arrangement
  - readable_logo_or_text
  - generic_global_filter
pillars:
- 蛋彩或油画结合古典素描与清晰轮廓；稳定的人体比例、清楚透视和金字塔式人物关系建立人文秩序；赭金、群青、朱红、石灰白和自然绿形成平衡色组。
- 'medium: 蛋彩或油画结合古典素描与清晰轮廓; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 稳定的人体比例、清楚透视和金字塔式人物关系建立人文秩序; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 赭金、群青、朱红、石灰白和自然绿形成平衡色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
