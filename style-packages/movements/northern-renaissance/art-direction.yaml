schema_version: 2.1.0
status: experimental
id: northern-renaissance-direction
name: 北方文艺复兴
base_package: movements/northern-renaissance
scope:
  medium: 细密油画、透明釉层与超写实小物; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 细密油画、透明釉层与超写实小物；室内细节、反射物和小尺度象征共同构成精密叙事；深红、墨绿、金黄、木棕和铅白形成细密色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied_named_work
  - recognizable_source_arrangement
  - readable_logo_or_text
  - generic_global_filter
pillars:
- 细密油画、透明釉层与超写实小物；室内细节、反射物和小尺度象征共同构成精密叙事；深红、墨绿、金黄、木棕和铅白形成细密色组。
- 'medium: 细密油画、透明釉层与超写实小物; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 室内细节、反射物和小尺度象征共同构成精密叙事; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 深红、墨绿、金黄、木棕和铅白形成细密色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
