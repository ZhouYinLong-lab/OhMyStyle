  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 粉紫 #D48BC7，角色：主色; 青绿 #72C3B7，角色：冷色;
    深靛 #29214E，角色：暗部. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
