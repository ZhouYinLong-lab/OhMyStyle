schema_version: 2.1.0
status: experimental
id: harlem-renaissance-direction
name: 哈莱姆文艺复兴
base_package: movements/harlem-renaissance
scope:
  medium: 绘画、海报、拼贴与舞台性构图结合; 媒介边缘、形体和细节密度保持一致。
  representation: stylized
  description: 绘画、海报、拼贴与舞台性构图结合；人物、音乐、城市街道和装饰平面共同形成文化自信的场景；深棕、金黄、孔雀蓝、朱红和黑色形成爵士般色组。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied_named_work
  - recognizable_source_arrangement
  - readable_logo_or_text
  - generic_global_filter
pillars:
- 绘画、海报、拼贴与舞台性构图结合；人物、音乐、城市街道和装饰平面共同形成文化自信的场景；深棕、金黄、孔雀蓝、朱红和黑色形成爵士般色组。
- 'medium: 绘画、海报、拼贴与舞台性构图结合; 媒介边缘、形体和细节密度保持一致。'
- 'composition: 人物、音乐、城市街道和装饰平面共同形成文化自信的场景; 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。'
- 'palette: 深棕、金黄、孔雀蓝、朱红和黑色形成爵士般色组; 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。'
