schema_version: 2.1.0
status: experimental
id: mexican-muralism-direction
name: 墨西哥壁画运动
base_package: movements/mexican-muralism
scope:
  medium: public-scale matte mural painting language
  representation: stylized
  description: 以公共尺度的整体构图、坚实轮廓、分层色块和壁面叙事秩序组织视觉信息，强调画面结构的可读性与公共空间感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以公共尺度的整体构图、坚实轮廓、分层色块和壁面叙事秩序组织视觉信息，强调画面结构的可读性与公共空间感。
- 'composition: 让画面像一面可以被远距离阅读的整体墙面，主体群组与背景色块形成明确层次。; 使用相互咬合的斜线、弧线和块面组织视线，避免细碎的写实景深。'
- 'palette: 以赭红、土黄、深蓝、墨绿和石灰白形成大块对比，颜色服务于结构与群体关系。; 允许局部高饱和，但整体保持矿物颜料般的厚重与统一。'
- 'lighting: quality: broad matte light with wall-scale tonal stability; behavior: 明暗来自体块和颜料密度，不依赖商业摄影式轮廓光或强烈戏剧投影。'
rules:
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 让画面像一面可以被远距离阅读的整体墙面，主体群组与背景色块形成明确层次。;
    使用相互咬合的斜线、弧线和块面组织视线，避免细碎的写实景深。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 让画面像一面可以被远距离阅读的整体墙面，主体群组与背景色块形成明确层次。;
    使用相互咬合的斜线、弧线和块面组织视线，避免细碎的写实景深。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 让画面像一面可以被远距离阅读的整体墙面，主体群组与背景色块形成明确层次。;
    使用相互咬合的斜线、弧线和块面组织视线，避免细碎的写实景深。.'
  evidence:
    source_ids:
    - source-mexican-muralism-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 以赭红、土黄、深蓝、墨绿和石灰白形成大块对比，颜色服务于结构与群体关系。;
    允许局部高饱和，但整体保持矿物颜料般的厚重与统一。. Adapt their balance to the requested subject; do not apply them as a uniform
    tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 以赭红、土黄、深蓝、墨绿和石灰白形成大块对比，颜色服务于结构与群体关系。;
    允许局部高饱和，但整体保持矿物颜料般的厚重与统一。.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    以赭红、土黄、深蓝、墨绿和石灰白形成大块对比，颜色服务于结构与群体关系。; 允许局部高饱和，但整体保持矿物颜料般的厚重与统一。.'
  evidence:
    source_ids:
    - source-mexican-muralism-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: broad matte light with wall-scale tonal
    stability; behavior: 明暗来自体块和颜料密度，不依赖商业摄影式轮廓光或强烈戏剧投影。. Keep light coherent with the requested subject, medium,
    and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: broad matte light
    with wall-scale tonal stability; behavior: 明暗来自体块和颜料密度，不依赖商业摄影式轮廓光或强烈戏剧投影。.'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: broad matte light
    with wall-scale tonal stability; behavior: 明暗来自体块和颜料密度，不依赖商业摄影式轮廓光或强烈戏剧投影。.'
  evidence:
    source_ids:
    - source-mexican-muralism-primary-source
    basis: curatorial_inference
    visual_review: pending
