medium: soft-focus fine-art photography with handmade print character
materials:
  support: original subject rendered through the package medium and surface logic
process:
  - 'compose with a clear tonal anchor'
  - 'soften selected edges optically'
  - 'build a restrained print tone'
  - 'add paper and emulsion character without obscuring form'
technical_direction:
  contrast: 'low-moderate with preserved middle tones'
  saturation: 'muted monochrome, sepia, or restrained color'
  perspective: 'quiet photographic depth with atmospheric recession'
avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or protected game asset.
