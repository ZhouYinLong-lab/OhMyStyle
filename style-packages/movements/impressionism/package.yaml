id: impressionism
name: 印象主义
kind: movement
domain: painting
version: 0.2.0
summary: >-
  An intentionally broad movement-level oil-painting direction: visible rapid
  marks, color carried through light and shadow, and a composed but immediate
  impression of a chosen subject. It preserves variation among artists rather
  than prescribing one painter's signature.
