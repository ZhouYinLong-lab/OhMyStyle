composition:
  - balance a dominant figure against stable architectural or ground cues
  - use a clear focal action with controlled secondary gestures
  - preserve legible negative space around the body
form:
  anatomy: naturalistic, proportioned, idealized without hypermuscular excess
  stance: poised weight shift or restrained contrapposto
  drapery: follows gravity and body structure in large calm folds
surface:
  - stone or bronze material remains legible
  - edges are clear but not diagrammatic
  - finish is controlled rather than distressed
color:
  - warm marble or muted earth
  - mineral blue, red, and ochre accents when painted
  - deep shadow used to model volume
tone:
  - lucid
  - poised
  - civic and humanist
invariants:
  - harmony is created by proportion and balance
  - action is intelligible without theatrical exaggeration
  - material and anatomy cooperate
avoid:
  - uniformly white modern marble cliché
  - superhero anatomy
  - baroque turbulence
  - romantic mist
