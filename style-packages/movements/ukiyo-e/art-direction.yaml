execution:
  route: text_only
  must:
  - block the user-supplied subject into a small number of readable planes
  - place contour lines and major silhouettes before decorative pattern
  - add limited pigment layers with one clear accent color
  - finish with restrained paper grain and registration variation
  - preserve print-like plane separation and contour hierarchy
  - preserve edited cropping and asymmetrical balance
  - keep the subject open; do not force bridges, lanterns, kimono, or Japanese architecture
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
