reproduction:
  priority_order:
    - 用户主体与用途
    - 色彩节奏和主要轮廓
    - 圆弧、扇面或色带的组织
    - 纸面和颜料细节
  subject_rules:
    - 用户主体必须保留；抽象化只改变视觉处理，不替换主体。
    - 代表图中的抽象构图不进入默认提示词。
  transfer_rules:
    - 从主体已有轮廓或空间关系中提取节奏。
    - 以色相对比制造光感，避免把光感写成发光特效。
    - 保持平面边界和有限手工质感。
  forbidden_shortcuts:
    - 极光渐变、霓虹光带、液态背景
    - 固定太阳、星球、唱片或窗户
