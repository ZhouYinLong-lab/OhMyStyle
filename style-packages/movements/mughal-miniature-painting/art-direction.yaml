execution:
  route: text_only
  must:
  - 先建立边框、分层平面和主体轮廓，保持空间层级清楚。
  - 再用不透明色块和细线逐层添加材质、服饰、植物或建筑细节。
  - 最后以少量亮色或金色样细节强调节奏，并控制空白区域的呼吸感。
  - 细密观察、轮廓秩序和多层平面在更换主体后仍然成立。
  - 不要求宫殿、皇帝、花园、狩猎、动物或波斯文字。
  - 复杂度来自局部精度与层级关系，不来自过度写实或随机装饰。
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - mandatory palace, royal hunt, garden, animal, or calligraphic text
  - glossy digital illustration, photorealistic lens blur, or 3D rendering
  - copying a specific manuscript folio or historical figure
  - copied folio composition
  - named historical figure as default subject
  - Do not reproduce a specific folio, recognizable historical figure, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
