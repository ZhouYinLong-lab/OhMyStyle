schema_version: 2.1.0
status: experimental
id: mughal-miniature-painting-direction
name: 莫卧儿细密画
base_package: movements/mughal-miniature-painting
scope:
  medium: opaque watercolor and ink on burnished paper
  representation: stylized
  description: 以细密笔触、清晰轮廓、层叠空间、平面化色块与精确自然观察组织画面，保留纸本、矿物色和金色装饰的手工感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied folio composition
  - named historical figure as default subject
pillars:
- 以细密笔触、清晰轮廓、层叠空间、平面化色块与精确自然观察组织画面，保留纸本、矿物色和金色装饰的手工感。
- 'composition: 用分层平面、窄边框、局部剖面和清晰轮廓组织空间，允许多个尺度同时存在。; 细节密集但层级明确，远近关系通过重叠、色值和边框而非强烈透视表达。'
- 'palette: 矿物感红、青绿、靛蓝、米色、棕色和少量金色形成清晰而克制的色块。; 颜色可以明亮，但保持纸面吸收和手工调色的微小差异。'
- 'lighting: quality: even manuscript illumination with selective modeled volume; behavior: 光线均匀，局部以细小明暗塑造体积，不使用电影式强光束。;
  behavior: 金色或亮色只强调边框、细节和层次，不把整幅画变成金属反光。'
