drawing:
  - contours are deliberate and anatomy is proportioned
  - bodies have weight, structure, and believable joints
  - drapery explains the body instead of becoming surface noise
composition:
  rule: Let subject matter determine the arrangement.
  valid_modes:
    - single figure with a quiet ground
    - small group with balanced counterweights
    - narrative scene with several connected actions
    - architectural, landscape, or domestic setting
  forbidden_assumption: The movement does not require a symmetrical hall, a central pair, or a philosopher assembly.
space:
  rule: Construct depth consistently, but do not force one-point perspective in every image.
  tools:
    - overlapping bodies
    - receding planes
    - measured architectural perspective when appropriate
    - atmospheric distance kept subordinate to drawing
light_and_color:
  - light describes volume without theatrical darkness
  - colors are mineral, warm, and controlled rather than neon or glossy
  - accents support hierarchy and material, not decoration for its own sake
surface:
  - fresco or tempera/panel surface may show restrained material variation
  - the image should feel made by a painter, not rendered by a 3D engine
tone:
  - lucid
  - measured
  - humane
  - composed
diagnostic_questions:
  - Would the scene still belong to the movement if the architecture were removed?
  - Are the figures organized by action rather than pasted into a template?
  - Does the composition remain readable without a famous central duo?
