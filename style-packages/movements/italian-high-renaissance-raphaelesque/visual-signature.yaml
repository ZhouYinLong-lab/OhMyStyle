composition:
  - establish a strong central vanishing point beneath a monumental arch
  - organize figures into balanced left and right groups around a central pair
  - use stairways and architectural bands to create a legible hierarchy
  - vary gestures while preserving overall equilibrium
form:
  anatomy: lucid, proportioned, idealized but physically credible
  poses: contrapposto, measured walking, seated discussion, pointing, reading
  drapery: broad gravity-following folds with clear silhouette
space:
  architecture: coffered barrel vault, arches, columns, distant sky opening
  perspective: one-point, symmetrical, deep but controlled
  crowding: dense intellectual gathering with readable figure groups
surface:
  - fresco-matte wall texture
  - softly integrated color transitions
  - crisp focal contours without photographic sharpness
color:
  - warm plaster and limestone
  - muted ultramarine and red drapery
  - ochre, terracotta, olive, and deep shadow
tone:
  - rational
  - serene
  - monumental
  - intellectually convivial
invariants:
  - architecture and figures form one coherent spatial system
  - balance is visible at both group and whole-wall scale
  - gestures communicate ideas and relationships
avoid:
  - chaotic baroque diagonals
  - dark tenebrism
  - generic fantasy temple
  - photorealistic movie crowd
