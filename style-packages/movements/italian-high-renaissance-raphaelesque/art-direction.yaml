id: italian-high-renaissance-raphaelesque-direction
name: 意大利文艺复兴盛期
base_package: movements/italian-high-renaissance-raphaelesque
scope:
  medium: 'support: fresco, tempera panel, or preparatory drawing; mark: clear underdrawing, thin layered color,
    restrained plaster or gesso variation; finish: matte, luminous, and materially quiet'
  representation: stylized
  description: A sixteenth-century Italian painting system built on careful drawing, proportioned figures,
    coherent space, calm narrative action, and controlled color; Raphael's School of Athens is one reference
    case, not a template.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - Do not copy a specific reference composition, named character, logo, or branded layout.
pillars:
- A sixteenth-century Italian painting system built on careful drawing, proportioned figures, coherent space,
  calm narrative action, and controlled color; Raphael's School of Athens is one reference case, not a template.
- 'composition: rule: Let subject matter determine the arrangement.; valid_modes: single figure with a quiet
  ground; valid_modes: small group with balanced counterweights; valid_modes: narrative scene with several
  connected actions; valid_modes: architectural, landscape, or domestic setting; forbidden_assumption: The
  movement does not require a symmetrical hall, a central pair, or a philosopher assembly.'
- 'composition: rule: Construct depth consistently, but do not force one-point perspective in every image.;
  tools: overlapping bodies; tools: receding planes; tools: measured architectural perspective when appropriate;
  tools: atmospheric distance kept subordinate to drawing'
- 'surface: fresco or tempera/panel surface may show restrained material variation; the image should feel made
  by a painter, not rendered by a 3D engine'
