package_id: italian-high-renaissance-raphaelesque
invariants:
  - id: drawing_and_proportion
    weight: 3
    test: Figures have stable anatomy, weight, joints, and deliberate contours.
  - id: subject_driven_composition
    weight: 3
    test: Arrangement follows the chosen subject instead of a repeated famous layout.
  - id: coherent_space
    weight: 2
    test: Depth is consistent through overlap, receding planes, or appropriate perspective.
  - id: open_modeling
    weight: 2
    test: Light describes volume without black theatrical shadow.
  - id: painted_material
    weight: 2
    test: Color and surface read as fresco, tempera, or drawing rather than CGI.
rejections:
  - School of Athens replica or near-replica
  - forced symmetrical hall
  - forced central pair
  - generic ancient-world fantasy
  - baroque or cinematic drama
minimum_score: 9
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
