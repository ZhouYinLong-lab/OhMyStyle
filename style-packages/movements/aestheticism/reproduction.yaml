medium: integrated decorative visual system
materials:
  support: user-specified object, room, image plane, or printed support
  surface: coordinated matte, satin, glazed, fibrous, or polished evidence
process:
  - keep the supplied subject authoritative
  - define a tonal and material family for subject and surroundings
  - coordinate pattern scale, silhouette, negative space, and surface response
  - use selective ornament rather than filling every empty area
  - resolve the image as one environment with clear object hierarchy
technical_direction:
  contrast: low to medium with deliberate accents
  saturation: medium and harmonized
  perspective: stable with optional flattening
  detail_density: organized medium-high
