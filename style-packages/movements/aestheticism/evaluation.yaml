profiles:
  generic:
    required:
      - subject and surrounding field form a coherent visual whole
      - pattern, material, and silhouette remain separately legible
      - color relationships are harmonized rather than filtered
      - no copied reference composition or branded material
    reject_if:
      - only a beige-and-gold filter remains
      - peacock, Japanese object, Victorian room, or floral wallpaper appears without request
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - subject identity remains primary over ornament
  still_life:
    required:
      - material and pattern hierarchy remain clear
minimum_score: 7
