joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-aestheticism-vam
  kind: primary
  base_asset_id: aestheticism-vam
- id: source-aestheticism-met
  kind: secondary
  base_asset_id: aestheticism-met
execution:
  route: text_only
  must:
  - keep the supplied subject authoritative
  - define a tonal and material family for subject and surroundings
  - coordinate pattern scale, silhouette, negative space, and surface response
  - use selective ornament rather than filling every empty area
  - resolve the image as one environment with clear object hierarchy
  - establish the supplied subject and its surrounding field
  - choose a restrained palette with one accent
  - coordinate silhouette, pattern scale, material gloss, and negative space
  avoid:
  - fixed peacocks, Japanese objects, Victorian rooms, or floral wallpaper
  - random luxury decoration
  - glossy generic fashion-advertising finish
  - flat color filter without material and proportional reasoning
  - copied composition
  - named artist or branded asset
  - recurring peacock, Japanese object, Victorian room, or floral motif
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
