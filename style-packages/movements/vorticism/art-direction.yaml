    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 黑、灰、米白作为结构底色，配以有限的红、黄、蓝或锈色硬边色块。;
