schema_version: 2.1.0
status: experimental
id: vorticism-direction
name: 旋涡主义
base_package: movements/vorticism
scope:
  medium: 硬边现代主义绘画、版式和综合平面构成
  representation: stylized
  description: 以硬边折线、机械时代的动势、强烈色面和向中心压缩的结构，制造短促而有能量的现代主义画面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以硬边折线、机械时代的动势、强烈色面和向中心压缩的结构，制造短促而有能量的现代主义画面。
- 'composition: 用对角线、折线、楔形和向内汇聚的结构组织视觉力量；让画面有明确的运动方向。; 主体可以保持具象，也可以被几何化，但不得被随机切碎到失去身份。'
- 'palette: 黑、灰、米白作为结构底色，配以有限的红、黄、蓝或锈色硬边色块。; 颜色之间要形成清楚的冲突和分区，不加入柔和渐变或糖果色氛围。'
- 'lighting: quality: 硬质方向光或平面化的高反差明暗，用于强调切面和方向，不制造真实机械反光。; behavior: 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。; behavior:
  保留用户指定的主体轮廓、位置和空间关系。'
