  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 用对角线、折线、楔形和向内汇聚的结构组织视觉力量；让画面有明确的运动方向。;
    主体可以保持具象，也可以被几何化，但不得被随机切碎到失去身份。. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 用对角线、折线、楔形和向内汇聚的结构组织视觉力量；让画面有明确的运动方向。;
    主体可以保持具象，也可以被几何化，但不得被随机切碎到失去身份。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 用对角线、折线、楔形和向内汇聚的结构组织视觉力量；让画面有明确的运动方向。;
    主体可以保持具象，也可以被几何化，但不得被随机切碎到失去身份。.'
