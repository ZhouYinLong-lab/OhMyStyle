composition:
  - '用对角线、折线、楔形和向内汇聚的结构组织视觉力量；让画面有明确的运动方向。'
  - '主体可以保持具象，也可以被几何化，但不得被随机切碎到失去身份。'
palette:
  - '黑、灰、米白作为结构底色，配以有限的红、黄、蓝或锈色硬边色块。'
  - '颜色之间要形成清楚的冲突和分区，不加入柔和渐变或糖果色氛围。'
lighting:
  quality: 硬质方向光或平面化的高反差明暗，用于强调切面和方向，不制造真实机械反光。
  behavior:
    - 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。
    - 保留用户指定的主体轮廓、位置和空间关系。
surface:
  finish: 平涂颜料、粗糙印刷、铅笔线、木刻感和略带磨损的纸面。
  edges: 保持主体边缘可辨；允许媒介造成的轻微不齐，但不使用发光描边或综合色隔离带。
texture:
  density: 低到中等；纹理服务于印刷边缘和色块交界，不变成油画厚重笔触。
  placement: 集中在材料边界、暗部或印刷交界处，不覆盖主体识别信息。
invariants:
  - '更换主体后仍然能观察到本包的媒介、构图、色彩和表面签名。'
  - '不要求特定人物、物件、地点、建筑、植物、车辆或故事作为默认内容。'
  - '示例主体只用于验证视觉迁移，不得泄漏到默认 Prompt。'

