package_id: diego-rivera
package_version: 0.2.0
profiles:
  generic:
    required:
    - package-specific visual signature is observable
    - composition remains coherent for a new subject
    - no copied reference composition or branded material
    - no fixed subject leaks into the output
    reject_if:
    - style is represented only by a global color filter
    - text, logo, watermark, or unintended signature is present
  portrait:
    required:
    - preserve the user-supplied person or object without adding a recurring figure
  still_life:
    required:
    - preserve the user-supplied objects and their count
  public_narrative_mural:
    required:
      - multiple requested activities connect as one wall-scale composition
      - people and environment share a readable scale and relation
      - contours and color planes remain legible at a distance
    reject_if:
      - an unrequested worker, factory, machine, emblem, or political symbol appears
      - a single activity is split into artificial panels
      - photorealistic depth or decorative texture obscures the narrative
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: Run at least two neutral-subject tasks from benchmarks/subject-independence.yaml.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Do not mark complete without outputs for at least two different subjects.
subject_independence_suite:
  status: pending
  fixture: benchmarks/subject-independence.yaml
  required_subjects:
  - ordinary-chair
  - unspecified-building
  evidence: Representative image is an anonymous demo, not a default subject requirement.
