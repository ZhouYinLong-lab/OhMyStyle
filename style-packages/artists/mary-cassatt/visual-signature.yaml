composition:
- 亲密的室内关系、偏近的裁切和自然姿态构成日常生活片段
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 柔和粉、薄荷绿、奶油黄、灰蓝和肤色形成轻盈色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 印象派笔触与粉彩般的柔软边缘
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 窗光均匀落在人物与织物上，阴影轻薄
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 织物、皮肤、纸张和木椅以细腻触感区分
- 不同材质保留可辨识的表面行为。
texture:
- 短笔触围绕人物姿态与光线分布，不覆盖面部结构
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持亲密但不摆拍的日常观察，不复制母子关系或具体室内布局
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
