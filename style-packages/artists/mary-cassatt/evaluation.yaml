package_id: mary-cassatt
package_version: 0.2.0
profiles:
  patterned-domestic-figure-scene:
    required:
    - requested figure and action remain readable against patterned planes
    - figure volume stays distinct from flatter decorative surfaces
    - viewpoint and crop support the requested composition
    reject_if:
    - unrequested family roles, Japanese props, flowers, or period costume appear
    - pattern overwhelms anatomy or replaces the requested setting
invariants:
- id: style_recognition
  weight: 3
  test: The package medium, edge, light, palette, and texture decisions remain recognizable
    after the subject changes.
- id: prompt_adherence
  weight: 3
  test: The requested subject, count, setting, and aspect ratio are followed without
    adding a copied source arrangement.
- id: material_readability
  weight: 2
  test: Requested materials and capture behavior remain visually distinguishable.
- id: human_artifact_control
  weight: 2
  test: Hands, faces, geometry, text, reflections, and repeated details do not show
    avoidable generative defects.
rejections:
- copied_named_work
- generic_global_filter
- unreadable_subject
- style_pollution
- unmotivated_extra_objects
minimum_score: 8
benchmark_suite:
- portrait
- still_life
- architecture_environment
- minimal_composition
- fuzzy_brief
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
