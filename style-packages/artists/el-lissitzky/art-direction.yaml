schema_version: 2.1.0
status: experimental
id: lissitzky-proun-architectonic-space
name: Lissitzky Proun architectonic space
base_package: artists/el-lissitzky
scope:
  medium: geometric_painting_or_spatial_graphic
  representation: stylized
  description: >-
    A focused direction based on El Lissitzky's Proun works from 1919–1927,
    where flat color planes and geometric volumes share an imagined, quasi-
    architectural space. Consistent axonometric cues and controlled color
    contrast create the sense that forms can float above, below, and through
    one another. This direction describes a specific artist-led transition
    between painting and architecture, not all Constructivism or a literal
    building method.
  required_contexts:
    - pictorial-architectonic-space
  incompatible_contexts:
    - paper-model-construction
    - flat-editorial-layout
    - naturalistic-perspective-rendering
  limitations:
    - Preserve the user-supplied subject, objects, relationships, and requested level of abstraction; do not default to red squares, slogans, stars, or political symbols.
    - Use axonometric or oblique depth only when it clarifies the requested composition; keep a coherent spatial reference instead of mixing arbitrary projections.
    - Suggest a transition between flat and volumetric form through image relationships; do not imply that the generated image is a physically buildable model.
contexts:
  - id: pictorial-architectonic-space
    description: The user requests a geometric composition where flat planes and volumes share an imagined space.
  - id: paper-model-construction
    description: The user requests a physically constructible paper model.
  - id: flat-editorial-layout
    description: The user requests a flat editorial layout.
  - id: naturalistic-perspective-rendering
    description: The user requires naturalistic perspective rendering.
  - id: geometric-blocks-or-volumes-in-imagined-space
    description: Geometric blocks or volumes are arranged in imagined space.
  - id: color-planes-distinguish-constructed-space
    description: Color planes distinguish parts of the requested constructed space.
pillars:
  - Balance flat geometric planes against a small number of volumetric forms so the image stays between graphic plane and imagined space.
  - Use consistent axonometric or oblique cues to let forms overlap and appear to pass above, below, or through one another.
  - Use color contrast to distinguish spatial roles and directional force, not as a fixed palette or surface wash.
  - Keep edges and internal subdivisions precise enough for the spatial construction to read.
rules:
  - id: plane-volume-interchange
    axis: geometric_form_and_depth
    importance: core
    when_contexts:
      - pictorial-architectonic-space
    applies_when: The requested image uses abstraction or stylized geometry to suggest space.
    instruction: Combine clearly flat color planes with a few geometric volumes that share the same imagined space; let overlap, partial occlusion, or edge continuity imply depth without turning the image into either a flat poster or a literal realistic room.
    observable: The viewer can distinguish planes from volumes and understand how they relate spatially, while the overall image remains an intentional constructed field.
    reject_when: All forms lie on one graphic layer, every shape becomes a fully shaded 3D object, or unrelated forms appear to occupy incompatible spaces.
    evidence:
      source_ids:
        - lissitzky-moma-proun-19d
        - lissitzky-moma-contrasts-of-form
      basis: institutional_description
      visual_review: pending
    avoid: flat poster-only treatment, photorealistic rooms, and random floating geometry
  - id: coherent-axonometric-relations
    axis: spatial_projection
    importance: core
    when_contexts:
      - geometric-blocks-or-volumes-in-imagined-space
    applies_when: The composition includes geometric blocks or volumes arranged in imagined space.
    instruction: Establish a small consistent set of oblique or axonometric directions and use them to organize overlaps, visible faces, and apparent movement; allow forms to float, but keep their orientation legible.
    observable: Directional edges agree enough to imply one constructed spatial field, and overlapping forms remain distinguishable.
    reject_when: Projection axes contradict one another without an intentional focal shift, or depth relies only on drop shadows.
    evidence:
      source_ids:
        - lissitzky-moma-new-man
        - lissitzky-moma-proun-19d
      basis: institutional_description
      visual_review: pending
    avoid: incompatible vanishing points, random rotation, and shadow-only depth
  - id: color-as-spatial-operator
    axis: color_and_material
    importance: core
    when_contexts:
      - color-planes-distinguish-constructed-space
    applies_when: The requested direction uses color planes to distinguish parts of a constructed space.
    instruction: Assign contrasting colors to selected planes or volumes so they clarify overlap, orientation, or visual force; maintain a restrained neutral field where needed and follow the user's palette if specified.
    observable: Color helps identify spatial roles and directional movement without becoming a universal red-black-white formula.
    reject_when: Saturation is decorative, colors ignore the form boundaries, or an unrequested political or typographic symbol is introduced.
    evidence:
      source_ids:
        - lissitzky-moma-contrasts-of-form
        - lissitzky-moma-proun-19d
      basis: institutional_description
      visual_review: pending
    avoid: fixed red-square motifs, global color filters, and text-led composition
active_rule_ids:
  - plane-volume-interchange
  - coherent-axonometric-relations
  - color-as-spatial-operator
joint_checks:
  - id: plane-volume-projection-coherence
    rule_ids:
      - plane-volume-interchange
      - coherent-axonometric-relations
      - color-as-spatial-operator
    instruction: Let planar forms, volumes, projection directions, and color contrast describe the same imagined space while preserving the user's requested content.
    observable: The image reads as a deliberate passage between flat composition and architectonic space, with each color and edge helping to orient the forms.
sources:
  - id: lissitzky-moma-proun-19d
    kind: museum_artwork_description
    url: https://www.moma.org/collection/works/79040
  - id: lissitzky-moma-new-man
    kind: museum_artwork_description
    url: https://www.moma.org/collection/works/88312
  - id: lissitzky-moma-contrasts-of-form
    kind: museum_catalogue
    url: https://assets.moma.org/documents/moma_catalogue_1733_300062754.pdf
execution:
  route: text_only
  must:
    - Declare the pictorial-architectonic-space context before applying this direction.
    - Preserve the user-supplied objects, their relationships, and requested abstraction level.
    - Keep plane-volume transitions and projection cues internally coherent.
    - Use color to clarify spatial roles while honoring any requested palette.
  avoid:
    - adding slogans, political symbols, stars, or a red-square motif without request
    - treating the composition as a buildable paper model or construction plan
    - reducing every form to a flat layout or converting every form to realistic 3D
