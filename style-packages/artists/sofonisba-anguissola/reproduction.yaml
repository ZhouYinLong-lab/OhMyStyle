medium: thin-layer oil-paint-like rendering over controlled preparatory drawing
materials: [fine brush, restrained glazing, quiet woven cloth, warm neutral ground]
process:
  - Establish the requested subject and a stable arrangement before adding decorative detail.
  - Define the main planes and contours with clear but gentle drawing.
  - Model faces and hands with small value shifts and warm reflected tones.
  - Use gaze, gesture, and optional held objects to clarify interaction when people are requested.
  - Finish only selected fabrics and small objects; keep the background subordinate.
technical_direction: Preserve individualized features and natural gesture. Avoid idealized uniform faces, heavy contouring, and dramatic spotlight effects.
safety_note: Use observable traits only. Do not reconstruct a named sitter, portrait, garment, object, logo, text, or exact composition.
