package_id: sofonisba-anguissola
package_version: 0.1.0
invariants:
- id: style_recognition
  weight: 3
  test: Controlled Renaissance modeling, individualized expression, and selective fine detail remain visible across changed
    subjects.
- id: prompt_adherence
  weight: 3
  test: The requested subject and setting are followed without adding a default court, family, or historical narrative.
- id: expression_and_gesture
  weight: 2
  test: If people are requested, their gaze and gestures are natural and support the requested interaction.
- id: material_readability
  weight: 2
  test: Skin, cloth, and hard materials remain distinguishable without theatrical contrast.
