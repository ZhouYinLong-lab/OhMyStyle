composition:
  - When people are requested, use reciprocal gaze, a small gesture, or a held object to clarify their relationship without inventing a story.
  - Favor a stable, legible arrangement with figures placed close enough for their expressions and hands to matter.
  - Keep the setting sparse or softly described so it supports the sitter rather than competing for attention.
palette:
  - Use warm, natural skin tones, deep but varied darks, and restrained muted colors.
  - Let small highlights describe fabric, jewelry, or an object; avoid decorative excess.
medium:
  - Suggest thin, carefully blended oil paint with crisp structural drawing beneath soft transitions.
  - Use fine, controlled marks for facial features and hands, with broader quiet passages elsewhere.
lighting:
  - Use even, soft illumination that reveals expression and form without a theatrical spotlight.
  - Keep shadows warm and moderate; do not convert the image to high-contrast tenebrism.
surface:
  - Maintain a smooth, resolved finish while allowing subtle paint variation.
  - Distinguish skin, cloth, and hard objects through restrained value and texture changes.
texture:
  - Keep brush marks subordinate to accurate physiognomy and clear gesture.
invariants:
  - Expression and interpersonal attention carry as much weight as formal status.
  - A few precise details anchor an otherwise quiet, controlled surface.
  - Do not add royal symbols, period costume, or a portrait setup unless requested.
