package_id: grant-wood
package_version: 0.2.0
profiles:
  composed-regional-landscape:
    required:
    - requested activity and location remain primary
    - rolling forms and vertical accents establish deliberate landscape rhythm
    - a path or gesture leads the eye when it fits the scene
    reject_if:
    - iconic Grant Wood figures, pitchfork, or copied triangular arrangement appear
    - unrequested farm or Midwest details replace the requested setting
    - uniform detail or global color wash flattens the focal hierarchy
invariants:
- id: signature
  weight: 3
  test: 乡土几何、清晰垂直形、冷静中西部色调与细密描绘
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
