medium: fine-detail surrealist painting with restrained old-master surface
materials:
- 薄层油彩
- 细笔轮廓
- 柔和底色
- 局部精细纹理
process:
- 先构建安静空间和主体关系
- 再加入一到两个异常形象
- 用有限色组和细节层级完成
- 去除无功能的奇观元素
technical_direction: 保持画面克制和可读；不要用过度锐化、恐怖血腥或随机超现实物体替代构思。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
