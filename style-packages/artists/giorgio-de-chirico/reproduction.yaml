medium: metaphysical oil-painting cityscape with simplified classical forms
materials:
- 平滑油彩底
- 干燥墙面色块
- 细致建筑边缘
- 柔和远景空气层
process:
- 先建立透视和广场空场
- 再安排单一异物或尺度线索
- 用长阴影固定时间感
- 最后削减多余细节
technical_direction: 保持透视清晰、色彩克制和静止节奏；不要生成随机超现实拼贴。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
