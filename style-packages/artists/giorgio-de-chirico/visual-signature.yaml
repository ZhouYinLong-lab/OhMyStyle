composition:
- 建筑透视线和长阴影把视线引向空旷深处
- 主体数量少但关系有悬念
- 远处可有小型人物或列车作为尺度线索
palette:
- 赭黄、土红、蓝绿阴影、乳白天空和深棕构成干燥色组
- 天空与建筑有明确分区
- 避免浓艳现代霓虹
medium:
- 平静而坚实的油画表面
- 古典建筑细节与简化形体并置
- 硬边和柔和空气透视并存
lighting:
- 低角度长阴影
- 光线像来自不可见的傍晚太阳
- 阴影有几何形状
surface:
- 墙面、石材、木箱和雕像质感简化但可信
- 画面不靠厚重笔触制造神秘
texture:
- 纹理少、空间静
- 远景略有干燥空气感
invariants:
- 神秘来自空间逻辑与时间错位
- 空旷不等于废墟灾难
- 不复制原作广场布局
