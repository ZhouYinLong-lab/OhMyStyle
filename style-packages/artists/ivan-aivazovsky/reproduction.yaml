medium: romantic oil seascape with layered atmosphere and directional water strokes
materials:
- 薄层油彩
- 透明罩染
- 不透明浪花高光
- 软硬笔触混合
process:
- 先确定地平线与天气
- 再铺海天大色层
- 用主光源建立海面反射路径
- 最后加入少量船只或岸线尺度锚点
technical_direction: 保持真实空气透视和统一光源；避免把海水变成均匀蓝色或发光特效。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
