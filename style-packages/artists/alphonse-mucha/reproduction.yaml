medium: decorative lithographic illustration simulation
materials:
  support: warm paper, ink contour, flat gouache-like pigment, restrained metallic accent
process:
  - Identify the user's subject and preserve its main silhouette.
  - Construct a border or arabesque rhythm that frames the subject without prescribing content.
  - Add flat color fields, continuous contours, and selective modeling.
  - Use fine paper and print texture only after the visual hierarchy is stable.
technical_direction:
  contrast: medium contour-to-paper separation
  saturation: muted mineral palette with selected accents
  perspective: flattened decorative staging
  detail_density: medium-high in ornament and contours
avoid:
  - fixed female portrait, flower, advertisement, readable text, or copied poster
safety_note: This package transfers observable decorative language, not the content of any source work.
