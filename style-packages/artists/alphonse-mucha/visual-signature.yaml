composition:
  - clear central or offset silhouette enclosed by flowing ornamental rhythm
  - flat decorative space with controlled border hierarchy
palette:
  - warm paper, muted teal, olive, dusty rose, and antique gold accents
  - color blocks remain separate and decorative
lighting:
  quality: even illustrated light
  behavior:
    - contours and value groups shape volume without theatrical chiaroscuro
surface:
  finish: paper, ink, gouache, and fine lithographic texture
  edges: continuous graceful contours and repeated arabesque curves
texture:
  density: fine, consistent, and subordinate to silhouette
  placement: border, foliage, fabric, hair, and paper grain
invariants:
  - line rhythm and ornamental framing survive subject substitution
  - decoration supports the user's subject
  - no fixed woman, flower, advertisement, or text
not_equivalent_to:
  - generic art nouveau filter
  - sepia portrait with flowers
  - copied poster composition
