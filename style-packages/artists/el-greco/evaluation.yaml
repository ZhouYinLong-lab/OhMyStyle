package_id: el-greco
package_version: 0.2.0
profiles:
  vertical-lift-composition:
    required:
      - selected forms support a rising path and remain recognizable
      - brush rhythm and color contrast are localized to the focal movement
      - the user's requested subject, setting, action, and count are preserved
    reject_if:
      - saints, angels, religious narrative, halo, or supernatural glow appears without request
      - all contours flicker or all forms are stretched uniformly
      - arbitrary distortion damages identity, anatomy, or object structure
invariants:
- id: signature
  weight: 3
  test: 拉长形体、垂直升腾、冷色灵光与压缩空间
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
