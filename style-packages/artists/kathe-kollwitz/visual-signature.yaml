composition:
  - 紧凑取景与大块留白并置。
  - 轮廓、手势和重心先于装饰细节。
palette:
  - 墨黑、炭灰、暖纸白组成有限阶调。
lighting:
  quality: 直接、克制、强调黑白重量
  behavior:
    - 阴影由线网和黑块构成，不使用彩色轮廓光。
surface:
  finish: 可见的木刻、石版或炭笔痕迹
  edges: 手工抖动但不失去主体辨识度
texture:
  density: 中高
  placement: 阴影、布料、木材和纸面边缘
invariants:
  - 版画性的线性结构不可被普通黑白滤镜替代
  - 主体保持可辨识且具有重量
  - 风格不规定人物、物体、地点或故事
