profiles:
  generic:
    required:
      - limited black-and-white printmaking structure is visible
      - line networks and solid masses shape volume
      - user-supplied subject remains recognizable
      - no copied artwork or fixed narrative motif
    reject_if:
      - result is only a grayscale filter
      - smooth digital gradients replace marks
      - text, logo, watermark, or unintended signature appears
  portrait:
    required:
      - face and pose remain legible under the graphic treatment
  still_life:
    required:
      - object edges and material separation survive the dense marks
minimum_score: 7
