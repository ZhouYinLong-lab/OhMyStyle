  accessed: 2026-10-19
- url: https://whitney.org/education/blog/notes-for-a-painting
  authority: Whitney Museum of American Art
  title: 'Hopper Drawing: Notes For A Painting'
  supports: preparatory notes on warm and cool colors and which architectural planes are in shadow
  accessed: 2026-10-19
- url: https://whitney.org/education/schools-educators/k-12/teaching-materials/teacher-guides/hopper-new-york/reality-fantasy
  authority: Whitney Museum of American Art
