medium: modern realist oil-painting scene with geometric light and quiet distance
materials:
- 薄到中厚油彩
- 平整大色面
- 硬边建筑轮廓
- 局部柔化过渡
process:
- 先搭建建筑框架与视点
- 再确定单一主光方向
- 放置少量人物或物件
- 最后削减多余叙事线索
technical_direction: 保持光影几何和空间比例；不要把静默场景处理成海报或电影截图。
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
