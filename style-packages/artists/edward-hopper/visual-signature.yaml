composition:
- 窗、门、街角和道路构成稳定几何框架
- 人物与空间有明显距离
- 画面常保留大片空墙或天空
palette:
- 奶油白、土黄、砖红、深绿和蓝灰构成克制暖冷色组
- 局部强光与深影形成心理张力
- 不做综合色雾化
medium:
- 平整而坚实的油画块面
- 建筑边缘清楚
- 人物姿态简化但有重量
lighting:
- 强方向日光或室内窗光
- 投影和亮面形状明确
- 光线不是金色滤镜
surface:
- 墙面、玻璃、木材、布料和皮肤表面分明
- 笔触隐约但不炫技
texture:
- 中低频画面纹理
- 细节服务空间心理而不平均分布
invariants:
- 孤独感来自构图距离和光线，不靠夸张表情
- 场景仍然是具体日常空间
- 不复刻原作人物和房屋
