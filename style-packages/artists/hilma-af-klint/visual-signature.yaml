composition:
- 中心轴、圆环、螺旋和对称结构组织画面
- 形体之间有层级但不必服从透视
- 留白与符号群保持平衡
palette:
- 淡粉、黄、蓝、紫、绿色与黑白形成精神性对照
- 颜色块边界清楚但允许手绘不均
- 冷暖与互补关系明确
medium:
- 蛋彩或油彩式平面绘画
- 细线和几何色面并置
- 手工颜料边缘
lighting:
- 不依赖自然光体积
- 明度通过色面关系而非写实阴影建立
surface:
- 画布或纸面的薄涂、叠色与细微不均
- 避免数字镜面光
texture:
- 纹理克制，服务色面和线条
- 不做厚重随机笔触
invariants:
- 抽象系统必须有内部秩序
- 符号不指向特定宗教文本
- 不复制原作图式
