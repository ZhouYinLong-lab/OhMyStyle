schema_version: 2.1.0
status: experimental
id: van-gogh-directional-impasto
name: Van Gogh directional impasto
base_package: artists/vincent-van-gogh
scope:
  medium: oil_painting
  representation: stylized
  description: Translate Van Gogh's observable directional mark-making, local blue-yellow color structure, and tactile paint into new subjects without copying a named composition or treating a famous motif as mandatory.
  required_contexts: []
  incompatible_contexts:
    - smooth-digital-painting
    - photographic-texture-overlay
  limitations:
    - Do not make a night sky, cypress, village, or sunflower a default subject; follow the user's requested subject.
    - Do not infer that every mark in Van Gogh's work follows one uniform curve or direction.
contexts:
  - id: smooth-digital-painting
    description: The user requires smooth digital painting without visible directional paint marks.
  - id: photographic-texture-overlay
    description: The user requires a photographic texture overlay.
  - id: close-view-of-painted-surface
    description: The user requests a close view where loaded, directional paint edges should remain legible.
pillars:
  - Organize brush marks by the form and movement of each surface.
  - Build color relationships locally, especially cool blue-violet against warm yellow, rather than applying a global filter.
  - Let paint thickness and visible edges carry material evidence.
rules:
  - id: surface-following-mark-families
    axis: texture
    importance: core
    applies_when: always
    instruction: "Assign distinct mark families to each surface: curved or interlocking strokes for moving atmospheres, short grouped marks for foliage, and longer directional strokes for ground or built forms."
    observable: Mark direction changes with the surface or movement, and focal forms remain legible beneath the stroke rhythm.
    reject_when: One repeated swirl covers every object, or marks become random noise unrelated to form.
    evidence:
      source_ids:
        - vangogh-moma-starry-night
        - vangogh-moma-olive-trees
      basis: direct_visual_observation
      visual_review: pending
    avoid: one uniform spiral texture across the entire image
  - id: local-cool-warm-color-structure
    axis: palette
    importance: core
    applies_when: always
    instruction: Place warm yellow or ochre accents against selected blue-violet fields and use chromatic greens or earth colors where the subject supports them; keep each relationship attached to a form or light source.
    observable: Cool and warm passages shape focal hierarchy, with dark anchors and intervening color transitions still visible.
    reject_when: A blue overlay with scattered yellow dots substitutes for structured color relationships.
    evidence:
      source_ids:
        - vangogh-moma-starry-night
        - vangogh-moma-olive-trees
      basis: institutional_description
      visual_review: pending
    avoid: global blue filter and unstructured yellow speckles
  - id: tactile-loaded-paint
    axis: surface
    importance: core
    applies_when: always
    instruction: Show loaded oil paint through raised, directional stroke edges and varied stroke length; keep highlights materially painted instead of airbrushed.
    observable: The painted surface remains tactile at close range while major masses stay readable at a distance.
    reject_when: Smooth digital shading or a uniform bump texture replaces visible, varied paint marks.
    evidence:
      source_ids:
        - vangogh-moma-starry-night
      basis: institutional_description
      visual_review: pending
    avoid: airbrushed glow and uniform embossed texture
  - id: close-view-of-directional-impasto
    axis: surface_and_detail
    importance: supporting
    when_contexts:
      - close-view-of-painted-surface
    applies_when: The user requests a close view of an oil-painted surface.
    instruction: Keep selected raised paint edges, overlaps, and changes in stroke length visible at close range; let the mark direction continue to follow the depicted forms instead of adding an even texture layer.
    observable: Close details reveal varied paint handling while the larger color masses and subject remain readable.
    reject_when: The surface becomes uniformly embossed, gritty, or so enlarged that the underlying form disappears.
    evidence:
      source_ids:
        - vangogh-moma-starry-night
      basis: direct_visual_observation
      visual_review: pending
    avoid: global canvas grain, uniform impasto relief, and texture unrelated to form
active_rule_ids:
  - surface-following-mark-families
  - local-cool-warm-color-structure
  - tactile-loaded-paint
  - close-view-of-directional-impasto
joint_checks:
  - id: mark-color-form-coherence
    rule_ids:
      - surface-following-mark-families
      - local-cool-warm-color-structure
      - tactile-loaded-paint
      - close-view-of-directional-impasto
    instruction: Make mark direction, local color contrast, and paint load reinforce the same forms; retain an original composition that follows the user's subject.
    observable: Stroke families clarify the forms carrying the warm-cool contrasts, and paint remains materially visible without reproducing a recognized composition.
sources:
  - id: vangogh-moma-starry-night
    kind: museum_object_description
    url: https://www.moma.org/collection/works/79802
  - id: vangogh-moma-olive-trees
    kind: museum_object_description
    url: https://www.moma.org/collection/works/80013
execution:
  route: text_only
  must:
    - Follow the user-requested subject, count, setting, and layout.
    - Vary stroke direction and length according to each surface.
    - Keep paint marks visible without using a single texture filter.
  avoid:
    - copying a named Van Gogh composition or placing its signature motifs by default
    - random all-over swirls, smooth airbrushed shading, or a global blue-yellow overlay
