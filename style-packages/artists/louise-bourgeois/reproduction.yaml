medium: mixed-media visual language
materials:
  support: user-specified support with visible grain or absorbency
  surface: plaster-like, paper-like, wood-like, textile, or restrained metal evidence
process:
  - define the supplied subject before style compilation
  - create a quiet structural frame and reserve meaningful negative space
  - model one biomorphic counter-form without changing the subject identity
  - expose joins, repairs, pressure marks, or dry edges where physically plausible
  - balance the result through local tonal edits, not a global distress filter
technical_direction:
  contrast: medium-high local contrast, open shadows
  saturation: low to medium with a single accent
  perspective: stable and slightly compressed
  detail_density: medium, concentrated at material transitions
