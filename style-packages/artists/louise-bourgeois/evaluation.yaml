profiles:
  generic:
    required:
      - architectural and organic geometry remain visibly distinct
      - material evidence is localized and physically plausible
      - new subject remains recognizable
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by brown-gray color grading
      - a spider, cage, cell, or body part appears without user request
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - face and body remain user-specified rather than symbolic substitutions
  still_life:
    required:
      - objects remain separate and materially legible
minimum_score: 7
