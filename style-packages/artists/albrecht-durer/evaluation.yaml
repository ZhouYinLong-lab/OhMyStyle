profiles:
  generic:
    required:
      - contour establishes subject before fine detail
      - hatch direction follows form and line density explains value
      - paper highlights remain visible
    reject_if:
      - cross-hatching is uniform across the image
      - a signature, monogram, or historical motif appears without request

