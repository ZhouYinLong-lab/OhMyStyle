schema_version: 2.1.0
status: experimental
id: beardsley-ink-mass-and-negative-space
name: Beardsley ink mass and negative space
base_package: artists/aubrey-beardsley
scope:
  medium: pen_and_ink_illustration
  representation: stylized
  description: >-
    A black-and-white illustration direction built from decisive ink masses,
    fluid calligraphic contours, and open paper fields. Line density and black
    area are deliberately unequal: they guide the eye instead of describing
    every surface evenly.
  required_contexts:
    - black-and-white-ink-illustration
  incompatible_contexts:
    - color-led-poster
    - painterly-gradient-rendering
    - photorealistic-rendering
  limitations:
    - Keep the user's subject and layout authoritative; do not add period costume, literary characters, grotesques, or decorative framing unless requested.
    - Use black ink and paper white as the default value system; do not add color or gray wash unless requested.
    - Preserve broad quiet paper areas so fine line work and solid blacks remain legible.
contexts:
  - id: black-and-white-ink-illustration
    description: The user requests a black-and-white ink illustration on a light ground.
  - id: color-led-poster
    description: The user requires a color-led poster treatment.
  - id: painterly-gradient-rendering
    description: The user requires painterly gradients rather than ink shape design.
  - id: photorealistic-rendering
    description: The user requires photorealistic rendering.
  - id: readable-outer-silhouette-or-overlap
    description: The requested subject has a readable outer silhouette or overlapping forms.
  - id: distinct-focal-passage
    description: A focal object or passage can carry more detail than the surrounding image.
pillars:
  - Let a few solid black shapes and open paper fields establish the composition before detail.
  - Use fluid, varied ink contours with deliberate starts, tapers, and changes of weight.
  - Concentrate line detail in selected focal passages and leave other surfaces nearly blank.
  - Keep ornament subordinate to the requested silhouette and spatial reading.
rules:
  - id: black-mass-paper-counterweight
    axis: composition_and_value
    importance: core
    when_contexts:
      - black-and-white-ink-illustration
    applies_when: The requested image uses black ink on a light ground.
    instruction: Organize the subject with a small number of clear black masses balanced by broad untouched paper; use white gaps inside or around forms to keep their edges readable.
    observable: The composition reads at thumbnail size through black-white balance before any fine detail is noticed.
    reject_when: Every area has similar gray density, black fill merges separate forms, or there is no calm open paper.
    evidence:
      source_ids:
        - beardsley-met-black-cat
        - beardsley-orsay-profile
      basis: institutional_description
      visual_review: pending
    avoid: gray gradients, uniform midtone, and undifferentiated black fill
  - id: calligraphic-contour-hierarchy
    axis: line_and_edge
    importance: core
    when_contexts:
      - readable-outer-silhouette-or-overlap
    applies_when: The subject has a readable outer silhouette or overlapping forms.
    instruction: Draw contours as confident ink decisions, varying thickness, taper, and curvature to separate near and far edges; use solid brush shapes where a line should become a mass.
    observable: The outline has a controlled rhythm and the silhouette remains clear without a mechanically uniform stroke.
    reject_when: Every edge uses the same vector-like width, or hatch and outline compete equally across the whole image.
    evidence:
      source_ids:
        - beardsley-orsay-profile
        - beardsley-met-black-cat
      basis: institutional_description
      visual_review: pending
    avoid: uniform technical outlines and automatic contour tracing
  - id: selective-detail-open-paper
    axis: detail_density
    importance: core
    when_contexts:
      - distinct-focal-passage
    applies_when: A focal object or passage can carry more detail than the surrounding image.
    instruction: Place fine line work only where it clarifies a requested material, overlap, or focal feature; let secondary surfaces resolve as clean paper or a single ink shape.
    observable: A clear focal passage contrasts with quieter regions, and the image does not depend on all-over ornament.
    reject_when: Hatching and decoration cover every surface or unrelated motifs fill the negative space.
    evidence:
      source_ids:
        - beardsley-met-black-cat
        - beardsley-vam-profile
      basis: institutional_description
      visual_review: pending
    avoid: uniform hatching, unrequested flourishes, and decorative borders
active_rule_ids:
  - black-mass-paper-counterweight
  - calligraphic-contour-hierarchy
  - selective-detail-open-paper
joint_checks:
  - id: silhouette-line-space-coherence
    rule_ids:
      - black-mass-paper-counterweight
      - calligraphic-contour-hierarchy
      - selective-detail-open-paper
    instruction: Keep black mass, contour rhythm, and fine detail in service of one readable silhouette with deliberately open paper around it.
    observable: The subject reads first as a black-white design, then as a controlled ink drawing with selective detail.
sources:
  - id: beardsley-met-black-cat
    kind: museum_object_description
    url: https://www.metmuseum.org/art/collection/search/753519
  - id: beardsley-orsay-profile
    kind: museum_artist_profile
    url: https://www.musee-orsay.fr/en/program/whats-on/exhibitions/presentation/aubrey-beardsley-1872-1898
  - id: beardsley-vam-profile
    kind: museum_artist_profile
    url: https://www.vam.ac.uk/articles/aubrey-beardsley-decadence-desire
execution:
  route: text_only
  must:
    - Declare the black-and-white-ink-illustration context before applying this direction.
    - Preserve the requested subject, count, and layout.
    - Establish black-white balance before fine detail.
    - Keep contour weight and detail density varied.
  avoid:
    - adding recurring literary, grotesque, or period motifs
    - adding decorative frames or all-over ornament without request
    - replacing ink shape design with gradients or color-led treatment
