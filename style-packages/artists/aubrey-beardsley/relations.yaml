distinctives:
  - Unlike Alphonse Mucha's color-led poster design, this profile uses strict black-white mass, calligraphic contour, and unevenly distributed detail to make illustration and page space work together.
avoid_overlap:
  - Do not introduce Mucha-like colored halos or poster lettering.
  - Do not fill every area with decorative pattern or crosshatching.
  - Do not replace organic contour with geometric constructivist forms.
