schema_version: 2.0.0
status: experimental
id: friedrich-human-scale-and-vastness
name: Friedrich human scale and vastness
base_package: artists/caspar-david-friedrich
scope:
  medium: oil_painting
  representation: stylized
  description: >-
    A landscape-only direction that makes the viewer feel the distance between a
    finite human presence and an expansive natural world through scale, a quiet
    horizon, and selective visibility. Atmospheric effects support this relationship
    but do not become the subject.
  required_contexts:
    - landscape-view
  incompatible_contexts:
    - object-only-still-life
    - photorealistic-landscape
  limitations:
    - Preserve the requested location, weather, time, and figure count; never add a wanderer, monk, ruin, cross, mountain, or fog by default.
    - A person viewed from behind is optional and only appears when the prompt requests a person or a human viewpoint.
    - Keep the scene contemplative through scale and spacing, not through invented religious or national symbolism.
pillars:
  - Establish a deliberate scale gap between a human presence, when requested, and the landscape around it.
  - Give broad, quiet areas of sky, water, or terrain enough space to carry the scene's emotional weight.
  - Reveal distant forms selectively so that the viewer senses what lies beyond the visible scene.
  - Use restrained, materially observed foreground detail against simplified distant landforms; weather serves the spatial idea rather than decorating every plane.
rules:
  - id: human-measure-without-default-figure
    axis: scale_and_viewpoint
    importance: core
    applies_when: The requested landscape includes a person or implies an observer's viewpoint.
    instruction: Use the requested person's scale and placement to measure the surrounding land or sky; a back-facing stance may invite looking into the view, but do not add or enlarge a figure beyond the prompt.
    observable: The relationship between person and landscape is immediately legible, while the person remains anonymous unless the prompt specifies identity or detail.
    reject_when: A person is inserted without request, dominates the scene without purpose, or becomes a copied iconic wanderer.
    evidence:
      source_ids:
        - friedrich-met-soul-of-nature
        - friedrich-nga-northern-landscape
      basis: institutional_description
      visual_review: pending
    avoid: unsolicited back-facing wanderers, heroic portraits, and fixed clothing or props
  - id: expansive-quiet-field
    axis: composition
    importance: core
    applies_when: always
    instruction: Reserve broad, low-detail areas of sky, sea, or land and place the horizon or major land masses with deliberate weight; let the requested subject feel small or exposed only when that relationship fits the prompt.
    observable: Open space is an active part of the composition, and a few grounded forms anchor the viewer without turning the scene into an ornamental panorama.
    reject_when: Every region is filled with landmarks and detail, or forced emptiness makes the requested subject difficult to read.
    evidence:
      source_ids:
        - friedrich-met-soul-of-nature
        - friedrich-nga-northern-landscape
      basis: curatorial_inference
      visual_review: pending
    avoid: crowded scenic detail, postcard panoramas, and empty space with no spatial role
  - id: partial-revelation-and-material-contrast
    axis: space_and_surface
    importance: core
    applies_when: The requested landscape contains distance, haze, cloud, or a visible transition between near and far forms.
    instruction: Let selected foreground rock, vegetation, or shoreline carry precise material cues while distant forms emerge or disappear in broad, quiet value masses; use only the weather or obscuration requested.
    observable: The viewer can distinguish near material from far atmosphere, and visibility changes support depth without relying on uniform mist or blur.
    reject_when: Fog is added without request, distant forms are uniformly blurred, or all planes have equal descriptive detail.
    evidence:
      source_ids:
        - friedrich-met-soul-of-nature
        - friedrich-nga-northern-landscape
      basis: institutional_description
      visual_review: pending
    avoid: uniform fog overlays, photographic depth blur, and equal-detail planes
active_rule_ids:
  - human-measure-without-default-figure
  - expansive-quiet-field
  - partial-revelation-and-material-contrast
joint_checks:
  - id: scale-space-visibility-coherence
    rule_ids:
      - human-measure-without-default-figure
      - expansive-quiet-field
      - partial-revelation-and-material-contrast
    instruction: Align the scale of any requested figure, the amount of open space, and the visibility of distant forms around one clear landscape viewpoint; do not add narrative symbols to explain the mood.
    observable: The scene reads as one sustained encounter with a large natural setting; open space and visibility shape attention while the requested subject remains clear.
sources:
  - id: friedrich-met-soul-of-nature
    kind: museum_exhibition_analysis
    url: https://www.metmuseum.org/zh/exhibitions/caspar-david-friedrich-the-soul-of-nature/inside-the-exhibition
  - id: friedrich-nga-northern-landscape
    kind: museum_object_record
    url: https://www.nga.gov/artworks/130555-northern-landscape-spring
execution:
  route: text_only
  must:
    - Preserve the requested landscape, location, weather, time, and figure count.
    - Use scale and open space to create a contemplative relationship between subject and setting.
    - Keep near material and distant forms distinct without uniform blur.
  avoid:
    - adding a wanderer, monk, ruin, cross, mountain, fog, or sunset unless requested
    - turning the landscape into a travel route or weather-driven print sequence
    - copying a named painting's figure placement or composition
