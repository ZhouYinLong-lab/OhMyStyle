profiles:
  user-authored-mark-hierarchy:
    required:
      - only user-supplied words and symbols appear
      - requested spelling and number of text elements are preserved
      - line, color, overlap, or strike-through creates a readable hierarchy among supplied marks
      - hand-made marks and surface abrasion remain visible without overwhelming the requested subject
    reject_if:
      - crowns, skulls, anatomy diagrams, signatures, or cultural references appear without request
      - crossed-out text is omitted or becomes unreadable when the user asked to preserve it
      - marks form a generic graffiti wall with no hierarchy to the requested subject
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - face and body remain the user-specified subject rather than a fixed icon
      - line and surface treatment remain visible without destroying anatomy
  still_life:
    required:
      - objects remain identifiable beneath the broken line and scraped surface
      - color blocks do not replace the requested object arrangement
minimum_score: 7

