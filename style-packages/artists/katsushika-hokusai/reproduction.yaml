medium: multicolor Japanese woodblock print language translated into a new digital image
materials:
  support: subtly fibrous warm paper ground
process:
  - establish the user-supplied subject with a bold silhouette and readable spatial planes
  - construct a limited palette as separate flat color layers
  - add carved contour rhythm and directional linework to describe form
  - add restrained paper grain and slight registration variation
technical_direction:
  contrast: medium-high graphic separation without crushed blacks
  saturation: controlled, with mineral blue as the anchor and one warm counterpoint
  perspective: flattened or selectively compressed; use scale and overlap rather than lens realism
  detail_density: TODO
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
