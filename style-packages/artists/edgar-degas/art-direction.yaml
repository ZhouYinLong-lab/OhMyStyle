schema_version: 2.1.0
status: experimental
id: degas-oblique-observation-and-spatial-crop
name: Degas oblique observation and spatial crop
base_package: artists/edgar-degas
scope:
  medium: oil_painting_or_pastel
  representation: recognizable
  description: >-
    An observational figure-scene direction built from an off-center viewpoint,
    asymmetric framing, and a spatial plane that carries the viewer into the
    scene. Cropping and tilted floor or ground geometry organize attention;
    they are deliberate framing choices rather than a preset dance motif.
  required_contexts:
    - observed-figure-scene
  incompatible_contexts:
    - centered-iconic-portrait
    - nonfigurative-field
    - flat-orthographic-diagram
  limitations:
    - Preserve the requested subject, identities, action, count, setting, and point of view when specified; do not add dancers, a studio, a stage, mirrors, or period props unless requested.
    - "Treat cropping as a compositional option: never cut through a face, hand, or action-critical contact when that would make the user-requested event unreadable."
    - Use an elevated or oblique viewpoint only when it clarifies spatial relations; do not force a tilted horizon or distorted anatomy.
contexts:
  - id: observed-figure-scene
    description: A requested human figure or interaction shown in a specific setting.
  - id: centered-iconic-portrait
    description: A centered portrait intended to read as an iconic frontal image.
  - id: nonfigurative-field
    description: An image without a human figure as a subject.
  - id: flat-orthographic-diagram
    description: A diagram or scene intentionally shown without perspective depth.
  - id: readable-spatial-plane
    description: The requested setting includes a visible floor, ground, or comparable plane.
pillars:
  - Place the viewpoint off-center or obliquely when the scene benefits from an observed, mid-moment framing.
  - Let a visible floor, ground, or other spatial plane establish depth and direct attention through the scene.
  - Crop secondary forms selectively while keeping the requested action and focal figure readable.
  - Capture a transitional posture as a specific bodily action, not as generic motion blur.
rules:
  - id: oblique-viewpoint-and-asymmetric-frame
    axis: viewpoint_and_framing
    importance: core
    applies_when: The requested scene contains a figure in a specific setting and an observational viewpoint is appropriate.
    instruction: Choose an off-center, elevated, or oblique viewpoint only when it reveals useful spatial information; balance the main figure with unequal surrounding areas and let any crop feel like a deliberate edge of the observed scene.
    observable: The viewpoint feels specific to the scene, the framing is asymmetrical without feeling accidental, and the requested figure remains identifiable.
    reject_when: The scene defaults to a centered stage view, arbitrary limbs are clipped, or perspective distortion replaces observation.
    evidence:
      source_ids:
        - degas-met-painting-and-drawing
        - degas-nga-picturing-france
      basis: institutional_description
      visual_review: pending
    avoid: centered symmetry by default, arbitrary edge cuts, and fisheye distortion
  - id: spatial-plane-as-compositional-path
    axis: spatial_composition
    importance: core
    when_contexts:
      - readable-spatial-plane
    applies_when: The requested setting includes a readable floor, ground, or comparable plane.
    instruction: Give the spatial plane enough area and directional geometry to connect foreground and figures; use its edges, seams, or perspective only when they belong to the requested setting, and keep the plane subordinate to the focal action.
    observable: The plane makes the viewpoint and depth legible and guides attention through the requested scene without becoming a decorative pattern.
    reject_when: The ground disappears into a generic backdrop, or invented boards, rugs, stage markings, and diagonals dominate the image.
    evidence:
      source_ids:
        - degas-nga-picturing-france
        - degas-met-painting-and-drawing
      basis: institutional_description
      visual_review: pending
    avoid: invented floor patterns, stage marks, and dominant perspective grids
  - id: legible-transitional-gesture
    axis: figure_action
    importance: core
    applies_when: The requested subject includes a person moving, pausing, or changing posture.
    instruction: Select one readable in-between posture from the requested action and clarify its balance through torso, limbs, and weight-bearing contact; keep anatomy and contact points distinct, with no blur standing in for movement.
    observable: The pose suggests a precise moment in an action while remaining anatomically readable and faithful to the request.
    reject_when: Motion blur obscures the pose, limbs merge, or an unrequested dance gesture or activity is introduced.
    evidence:
      source_ids:
        - degas-nga-dancers
        - degas-met-painting-and-drawing
      basis: institutional_description
      visual_review: pending
    avoid: generic motion blur, ballet poses by default, and unreadable anatomy
active_rule_ids:
  - oblique-viewpoint-and-asymmetric-frame
  - spatial-plane-as-compositional-path
  - legible-transitional-gesture
joint_checks:
  - id: observed-space-and-action
    rule_ids:
      - oblique-viewpoint-and-asymmetric-frame
      - spatial-plane-as-compositional-path
      - legible-transitional-gesture
    instruction: Let the selected viewpoint, spatial plane, and transitional pose describe one observed moment; each should clarify the same requested action without adding a recurring subject or setting.
    observable: Framing, ground plane, and bodily balance work together to make the scene feel observed in progress while preserving the user-specified content.
sources:
  - id: degas-met-painting-and-drawing
    kind: museum_essay
    url: https://www.metmuseum.org/essays/edgar-degas-1834-1917-painting-and-drawing
  - id: degas-nga-picturing-france
    kind: museum_teaching_resource
    url: https://www.nga.gov/sites/default/files/migrate_images/content/dam/ngaweb/education/learning-resources/teaching-packets/pdfs/picturing_france.pdf
  - id: degas-nga-dancers
    kind: museum_catalogue
    url: https://www.nga.gov/research/publications/degass-dancers
execution:
  route: text_only
  must:
    - Declare the observed-figure-scene context before applying this direction.
    - Preserve the user-requested scene, action, setting, and figure count.
    - Use asymmetrical framing and a spatial plane only where they clarify the requested scene.
    - Keep the selected pose anatomically and narratively legible.
  avoid:
    - adding dancers, stages, studios, mirrors, or period props without request
    - forcing crops or a high viewpoint onto scenes they do not suit
    - using motion blur or perspective distortion to imply observation
