medium: oil-paint-like rendering with open, broken strokes and a lightly visible ground
materials:
  - warm white or pale neutral ground
  - broad soft brushes for large light and shadow masses
  - smaller loaded strokes for accents and structural cues
process:
  - Establish the requested subject and a loose, asymmetrical composition.
  - Block in large luminous and shadowed color masses before describing local detail.
  - Build form with short, varied strokes that follow the surface or gesture.
  - Soften selected contours into surrounding color while retaining readable anchors.
  - Finish with a few clear, chromatic accents and leave some passages unresolved.
technical_direction: Maintain value clarity beneath the high-key palette; keep brushwork varied in scale, direction, and opacity instead of applying a uniform blur or pastel filter.
safety_note: Use observable traits only. Do not reconstruct a named work, sitter, location, logo, text, or exact composition.
