composition:
  - 用圆、直线、矩形、透明片和斜向切割建立几何张力，保留明确的空白区域。
  - 让前后层通过遮挡、透明度和投影产生空间，不依靠装饰性背景填满画面。
palette:
  - 以黑、白、灰为结构底色，选择少量红、黄或蓝作为高辨识度的单点或窄色带。
  - 颜色保持清晰分区，避免把所有色块融合成综合色滤镜。
lighting:
  quality: 中性而具有方向性的硬光与透明投影
  behavior:
    - 让光线在透明表面、金属细部或半透明层上留下可追踪的几何投影。
    - 高光服务于结构和运动感，不制造霓虹光晕或赛博朋克氛围。
surface:
  finish: 摄影、拼贴、透明材料或精确印刷之间的实验性表面
  edges: 几何边缘清晰，透明叠层边界可见，局部允许轻微曝光或套印变化
texture:
  density: low_to_medium
  placement: 集中在透明层、投影、颗粒和材料交界处
invariants:
  - 光与几何关系在更换主体后仍然清楚。
  - 不要求圆盘、机械装置、工作室、梯子或特定建筑作为主体。
  - 实验感来自媒介和光的组织，而不是随机故障、文字或品牌图形。
