distinctives:
  - Direct coastal light, reflected cool color, clear broad forms, and rapid directional oil marks distinguish this profile from Monet's atmospheric broken-color observation, Van Gogh's expressive contour rhythm, and Renoir's soft figure modeling.
avoid_overlap:
  - Do not substitute all-over impressionist stippling for directional marks.
  - Do not soften the whole scene into Turner's dissolving atmosphere.
  - Do not make brush rhythm emotional and contour-led as in Van Gogh.
