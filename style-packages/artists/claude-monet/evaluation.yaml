package_id: claude-monet
package_version: 0.1.0
invariants:
  - id: transient_light
    weight: 3
    test: Light temperature and reflected air organize the image.
  - id: broken_color
    weight: 3
    test: Adjacent color touches replace uniform fills and heavy outlines.
  - id: selective_atmosphere
    weight: 2
    test: Distant edges dissolve while the motif remains readable.
  - id: original_arrangement
    weight: 3
    test: The scene is not a recognizable reconstruction.
rejections: [global_pastel_filter, heavy_impasto, copied_named_work]
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
