canonical_name: 皮特·蒙德里安
entity_type: artist
domain: painting
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；示例题材只是验证标签，不会变成默认场景要求。
  subjects: []
  exclusions:
    - 复制具体作品构图
    - 固定城市、建筑或静物主体
    - 文字、标志和品牌版式
sources:
  - 'https://www.moma.org/artists/4057-piet-mondrian'
notes:
  - 本包提取网格、色面、线条和非对称平衡，不把某一幅作品的矩形位置写成模板。
  - 代表图使用抽象构成为示例；用户可以将同一视觉规则用于人物、物体或环境。
composition:
  - 以水平线与垂直线建立不对称网格，保留不同大小的留白和色面。
  - 让少量色块承担视觉重心，避免平均铺满或装饰性堆叠。
  - 保持平面关系清楚，不使用写实透视制造主次。
palette:
  - 以暖白、黑、红、蓝、黄组成有限调色板，色彩角色必须彼此分离。
  - 原色面积克制，黑色线条负责秩序，不将整张图处理成统一滤镜。
lighting:
  quality: 平面、稳定、低戏剧性的照明或明度组织
  behavior:
    - 主要依靠色面和线条区分层级，不依靠轮廓光、渐变和强投影。
    - 若用户主体需要体积，只加入极少量中性明度变化。
surface:
  finish: 哑光绘画表面，保留轻微纸张或颜料触感
  edges: 线条和矩形边界清楚，允许少量手工绘制的不完全规整
texture:
  density: 低
  placement: 纹理只用于支持纸面或颜料感，不改变网格和色面关系
invariants:
  - 非对称网格与有意留白
  - 少量高辨识度色面和黑色结构线
  - 平面化、克制、可读的视觉秩序
  - 不固定人物、物体、地点、建筑或故事
medium: 抽象绘画中的线条、色面与平面构成
materials:
  support: 哑光纸面或画布；保持纯色段落与清晰边界
process:
  - 先读取用户主体并建立可用的平面轮廓。
  - 用水平线和垂直线划分空间，保留不均等的留白。
  - 根据视觉重心加入少量红、蓝、黄色面，再调整黑线的粗细与断续。
  - 最后加入克制的纸面或颜料触感，不添加具体艺术作品的标志性布局。
technical_direction:
  contrast: 中等局部对比，黑线清楚但不压黑全部暗部
  saturation: 原色饱和，面积有限，暖白保持干净
  perspective: 平面化构成；除非用户要求，不使用广角或写实透视
  detail_density: 低到中等，细节集中在线条、间距和边缘质量
avoid:
  - 复刻某一幅已知作品的矩形排列
  - 把网格误解为网页界面、海报文字框或建筑立面
  - 通过渐变、发光、阴影和三维材质制造廉价数字效果
  - 把示例中的抽象构成当成每次生成的固定主体
safety_note: 不复现具体作品、可识别人物、标志或品牌版式。
