schema_version: 2.1.0
status: experimental
id: nicolas-de-stael-performance-gesture-blocks
name: Nicolas de Staël performance gesture blocks
base_package: artists/nicolas-de-stael
scope:
  medium: oil_painting_with_compressed_color_planes
  representation: stylized
  description: >-
    An optional direction for a user-requested dance or music performance.
    Preserve the requested performer count and action, but translate bodies,
    instruments, and the stage into a few broad, weighted color masses. Vary
    vertical and diagonal blocks to carry rhythm; use only a few narrow edges or
    gaps to keep gestures and instruments distinguishable. It does not prescribe
    a café, stadium, specific dance, instrument, or named composition.
  required_contexts:
    - dance-or-music-performance
  incompatible_contexts:
    - photorealistic-concert-documentation
    - quiet-unoccupied-landscape
    - detailed-solo-portrait
  limitations:
    - Activate only when the user requests a dance or music performance scene.
    - Preserve requested performer count, identities, instruments, choreography, and setting.
    - Make figures recognizable through pose and color-plane relationship, not anatomical detail.
    - Do not add a café, stage, audience, sports field, or instrument unless it appears in the user's request.
    - Do not reproduce a named painting or its figure arrangement.
contexts:
  - id: dance-or-music-performance
    description: A user-requested dance or music performance scene.
  - id: photorealistic-concert-documentation
    description: A photorealistic concert or performance record.
  - id: quiet-unoccupied-landscape
    description: An empty landscape without performance or figures.
  - id: detailed-solo-portrait
    description: A detailed portrait of one person rather than a performance scene.
  - id: visible-movement-phrase
    description: The requested scene has multiple performers or a clear movement phrase.
  - id: instruments-or-held-props-present
    description: The requested performance includes instruments or held props.
pillars:
  - Compress each requested performer into a few opaque planes with a distinct tilt or height.
  - Let alternating vertical and diagonal color masses carry the movement rhythm across the frame.
  - Keep just enough contour and separation to read the user-requested gesture and instrument.
rules:
  - id: performer-color-masses
    axis: figure_and_color_plane
    importance: core
    applies_when: The user requests one or more performers in a dance or music scene.
    instruction: Reduce each requested performer to no more than four broad opaque color masses. Give each body a distinct dominant angle or height; omit facial features, garment seams, and small anatomy unless the user requests them, so the performer remains readable through silhouette, instrument, and gesture rather than illustration detail.
    observable: Performer count and action remain readable from silhouettes, distinct block angles, instruments, and a few gesture cues; each figure visibly uses a small number of large color masses.
    reject_when: Bodies merge into one undifferentiated block, the requested count changes, or faces, garment folds, and anatomy details dominate instead of a few broad color masses.
    evidence:
      source_ids:
        - nga-de-stael-ballet
      basis: direct_visual_observation
      visual_review: pending
    avoid: polished portraits, uniform body shapes, and copied figure placement
  - id: alternating-performance-rhythm
    axis: composition_and_motion
    importance: core
    when_contexts:
      - visible-movement-phrase
    applies_when: The user requests multiple performers or a visible movement phrase.
    instruction: Alternate upright and oblique blocks across the requested action; vary their scale and intervals so the scene has a readable pulse without imposing a fixed left-to-right order.
    observable: The eye can follow the movement across distinct masses while open gaps prevent a crowded, continuous silhouette.
    reject_when: All figures repeat one static pose, the user-requested choreography changes, or unrelated diagonal shapes dominate the action.
    evidence:
      source_ids:
        - nga-de-stael-ballet
        - nga-de-stael-musique-de-cafe
      basis: curatorial_inference
      visual_review: pending
    avoid: decorative zigzags, unrequested audience rows, and copied composition
  - id: selective-action-cues
    axis: contour_and_detail_hierarchy
    importance: supporting
    when_contexts:
      - instruments-or-held-props-present
    applies_when: The scene includes instruments, held props, or identifiable dance gestures.
    instruction: Use only a few narrow contrasting marks to indicate instrument direction and the main arm gesture; leave faces, hands, and clothing largely unmodeled so the larger color masses stay dominant.
    observable: Requested instruments and the main action remain identifiable, while each performer still reads first as a handful of weighted paint planes rather than a detailed illustration.
    reject_when: Instrument or limb cues disappear, or outlines and small details cover most color fields.
    evidence:
      source_ids:
        - nga-de-stael-musique-de-cafe
      basis: institutional_description
      visual_review: pending
    avoid: detailed musical notation, readable text, and thin uniform outlining
active_rule_ids:
  - performer-color-masses
  - alternating-performance-rhythm
  - selective-action-cues
joint_checks:
  - id: movement-in-painted-masses
    rule_ids:
      - performer-color-masses
      - alternating-performance-rhythm
      - selective-action-cues
    instruction: Keep each requested performer countable, use alternating weighted planes to carry the motion, and reserve narrow marks for the instruments or gestures that identify the action.
    observable: The scene reads as the requested performance through silhouettes, angle, and a small number of action cues while thick color masses remain dominant.
sources:
  - id: nga-de-stael-ballet
    kind: museum_collection_record
    url: https://www.nga.gov/artworks/61384-ballet
  - id: nga-de-stael-musique-de-cafe
    kind: museum_collection_record
    url: https://www.nga.gov/artworks/53075-musique-de-cafe
execution:
  route: text_only
  must:
    - Activate only for a user-requested dance or music performance.
    - Preserve performer count, identity, instruments, choreography, and stated setting.
    - Use a few broad, textured color planes per performer and vary their orientations to express motion.
    - Keep a small number of contour cues for the requested gesture or instrument.
    - Review performer separation and action readability after generation.
  avoid:
    - adding cafés, stadiums, audiences, instruments, or named settings unless requested
    - changing the requested choreography or performance type
    - copying a named painting, exact pose, or recognizable arrangement
