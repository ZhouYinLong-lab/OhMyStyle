medium: oil painting translated as a contemporary generated image
materials:
  support: coarse canvas or lightly visible board ground
process:
  - Establish the supplied subject as a simple silhouette or arrangement before adding detail.
  - Block in the largest value and color planes with opaque, loaded strokes.
  - Compress perspective and connect neighboring planes through edge rhythm rather than realism.
  - Add selective scraped or ridged texture, leaving a few quiet support gaps.
technical_direction:
  contrast: medium-high between adjacent planes, without crushed blacks
  saturation: medium-high in selected accents; keep the palette limited
  perspective: compressed and intentionally shallow
  detail_density: low-to-medium; prioritize plane hierarchy over small detail
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
