medium: oil and gouache-like painted image language
materials:
  support: canvas, board, or matte paper impression
process:
  - establish the broad color atmosphere and spatial planes
  - place the user-supplied subject as an independent painted form
  - add floating secondary shapes and restrained surface accents only when composition needs them
technical_direction:
  contrast: medium with selective dark anchors
  saturation: uneven; vivid accents against muted passages
  perspective: compressed or dreamlike, never mechanically distorted
  detail_density: medium, with calm negative spaces
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
