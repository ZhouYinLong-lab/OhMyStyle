medium: watercolor, gouache, and ink-informed modernist painting
materials:
  support: lightly textured paper with transparent pigment layers
process:
  - establish the user's subject as a simplified silhouette or sign
  - place a few translucent color planes with a quiet asymmetrical balance
  - let a fine line wander through, divide, or connect the planes
  - add sparse symbols and pigment variation without closing the interpretation
technical_direction:
  contrast: low to medium, anchored by dark line
  saturation: muted to moderate, with transparent overlaps
  perspective: shallow and symbolic rather than strictly photographic
  detail_density: sparse, with local detail at lines and small signs
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
