schema_version: 2.1.0
status: experimental
id: klee-independent-line-atmospheric-color
name: Klee independent line and atmospheric color field
base_package: artists/paul-klee
scope:
  medium: watercolor_gouache_and_ink_on_paper
  representation: stylized
  description: >-
    An optional direction for a user-requested simple mechanical object whose
    movement should remain legible. Describe the object with a few wiry, active
    ink lines while allowing a translucent color field to establish a separate
    shallow atmosphere. Let at least one line travel beyond the object's contour
    into open paper; do not turn that gesture into a fixed symbol or narrative.
  required_contexts:
    - simple-moving-mechanical-object
  incompatible_contexts:
    - photorealistic-product-render
    - dense-technical-blueprint
    - user-requested-typography-layout
  limitations:
    - Activate only for a user-requested simple mechanical object or device with implied or requested movement.
    - Preserve the requested object, material, count, controls, and action; do not add a default bird, music note, perch, trap, letter, or landscape.
    - Keep line and color as distinguishable carriers; the line records action or connection, while the color field builds atmosphere without filling every line-bounded area.
    - Retain enough object geometry for recognition; a freely moving line must not change the object's structure or function.
    - Keep paper visible and use only a few incidental transfer-like marks; do not imitate a specific Klee drawing or its composition.
contexts:
  - id: simple-moving-mechanical-object
    description: A user-requested simple mechanical object whose movement should remain legible.
  - id: photorealistic-product-render
    description: A photorealistic product rendering with no visible drawing marks.
  - id: dense-technical-blueprint
    description: A technical drawing requiring precise measured linework and labels.
  - id: user-requested-typography-layout
    description: A composition that includes requested typography or a designed text layout.
  - id: handmade-paper-support
    description: The requested image allows a visible handmade paper surface and incidental pigment traces.
pillars:
  - Draw the requested mechanism with a few wiry, variable lines; allow a motion or connection line to extend into negative space instead of merely outlining the object.
  - Place a translucent color field as a separate spatial layer, letting it overlap or sit behind the line without making the two systems coincide.
  - Leave visible paper and sparse incidental pigment traces so the image retains the tension between flat support and atmospheric depth.
rules:
  - id: active-line-beyond-contour
    axis: line_behavior_and_motion
    importance: core
    applies_when: The user requests one simple mechanical object with implied or requested movement.
    instruction: Use a small number of wiry, hand-drawn lines to make the requested object's structure and motion readable; let one connected line travel beyond its contour into open space rather than closing every form.
    observable: The object remains identifiable while at least one active line has a clear path into negative space that is not simply a copied outer contour.
    reject_when: The line becomes a dense blueprint, an unrelated decorative squiggle, or changes the mechanism's user-specified structure.
    evidence:
      source_ids:
        - moma-klee-twittering-machine
      basis: institutional_description
      visual_review: pending
    avoid: bird forms, music-note marks, copied wire perch, and rigid CAD edges
  - id: independent-translucent-color-field
    axis: color_field_and_space
    importance: core
    applies_when: The user requests a stylized mechanical study on a paper-like support.
    instruction: Set one translucent, irregular color field behind or across part of the mechanism; allow it to establish shallow atmosphere independently from the ink line and leave some paper unpainted.
    observable: A viewer can distinguish line-drawn structure from the larger soft-edged color field; the color does not simply fill every mechanical contour.
    reject_when: Color becomes uniform object fill, a full-bleed background, or photographic volumetric shading.
    evidence:
      source_ids:
        - moma-klee-twittering-machine
      basis: institutional_description
      visual_review: pending
    avoid: all-over gradient, enclosing frame, and color-coded technical diagram
  - id: sparse-transfer-trace
    axis: support_and_surface
    importance: supporting
    when_contexts:
      - handmade-paper-support
    applies_when: The user allows a handmade drawing surface.
    instruction: Keep the paper visibly present and use only a few faint, irregular transfer-like smudges near the drawn mechanism; let these marks register the support without becoming extra objects or symbols.
    observable: Empty paper remains an active part of the composition, with incidental marks subordinate to the requested object and color field.
    reject_when: Smudges obscure object details, form an all-over distressed texture, or read as added symbols or text.
    evidence:
      source_ids:
        - moma-klee-twittering-machine
      basis: institutional_description
      visual_review: pending
    avoid: dirt, grunge overlays, deliberate handwriting, and copied transfer artifacts
active_rule_ids:
  - active-line-beyond-contour
  - independent-translucent-color-field
  - sparse-transfer-trace
joint_checks:
  - id: line-color-plane-tension
    rule_ids:
      - active-line-beyond-contour
      - independent-translucent-color-field
      - sparse-transfer-trace
    instruction: Keep the user's mechanism readable through wiry active lines while a separate translucent field suggests shallow atmosphere; leave paper visible and use incidental marks sparingly.
    observable: Object, line path, color field, and paper remain distinct but form one balanced drawing.
sources:
  - id: moma-klee-twittering-machine
    kind: museum_collection_description
    url: https://www.moma.org/collection/works/37347
execution:
  route: text_only
  must:
    - Activate only for a user-requested simple moving mechanical object.
    - Preserve the user's object identity, material, count, and requested action.
    - Keep line-drawn structure distinct from the translucent color field.
    - Let one active line travel into open space while preserving object recognition.
    - Leave visible paper and keep incidental smudges sparse.
    - Review object readability, line path, color-field independence, and paper visibility.
  avoid:
    - adding birds, notes, perches, traps, lettering, or an unrequested landscape
    - copying the composition or particular forms of Twittering Machine
    - turning the image into a technical blueprint, generic watercolor filter, or photorealistic product render
