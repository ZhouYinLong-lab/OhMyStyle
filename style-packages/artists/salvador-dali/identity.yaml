canonical_name: 萨尔瓦多·达利
entity_type: artist
domain: painting
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；梦境场景只是代表性测试，不是默认题材。
  subjects: []
  exclusions:
    - 固定融化时钟、荒漠、长腿动物或肖像
    - 复制具体作品构图或标志性物件组合
    - 文字、标志和品牌元素
sources:
  - 'https://www.moma.org/artists/1364-salvador-dali'
notes:
  - 本包提取精细写实表面、清醒的梦境逻辑、延展阴影和形体转化。
  - 代表图的石庭与变形物只是说明“现实表面承载不合理关系”，不会成为默认主体。
composition:
  - 以清楚的远近层次和稳定视点承载一个或两个不协调的形体关系。
  - 保留宽阔留白、低地平线或安静背景，让异常变化集中出现。
  - 让变形来自主体关系和尺度，而不是随机堆叠超现实物件。
palette:
  - 使用干净的暖土色、灰白和天空蓝，允许局部深色或红色形成心理重音。
  - 色彩整体克制，异常感主要来自形体、尺度和影子，而非霓虹滤镜。
lighting:
  quality: 清晰、偏硬而稳定的日光，带有不合时宜的延展阴影
  behavior:
    - 阴影方向可读，长度或连接关系可以轻微违背日常经验。
    - 保持物体表面精确，不用雾化和发光掩盖结构。
surface:
  finish: 细腻、近乎写实的绘画表面
  edges: 主要形体轮廓清楚，异常处仍保持可辨的物理边界
texture:
  density: 中等
  placement: 纹理集中于石头、墙面、织物和皮肤等真实材料，不覆盖梦境关系
invariants:
  - 写实细节与不合理关系并置
  - 稳定空间中的尺度、形体或影子异常
  - 安静、清醒、带心理距离的画面气氛
  - 不固定时钟、荒漠、动物、人物或故事
medium: 精细写实绘画中的超现实形体与梦境空间
materials:
  support: 平滑画布或木板，保留清楚的边缘和细腻的颜料层
process:
  - 先按用户要求建立可辨的主体与环境。
  - 选择一个局部关系进行尺度、连接或形体的轻微偏移。
  - 用明确日光和延展影子强化异常感，再补充真实材料细节。
  - 删除会把画面变成符号清单的多余梦境物件。
technical_direction:
  contrast: 中高局部对比，暗部仍有细节
  saturation: 低到中等，局部色彩作为心理重音
  perspective: 稳定写实透视，避免广角畸变和随机空间折叠
  detail_density: 中高，细节服从形体可信度
avoid:
  - 融化时钟、沙漠、长腿动物等固定联想
  - 把超现实主义写成随机物件拼盘
  - 过度模糊、霓虹、赛博朋克或数字发光
  - 复制具体作品的构图和符号组合
safety_note: 不复现具体作品、可识别人物、标志或品牌版式。
