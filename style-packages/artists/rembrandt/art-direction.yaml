schema_version: 2.0.0
status: experimental
id: rembrandt-hand-object-light-chain
name: Rembrandt hand-object light chain
base_package: artists/rembrandt
scope:
  medium: painted_image
  representation: stylized
  description: >-
    An optional direction for a user-requested figure holding or touching a
    small object. Use one restrained light path to connect the face, contact
    hand, and the object's material response, making the requested act of
    handling clear without making the object brighter than the human subject.
  required_contexts:
    - user-requested-figure-handling-object
  incompatible_contexts:
    - no-figure-or-hand-object-contact
    - user-requested-dark-silhouette
    - exact-reconstruction-of-named-rembrandt-work
  limitations:
    - Use only when the user requests a figure holding or touching an object.
    - Preserve the specified object, hand, gesture, face, light source, and setting.
    - Keep the human figure as the primary subject; object highlights remain secondary.
    - Do not invent a symbolic or historical meaning for the object.
pillars:
  - Let the light path link facial attention to the requested hand-object contact.
  - Show how the user's specified object material receives light without generic glow.
  - Keep the surrounding dark warm and structured, with the brightest accents selective.
rules:
  - id: light-connects-face-hand-and-object
    axis: focal-light-path
    importance: core
    applies_when: A figure holds or touches an object in the requested scene.
    instruction: Align the dominant light path across the face, the contact hand, and one material-specific accent on the requested object.
    observable: The viewer can follow the sitter's attention from face to gesture and identify the object without it becoming the brightest subject.
    reject_when: Face, hand, and object receive unrelated lighting or the object overwhelms the figure.
    evidence:
      source_ids:
        - rijksmuseum-rembrandt-jewish-bride
      basis: direct_visual_observation
      visual_review: pending
    avoid: halo around the object or multiple competing highlight paths
  - id: contact-point-explains-material
    axis: hand-object-material-response
    importance: core
    applies_when: The requested hand touches, holds, or presents an object.
    instruction: Keep finger placement anatomically clear and use a small local change in value or paint texture where the object's material meets the hand.
    observable: Contact, weight, and material can be read at a glance without adding detail to every surface.
    reject_when: Fingers float away from the object or the material is replaced by a generic glossy highlight.
    evidence:
      source_ids:
        - rijksmuseum-rembrandt-jewish-bride
      basis: direct_visual_observation
      visual_review: pending
    avoid: added jewelry, decorative insignia, or unrequested object details
  - id: keep-shadow-open-around-contact
    axis: warm-shadow-detail
    importance: supporting
    applies_when: A local light path is used in a dark interior or intimate scene.
    instruction: Preserve warm detail around the hand and object; reserve the deepest dark for areas that do not explain the contact or expression.
    observable: Hand, object, and nearby fabric remain distinguishable within the warm dark field.
    reject_when: The hand-object relation disappears into clipped black shadow.
    evidence:
      source_ids:
        - nga-rembrandt-old-lady-book
      basis: institutional_description
      visual_review: pending
    avoid: uniform sepia tint or theatrical black background
active_rule_ids:
  - light-connects-face-hand-and-object
  - contact-point-explains-material
  - keep-shadow-open-around-contact
joint_checks:
  - id: hand-object-action-remains-human-led
    rule_ids:
      - light-connects-face-hand-and-object
      - contact-point-explains-material
      - keep-shadow-open-around-contact
    instruction: Use selective light to connect the user's requested face, hand gesture, and object while keeping material, contact, and warm shadows legible.
    observable: The object enriches the human action without displacing the person or inventing a narrative.
sources:
  - id: rijksmuseum-rembrandt-jewish-bride
    kind: museum_collection_record
    url: https://www.rijksmuseum.nl/en/collection/object/Isaac-and-Rebecca-Known-as-The-Jewish-Bride--019c1265e6dbf108d4587ab2b7c02c66
  - id: nga-rembrandt-old-lady-book
    kind: museum_research_record
    url: https://www.nga.gov/research/publications/dutch-paintings-seventeenth-century/rembrandt-van-rijn-old-lady-book-1637
execution:
  route: text_only
  must:
    - Activate only for a user-requested figure-object contact.
    - Preserve hand placement, face, object, material, and scene.
    - Connect attention and contact through one selective warm light path.
    - Review anatomy, object legibility, material response, and open shadow detail.
  avoid:
    - making the object brighter or more important than the requested person
    - adding symbolic meanings, objects, or historical costume
    - using generic sepia overlays or clipping shadows to black
