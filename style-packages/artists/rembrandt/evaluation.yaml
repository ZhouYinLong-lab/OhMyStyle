package_id: rembrandt
package_version: 0.1.0
invariants:
  - id: directional_light_path
    weight: 3
    test: One dominant light path organizes the face, hands, or gesture.
  - id: open_warm_shadows
    weight: 3
    test: Dark regions retain warm structure and material detail.
  - id: tactile_focus
    weight: 2
    test: Loaded paint is localized at focal material and gesture.
  - id: original_arrangement
    weight: 3
    test: The scene is not a recognizable reconstruction.
rejections: [brown_filter, crushed_black_void, generic_movie_chiaroscuro, copied_named_work]
minimum_score: 8
image_audit:
  similarity_level: high
  visual_overlap:
    - warm selective illumination
    - deep shadow and strong face-or-object modelling
  reason: Rembrandt shares a thumbnail-level chiaroscuro structure with Caravaggio and Tenebrism packages.
  keep_separate_because:
    - the package emphasizes warm atmospheric modelling, layered surfaces, and psychological quiet
    - it is an artist-derived visual language rather than a generic dark-light filter
    - it must remain open to non-portrait subjects
  action: clarify_distinctive_signature
subject_independence_suite:
  status: pending
  fixture: benchmarks/subject-independence.yaml
  required_subjects:
    - ordinary-chair
    - unspecified-building
  evidence: "No provider-backed result is claimed until a real image run is recorded."
