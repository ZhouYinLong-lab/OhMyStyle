package_id: rembrandt
package_version: 0.1.0
invariants:
  - id: directional_light_path
    weight: 3
    test: One dominant light path organizes the face, hands, or gesture.
  - id: open_warm_shadows
    weight: 3
    test: Dark regions retain warm structure and material detail.
  - id: tactile_focus
    weight: 2
    test: Loaded paint is localized at focal material and gesture.
  - id: original_arrangement
    weight: 3
    test: The scene is not a recognizable reconstruction.
rejections: [brown_filter, crushed_black_void, generic_movie_chiaroscuro, copied_named_work]
minimum_score: 8
