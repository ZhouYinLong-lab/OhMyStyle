composition:
  - place a figure or gesture inside a large dark field with a clear light path
  - use asymmetrical balance and quiet surrounding space
  - let hands, face, fabric, or an object carry the narrative focus
color: [deep umber, warm black, muted red, ochre gold, restrained ivory]
light:
  quality: directional_window_or_candle_like_light
  behavior: [one dominant light path, luminous face_and_hands, open_chromatic_shadows]
surface:
  brushwork: layered_oil_with_selective_thick_accents
  mark_logic: [soft transitions in flesh, broken loaded marks in cloth and highlights]
  finish: deep_glazing_with_tactile_focal_passages
invariants:
  - light reveals psychology and material, not only form
  - dark areas retain warm structure and detail
  - the strongest paint load is localized at the focal gesture
  - new subject and arrangement are mandatory
