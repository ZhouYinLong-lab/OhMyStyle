composition:
- 人物以强烈对角线和近距离动作挤压画面，形成有力的叙事瞬间
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 深黑、血红、赭金、钴蓝与象牙白形成高对比巴洛克色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 写实油画与大胆的肉身造型
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 单一侧上方光源切出人物与布料，背景沉入深暗
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 皮肤、金属、粗布和木材通过触感对比增强张力
- 不同材质保留可辨识的表面行为。
texture:
- 笔触紧贴动作方向，局部高光集中于手臂和面部
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保留强烈明暗与身体能量，不复刻圣经人物、暴力场面或原作动作
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
