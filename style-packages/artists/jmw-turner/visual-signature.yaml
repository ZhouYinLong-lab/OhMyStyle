composition:
  - establish a low or receding horizon and a strong diagonal vector through water, track, wake, cloud, or light
  - leave generous atmospheric space around the primary event
  - let the main subject emerge from the atmosphere rather than sit as a sharply cut-out object
color:
  - blue-gray and pearl-gray atmospheric field
  - amber, ochre, and muted orange light
  - brown-black or deep blue structural accents
  - pale cream highlights that remain integrated with the air
light:
  quality: luminous_atmospheric_weather
  behavior:
    - light blooms through thin layers without becoming digital glow
    - warm and cool veils overlap across distance
    - forms lose contrast with atmospheric depth
surface:
  brushwork: scumbled_translucent_and_scraped_layers
  mark_logic:
    - broad veils for sky and vapor
    - dragged or broken marks for water, smoke, and rain
    - selective sharper marks only at the focal event
  finish: oil_surface_with_lost_and_found_edges
invariants:
  - atmosphere changes the legibility of forms across depth
  - motion has a clear spatial vector
  - luminosity comes from layered paint relationships, not lens effects
  - the new scene must not copy a known composition
