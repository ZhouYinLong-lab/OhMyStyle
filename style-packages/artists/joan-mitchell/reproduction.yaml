medium: gestural oil-painting language with exposed ground
materials:
  support: canvas or user-specified flat surface with a warm-white ground
process:
  - Establish the user's subject and its broad spatial mass before abstraction.
  - Lay down a warm-white ground and reserve quiet areas rather than filling the frame.
  - Build a few large broken color families with visible directional brush movement.
  - Add scraped passages, thin drips and smaller accents only where they sharpen rhythm.
  - Restore enough subject recognition that the visual language remains transferable.
technical_direction:
  contrast: medium, carried by paint density and dark accents rather than hard lighting
  saturation: medium to high in selected strokes; the ground stays luminous
  perspective: open and flattened; do not force a landscape vanishing point
  detail_density: low in quiet ground, high in selected gestural clusters
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
