profiles:
  counterposed-color-stroke-groups:
    required:
      - distinct brush groups use counterposed directions and varied stroke weights
      - the requested ground remains visible between color clusters
      - thick and thin paint passages create local depth without a global filter
      - the requested subject or abstract arrangement remains recognizable
    reject_if:
      - strokes fill the whole image as uniform texture or an all-over web
      - all clusters share one direction, length, and density
      - unrequested horizon, trees, flowers, or landscape objects appear
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - brush groups support the requested likeness instead of replacing facial structure
      - exposed ground and directional paint remain visible without obscuring the subject
  still_life:
    required:
      - object silhouettes remain legible beneath broken paint passages
      - color clusters vary in density and do not become a repeated decorative pattern
minimum_score: 7

