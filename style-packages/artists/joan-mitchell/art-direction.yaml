schema_version: 2.1.0
status: experimental
id: mitchell-counterposed-color-stroke-groups
name: Mitchell counterposed color-stroke groups
base_package: artists/joan-mitchell
scope:
  medium: oil_painting
  representation: abstract_interpretation
  description: >-
    A context-specific abstract-painting direction built from distinct groups of
    brushstrokes that counterpose in direction, scale, and paint thickness. Color
    weight and stroke density create movement across a broad visible ground
    without requiring a literal landscape, horizon, or focal object. It controls
    paint relationships, not subject matter.
  required_contexts:
    - counterposed-color-stroke-groups
  incompatible_contexts:
    - all-over-drip-web
    - flat-vector-poster
    - photorealistic-landscape
  limitations:
    - Apply only to a user-requested abstract or painterly composition with visible brushwork.
    - Preserve any requested subject, color roles, object count, and framing.
    - Do not introduce a horizon, trees, flowers, water, or landscape objects unless requested.
    - Avoid copying a named canvas, panel arrangement, or identifiable stroke pattern.
contexts:
  - id: counterposed-color-stroke-groups
    description: The user requests an abstract painting built from counterposed visible brushstroke groups.
  - id: all-over-drip-web
    description: The user requests an all-over drip-web composition.
  - id: flat-vector-poster
    description: The user requires a flat vector poster.
  - id: photorealistic-landscape
    description: The user requires a photorealistic landscape.
  - id: open-field-or-visible-unpainted-ground
    description: The user requests an open abstract field or permits visible unpainted ground.
pillars:
  - Build several distinct stroke groups with contrasting directions, lengths, and pressure; let one group answer another rather than spreading marks uniformly.
  - Use changes in stroke size, opacity, and paint thickness to give color groups different visual weight and depth.
  - Leave broad areas of exposed warm-white ground between groups; use white paint or scraped passages selectively to reopen space.
  - Keep color relationships local and deliberate, with a few saturated hues balanced by quieter passages.
rules:
  - id: counterposed-directional-groups
    axis: markmaking_and_composition
    importance: core
    when_contexts:
      - counterposed-color-stroke-groups
    applies_when: The user requests a painterly abstract field or a subject treated through visible brush groups.
    instruction: Organize marks into a few distinct families with different directions, such as horizontal sweeps answered by diagonal or vertical strokes; vary scale and pressure within each family and preserve readable intervals between groups.
    observable: The image has several directional brush clusters with a legible counter-rhythm rather than one repeated all-over texture.
    reject_when: Every mark points the same way, clusters dissolve into a uniform web, or a new focal subject appears.
    evidence:
      source_ids:
        - mitchell-foundation-materials
        - nga-piano-mecanique
      basis: institutional_description
      visual_review: pending
    avoid: uniform splatter, repetitive parallel striping, and all-over webbing
  - id: paint-weight-and-layer-contrast
    axis: color_and_material
    importance: core
    when_contexts:
      - counterposed-color-stroke-groups
    applies_when: The requested treatment relies on color and visible oil-paint handling.
    instruction: Vary paint thickness and opacity across the color groups; reserve a few dense, opaque strokes as anchors, balance them with thinner veils or scumbled passages, and keep each hue attached to its own stroke form.
    observable: Color has different weights and surface depths while remaining tied to discrete marks rather than a global filter.
    reject_when: All paint looks equally thick, translucent passages turn into a full-image wash, or color loses its local structure.
    evidence:
      source_ids:
        - mitchell-foundation-materials
      basis: institutional_description
      visual_review: pending
    avoid: global color overlays, uniform impasto, and digital gradients
  - id: exposed-ground-pauses
    axis: negative_space_and_rhythm
    importance: supporting
    when_contexts:
      - open-field-or-visible-unpainted-ground
    applies_when: The user requests an open abstract field or permits visible unpainted ground.
    instruction: Preserve broad, intentional ground passages between stroke groups; let their shape and width create pauses and counterbalance the denser color areas.
    observable: Ground remains an active compositional element rather than a thin border or a fully covered background.
    reject_when: Marks fill the surface uniformly or ground is inserted only as empty margins.
    evidence:
      source_ids:
        - nga-piano-mecanique
        - mitchell-foundation-materials
      basis: institutional_description
      visual_review: pending
    avoid: edge-to-edge texture, decorative blank border, and erased subject structure
active_rule_ids:
  - counterposed-directional-groups
  - paint-weight-and-layer-contrast
  - exposed-ground-pauses
joint_checks:
  - id: color-groups-in-open-counterpoint
    rule_ids:
      - counterposed-directional-groups
      - paint-weight-and-layer-contrast
      - exposed-ground-pauses
    instruction: Use directional, varied paint groups to create color weight and movement across visible ground while preserving the user's subject and color requests.
    observable: Stroke families counterpose; paint thickness varies; ground creates pauses; no fixed landscape or all-over web is added.
sources:
  - id: mitchell-foundation-materials
    kind: artist_foundation_material_analysis
    url: https://www.joanmitchellfoundation.org/joan-mitchell/materials-and-practice
  - id: nga-piano-mecanique
    kind: museum_collection_analysis
    url: https://www.nga.gov/artworks/75155-piano-mecanique
execution:
  route: text_only
  must:
    - Declare counterposed-color-stroke-groups only for a user-requested painterly abstract field.
    - Preserve the user's subject, palette roles, and framing.
    - Use counterposed stroke families, variable paint weight, and visible ground pauses.
    - Keep brush clusters distinct and avoid filling every area with marks.
  avoid:
    - inventing literal landscape features or a horizon
    - turning mark groups into a uniform web or repeated pattern
    - applying a global color filter or equal texture everywhere
    - copying a named artwork's arrangement
