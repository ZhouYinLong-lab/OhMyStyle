composition:
- 优雅的线性轮廓、平衡的神话人物群组和轻盈的风向线组织平面叙事
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 淡蓝、贝壳粉、草绿、金发黄与乳白形成清澈的早期文艺复兴色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 蛋彩画式平面色层与精细线描
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀柔和的日光，几乎没有戏剧性黑影
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 布料、头发和植物以装饰性线条而非厚重体积表现
- 不同材质保留可辨识的表面行为。
texture:
- 轮廓线、飘带和花叶形成连续节奏
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持优雅线性和浅色秩序，不加入照片式皮肤或厚重油画肌理
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
