medium: 蛋彩画式平面色层与精细线描
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持优雅线性和浅色秩序，不加入照片式皮肤或厚重油画肌理
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
