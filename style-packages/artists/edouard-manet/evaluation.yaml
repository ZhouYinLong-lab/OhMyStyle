profiles:
  modern-life-color-plane:
    required:
      - local colors remain distinct in adjacent patches
      - composition is deliberate even when some paint passages remain open
      - compressed space preserves the requested focal action and object identity
    reject_if:
      - a café, bar, nude figure, Paris landmark, or named composition is added without request
      - all edges become uniformly vague or uniformly outlined
      - palette alone substitutes for the visual rules
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
      - no fixed subject leaks into the output
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - preserve the user-supplied person or object without adding a recurring figure
  still_life:
    required:
      - preserve the user-supplied objects and their count
minimum_score: 7

