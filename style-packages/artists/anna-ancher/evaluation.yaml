invariants:
- id: window_light_is_structural
  weight: 3
  test: The main light direction is legible and shapes the composition.
- id: domestic_scale
  weight: 2
  test: The setting feels like an ordinary interior rather than a stage.
- id: restrained_color
  weight: 2
  test: Muted color relationships carry the image without neon saturation.
- id: simplified_planes
  weight: 2
  test: Secondary objects are simplified into readable planes and edges.
rejections:
- spotlight_or_rim_light
- glossy_digital_finish
- copied_composition
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
