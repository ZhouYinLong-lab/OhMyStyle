profiles:
  generic:
    required:
    - package-specific visual signature is observable
    - composition remains coherent for a new subject
    - no copied reference composition or branded material
    - no fixed subject leaks into the output
    reject_if:
    - style is represented only by a global color filter
    - text, logo, watermark, or unintended signature is present
  portrait:
    required:
    - preserve the user-supplied person or object without adding a recurring figure
  still_life:
    required:
    - preserve the user-supplied objects and their count
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: Run at least two neutral-subject tasks from benchmarks/subject-independence.yaml.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Do not mark complete without outputs for at least two different subjects.
