composition:
  - Favor frontal or calmly centered arrangements with a clear subject plane and deliberate symbolic spacing.
  - Let a few objects or shapes carry relational meaning without turning the image into a literal narrative.
  - Keep the picture plane legible; depth may be shallow and constructed rather than optically natural.
palette:
  - Use confident saturated reds, turquoise, cobalt, ochre, and warm neutrals in clear blocks.
  - Keep accents emotionally specific and avoid washing the whole image with one cinematic filter.
lighting:
  quality: steady, readable illumination with painted rather than photographic drama
  behavior:
    - Use moderate contrast and stable local values so contours and small symbolic forms remain visible.
    - Avoid theatrical rim light or glossy studio highlights.
surface:
  finish: handmade painted surface with controlled opacity and visible brush decisions
  edges: crisp dark contours around selected forms, softened only where the subject calls for it
texture:
  density: low to medium, with detail concentrated in faces, cloth, plants, and meaningful objects when present
  placement: tactile marks support the form and symbolic relation; they do not become random decoration
invariants:
  - frontal clarity and deliberate symbolic spacing
  - saturated but separated color blocks with warm and cool tension
  - controlled contour and handmade painted surface
  - no fixed person, costume, animal, place, or autobiographical event
