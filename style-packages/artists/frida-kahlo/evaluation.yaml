package_id: frida-kahlo
package_version: 0.2.0
profiles:
  generic:
    required:
    - package-specific visual signature is observable
    - composition remains coherent for a new subject
    - no copied reference composition or branded material
    reject_if:
    - style is represented only by a global color filter
    - text, logo, watermark, or unintended signature is present
  portrait:
    required:
    - frontal psychological clarity is present without forcing a self-portrait
  still_life:
    required:
    - object relationships and color blocks remain deliberate without adding symbolic props
  intimate-symbolic-portrait:
    required:
    - requested portrait subject remains primary and recognizable
    - only user-specified companion forms establish symbolic relationships
    - shallow space and separated color fields support a painted portrait presence
    reject_if:
    - self-portrait, animals, plants, medical symbols, or regional dress appear without request
    - generic dream collage replaces the requested setting and objects
    - direct gaze is forced against the user's specified expression or pose
