composition:
  - '用大面积单色场、偏置色面或低起伏浮雕建立安静而强烈的空间；保留足够留白。'
  - '主体可以被压缩为平面、轮廓或局部浮起的色面，但不得删掉用户要求的关键结构。'
palette:
  - '以深而饱和的蓝色作为主要色彩角色；白、黑、暖金或少量粉色只作为克制的结构对照。'
  - '颜色要像颜料或表面材料，而不是发光滤镜；同一色域保留细微明度变化。'
lighting:
  quality: 大型均匀柔光或低角度掠射光，重点揭示颜料颗粒、海绵孔隙和表面起伏。
  behavior:
    - 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。
    - 保留用户指定的主体轮廓、位置和空间关系。
surface:
  finish: 哑光颜料、厚涂、海绵压印、石膏浮雕、未上釉纸面或粗纤维画布。
  edges: 保持主体边缘可辨；允许媒介造成的轻微不齐，但不使用发光描边或综合色隔离带。
texture:
  density: 低到中等；纹理集中在表面边界和浮起区域，不覆盖主体轮廓。
  placement: 集中在材料边界、暗部或印刷交界处，不覆盖主体识别信息。
invariants:
  - '更换主体后仍然能观察到本包的媒介、构图、色彩和表面签名。'
  - '不要求特定人物、物件、地点、建筑、植物、车辆或故事作为默认内容。'
  - '示例主体只用于验证视觉迁移，不得泄漏到默认 Prompt。'

