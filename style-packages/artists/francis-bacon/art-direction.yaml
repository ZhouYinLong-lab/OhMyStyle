schema_version: 2.0.0
status: experimental
id: bacon-enclosed-space-and-localized-distortion
name: Bacon enclosed space and localized distortion
base_package: artists/francis-bacon
scope:
  medium: oil_painting
  representation: recognizable
  description: >-
    A figurative painting direction that places the user's requested subject
    within a compressed spatial frame, then applies restrained local contour
    shifts and visible overpainting to create tension. The frame can be a
    transparent architectural outline, platform, opening, or crop, but it
    must not become a literal cage by default. The subject remains identifiable
    and the paint process stays visible without imposing a fixed narrative.
  required_contexts:
    - enclosed-figurative-tension
  incompatible_contexts:
    - open-atmospheric-landscape
    - photorealistic-editorial-portrait
    - mandatory-horror-scene
  limitations:
    - Only use a figure or object supplied by the user; do not add a person, animal, portrait, or body part by default.
    - Keep any contour shift localized and recover the requested subject's identity and count.
    - Use enclosure and dark or saturated fields only when they fit the requested setting; do not add violence, screaming, crosses, arenas, or meat imagery.
pillars:
  - Compress space around the existing subject with a spare frame or shallow architectural cue rather than a fully described room.
  - Apply small, selective contour displacements through dragged, scraped, or overpainted marks while preserving recognition.
  - Contrast a few broad color fields with visible changes in paint thickness and exposed underlying layers.
  - Keep areas of visual quiet so distortion reads as a deliberate pressure point, not all-over glitch.
rules:
  - id: frame-and-compressed-spatial-cue
    axis: enclosure_and_space
    importance: core
    applies_when: The user supplies a figure or object for a psychologically tense painted scene.
    instruction: Place the requested subject in a compressed, shallow setting and use one spare frame, opening, platform, or boundary line to establish spatial pressure; do not add literal bars or a cage unless requested.
    observable: A simple spatial cue encloses or focuses the subject without building a detailed room or changing the user's setting.
    reject_when: The subject is replaced, the room becomes a generic prison, or the frame obscures essential anatomy or object structure.
    evidence:
      source_ids:
        - bacon-met-three-studies
        - bacon-moma-conservation
      basis: institutional_description
      visual_review: pending
    avoid: default cage bars, generic cell, and elaborate unrelated interior
  - id: localized-contour-shift-with-recognition
    axis: figure_and_contour
    importance: core
    applies_when: The user requests expressive distortion of a recognizable subject.
    instruction: Shift or drag only selected contour passages; preserve the subject's defining silhouette, identity, number of parts, and pose while letting surrounding marks suggest tension or movement.
    observable: The subject remains identifiable at a glance, and distortion concentrates in a few intentional passages.
    reject_when: Features melt indiscriminately, identity changes, anatomy multiplies, or distortion becomes a digital glitch effect.
    evidence:
      source_ids:
        - bacon-met-three-studies
        - bacon-moma-1959-exhibition
      basis: institutional_description
      visual_review: pending
    avoid: all-over liquefaction, duplicate features, and grotesque default expression
  - id: overpaint-scrape-and-color-field
    axis: surface_and_color
    importance: supporting
    applies_when: The user requests a visibly, materially expressive oil-painted surface.
    instruction: Build a few distinct color fields and show selected dragged, scraped, covered, or thinly washed passages; reserve the strongest surface disturbance for places where it reinforces the subject's tension.
    observable: Paint layers and corrections remain visible in selected areas while the overall color structure stays coherent.
    reject_when: Scratches become decorative noise, every surface has the same texture, or color fields hide the requested subject.
    evidence:
      source_ids:
        - bacon-moma-conservation
        - bacon-moma-painting-audio
      basis: institutional_description
      visual_review: pending
    avoid: uniform grunge overlay, plastic smoothness, and unmotivated splatter
active_rule_ids:
  - frame-and-compressed-spatial-cue
  - localized-contour-shift-with-recognition
  - overpaint-scrape-and-color-field
joint_checks:
  - id: enclosure-distortion-and-material-coherence
    rule_ids:
      - frame-and-compressed-spatial-cue
      - localized-contour-shift-with-recognition
      - overpaint-scrape-and-color-field
    instruction: Let the spatial frame, localized shifts, and altered paint surface build pressure around the user's subject while preserving its identity.
    observable: The subject remains recognizable, spatial enclosure feels deliberate, and paint disturbance is selective rather than a global effect.
sources:
  - id: bacon-met-three-studies
    kind: museum_artwork_analysis
    url: https://www.metmuseum.org/art/collection/search/489966
  - id: bacon-moma-conservation
    kind: museum_conservation_analysis
    url: https://www.moma.org/explore/inside_out/2015/11/19/francis-bacons-painting-1946-histories-and-conservation-part-1/
  - id: bacon-moma-1959-exhibition
    kind: museum_exhibition_catalogue
    url: https://www.moma.org/documents/moma_catalogue_1959_300062980.pdf
  - id: bacon-moma-painting-audio
    kind: museum_artwork_analysis
    url: https://www.moma.org/audio/playlist/307/3974
execution:
  route: text_only
  must:
    - Declare enclosed-figurative-tension before applying this direction.
    - Preserve the user's requested subject, identity, pose, count, and setting.
    - Apply contour shifts selectively and keep the subject recognizable.
    - Use visible paint disturbance as a material decision, not a uniform filter.
  avoid:
    - adding a person, screaming face, crucifix, arena, meat, or violence without request
    - turning the frame into literal cage bars unless the user requests that setting
    - copying a named triptych's exact pose, crop, color layout, or sequence
