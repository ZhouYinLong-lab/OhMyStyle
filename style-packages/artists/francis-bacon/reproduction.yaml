reproduction:
  priority_order:
    - 用户主体与用途
    - 主体可辨识轮廓
    - 空间压缩与局部变形
    - 颜料过程与色面冲突
  subject_rules:
    - 用户主体必须保留；艺术家包不能默认加入人物、肖像或固定符号。
    - 代表图中的椅子和室内只是测试主体，不进入默认提示词。
  transfer_rules:
    - 先建立正常结构，再对局部边缘、比例或空间做克制偏移。
    - 用擦刮和覆盖表现不稳定，而不是添加随机故障。
    - 让颜色承担心理张力，同时保持主要形体可读。
  forbidden_shortcuts:
    - 默认尖叫面孔、十字架、竞技场或肉身意象
    - 数字液化、故障滤镜和卡通人体
