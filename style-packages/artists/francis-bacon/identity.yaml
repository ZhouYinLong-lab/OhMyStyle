canonical_name: 弗朗西斯·培根
entity_type: artist
domain: painting
scope:
  subject_policy: open
  subject_note: 用户提供的主体优先；代表图只是测试主体，不是默认场景。
  subjects: []
  exclusions:
    - 固定肖像、尖叫面孔、十字架或竞技场
    - 复制具体画作、人物或构图
    - 把所有场景都变成肉身和封闭房间
sources:
  - 'https://www.moma.org/artists/272-francis-bacon'
notes:
  - 本包提取扭曲、封闭空间、擦刮颜料和肉身张力之间的关系。
  - 变形应服务于用户主体的心理或空间压力，不制造固定故事。
composition:
  - 用框架、门洞、台座或压缩透视把主体放进有限空间。
  - 允许主体轮廓发生局部偏移，但保留整体可辨识度。
  - 让空白、阴影和局部形变共同制造不稳定的观看感。
palette:
  - 使用脏奶油、紫红、深蓝绿、赭黄和肉色之间的冲突。
lighting:
  quality: 平直而压迫的室内光，局部阴影具有心理重量
  behavior:
    - 不依赖电影式轮廓光；通过色面、擦痕和空间压缩制造体积。
surface:
  finish: 厚薄并置、擦刮可见的油画表面
  edges: 建筑边缘较硬，主体局部边缘被拖拽、擦除或重新覆盖
texture:
  density: 中等到高
  placement: 颜料堆积、刮痕、薄洗和被覆盖的底层
invariants:
  - 具象主体与局部扭曲同时成立
  - 封闭空间或框架造成心理压力
  - 颜色和擦痕承担形体与情绪
  - 不固定人物、物体、地点或故事
medium: 20世纪现代具象油画
materials:
  support: 画布、油画颜料、薄洗和刮擦层
process:
  - 先锁定用户主体，不从艺术家姓名推断人物或道具。
  - 建立可辨识的轮廓和空间框架，再加入局部偏移。
  - 用色面对比、擦刮和覆盖改变心理重量。
  - 最后恢复主体关键结构，避免变成随机人体噪声。
technical_direction:
  contrast: 中等到高，重点在色面冲突而非纯黑纯白
  saturation: 中等，局部肉色和紫红可以更强
  perspective: 压缩、略不稳定，但不破坏基本空间
  detail_density: 中等，细节集中在形体和颜料过程
avoid:
  - 默认肖像、尖叫、十字架、竞技场或肉块
  - 赛博故障、液态变形和卡通夸张
  - 平滑数字渐变、塑料质感和装饰性污渍
  - 复制具体作品、人物或可识别符号
safety_note: 不复现具体作品、人物、商标或固定叙事；代表图只展示视觉方法。
