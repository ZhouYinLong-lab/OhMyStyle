profiles:
  flat-space-natural-detail:
    required:
      - requested subject identities and count remain correct
      - crisp contours and bounded color areas remain visible
      - shallow overlap organizes depth without changing the layout
      - diffuse light keeps requested details legible
    reject_if:
      - unrequested plants, animals, figures, or jungle narrative appear
      - atmospheric haze erases the forms or dramatic light dominates
      - perspective or scale changes the requested arrangement
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - simplified planes and even illumination remain visible without forcing a jungle portrait
  still_life:
    required:
      - repeated forms remain decorative without inventing animals or tropical props
