composition:
- 人物被装饰性平面、金色图案和垂直背景包围，身体关系被图案化
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 金黄、黑、象牙、深紫与孔雀蓝形成装饰性对比
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 金箔联想、平面装饰和局部写实身体结合
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀正面光让金属与图案发亮，但不产生摄影棚高光
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 金属叶片、织物、皮肤和花朵使用不同图案语言
- 不同材质保留可辨识的表面行为。
texture:
- 几何图案与植物纹样形成密度层级
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 只提取装饰结构和金色平面，不复制拥抱人物、服装图案或具体作品
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
