schema_version: 2.0.0
status: experimental
id: delaunay-seam-aware-garment-color-rhythm
name: Delaunay seam-aware garment color rhythm
base_package: artists/sonia-delaunay
scope:
  medium: painted_image
  representation: stylized
  description: >-
    An optional direction for one user-requested garment design. Place simultaneous-
    contrast color blocks, arcs, and bands according to the garment's real body,
    sleeve, collar, cuff, and seam panels. Let color rhythm cross adjacent pieces
    through related shapes while preserving the cut and construction. This applies
    Delaunay's color-and-fashion practice to a new garment without prescribing a
    dress, pattern, wearer, or historical design.
  required_contexts:
    - user-requested-single-garment-design
  incompatible_contexts:
    - user-requested-unpatterned-garment
    - multiple-garments-as-equal-subjects
    - exact-brand-or-logo-reproduction
    - text-or-logo-reproduction
  limitations:
    - Activate only when the user requests a designed or patterned garment.
    - Preserve the requested garment type, silhouette, fit, material, color constraints, closures, and visible construction features.
    - Keep all designed color shapes within the garment silhouette; do not turn the wearer, mannequin, background, or second garment into a textile pattern unless requested.
    - Align blocks and arcs to actual garment panels and seams; do not erase buttons, pockets, lapels, cuffs, or openings.
    - Do not default to a dress, a specific historical costume, a wearer, or a named design.
pillars:
  - Make color rhythm answer the garment's construction, with related shapes connecting adjacent panels.
  - Use simultaneous warm-cool contrasts in a controlled palette rather than a random rainbow fill.
  - Keep garment silhouette, seams, and practical features legible beneath the pattern.
rules:
  - id: rhythm-follows-garment-panels
    axis: pattern-to-construction-alignment
    importance: core
    applies_when: The user requests a patterned or color-blocked garment.
    instruction: Place major color blocks and arcs inside the actual body, sleeve, and collar panels; let related edges meet or continue across seams where the user has requested a coordinated design.
    observable: Color rhythm follows the garment's cut and panel boundaries rather than floating as an unrelated overlay.
    reject_when: Pattern erases seams, crosses openings arbitrarily, or changes the garment silhouette.
    evidence:
      source_ids:
        - moma-sonia-delaunay-clothing-and-textiles
      basis: institutional_description
      visual_review: pending
    avoid: wallpaper-like all-over print or copied costume geometry
  - id: construction-details-remain-readable
    axis: garment-function-and-feature-legibility
    importance: core
    applies_when: The requested garment includes closures, lapels, pockets, cuffs, or other structural details.
    instruction: Preserve each specified feature and leave enough contrast around it to identify its function; pattern edges may meet a seam but must not disguise the opening or fastener.
    observable: The garment remains wearable and recognizable at thumbnail size, with all requested closures and features visible.
    reject_when: A pocket vanishes, buttons merge into pattern, sleeves fuse into the body, or the neckline changes.
    evidence:
      source_ids:
        - nga-sonia-textile-patterns
      basis: direct_visual_observation
      visual_review: pending
    avoid: decorative blocks that obscure garment construction
  - id: controlled-simultaneous-contrast
    axis: color-rhythm-and-local-contrast
    importance: supporting
    applies_when: The user permits a multicolor garment design.
    instruction: Pair a small set of contrasting hues across neighboring garment panels, vary arc or block scale to create movement, and leave a few quiet intervals so the garment does not become an undifferentiated rainbow.
    observable: Adjacent panels create a pulsing color rhythm while each panel and the whole garment remain distinct.
    reject_when: Every panel receives an unrelated saturated hue or repeated shapes become an even mechanical tile.
    evidence:
      source_ids:
        - moma-sonia-delaunay-clothing-and-textiles
      basis: institutional_description
      visual_review: pending
    avoid: random rainbow fill, blur, motion streaks, or copied textile repeat
active_rule_ids:
  - rhythm-follows-garment-panels
  - construction-details-remain-readable
  - controlled-simultaneous-contrast
joint_checks:
  - id: wearable-color-rhythm-keeps-construction
    rule_ids:
      - rhythm-follows-garment-panels
      - construction-details-remain-readable
      - controlled-simultaneous-contrast
    instruction: Let a limited rhythmic color design follow the user's actual garment panels, preserve every named construction feature, and keep the garment readable as a functional item.
    observable: Simultaneous color contrast energizes the garment while its silhouette, seams, closures, and requested material stay clear.
sources:
  - id: moma-sonia-delaunay-clothing-and-textiles
    kind: museum_artist_record
    url: https://www.moma.org/artists/1480-sonia-delaunay
  - id: nga-sonia-textile-patterns
    kind: museum_collection_record
    url: https://www.nga.gov/artworks/199084-simultaneous-patterns-cloth
execution:
  route: text_only
  must:
    - Activate only for a user-requested garment design.
    - Preserve garment type, silhouette, fit, material, openings, closures, and construction features.
    - Keep color rhythm within the garment and align it to garment panels and seams.
    - Review pattern boundaries, seam alignment, feature legibility, and palette control.
  avoid:
    - adding a dress, wearer, accessories, or second garment unless requested
    - extending garment pattern onto the background or mannequin
    - obscuring pockets, buttons, lapels, cuffs, or openings
