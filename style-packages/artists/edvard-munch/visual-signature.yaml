composition:
  - compress or tilt space so the environment participates in the emotion
  - use a small or isolated figure against a large rhythmic field
  - build paths, shorelines, rails, or sky bands as repeated emotional curves
color:
  - rust red, acid ochre, deep blue, green-black, and dirty flesh tones
  - non-natural color is tied to psychological state, not decorative contrast
line:
  behavior: contour_and_environment_share_the_same_tension
  marks: [long undulating lines, dark enclosing contours, restless parallel bands]
surface:
  brushwork: broad_uneven_loaded_marks_with_visible_support
  finish: raw_symbolic_oil_surface
invariants:
  - color and line must communicate an inner condition
  - space may distort but remains intentional and readable
  - the figure is psychologically specific without being a named person
  - new subject and arrangement are mandatory
