package_id: edvard-munch
package_version: 0.1.0
invariants:
  - id: psychological_color
    weight: 3
    test: Non-natural color communicates an inner state rather than decoration.
  - id: rhythmic_contour
    weight: 3
    test: Figure and environment share intentional undulating or enclosing line.
  - id: compressed_space
    weight: 2
    test: Space is simplified or tilted while remaining purposeful.
  - id: original_arrangement
    weight: 3
    test: The scene is not a recognizable reconstruction.
rejections: [decorative_saturation, random_distortion, copied_iconic_pose]
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
