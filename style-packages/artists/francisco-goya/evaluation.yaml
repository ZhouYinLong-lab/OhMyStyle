package_id: francisco-goya
package_version: 0.2.0
profiles:
  psychological-portrait:
    required:
    - sitter's requested expression and identity remain recognizable
    - paint detail and mark scale distinguish focal features from background
    - restrained value contrast supports face readability
    reject_if:
    - unrequested violence, grotesque imagery, or self-portrait identity appears
    - direct gaze is forced against the user's request
    - global roughness or black overlay replaces selective painted marks
invariants:
- id: signature
  weight: 3
  test: 心理张力、暗色现实、粗粝笔触与不安静默
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
image_audit:
  similarity_level: review
  method: perceptual hash, color histogram, luminance, texture, and layout; screening only
  candidate_pairs:
  - package: artists/gustave-moreau
    score: 0.826
    signals:
      color: 0.977
      luminance: 0.957
      texture: 0.996
      layout: 0.943
  - package: movements/symbolism
    score: 0.823
    signals:
      color: 0.958
      luminance: 0.998
      texture: 0.984
      layout: 0.988
  reason: Automated gallery similarity is a curator-review cue, not evidence of semantic duplication.
  action: preserve-distinctive-signature-and-recheck-gallery
