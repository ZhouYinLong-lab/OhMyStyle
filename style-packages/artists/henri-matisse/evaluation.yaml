package_id: henri-matisse
package_version: 0.2.0
profiles:
  cut-paper-color-construction:
    required:
      - requested subject and count remain recognizable in simplified silhouettes
      - opaque flat color shapes and crisp edges define the image
      - positive and negative shapes create an intentional composition
      - color spacing creates varied rhythm without a rigid grid
    reject_if:
      - unrequested plant, sea creature, figure, or decorative motif appears
      - forms use photorealistic gradients or metallic ornament
      - added cutouts obscure or alter the requested subject count
invariants:
- id: signature
  weight: 3
  test: 平面色块、装饰性空间、简化轮廓与大胆色彩
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
