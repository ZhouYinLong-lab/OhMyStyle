schema_version: 2.0.0
status: experimental
id: schiele-contour-tension-and-exposed-ground
name: Schiele contour tension and exposed ground
base_package: artists/egon-schiele
scope:
  medium: drawing_or_watercolor_on_paper
  representation: stylized
  description: >-
    A focused direction drawn from Schiele's radical works on paper around
    1910–1914. An emphatic, angular contour carries the subject's structure and
    tension; asymmetrical open ground balances the silhouette, while dry,
    sparse color remains attached to selected forms. This is a study of line,
    figure-ground pressure, and material restraint, not a prescribed body or
    narrative.
  required_contexts:
    - expressive-contour-study
  incompatible_contexts:
    - photorealistic-rendering
    - decorative-monochrome-ink
    - smooth-academic-modeling
  limitations:
    - Preserve the requested subject, identity, pose, clothing, and body type; do not default to nudity, self-portraiture, erotic framing, or a contorted pose.
    - Apply angular stylization only as far as the subject remains recognizable and the requested action stays legible.
    - Keep paper ground and sparse color subordinate to the requested medium and color constraints; do not impose a fixed palette on every image.
pillars:
  - Let a directional, emphatic contour describe structure and expressive tension instead of tracing every edge evenly.
  - Balance the silhouette with deliberate open ground and unevenly worked regions.
  - Use angular simplification to make the pose or object's structure clear, without arbitrary distortion.
  - Keep dry, sparse color localized to selected forms and preserve visible paper between marks.
rules:
  - id: emphatic-angular-contour
    axis: line_and_form
    importance: core
    applies_when: The requested image is a drawing or watercolor study with a clearly defined subject.
    instruction: Vary the contour's pressure, direction, and continuity to stress the requested subject's structure; allow purposeful angular breaks, but retain enough anatomical or object landmarks to preserve identity and action.
    observable: The line feels deliberate and structurally expressive, with a few stronger turns or interruptions carrying more weight than secondary edges.
    reject_when: Every edge has the same weight, the contour becomes decorative calligraphy, or angularity distorts a user-specified identity or action.
    evidence:
      source_ids:
        - schiele-moma-line-study
        - schiele-leopold-crouching-figure
      basis: institutional_description
      visual_review: pending
    avoid: uniform outlines, ornamental flourishes, and arbitrary anatomical distortion
  - id: silhouette-and-open-ground-tension
    axis: figure_ground_and_composition
    importance: core
    applies_when: The composition includes a distinct subject against visible paper or a quiet field.
    instruction: Place the subject asymmetrically and let open ground press against or interrupt selected parts of its silhouette; keep the negative shapes intentional and protect the requested focal landmarks.
    observable: The occupied and unoccupied areas create a taut, readable balance rather than a centered cutout or evenly filled page.
    reject_when: Empty ground is merely leftover margin, the silhouette closes into a generic sticker shape, or open areas erase critical parts of the subject.
    evidence:
      source_ids:
        - schiele-leopold-lantern-plant
        - schiele-leopold-crouching-figure
      basis: institutional_description
      visual_review: pending
    avoid: centered badge layouts, uniform page filling, and accidental blank gaps
  - id: localized-dry-color-and-paper
    axis: color_and_surface
    importance: core
    applies_when: The user requests watercolor, gouache, or another paper-based painted study.
    instruction: Use a few restrained, dry color passages on selected forms and leave paper visible between them; assign colors locally to the requested subject and avoid spreading one hue as an all-over wash.
    observable: Color supports the form in separate, economical accents while the paper remains an active part of the surface.
    reject_when: Color becomes a uniform filter, wet atmospheric blending replaces line and paper, or the user's palette request is ignored.
    evidence:
      source_ids:
        - schiele-leopold-crouching-figure
        - schiele-leopold-squatting-figure
      basis: institutional_description
      visual_review: pending
    avoid: global sepia, generalized watercolor haze, and full-page opaque fill
active_rule_ids:
  - emphatic-angular-contour
  - silhouette-and-open-ground-tension
  - localized-dry-color-and-paper
joint_checks:
  - id: line-ground-color-coherence
    rule_ids:
      - emphatic-angular-contour
      - silhouette-and-open-ground-tension
      - localized-dry-color-and-paper
    instruction: Let contour, open ground, and sparse color reinforce the same structural emphasis without forcing a recurring subject, pose, or palette.
    observable: The subject remains recognizable, the line carries expressive weight, and open paper and localized color complete rather than decorate the composition.
sources:
  - id: schiele-moma-line-study
    kind: museum_catalogue
    url: https://www.moma.org/documents/moma_catalogue_264_300063176.pdf
  - id: schiele-leopold-crouching-figure
    kind: museum_object_description
    url: https://onlinecollection.leopoldmuseum.org/en/object/1538-crouching-female-nude/
  - id: schiele-leopold-squatting-figure
    kind: museum_object_description
    url: https://onlinecollection.leopoldmuseum.org/en/object/1596-squatting-female-nude/
  - id: schiele-leopold-lantern-plant
    kind: museum_object_description
    url: https://onlinecollection.leopoldmuseum.org/en/object/528-self-portrait-with-chinese-lantern-plant/
execution:
  route: text_only
  must:
    - Declare the expressive-contour-study context before applying this direction.
    - Preserve the requested identity, action, clothing, and subject count.
    - Use emphatic contour and asymmetrical open ground only where they clarify the requested form.
    - Keep any color local and leave the requested paper or ground visible.
  avoid:
    - adding nudity, erotic framing, self-portraiture, or a signature pose without request
    - turning line angularity into arbitrary distortion or decorative lettering
    - covering the whole surface with a color wash
