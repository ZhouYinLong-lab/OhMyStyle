package_id: egon-schiele
package_version: 0.2.0
profiles:
  expressive-contour-study:
    required:
      - directional contour emphasizes structure without equal outlining
      - open ground balances the subject without obscuring requested landmarks
      - dry, sparse local color preserves visible paper where appropriate
    reject_if:
      - nudity, erotic framing, or a contorted pose is introduced without request
      - angular stylization damages identity, anatomy, or action readability
      - a global wash or decorative monochrome treatment replaces local form
invariants:
- id: style_recognition
  weight: 3
  test: The package medium, edge, light, palette, and texture decisions remain recognizable after the subject changes.
- id: prompt_adherence
  weight: 3
  test: The requested subject, count, setting, and aspect ratio are followed without adding a copied source arrangement.
- id: material_readability
  weight: 2
  test: Requested materials and capture behavior remain visually distinguishable.
- id: human_artifact_control
  weight: 2
  test: Hands, faces, geometry, text, reflections, and repeated details do not show avoidable generative defects.
rejections:
- copied_named_work
- generic_global_filter
- unreadable_subject
- style_pollution
- unmotivated_extra_objects
minimum_score: 8
benchmark_suite:
- portrait
- still_life
- architecture_environment
- minimal_composition
- fuzzy_brief
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
image_audit:
  similarity_level: review
  method: perceptual hash, color histogram, luminance, texture, and layout; screening only
  candidate_pairs:
  - package: movements/chinese-literati-ink-painting
    score: 0.854
    signals:
      color: 0.999
      luminance: 0.981
      texture: 0.999
      layout: 0.901
  - package: schools/california-institute-of-the-arts
    score: 0.849
    signals:
      color: 0.933
      luminance: 0.821
      texture: 0.995
      layout: 0.918
  reason: Automated gallery similarity is a curator-review cue, not evidence of semantic duplication.
  action: preserve-distinctive-signature-and-recheck-gallery
