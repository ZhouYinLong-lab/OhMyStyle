composition:
- 人物或物体以扭曲姿态、尖锐负形和不稳定边缘占据空白纸面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 骨白、砖红、暗绿、烟灰和黑线形成裸露而克制的色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 干涩线描、扭曲人体和稀疏水彩色块
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 平光或纸面均匀光，体积来自线条和局部色块
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 纸张、皮肤和衣物表面保持干裂、轻薄和未完成感
- 不同材质保留可辨识的表面行为。
texture:
- 线条有明显方向，空白也是构图的一部分
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持紧张线性和空白，不复制具体肖像、姿势或色情化身体
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
