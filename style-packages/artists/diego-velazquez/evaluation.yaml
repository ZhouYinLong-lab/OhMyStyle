package_id: diego-velazquez
package_version: 0.2.0
profiles:
  observed_interior_portrait:
    required:
      - gaze and posture organize attention among requested people or tasks
      - layered values create readable space without a black void
      - facial and hand anchors are precise while secondary paint remains broad
    reject_if:
      - mirror, doorway, attendant, or court costume appears without request
      - every figure faces the viewer by default
      - detail or blur is uniform across all forms
invariants:
- id: signature_primary
  weight: 3
  test: The output demonstrates the package's primary observable structural behavior.
- id: medium_consistency
  weight: 2
  test: Surface, light, and detail behavior remain consistent with the stated medium.
- id: original_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: no_generic_filter
  weight: 2
  test: The result is not explained by a global filter alone.
rejections:
- copied_named_work
- generic_style_filter
- contradictory_medium_behavior
minimum_score: 8
semantic_evaluation:
  subject_independence:
    score: null
    notes: Pending provider-backed neutral-subject review.
  distinctive_signature:
    score: null
    notes: Record which visual decisions remain observable after the subject changes.
  visual_overlap:
    score: null
    notes: Compare the representative image and output with near-duplicate packages.
  cross_subject_stability:
    score: null
    notes: Run at least two different subjects before assigning a score.
image_audit:
  similarity_level: review
  method: perceptual hash, color histogram, luminance, texture, and layout; screening only
