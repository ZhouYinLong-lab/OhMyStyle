canonical_name: 迭戈·委拉斯开兹
entity_type: artist
life: 1599-1660
region: Spain
primary_medium: oil_painting
scope:
  subjects:
    - court portrait and group interaction
    - quiet interior architecture
    - hands, faces, textiles, and animals
    - social presence without theatrical exaggeration
  period_focus: mature historical practice
  exclusions:
    - copied famous composition
    - generic style filter
    - unmotivated decorative effects
subject_matter:
  - visual behavior is extracted from multiple original works
  - the generated scene must remain a new subject and arrangement
