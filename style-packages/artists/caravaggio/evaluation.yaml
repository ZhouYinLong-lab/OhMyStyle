package_id: caravaggio
package_version: 0.1.0
invariants:
- id: signature
  weight: 3
  test: 明暗对照、单一光源、普通人物与戏剧性空间
- id: new_arrangement
  weight: 3
  test: The subject and composition are not a recognizable reconstruction.
- id: material_readability
  weight: 2
  test: The requested medium or capture behavior remains visible.
rejections:
- copied_named_work
- global_generic_filter
- unreadable_subject
minimum_score: 8
image_audit:
  similarity_level: high
  visual_overlap:
    - dramatic directional light
    - dark field with isolated highlights
  reason: Caravaggio, Rembrandt, Tenebrism, and deep-shadow presets share strong chiaroscuro signals.
  keep_separate_because:
    - this package is an artist-derived treatment with naturalistic human drama and tactile bodies
    - it must not force biblical, tavern, or figure subjects
    - artist-specific spatial and skin-light decisions differ from a generic lighting preset
  action: clarify_distinctive_signature
