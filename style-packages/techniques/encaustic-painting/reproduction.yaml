medium: 颜料与蜡混合、叠层、熔融和刮除
materials:
- 纸张或画布
- 主体媒介纹理
- 有限的边缘控制
- 角色化色板
- 可读的光影层次
process:
- 先确定主体和独立构图
- 再建立大形体与色彩角色
- 补充媒介特有的表面与纹理
- 最后检查来源特征是否保持而非复制原作
technical_direction: 保持蜡层和热处理痕迹，不把结果做成普通油画或塑料
safety_note: Use observable traits only. Do not reconstruct a named work, character,
  location, logo, text, or exact composition.
