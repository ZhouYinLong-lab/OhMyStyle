composition:
- 半透明蜡层、刮痕和堆积边缘构成厚薄不均的抽象表面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 蜂蜜黄、乳白、烟灰、朱红和深棕形成温暖蜡质色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 颜料与蜡混合、叠层、熔融和刮除
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 表面高光来自蜡层方向而非镜面灯光
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 蜡、颜料、木板和刮痕的层次必须清楚
- 不同材质保留可辨识的表面行为。
texture:
- 熔化流痕、半透明层和刮痕形成自然的手工纹理
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持蜡层和热处理痕迹，不把结果做成普通油画或塑料
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
