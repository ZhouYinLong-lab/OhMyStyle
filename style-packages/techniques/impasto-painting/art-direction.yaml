joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - composition
  - palette
  instruction: Keep the package-specific relationship among differentiation, composition, palette consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-primary-01
  kind: impasto
  base_asset_id: primary-01
execution:
  route: text_only
  must:
  - 先确定主体的体积和光源方向
  - 用厚薄不同的颜料建立主要色块
  - 让笔触方向回应曲面、边缘和光线
  - 检查纹理是否仍然服务于主体而非成为固定题材
  - 真实可见的颜料厚度
  - 笔触方向与体积、光线绑定
  - 高光通过颜料堆叠而不是发光滤镜产生
  - 纹理密度随主体和构图变化
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - generic painterly filter
  - uniform canvas noise
  - automatic artist palette or subject
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or
    protected game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
