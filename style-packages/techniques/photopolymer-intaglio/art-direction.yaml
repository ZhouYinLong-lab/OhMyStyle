execution:
  route: text_only
  must:
  - prepare a high-quality tonal source from the user-supplied subject
  - expose and develop the polymer plate so tonal information becomes recessed plate structure
  - ink, wipe, and press the plate into damp paper, retaining grain and pressure variation
  - continuous-tone information translated into plate grain
  - wiped intaglio ink and paper pressure
  - restrained process color over a tactile ground
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - a mandatory landscape, portrait, camera, or darkroom scene
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
