medium: water-and-ink marbling transferred to paper
materials:
  support: absorbent paper, water bath, diluted ink, and gentle air movement
process:
  - establish a quiet paper field and a shallow water surface
  - place floating ink rings and disturb them with restrained currents
  - transfer the pattern to paper and preserve drying, pooling, and absorption marks
technical_direction:
  contrast: low to medium with dark ink anchors
  saturation: translucent and restrained
  perspective: planar, close, and material-focused
  detail_density: fine in fluid boundaries, sparse elsewhere
avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
safety_note: Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
