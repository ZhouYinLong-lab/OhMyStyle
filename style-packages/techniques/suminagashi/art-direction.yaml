schema_version: 2.1.0
status: experimental
id: suminagashi-direction
name: 墨流
base_package: techniques/suminagashi
scope:
  medium: water-and-ink marbling transferred to paper
  representation: stylized
  description: 以水面漂浮墨迹、缓慢扰动、偶然纹理与纸张吸收之间的关系，生成轻盈而不可完全重复的表面。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory flowers, ocean waves, or calligraphy
  - glossy digital fluid gradients without paper or process evidence
pillars:
- 以水面漂浮墨迹、缓慢扰动、偶然纹理与纸张吸收之间的关系，生成轻盈而不可完全重复的表面。
- 'differentiation: water-driven rings and slow currents; translucent ink layers on absorbent paper; handmade
  variation and drying evidence'
- 'composition: Let fluid rings, currents, and pauses create an organic field without requiring a recognizable
  motif.; Preserve asymmetry and breathing room; the most important event may sit off center.'
- 'palette: Start with ink black, smoke gray, and paper white; add diluted mineral or indigo tones sparingly.;
  Keep colors translucent and separated by water-driven boundaries rather than digital gradients.'
