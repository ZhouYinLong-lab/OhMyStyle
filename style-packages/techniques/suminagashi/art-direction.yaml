execution:
  route: text_only
  must:
  - establish a quiet paper field and a shallow water surface
  - place floating ink rings and disturb them with restrained currents
  - transfer the pattern to paper and preserve drying, pooling, and absorption marks
  - preserve fluid uncertainty and the trace of a handmade process
  - preserve translucent layers and paper as an active material
  - preserve non-repeatable variation without turning it into chaotic noise
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - mandatory flowers, ocean waves, or calligraphy
  - glossy digital fluid gradients without paper or process evidence
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
