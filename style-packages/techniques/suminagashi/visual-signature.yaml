composition:
  - Let fluid rings, currents, and pauses create an organic field without requiring a recognizable motif.
  - Preserve asymmetry and breathing room; the most important event may sit off center.
palette:
  - Start with ink black, smoke gray, and paper white; add diluted mineral or indigo tones sparingly.
  - Keep colors translucent and separated by water-driven boundaries rather than digital gradients.
lighting:
  quality: soft overhead craft-table light
  behavior:
    - Reveal paper fibers, shallow staining, and the difference between wet and dry marks.
surface:
  finish: absorbent handmade paper with water-softened ink lines
  edges: feathery, tide-like, and irregular; retain occasional drying marks
texture:
  density: fine to moderate
  placement: concentrated in rings, sediment, paper grain, and edges of pooled pigment
invariants:
  - preserve fluid uncertainty and the trace of a handmade process
  - preserve translucent layers and paper as an active material
  - preserve non-repeatable variation without turning it into chaotic noise
