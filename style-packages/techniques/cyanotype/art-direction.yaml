schema_version: 2.1.0
status: experimental
id: cyanotype-direction
name: 氰版印相
base_package: techniques/cyanotype
scope:
  medium: cyanotype contact printing, with Prussian-blue photochemical exposure on a visible paper ground
  representation: stylized
  description: Describes cyanotype results through Prussian-blue values, contact-print silhouettes, paper irregularity,
    and photochemical traces, focusing on process rather than a single artist’s personal style.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copying_a_specific_work
  - copying_a_named_character_or_logo
pillars:
- Describes cyanotype results through Prussian-blue values, contact-print silhouettes, paper irregularity, and
  photochemical traces, focusing on process rather than a single artist’s personal style.
- 'medium: cyanotype contact printing, with Prussian-blue photochemical exposure on a visible paper ground'
- 'composition: Arrange the requested subject as a readable contact-print silhouette with deliberate negative
  space; preserve paper margins and avoid a copied source arrangement.'
- 'palette: Prussian-blue image values over warm paper: #123A63 deep image, #2B5B82 middle tone, #7FA6B9 diluted
  layer, #F1EAD8 unexposed area, and #D3C5A5 paper base.'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Render in cyanotype contact printing, with Prussian-blue photochemical exposure on a visible paper
    ground; make the production or rendering process visible in edge, surface, and tonal evidence.
  observable: The image visibly reads as cyanotype contact printing, with Prussian-blue photochemical exposure
    on a visible paper ground, rather than a generic color treatment.
  reject_when: Reject when the material or rendering process cannot be distinguished from a generic filter.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Arrange the requested subject as a readable contact-print silhouette with deliberate negative space;
    preserve paper margins and avoid a copied source arrangement. Preserve the user-provided subject and requested
    layout.
  observable: Arrange the requested subject as a readable contact-print silhouette with deliberate negative space;
    preserve paper margins and avoid a copied source arrangement.
  reject_when: Reject when the arrangement loses these structural decisions or copies a source composition.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use Prussian blue for the deepest image, middle and diluted blues for tonal separation, and warm
    paper or unexposed regions as distinct grounds. Do not apply a single blue filter.
  observable: 'Prussian-blue image values over warm paper: #123A63 deep image, #2B5B82 middle tone, #7FA6B9 diluted
    layer, #F1EAD8 unexposed area, and #D3C5A5 paper base.'
  reject_when: Reject when a global tint replaces the stated color roles or the roles cannot be distinguished.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- medium
- composition
- palette
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-source-1
  kind: style_reference
  base_asset_id: source-1
- id: source-source-2
  kind: style_reference
  base_asset_id: source-2
execution:
  route: text_only
  must:
  - translate the user subject into the style medium and structural rules
  - establish composition before small detail
  - inspect against the generic five-task suite
  - the result is an original new scene, not a copy of a source work
  - no unrequested text, logo, trademark, or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic_global_filter
  - copied_source_composition
  - readable_text_or_branding
  - copying_a_specific_work
  - copying_a_named_character_or_logo
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
