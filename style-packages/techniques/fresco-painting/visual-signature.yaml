composition:
- 建筑墙面、连续叙事和稳定人物群组形成公共空间画面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 石灰白、赭红、群青、土黄和灰绿形成矿物色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 湿灰泥上的矿物颜料、平面壁画与建筑尺度
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀天光或室内漫射光，颜色嵌入墙体而非悬浮
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 灰泥、石墙、矿物颜料和旧表面裂纹可见
- 不同材质保留可辨识的表面行为。
texture:
- 大色面和边缘磨损体现时间，细节服务远观
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持墙体承载和矿物色层，不复制宗教壁画、人物或建筑
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
