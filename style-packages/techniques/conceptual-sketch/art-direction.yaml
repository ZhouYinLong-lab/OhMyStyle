schema_version: 2.1.0
status: experimental
id: conceptual-sketch-direction
name: 概念草图
base_package: techniques/conceptual-sketch
scope:
  medium: 草图与视觉开发
  representation: stylized
  description: 以快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向，而不是追求完整渲染。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向，而不是追求完整渲染。
- 'form: 快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向的开发性画面'
- 'medium: 草图与视觉开发'
- 'composition: 线条先于表面渲染; 保留修正、箭头或局部未完成区域; 主体结构仍应清楚可读'
rules:
- id: signature
  axis: form
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Preserve this identifying visual signature across the requested subject: 快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向的开发性画面.
    Do not let generic polish or another package direction replace it. If a cue names a concrete object or
    motif, do not add it unless the user requests it; translate its formal qualities to the supplied subject.'
  observable: 'The image is recognizable through the package-specific formal relationships expressed by: 快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向的开发性画面.'
  reject_when: 'The result could not be distinguished from a generic treatment because these identifying cues
    are absent or contradicted: 快速线稿、局部标记、未完成轮廓和构思痕迹记录形体方向的开发性画面.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use the declared medium and keep its package-specific representation constraints visible: 草图与视觉开发.'
  observable: 'The requested image retains the stated medium distinction or production constraint: 草图与视觉开发.'
  reject_when: 'The medium is converted into an unrelated representation or the stated distinction disappears:
    草图与视觉开发.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 线条先于表面渲染; 保留修正、箭头或局部未完成区域;
    主体结构仍应清楚可读. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 线条先于表面渲染; 保留修正、箭头或局部未完成区域;
    主体结构仍应清楚可读.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 线条先于表面渲染;
    保留修正、箭头或局部未完成区域; 主体结构仍应清楚可读.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 石墨 #3B3B3B，角色：主线条; 纸白 #F2ECDD，角色：纸面;
    朱红 #B95644，角色：少量修改标记. Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 石墨 #3B3B3B，角色：主线条; 纸白 #F2ECDD，角色：纸面;
    朱红 #B95644，角色：少量修改标记.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    石墨 #3B3B3B，角色：主线条; 纸白 #F2ECDD，角色：纸面; 朱红 #B95644，角色：少量修改标记.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 材质细节服从用户主体，并保持可辨识.
    Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: 材质细节服从用户主体，并保持可辨识.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    材质细节服从用户主体，并保持可辨识.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
- id: edge-behavior
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: 边缘行为由媒介与光线决定，不使用统一发光描边.
    Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: 边缘行为由媒介与光线决定，不使用统一发光描边.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    边缘行为由媒介与光线决定，不使用统一发光描边.'
  evidence:
    source_ids:
    - package-visual-definition
    basis: original_design_intent
    visual_review: pending
active_rule_ids:
- signature
- medium
- composition
- palette
- surface
- edge-behavior
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - signature
  - medium
  - composition
  instruction: Keep the package-specific relationship among form, medium, composition consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: package-visual-definition
  kind: authored_package_definition
  local_path: visual-signature.yaml
execution:
  route: text_only
  must:
  - Translate the user's subject, objects, location, and narrative literally.
  - Apply the package signature only after the subject is established.
  - Keep style decisions observable and reversible at the prompt level.
  - Check that no recurring motif was introduced by the package.
  - Preserve the user's subject, location, object count, and narrative.
  - Do not add a recurring object, setting, character, landmark, or narrative motif.
  - Do not copy a named reference work or recognizable layout.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - copied composition
  - named character or branded asset
  - Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact
    composition.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
