execution:
  route: text_only
  must:
  - 先在黏稠液面上建立底色和大尺度漂浮色岛。
  - 再用滴落、牵引、梳理或轻微吹动形成涡旋、波纹和细线。
  - 最后将纸面平稳接触液面并转印，保留一次性边缘、吸收和套位变化。
  - 流体生成的边界、层叠和转印痕迹在更换主体后仍可辨认。
  - 不要求书籍、花朵、书法、土耳其图案或装帧页面。
  - 偶然性由水面过程产生，不用数字噪声、故障或随机渐变替代。
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic gradient wallpaper
  - mandatory flower, book page, calligraphy, or Ottoman ornament
  - plastic 3D material, digital glitch, or perfectly repeated pattern
  - copying a specific marbled sheet
  - mandatory calligraphic page, flower, or bookbinding subject
  - copied marbled sheet
  - fixed floral pattern
  - Do not reproduce a specific reference sheet, logo, text, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
