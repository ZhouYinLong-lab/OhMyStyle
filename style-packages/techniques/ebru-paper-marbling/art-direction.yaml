id: ebru-paper-marbling-direction
name: 水面浮彩纸张纹样
base_package: techniques/ebru-paper-marbling
scope:
  medium: water-surface marbling and paper transfer
  representation: stylized
  description: 将颜料漂浮在黏稠水面上，通过滴落、牵引、梳理与转印形成不可重复但可控的云纹、石纹和流动色带。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied marbled sheet
  - fixed floral pattern
  - mandatory calligraphic page, flower, or bookbinding subject
pillars:
- 将颜料漂浮在黏稠水面上，通过滴落、牵引、梳理与转印形成不可重复但可控的云纹、石纹和流动色带。
- 'differentiation: viscous bath with floating pigment and deliberate combing; one-time transfer to absorbent
  paper; controlled chance at the boundary between process and pattern'
- 'composition: 让颜色像流体一样围绕主体或背景形成连续的云纹、涡旋、石纹和细长流线。; 保留水面生成的偶然性，同时用边界、方向和留白控制画面不会变成无差别噪声。'
- 'palette: 采用高色相分离的红、蓝、黄、绿、紫和乳白，颜色在相互推动时保持边界。; 允许透明叠层与局部混色，但避免统一的渐变背景或塑料光泽。'
