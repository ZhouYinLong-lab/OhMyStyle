profiles:
  generic:
    required:
      - floating pigment, fluid boundaries, and paper transfer are observable
      - user-supplied subject remains legible and independent
      - no copied sheet or branded material
    reject_if:
      - output is only a smooth digital gradient or blur filter
      - default book, flower, calligraphy, or ornamental page appears without request
  portrait:
    required:
      - face and requested pose remain readable despite fluid surface treatment
  still_life:
    required:
      - opaque subject and marbled surface remain visually distinguishable
minimum_score: 7
