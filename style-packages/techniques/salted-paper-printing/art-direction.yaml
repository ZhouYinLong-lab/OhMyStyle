execution:
  route: text_only
  must:
  - compose the user subject; establish gentle gray scale; apply warm chemical tone; reveal subtle fibers and
    edge variation; check against glossy albumen
  - subject remains identifiable; matte fiber-rich support is visible; warmth is not a generic sepia filter
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - fixed subject, location, character, or story not requested by the user
  - generic global color filter without process evidence
  - copying a specific reference composition
  - forcing Victorian subjects, costumes, scratches, borders, or decorative aging
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
