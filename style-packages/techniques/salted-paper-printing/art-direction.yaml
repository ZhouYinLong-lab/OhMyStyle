    rather than add a fixed scene..'
  evidence:
    source_ids:
    - source-salted-paper-printing-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: matte
    uncoated paper with visible fibers and contact-print irregularity; edges: precise enough to preserve the
    requested subject. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
