schema_version: 2.1.0
status: experimental
id: stereoscopic-photography-direction
name: 立体摄影
base_package: techniques/stereoscopic-photography
scope:
  medium: 十九世纪摄影格式与观看技术 摄影格式与观看技术
  representation: stylized
  description: 以左右视点略有差异的双联影像、卡片式编排和可感知的空间错位模拟早期立体摄影观看经验。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - fixed subject, landmark, character, or narrative event
  - copied reference composition or branded asset
pillars:
- 以左右视点略有差异的双联影像、卡片式编排和可感知的空间错位模拟早期立体摄影观看经验。
- 'differentiation: 左右双联视图与明确的卡片式编排; 轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调'
- 'composition: 左右双联视图与明确的卡片式编排; 轻微水平视差带来的空间错觉'
- 'palette: 轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调'
- 'lighting: even photographic illumination with moderate contrast across both paired views; Keep illumination
  consistent between views while retaining the small horizontal parallax that creates depth.'
rules:
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: 左右双联视图与明确的卡片式编排;
    轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: 左右双联视图与明确的卡片式编排; 轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: 左右双联视图与明确的卡片式编排;
    轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 左右双联视图与明确的卡片式编排;
    轻微水平视差带来的空间错觉. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 左右双联视图与明确的卡片式编排; 轻微水平视差带来的空间错觉.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 左右双联视图与明确的卡片式编排;
    轻微水平视差带来的空间错觉.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调. Adapt
    their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    轻微水平视差带来的空间错觉; 银盐照片或手工着色的有限色调.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use even photographic illumination with moderate contrast across both paired views. Keep illumination
    consistent between views while retaining the small horizontal parallax that creates depth. Keep the light
    coherent with the requested subject and scene.
  observable: 'The light quality and its effect on shadows, materials, or tonal separation are visible: even photographic
    illumination with moderate contrast across both paired views. Keep illumination consistent between views while
    retaining the small horizontal parallax that creates depth.'
  reject_when: 'Reject global tint, bloom, or lighting that erases the stated tonal or material distinctions:
    even photographic illumination with moderate contrast across both paired views.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: 两张图之间保持可比较但不完全相同的细节;
    edges: subject-dependent, without a copied layout. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish: 两张图之间保持可比较但不完全相同的细节;
    edges: subject-dependent, without a copied layout.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: finish:
    两张图之间保持可比较但不完全相同的细节; edges: subject-dependent, without a copied layout.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: controlled
    and medium-dependent; placement: only where the package visual language needs explanation. Preserve detail
    hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density: controlled
    and medium-dependent; placement: only where the package visual language needs explanation.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: density:
    controlled and medium-dependent; placement: only where the package visual language needs explanation.'
  evidence:
    source_ids:
    - source-primary-01
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- distinctiveness
- composition
- palette
- lighting
- surface
- texture
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - composition
  - palette
  instruction: Keep the package-specific relationship among differentiation, composition, palette consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-primary-01
  kind: primary_research_source
  base_asset_id: primary-01
execution:
  route: text_only
  must:
  - 先确定一个简单且可辨的用户主体
  - 从相邻视点生成两张保持同一主体的画面
  - 并置双联图并保留边框和卡片比例
  - 避免过度变形，让视差服务于空间感
  - 左右双联视图与明确的卡片式编排
  - 轻微水平视差带来的空间错觉
  - 银盐照片或手工着色的有限色调
  - 两张图之间保持可比较但不完全相同的细节
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - fixed subject, landmark, character, or narrative event
  - copied reference composition or branded asset
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, screenshot, or protected
    game asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
