execution:
  route: text_only
  must:
  - define the subject independently
  - construct the leaded geometry or material divisions
  - assign a limited glass palette
  - add transmission, edge thickness, and projected color
  - light must pass through material
  - lead or structural divisions remain legible when requested
  - color spill has a bounded projection
  - no religious icon or fixed architecture is required
  avoid:
  - generic global style-filter language without observable constraints
  - fixed subject matter, landmark, character, or narrative motif
  - copying a specific reference composition
  - fixed subject, landmark, character, or narrative event
  - copied reference composition or branded asset
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, branded layout, or protected game
    asset.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
