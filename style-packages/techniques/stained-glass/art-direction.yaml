schema_version: 2.1.0
status: experimental
id: stained-glass-direction
name: 彩绘玻璃
base_package: techniques/stained-glass
scope:
  medium: translucent colored glass with leaded divisions and projected light
  representation: stylized
  description: 以玻璃分片、铅线分格、透光色块和投影色彩构成视觉语言。它可以服务抽象、建筑、人物或普通物体，不绑定宗教图像、教堂或固定故事。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - fixed subject, landmark, character, or narrative event
  - copied reference composition or branded asset
pillars:
- 以玻璃分片、铅线分格、透光色块和投影色彩构成视觉语言。它可以服务抽象、建筑、人物或普通物体，不绑定宗教图像、教堂或固定故事。
- 'differentiation: light must pass through material; lead or structural divisions remain legible when requested;
  color spill has a bounded projection; no religious icon or fixed architecture is required'
- 'composition: 分格线建立清楚的几何骨架; 色块和光影共同组织焦点; 前后层次由透明度和投影而非景深滤镜决定'
- 'palette: 宝石蓝、琥珀、红和紫以有限色块出现; 透光处变亮但保留颜色密度; 中性区域用来让色块呼吸'
- 'lighting: backlit or side-lit daylight passing through colored glass and casting bounded shadows nearby; Keep
  transmitted color bright but dense, and constrain color spill to adjacent surfaces.'
rules:
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: light must pass
    through material; lead or structural divisions remain legible when requested; color spill has a bounded projection;
    no religious icon or fixed architecture is required. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: light must pass through material;
    lead or structural divisions remain legible when requested; color spill has a bounded projection; no religious
    icon or fixed architecture is required.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: light
    must pass through material; lead or structural divisions remain legible when requested; color spill has a
    bounded projection; no religious icon or fixed architecture is required.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 分格线建立清楚的几何骨架; 色块和光影共同组织焦点;
    前后层次由透明度和投影而非景深滤镜决定. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 分格线建立清楚的几何骨架; 色块和光影共同组织焦点;
    前后层次由透明度和投影而非景深滤镜决定.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 分格线建立清楚的几何骨架;
    色块和光影共同组织焦点; 前后层次由透明度和投影而非景深滤镜决定.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: 宝石蓝、琥珀、红和紫以有限色块出现; 透光处变亮但保留颜色密度; 中性区域用来让色块呼吸.
    Adapt their balance to the requested subject; do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: 宝石蓝、琥珀、红和紫以有限色块出现; 透光处变亮但保留颜色密度;
    中性区域用来让色块呼吸.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    宝石蓝、琥珀、红和紫以有限色块出现; 透光处变亮但保留颜色密度; 中性区域用来让色块呼吸.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Use backlit or side-lit daylight passing through colored glass and casting bounded shadows nearby.
    Keep transmitted color bright but dense, and constrain color spill to adjacent surfaces. Keep the light coherent
    with the requested subject and scene.
  observable: 'The light quality and its effect on shadows, materials, or tonal separation are visible: backlit
    or side-lit daylight passing through colored glass and casting bounded shadows nearby. Keep transmitted color
    bright but dense, and constrain color spill to adjacent surfaces.'
  reject_when: 'Reject global tint, bloom, or lighting that erases the stated tonal or material distinctions:
    backlit or side-lit daylight passing through colored glass and casting bounded shadows nearby.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: thick translucent
    glass, lead seams, slight waviness, edge thickness, and small imperfections; edges: varied, deliberate edges
    with no copied layout. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish: thick
    translucent glass, lead seams, slight waviness, edge thickness, and small imperfections; edges: varied, deliberate
    edges with no copied layout.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: finish:
    thick translucent glass, lead seams, slight waviness, edge thickness, and small imperfections; edges: varied,
    deliberate edges with no copied layout.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: medium
    detail at seams and glass edges, clean planes between divisions, visible but controlled color spill; placement:
    concentrated where the medium or material needs explanation. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density: medium
    detail at seams and glass edges, clean planes between divisions, visible but controlled color spill; placement:
    concentrated where the medium or material needs explanation.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment: density:
    medium detail at seams and glass edges, clean planes between divisions, visible but controlled color spill;
    placement: concentrated where the medium or material needs explanation.'
  evidence:
    source_ids:
    - source-stained-glass-primary-source
    basis: curatorial_inference
    visual_review: pending
