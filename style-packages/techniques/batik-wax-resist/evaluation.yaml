profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - clothing or body surfaces, if requested, show textile absorbency and resist marks without becoming a fixed costume
      - the material process remains visible without regional symbolism being added by default
  still_life:
    required:
      - cloth weave, wax boundaries, crackle, and layered dye are visually distinct
      - the supplied object or pattern remains authoritative
minimum_score: 7

