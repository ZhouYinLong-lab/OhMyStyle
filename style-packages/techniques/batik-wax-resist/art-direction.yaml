execution:
  route: text_only
  must:
  - Establish the user's subject or pattern on the cloth without fixing a cultural motif.
  - Draw irregular wax barriers that reserve selected areas from the first dye bath.
  - Layer darker and warmer dyes, allowing absorption, pooling, and small cracks to interrupt the boundaries.
  - Show folds, weave, and matte surface response; keep the result tactile rather than vector-smooth.
  - Wax boundaries and dye sequence remain visible after the motif or subject changes.
  - Cloth absorbency and small irregularities are more important than perfect geometry.
  - The user's subject stays open; regional motifs are optional research context, not default content.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - mandatory floral, temple, Indonesian, or regional ornament when not requested
  - a smooth vector pattern or glossy synthetic fabric
  - a fixed scarf, garment, or ceremonial object
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
