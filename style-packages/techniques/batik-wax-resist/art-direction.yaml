schema_version: 2.1.0
status: experimental
id: batik-wax-resist-direction
name: 蜡染防染工艺
base_package: techniques/batik-wax-resist
scope:
  medium: wax-resist textile dyeing translated into a material-aware visual treatment
  representation: stylized
  description: 以熔蜡防染、分层上色、裂纹渗色和织物吸收，形成由工艺顺序决定的图案与表面节奏。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory floral, temple, Indonesian, or regional ornament when not requested
  - a smooth vector pattern or glossy synthetic fabric
  - a fixed scarf, garment, or ceremonial object
pillars:
- 以熔蜡防染、分层上色、裂纹渗色和织物吸收，形成由工艺顺序决定的图案与表面节奏。
- 'differentiation: wax barriers that remain legible as raised or pale resist edges; layered dye, crackle,
  bleed, and cloth absorption; repeated marks with hand-process variation rather than perfect vector tiling'
- 'composition: Let the cloth or supplied surface carry a legible field of resist boundaries, layered zones,
  and irregular flow.; Use repeated marks with small deviations; avoid a mechanically tiled pattern.'
- 'palette: Build color through layered dye: deep indigo and brown anchors, with restrained madder red, turmeric
  yellow, and cloth cream.; Dark lines should feel like wax barriers, while dye areas show uneven absorption.'
