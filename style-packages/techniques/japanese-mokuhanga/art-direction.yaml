execution:
  route: text_only
  must:
  - Draw a simple keyline study based on the user's subject and separate the image into color blocks.
  - Assign each color to an imagined carved block and keep overlaps physically plausible.
  - Apply water-based pigment in layers, allowing paper absorption and small registration shifts.
  - Finish with restrained paper texture and baren-like pressure variation; preserve clean areas of paper.
  - Separate block logic, paper reserve, and hand registration remain visible after the subject changes.
  - The technique does not require waves, actors, landscapes, or a particular historical motif.
  - Water-based softness supports the carved structure rather than replacing it with watercolor blur.
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - photorealistic surface detail when it conflicts with the package
  - generic style-filter language without observable constraints
  - copying a specific reference composition
  - mandatory wave, actor, mountain, shrine, or Japanese decorative motif
  - glossy poster gradients or watercolor-only softness without carved logic
  - perfect vector registration or a fixed historical scene
  - copied composition
  - named character or branded asset
  - Do not reproduce a specific reference work, recognizable character, logo, or branded layout.
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
