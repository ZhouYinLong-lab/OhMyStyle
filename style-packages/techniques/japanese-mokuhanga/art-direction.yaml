schema_version: 2.1.0
status: experimental
id: japanese-mokuhanga-direction
name: 日本水性木版画
base_package: techniques/japanese-mokuhanga
scope:
  medium: Japanese water-based woodblock printmaking translated into a generated print treatment
  representation: stylized
  description: 以分色木版、手工套印、水性颜料和纸张吸收建立清晰轮廓与细腻色层，保留手工对位的微小变化。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory wave, actor, mountain, shrine, or Japanese decorative motif
  - glossy poster gradients or watercolor-only softness without carved logic
  - perfect vector registration or a fixed historical scene
pillars:
- 以分色木版、手工套印、水性颜料和纸张吸收建立清晰轮廓与细腻色层，保留手工对位的微小变化。
- 'differentiation: color-specific block separation and carved keylines; water-based pigment absorbed into
  paper with gentle variation; handmade registration and paper reserve as visible structure'
- 'composition: Build the image from a clear keyline structure and separate color areas that can be imagined
  as individual blocks.; Use broad flat passages with carefully chosen overlaps, leaving paper to participate
  in the composition.'
- 'palette: Use water-based pigments with a limited, transparent-to-opaque range and clear separation between
  color blocks.; Let paper tone and slight color variation soften the geometry without losing the carved structure.'
