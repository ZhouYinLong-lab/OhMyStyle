profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - figures, if requested, use clear keylines and separate color blocks without becoming historical characters
      - paper absorption and registration variation remain visible
  still_life:
    required:
      - the supplied objects are translated through carved contours, block separation, and water-based pigment
      - no mandatory wave, shrine, actor, or ukiyo-e motif has been introduced
minimum_score: 7

semantic_evaluation:
  subject_independence:
    score: null
    notes: "Run at least two neutral-subject tasks from benchmarks/subject-independence.yaml."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Do not mark complete without outputs for at least two different subjects."

