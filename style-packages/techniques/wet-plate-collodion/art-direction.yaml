- 'differentiation: glass-plate surface; wet chemical irregularity; silver-amber tonal response'
- 'composition: 银灰、烟褐和有限琥珀色的化学影调; 玻璃板边缘、轻微涂布不均和手工处理痕迹'
- 'palette: 玻璃板边缘、轻微涂布不均和手工处理痕迹; 柔化但仍可辨认的轮廓'
- 'lighting: soft, steady photographic light with a broad tonal range and modest highlights; Keep exposure legible
  across the plate; limit chemical irregularity to the surface rather than a global lighting effect.'
