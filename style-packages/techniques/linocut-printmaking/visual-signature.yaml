composition:
- 黑白或双色块以强轮廓、负形和切刀方向组织画面
- 主体与背景保持清楚的层级关系，并让新主题拥有独立构图。
palette:
- 黑、纸白、靛蓝、砖红和赭黄形成版画色组
- 颜色按角色分配，不把调色板当作覆盖全画面的滤镜。
medium:
- 油毡刻线、平面油墨和套色印刷
- 媒介边缘、形体和细节密度保持一致。
lighting:
- 均匀印刷光，不使用摄影阴影
- 光源方向和明暗层次服务于空间与主体，而不是制造无来源效果。
surface:
- 纸张、油墨、刻痕和压印边缘必须可见
- 不同材质保留可辨识的表面行为。
texture:
- 刀痕沿形体方向排列，版面保留不完美套印
- 纹理沿结构和媒介方向组织，远景与次要区域降低密度。
invariants:
- 保持刻刀负形和印刷边缘，不复制具体版画图案或文字
- 不得复制来源作品的具体人物、地标、文字、标志、道具或构图。
