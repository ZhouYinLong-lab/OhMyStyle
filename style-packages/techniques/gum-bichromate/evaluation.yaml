invariants:
  - id: material_print
    weight: 3
    test: Paper and pigment behavior are visible as part of the image object.
  - id: broad_tone
    weight: 2
    test: Tonal structure is broad with selective rather than universal detail.
  - id: hand_control
    weight: 2
    test: Edge and pigment variation looks controlled and region-specific.
  - id: layered_color
    weight: 2
    test: Any multiple color passes show restrained, plausible misregistration.
rejections:
  - generic_watercolor_filter
  - uniform_noise_overlay
  - glossy_digital_finish
  - unsafe_chemical_instruction
minimum_score: 7
semantic_evaluation:
  subject_independence:
    score: null
    notes: "Pending provider-backed neutral-subject review."
  distinctive_signature:
    score: null
    notes: "Record which visual decisions remain observable after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare the representative image and output with near-duplicate packages."
  cross_subject_stability:
    score: null
    notes: "Run at least two different subjects before assigning a score."
