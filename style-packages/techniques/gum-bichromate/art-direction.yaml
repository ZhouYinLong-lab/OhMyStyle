id: gum-bichromate-direction
name: 重铬酸盐胶印
base_package: techniques/gum-bichromate
scope:
  medium: printmaking
  representation: stylized
  description: A hand-controlled pigment-printing process using sensitized gum arabic and pigment, contact
    exposure, washing, and optional layered color passes to create broad tones, soft detail, and visibly material
    photographic surfaces.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - Do not copy a specific reference composition, named character, logo, or branded layout.
pillars:
- A hand-controlled pigment-printing process using sensitized gum arabic and pigment, contact exposure, washing,
  and optional layered color passes to create broad tones, soft detail, and visibly material photographic surfaces.
- 'palette: default: monochrome_or_limited_palette; layered_option: multiple_pigment_passes'
- 'surface: matte_paper_tooth; pigment_sitting_in_or_on_paper; visible_brush_or_wash_variation'
- 'surface: brushed_or_softened; selective_detail; uneven_transition'
