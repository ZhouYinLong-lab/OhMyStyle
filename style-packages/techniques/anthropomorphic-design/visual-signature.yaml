package: "拟人化设计"
summary: "将用户指定的动物、植物、器物或抽象形体转译为具人格暗示的姿态、表情和功能角色"
subject_policy: open
visual_signature:
  medium: "角色与物体设计"
  focus: "将用户指定的动物、植物、器物或抽象形体转译为具人格暗示的姿态、表情和功能角色"
  composition:
  - "保持原主体可辨识"
  - "人格线索来自姿态和比例而非随机人脸"
  - "轮廓清晰、动作具有因果"
  palette:
  - "主体色 #D66B4F，角色：用户指定主体"
  - "墨色 #25272C，角色：轮廓"
  - "米白 #EEE3CD，角色：背景"
  surface:
    - 材质细节服从用户主体，并保持可辨识
  edge_behavior:
    - 边缘行为由媒介与光线决定，不使用统一发光描边
invariants:
  - Preserve the user's subject, location, object count, and narrative.
  - Do not add a recurring object, setting, character, landmark, or narrative motif.
  - Do not copy a named reference work or recognizable layout.
