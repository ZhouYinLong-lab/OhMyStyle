schema_version: 2.1.0
status: experimental
id: collagraph-printmaking-direction
name: 拼贴版画
base_package: techniques/collagraph-printmaking
scope:
  medium: collagraph printmaking
  representation: stylized
  description: 以叠加、粘附和压印形成不均匀的版面肌理，让材料痕迹、墨色密度和纸张压痕共同构成图像。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - mandatory newspaper collage, landscape, or handmade still life
pillars:
- 以叠加、粘附和压印形成不均匀的版面肌理，让材料痕迹、墨色密度和纸张压痕共同构成图像。
- 'differentiation: relief-built surface and pressure variation; uneven ink film on tactile paper; material
  accidents retained as part of the image'
- 'composition: Let layered relief, irregular silhouettes, and pressure variations organize the image.; Preserve
  the clarity of the user-supplied subject while allowing material accidents to interrupt perfect geometry.'
- 'palette: Use a limited ink family with paper ground and occasional two- or three-color registration shifts.;
  Let ink density, wiping, and paper absorbency create the main tonal range.'
rules:
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: relief-built
    surface and pressure variation; uneven ink film on tactile paper; material accidents retained as part of
    the image. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: relief-built surface and pressure
    variation; uneven ink film on tactile paper; material accidents retained as part of the image.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: relief-built
    surface and pressure variation; uneven ink film on tactile paper; material accidents retained as part of
    the image.'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: Let layered
    relief, irregular silhouettes, and pressure variations organize the image.; Preserve the clarity of the
    user-supplied subject while allowing material accidents to interrupt perfect geometry.. Preserve the user-provided
    content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: Let layered relief,
    irregular silhouettes, and pressure variations organize the image.; Preserve the clarity of the user-supplied
    subject while allowing material accidents to interrupt perfect geometry..'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: Let layered
    relief, irregular silhouettes, and pressure variations organize the image.; Preserve the clarity of the
    user-supplied subject while allowing material accidents to interrupt perfect geometry..'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: Use a limited ink family with paper
    ground and occasional two- or three-color registration shifts.; Let ink density, wiping, and paper absorbency
    create the main tonal range.. Adapt their balance to the requested subject; do not apply them as a uniform
    tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: Use a limited ink family
    with paper ground and occasional two- or three-color registration shifts.; Let ink density, wiping, and
    paper absorbency create the main tonal range..'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    Use a limited ink family with paper ground and occasional two- or three-color registration shifts.; Let
    ink density, wiping, and paper absorbency create the main tonal range..'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: lighting
  axis: lighting
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply the package-specific light behavior: quality: direct, even print light; behavior: Keep
    the printed relief readable; avoid glossy lighting that hides the paper and plate texture.. Keep light
    coherent with the requested subject, medium, and scene.'
  observable: 'Light and shadow visibly support the stated forms or atmosphere: quality: direct, even print
    light; behavior: Keep the printed relief readable; avoid glossy lighting that hides the paper and plate
    texture..'
  reject_when: 'Global glow, tint, or incoherent light replaces the stated behavior: quality: direct, even
    print light; behavior: Keep the printed relief readable; avoid glossy lighting that hides the paper and
    plate texture..'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: surface
  axis: surface
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: finish: tactile
    pressed paper with uneven ink film; edges: irregular, cut, or embossed edges with occasional soft transfer.
    Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: finish:
    tactile pressed paper with uneven ink film; edges: irregular, cut, or embossed edges with occasional soft
    transfer.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    finish: tactile pressed paper with uneven ink film; edges: irregular, cut, or embossed edges with occasional
    soft transfer.'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: texture
  axis: texture
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Render the requested materials using these package-specific surface decisions: density: medium
    to high at plate transitions; placement: concentrated around attached materials, wiped passages, and pressure
    changes. Preserve detail hierarchy and material identity.'
  observable: 'The stated edge, surface, or texture treatment can be seen at an appropriate scale: density:
    medium to high at plate transitions; placement: concentrated around attached materials, wiped passages,
    and pressure changes.'
  reject_when: 'Generic gloss, uniform texture, or unrelated effects replace the stated surface treatment:
    density: medium to high at plate transitions; placement: concentrated around attached materials, wiped
    passages, and pressure changes.'
  evidence:
    source_ids:
    - source-collagraph-printmaking-primary-source
    basis: curatorial_inference
    visual_review: pending
