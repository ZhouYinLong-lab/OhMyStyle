execution:
  route: text_only
  must:
  - keep the supplied subject and composition authoritative
  - establish a broad grayscale negative
  - model the image as absorbed into paper rather than floating in glossy emulsion
  - preserve highlight texture and open shadows
  - apply only subtle paper and coating variation
  - frame the user-supplied subject without changing its identity
  - build a full grayscale negative with controlled highlights and shadows
  - simulate paper absorption and soft metallic tonal depth
  avoid:
  - forced portrait, landscape, darkroom, antique object, or historical costume
  - glossy silver-gelatin look
  - sepia preset without material reasoning
  - crushed shadows, clipped highlights, or fake paper border
  - forced portrait, landscape, darkroom, or antique subject
  - copied composition
  - named photographer or branded asset
  - recurring portrait, landscape, darkroom, or antique object
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
