profiles:
  generic:
    required:
      - matte paper and absorbed image character are visible
      - grayscale is broad and continuous
      - supplied subject remains recognizable
      - no copied reference composition or branded material
    reject_if:
      - result is only a sepia or monochrome filter
      - glossy silver-gelatin look, fake border, crushed black, or clipped white dominates
      - text, logo, watermark, or unintended signature is present
  portrait:
    required:
      - skin and facial structure remain legible without forced period styling
  still_life:
    required:
      - material differences survive the grayscale process
minimum_score: 7
