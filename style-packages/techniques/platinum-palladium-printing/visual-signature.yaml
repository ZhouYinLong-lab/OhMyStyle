composition:
  - Keep the user-supplied subject and a calm photographic frame primary.
  - Preserve tonal breathing room; the process should not dictate a particular scene.
palette:
  - Use continuous neutral gray with optional warm platinum or palladium drift.
lighting:
  quality: broad, controlled, and tonally descriptive
  behavior:
    - Preserve highlight detail and soft but present shadow modeling.
    - Avoid glossy specular clipping and cinematic color lighting.
surface:
  finish: matte, fibrous, absorbed into paper
  edges: clear but gently integrated into the paper surface
texture:
  density: low and continuous
  placement: paper grain, tonal transitions, and subject materials
invariants:
  - matte paper character remains visible
  - grayscale has broad continuous range
  - warm neutral variation is material, not a global sepia filter
medium: platinum and palladium photographic printing language
materials:
  support: matte fiber paper with visible tooth and absorbency
process:
  - frame the user-supplied subject without changing its identity
  - build a full grayscale negative with controlled highlights and shadows
  - simulate paper absorption and soft metallic tonal depth
  - add minimal paper and coating variation
  - finish with local tonal balance rather than heavy grain or color grading
technical_direction:
  contrast: medium with long continuous transitions
  saturation: monochrome or warm neutral
  perspective: natural photographic perspective
  detail_density: medium, with smooth tonal modeling
avoid:
  - forced portrait, landscape, darkroom, antique object, or historical costume
  - glossy silver-gelatin look
  - sepia preset without material reasoning
  - crushed shadows, clipped highlights, or fake paper border
safety_note: Do not reproduce a specific reference work, recognizable person, logo, or branded layout.
SUBJECT INDEPENDENCE CONTRACT:
- The user-supplied {SUBJECT} and {LOCATION} are authoritative.
- This package controls visual treatment only: medium, composition, lighting,
  palette, surface, texture, and edge behavior.
- Do not add a recurring object, setting, character, landmark, or narrative
  motif unless the user explicitly requests it.
