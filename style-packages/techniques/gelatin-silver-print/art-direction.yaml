schema_version: 2.1.0
status: experimental
id: gelatin-silver-print-direction
name: 明胶银盐印相
base_package: techniques/gelatin-silver-print
scope:
  medium: gelatin silver black-and-white photographic print
  representation: stylized
  description: 以中性黑白阶调、纸基明胶乳剂、细腻颗粒和暗房放大控制构成摄影表面，不规定拍摄主体、地点或叙事。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
  - fixed subject, landmark, character, or narrative event
  - copied reference composition or branded asset
pillars:
- 以中性黑白阶调、纸基明胶乳剂、细腻颗粒和暗房放大控制构成摄影表面，不规定拍摄主体、地点或叙事。
- 'differentiation: neutral grayscale remains stable; material surface is photographic, not charcoal or ink;
  local contrast follows the subject; subject and location remain independent'
- 'composition: 主体结构由阶调而非色相承担; 保留暗房放大的裁切与边缘控制感; 可用清晰几何或细腻灰阶适配不同主体'
- 'palette: 中性黑白为主; 高光保留纸面质感而不纯白爆掉; 暗部有层次，不压成一整块黑'
rules:
