  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: neutral grayscale
    remains stable; material surface is photographic, not charcoal or ink; local contrast follows the subject;
    subject and location remain independent. Do not collapse the direction into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: neutral grayscale remains stable;
    material surface is photographic, not charcoal or ink; local contrast follows the subject; subject and
    location remain independent.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: neutral
    grayscale remains stable; material surface is photographic, not charcoal or ink; local contrast follows
    the subject; subject and location remain independent.'
  evidence:
    source_ids:
    - source-gelatin-silver-print-primary-source
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 主体结构由阶调而非色相承担;
    保留暗房放大的裁切与边缘控制感; 可用清晰几何或细腻灰阶适配不同主体. Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 主体结构由阶调而非色相承担; 保留暗房放大的裁切与边缘控制感;
