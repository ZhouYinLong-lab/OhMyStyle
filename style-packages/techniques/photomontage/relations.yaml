family: photographic-assemblage
near_duplicates:
  - techniques/collage-mixed-media
supersedes: []
conflicts:
  - movements/photorealism
distinctives:
  - photographic fragments and masking are structural, not decorative
  - hard seams, scale discontinuity, and darkroom-like overlap
  - controlled graphic counterforms around a limited set of source roles
avoid_overlap:
  - sticker collage, scrapbook decoration, and seamless composite photography
  - fixed surreal objects or a mandatory retro paper look
