  subject_independence:
    score: null
    notes: "Run at least two neutral-subject tasks from benchmarks/subject-independence.yaml."
  distinctive_signature:
    score: null
    notes: "Record whether masking, hard seams, and scale discontinuity remain visible after the subject changes."
  visual_overlap:
    score: null
    notes: "Compare against collage-mixed-media; photographic construction and darkroom logic should remain distinct."
  cross_subject_stability:
    score: null
    notes: "Do not mark complete without outputs for at least two different subjects."

