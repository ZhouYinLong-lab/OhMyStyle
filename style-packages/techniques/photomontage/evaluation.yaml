profiles:
  generic:
    required:
      - distinct photographic or graphic layers are visibly constructed
      - seams, masking, or scale discontinuity support the composition
      - user-supplied subject remains identifiable and independent
    reject_if:
      - output is only a vintage filter or seamless photorealistic scene
      - fragments become random decorative clutter
      - text, logo, watermark, or copied source layout is present
  still_life:
    required:
      - objects remain countable while their scale and plane relationships can break convention
  poster:
    required:
      - the hierarchy works without relying on readable text
minimum_score: 7

