joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - medium
  - composition
  instruction: Keep the package-specific relationship among differentiation, medium, composition consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-photomontage-primary-source
  kind: primary
  base_asset_id: photomontage-primary-source
execution:
  route: text_only
  must:
  - Translate the user's subject into a small set of image fragments and geometric supports.
  - Use masking, cropping, overlap, and scale change instead of adding many independent objects.
  - Keep cuts and seams legible; avoid smoothing every boundary into one synthetic scene.
  - Establish the main diagonal or counterform before adding grain, halftone, or paper wear.
  - Check that every fragment is relevant, new, and free of text or protected imagery.
  - Start with the user's subject and choose only the fragments required to express it.
  - 'Separate source roles: figure, object, architecture, texture, and geometric counterform.'
  - Cut or mask fragments with visible but controlled boundaries; preserve meaningful scale changes.
  avoid:
  - mandatory objects, characters, locations, or narrative
  - seamless 3D render, random scrapbook, glossy gradient, or fake film poster
  - seamless realistic lighting across incompatible fragments
  - random clutter, sticker-like decoration, or a fixed surreal prop list
  - readable text, logos, and copied source layouts
  - sticker collage, scrapbook decoration, and seamless composite photography
  - fixed surreal objects or a mandatory retro paper look
  - mandatory hand, staircase, machine, landscape, or human figure
  - copied source photograph, recognizable person, or protected layout
  - random scrapbook decoration without compositional intent
