schema_version: 2.1.0
status: experimental
id: screen-printing-direction
name: 丝网印刷
base_package: techniques/screen-printing
scope:
  medium: screen printing with opaque ink layers, limited color separations, visible registration shifts, and
    paper grain
  representation: stylized
  description: Builds screen-print results from opaque ink layers, limited separations, registration shifts, paper
    grain, and deliberate reduction for posters, packaging, illustration, and graphic marks.
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copying_a_specific_work
  - copying_a_named_character_or_logo
pillars:
- Builds screen-print results from opaque ink layers, limited separations, registration shifts, paper grain, and
  deliberate reduction for posters, packaging, illustration, and graphic marks.
- 'medium: screen printing with opaque ink layers, limited color separations, visible registration shifts, and
  paper grain'
- 'composition: Reduce forms to bold silhouettes and a small number of separations; use negative space and registration
  offsets to clarify hierarchy without copying a poster layout.'
- 'palette: Warm paper #F0E8D4, dark outline #172A42, red #B7483B, ochre #D4A83B, teal #3E827D, and near-black
  structure #202020 as separated ink roles.'
rules:
- id: medium
  axis: medium
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Render in screen printing with opaque ink layers, limited color separations, visible registration
    shifts, and paper grain; make the production or rendering process visible in edge, surface, and tonal evidence.
  observable: The image visibly reads as screen printing with opaque ink layers, limited color separations, visible
    registration shifts, and paper grain, rather than a generic color treatment.
  reject_when: Reject when the material or rendering process cannot be distinguished from a generic filter.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Reduce forms to bold silhouettes and a small number of separations; use negative space and registration
    offsets to clarify hierarchy without copying a poster layout. Preserve the user-provided subject and requested
    layout.
  observable: Reduce forms to bold silhouettes and a small number of separations; use negative space and registration
    offsets to clarify hierarchy without copying a poster layout.
  reject_when: Reject when the arrangement loses these structural decisions or copies a source composition.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: Keep the paper ground distinct from the dark structural ink, then use a few opaque, clearly separated
    color layers. Avoid gradients that erase the printed separations.
  observable: 'Warm paper #F0E8D4, dark outline #172A42, red #B7483B, ochre #D4A83B, teal #3E827D, and near-black
    structure #202020 as separated ink roles.'
  reject_when: Reject when a global tint replaces the stated color roles or the roles cannot be distinguished.
  evidence:
    source_ids:
    - source-source-1
    - source-source-2
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- medium
- composition
- palette
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - medium
  - composition
  - palette
  instruction: Keep the package-specific relationship among medium, composition, palette consistent while preserving
    the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided subject.
sources:
- id: source-source-1
  kind: style_reference
  base_asset_id: source-1
- id: source-source-2
  kind: style_reference
  base_asset_id: source-2
execution:
  route: text_only
  must:
  - translate the user subject into the style medium and structural rules
  - establish composition before small detail
  - inspect against the generic five-task suite
  - the result is an original new scene, not a copy of a source work
  - no unrequested text, logo, trademark, or named character
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - generic_global_filter
  - copied_source_composition
  - readable_text_or_branding
  - copying_a_specific_work
  - copying_a_named_character_or_logo
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
