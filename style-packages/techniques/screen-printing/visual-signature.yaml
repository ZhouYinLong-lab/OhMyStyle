medium: screen printing with opaque ink layers, limited color separations, visible registration shifts, and paper
  grain
composition:
- Reduce forms to bold silhouettes and a small number of separations; use negative space and registration offsets
  to clarify hierarchy without copying a poster layout.
style_signature:
- Builds screen-print results from opaque ink layers, limited separations, registration shifts, paper grain, and
  deliberate reduction for posters, packaging, illustration, and graphic marks.
- avoid_generic_filters; make medium, structure, palette, and lighting jointly visible
- narrative_is_optional
invariants:
- the result is an original new scene, not a copy of a source work
- no unrequested text, logo, trademark, or named character
