notes:
  - '蛋白印相的魅力不在于把照片做旧，而在于它让细节落在一层薄而有光泽的表面上：高光温和，暗部带褐色，纸张和银盐共同决定了画面的呼吸。它适合迁移到新的主体，不要求每次都出现旧肖像或历史建筑。'
  - 主体独立性是硬约束：固定题材只可出现在 benchmark 或可选说明中。

