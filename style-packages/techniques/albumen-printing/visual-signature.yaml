composition:
  - '保持摄影构图本身清楚，让工艺主要作用于色调、表面和边缘；可保留接触印相的纸边或轻微不齐。'
  - '中等细节密度与安静的留白比过度戏剧化的画面更稳定。'
palette:
  - '暖褐、奶油白、烟灰和柔和黑构成主调；可以保留用户指定的局部颜色，但整体不应变成综合色滤镜。'
  - '高光偏暖、暗部略带棕红，明度层次连续而不死黑。'
lighting:
  quality: 自然柔光或均匀窗光，强调纸面半光和细节，不使用现代商业摄影的锐利轮廓光。
  behavior:
    - 光线服务于主体结构和媒介表面，不制造与本包无关的戏剧化特效。
    - 保留用户指定的主体轮廓、位置和空间关系。
surface:
  finish: 薄纸、蛋白涂层、银盐颗粒、轻微黄化高光和边缘磨损。
  edges: 保持主体边缘可辨；允许媒介造成的轻微不齐，但不使用发光描边或综合色隔离带。
texture:
  density: 低到中等；纸纤维、涂层反光和微小化学不均匀可见，但不能盖住主体。
  placement: 集中在材料边界、暗部或印刷交界处，不覆盖主体识别信息。
invariants:
  - '更换主体后仍然能观察到本包的媒介、构图、色彩和表面签名。'
  - '不要求特定人物、物件、地点、建筑、植物、车辆或故事作为默认内容。'
  - '示例主体只用于验证视觉迁移，不得泄漏到默认 Prompt。'

