medium: "编辑版式"
materials:
  - 用户主题提供的真实材料
  - "九宫格分区、重复模块、明确间距和可替换内容建立稳定的编辑版面与视觉导航结构"
process:
  - Translate the user's subject, objects, location, and narrative literally.
  - Apply the package signature only after the subject is established.
  - Keep style decisions observable and reversible at the prompt level.
  - Check that no recurring motif was introduced by the package.
technical_direction: Preserve subject identity and physical plausibility; use the palette as roles, not a fixed filter.
safety_note: Use observable traits only. Do not reconstruct a named work, character, location, logo, text, or exact composition.
