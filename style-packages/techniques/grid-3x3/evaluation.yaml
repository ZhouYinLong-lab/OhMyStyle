profiles:
  generic:
    required:
      - package-specific visual signature is observable
      - composition remains coherent for a new subject
      - user-supplied subject and object count are preserved
      - no copied reference composition or branded material
    reject_if:
      - style is represented only by a global color filter
      - text, logo, watermark, or unintended signature is present
      - an unrequested recurring object, location, character, or narrative motif is added
  portrait:
    required:
      - requested subject remains recognizable and naturally posed
  still_life:
    required:
      - requested objects remain count-accurate and physically distinct
minimum_score: 7
image_audit:
  similarity_level: high
  visual_overlap:
    - modular cell structure
    - repeated rectangular alignment
  reason: Grid technique thumbnails can overlap with design-school packages that also use geometric organization.
  keep_separate_because:
    - the package controls a compositional scaffold rather than a historical visual language
    - the grid is optional and must be applied to the user's subject
    - it must not impose primary colours or a poster subject
  action: clarify_distinctive_signature
subject_independence_suite:
  status: pending
  fixture: benchmarks/subject-independence.yaml
  required_subjects:
    - ordinary-chair
    - unspecified-building
  evidence: "No provider-backed result is claimed until a real image run is recorded."
