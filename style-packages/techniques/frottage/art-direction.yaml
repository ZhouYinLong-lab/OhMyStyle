schema_version: 2.1.0
status: experimental
id: frottage-direction
name: 擦拓画法
base_package: techniques/frottage
scope:
  medium: 纸面擦拓、拼贴与混合媒介
  representation: stylized
  description: 把纸张覆盖在有纹理的表面上进行摩擦转印，让木纹、织物、叶片和网格成为不稳定的图像结构。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - 固定树叶、木板、石头或森林题材
  - 把普通颗粒滤镜当作擦拓纹理
  - 复制具体艺术作品、构图或文字
pillars:
- 把纸张覆盖在有纹理的表面上进行摩擦转印，让木纹、织物、叶片和网格成为不稳定的图像结构。
- 'differentiation: 压力与方向造成的材料转印; 纹理层与未处理纸面并置; 物理粉末感而非数字噪声'
- 'medium: 纸面擦拓、拼贴与混合媒介'
- 'composition: 让纹理层沿主体结构分布，保留局部空白和纸张边缘。; 使用不同方向、压力和密度的纹理叠层，避免整张图同质化。'
