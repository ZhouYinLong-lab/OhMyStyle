joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - distinctiveness
  - medium
  - composition
  instruction: Keep the package-specific relationship among differentiation, medium, composition consistent
    while preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
- id: source-frottage-primary-source
  kind: primary
  base_asset_id: frottage-primary-source
execution:
  route: text_only
  must:
  - 先锁定用户主体和轮廓，再选择与主体结构相容的纹理来源。
  - 用不同压力和方向转印局部区域，保留未擦拓的纸面。
  - 通过少量拼贴或透明色层整合纹理，不让纹理吞没主体。
  - 纹理来自材料转印和压力变化
  - 保留纸张、粉末和叠层的物理感
  - 纹理不自动替换用户主体
  - 不固定人物、物体、地点或故事
  - Preserve the user-provided subject, object count, location, and requested details.
  avoid:
  - 默认树叶、木板、石头、森林或超现实景观
  - 全局颗粒、数字噪声、无方向纹理和塑料表面
  - 把纹理做成均匀图案、金属拉丝或摄影滤镜
  - 固定树叶、木板、石头或森林题材
  - 把普通颗粒滤镜当作擦拓纹理
  - 复制具体艺术作品、构图或文字
  - 不复现具体作品、文字、签名或固定叙事；代表图只展示材料方法。
  - Do not add a recurring subject, landmark, story event, logo, or layout unless the user requests it.
