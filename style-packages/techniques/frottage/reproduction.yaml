medium: 纸面转印与混合媒介
materials:
  support: 粗纹纸、薄纸、石墨、蜡笔或干颜料
  texture_sources: 可替换的木纹、织物、网格、叶脉或建筑表面
  surface: 粉末堆积、纸纤维、压痕和不均匀覆盖
process:
  - 先锁定用户主体和轮廓，再选择与主体结构相容的纹理来源。
  - 用不同压力和方向转印局部区域，保留未擦拓的纸面。
  - 通过少量拼贴或透明色层整合纹理，不让纹理吞没主体。
technical_direction:
  contrast: 中等，依靠压力和叠层深浅变化
  saturation: 低至中等，保留材料本色
  perspective: 平面化但服从主体的基本空间
  detail_density: 中高，细节集中在纹理边界和材料交界
avoid:
  - 默认树叶、木板、石头、森林或超现实景观
  - 全局颗粒、数字噪声、无方向纹理和塑料表面
  - 把纹理做成均匀图案、金属拉丝或摄影滤镜
safety_note: 不复现具体作品、文字、签名或固定叙事；代表图只展示材料方法。
