medium: 纸面擦拓、拼贴与混合媒介
composition:
  - 让纹理层沿主体结构分布，保留局部空白和纸张边缘。
  - 使用不同方向、压力和密度的纹理叠层，避免整张图同质化。
palette:
  dominant:
    - 石墨黑
    - 纸张白
    - 棕褐
    - 暗赭
    - 苔绿色
  behavior: 颜色低至中饱和，色层之间保留纸张和颜料的分离。
lighting:
  quality: 平面工作室光，不强调摄影式高光
  behavior:
    - 纹理通过明暗、方向和压力显现，不依赖发光或阴影特效。
surface:
  finish: 纸纤维、石墨粉、干颜料、边缘撕裂与局部压痕
  edges: 纹理边缘断续，主体轮廓保持可辨
texture:
  density: 中等至高
  placement: 纹理与主体结构相关，背景可留出未处理纸面
invariants:
  - 纹理来自材料转印和压力变化
  - 保留纸张、粉末和叠层的物理感
  - 纹理不自动替换用户主体
  - 不固定人物、物体、地点或故事
