signature:
  - 'continuous gray scale'
  - 'ink density in shadow'
  - 'matte paper absorption'
  - 'fine plate grain'

controls:
  - 'surface'
  - 'texture'
  - 'lighting'
  - 'palette'

does_not_control:
  - subject identity
  - object count
  - location
  - story or narrative event
  - text, logo, or brand
