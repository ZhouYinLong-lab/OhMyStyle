schema_version: 2.1.0
status: experimental
id: photogravure-direction
name: 凹版照相制版
base_package: techniques/photogravure
scope:
  medium: printmaking
  representation: stylized
  description: 以连续灰阶、油墨密度、纸面吸收和细密颗粒把摄影转化为有物质感的印刷图像，并保留凹版印刷的层次和触感。
  required_contexts: []
  incompatible_contexts: []
  limitations:
  - copied composition
  - named character or branded asset
pillars:
- 以连续灰阶、油墨密度、纸面吸收和细密颗粒把摄影转化为有物质感的印刷图像，并保留凹版印刷的层次和触感。
- 'form: continuous gray scale; ink density in shadow; matte paper absorption; fine plate grain'
- 'differentiation: continuous gray scale; ink density in shadow; matte paper absorption; fine plate grain'
- 'process: surface; texture; lighting; palette'
rules:
- id: signature
  axis: form
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Preserve this identifying visual signature across the requested subject: continuous gray scale;
    ink density in shadow; matte paper absorption; fine plate grain. Do not let generic polish or another package
    direction replace it. If a cue names a concrete object or motif, do not add it unless the user requests
    it; translate its formal qualities to the supplied subject.'
  observable: 'The image is recognizable through the package-specific formal relationships expressed by: continuous
    gray scale; ink density in shadow; matte paper absorption; fine plate grain.'
  reject_when: 'The result could not be distinguished from a generic treatment because these identifying cues
    are absent or contradicted: continuous gray scale; ink density in shadow; matte paper absorption; fine
    plate grain.'
  evidence:
    source_ids:
    - source-primary-reference
    basis: curatorial_inference
    visual_review: pending
- id: distinctiveness
  axis: differentiation
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Distinguish this direction from nearby packages using these authored differences: continuous
    gray scale; ink density in shadow; matte paper absorption; fine plate grain. Do not collapse the direction
    into a neighboring style.'
  observable: 'The result expresses the stated distinction in visible form: continuous gray scale; ink density
    in shadow; matte paper absorption; fine plate grain.'
  reject_when: 'The result adopts the neighboring package defined treatment or ignores this distinction: continuous
    gray scale; ink density in shadow; matte paper absorption; fine plate grain.'
  evidence:
    source_ids:
    - source-primary-reference
    basis: curatorial_inference
    visual_review: pending
- id: controls
  axis: process
  importance: supporting
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Apply this package-specific visual rule: surface; texture; lighting; palette. Keep it subordinate
    to the requested subject and medium.'
  observable: 'The stated visual decision is plainly visible in the requested image: surface; texture; lighting;
    palette.'
  reject_when: 'The stated decision is absent, contradicted, or replaced by a generic filter: surface; texture;
    lighting; palette.'
  evidence:
    source_ids:
    - source-primary-reference
    basis: curatorial_inference
    visual_review: pending
- id: palette
  axis: palette
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Use these package-specific color roles and relationships: palette: name: warm white paper;
    palette: hex: #E5DED0; palette: name: soft black; palette: hex: #252628; palette: name: silver gray; palette:
    hex: #858788; palette: name: oxide brown; palette: hex: #795D45. Adapt their balance to the requested subject;
    do not apply them as a uniform tint.'
  observable: 'The stated colors and their roles are visible and distinguishable: palette: name: warm white
    paper; palette: hex: #E5DED0; palette: name: soft black; palette: hex: #252628; palette: name: silver gray;
    palette: hex: #858788; palette: name: oxide brown; palette: hex: #795D45.'
  reject_when: 'An all-over filter replaces the stated color relationships, or their roles cannot be distinguished:
    palette: name: warm white paper; palette: hex: #E5DED0; palette: name: soft black; palette: hex: #252628;
    palette: name: silver gray; palette: hex: #858788; palette: name: oxide brown; palette: hex: #795D45.'
  evidence:
    source_ids:
    - source-primary-reference
    basis: curatorial_inference
    visual_review: pending
- id: composition
  axis: composition
  importance: core
  applies_when: Always when this visual direction is selected and compatible with the requested medium.
  instruction: 'Organize the requested subject using these package-specific spatial decisions: 以连续灰阶、油墨密度、纸面吸收和细密颗粒把摄影转化为有物质感的印刷图像，并保留凹版印刷的层次和触感。.
    Preserve the user-provided content and layout.'
  observable: 'The stated hierarchy, spacing, framing, or depth relationship is readable: 以连续灰阶、油墨密度、纸面吸收和细密颗粒把摄影转化为有物质感的印刷图像，并保留凹版印刷的层次和触感。.'
  reject_when: 'The composition contradicts these spatial decisions or copies a source arrangement: 以连续灰阶、油墨密度、纸面吸收和细密颗粒把摄影转化为有物质感的印刷图像，并保留凹版印刷的层次和触感。.'
  evidence:
    source_ids:
    - source-primary-reference
    basis: curatorial_inference
    visual_review: pending
active_rule_ids:
- signature
- distinctiveness
- controls
- palette
- composition
joint_checks:
- id: visual-relationship-coherence
  rule_ids:
  - signature
  - distinctiveness
  - controls
  instruction: Keep the package-specific relationship among form, differentiation, process consistent while
    preserving the user-specified subject and layout.
  observable: The linked visual decisions reinforce one another and remain subordinate to the user-provided
    subject.
sources:
