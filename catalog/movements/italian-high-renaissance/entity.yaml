id: italian-high-renaissance
name: Italian High Renaissance
entity_type: art_movement
region: Central Italy, especially Rome and Florence
period: c. 1490-1527
representative_anchors:
  - Raphael, The School of Athens
  - Raphael's Rooms, Room of the Segnatura
scope_note: The School of Athens is a work-level anchor, not the definition of the movement.
visual_system:
  - careful drawing and proportion
  - coherent spatial construction
  - calm, legible narrative action
  - controlled color and light
source_policy: Historical works remain link-only unless reproduction rights are verified.
